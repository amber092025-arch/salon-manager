const sb = {
  from: (table) => ({
    _table: table,
    select: function(cols = "*") { this._cols = cols; this._filters = []; return this; },
    insert: function(data) { this._method = "POST"; this._data = data; return this; },
    upsert: function(data) { this._method = "POST"; this._data = data; this._upsert = true; return this; },
    update: function(data) { this._method = "PATCH"; this._data = data; this._filters = []; return this; },
    delete: function() { this._method = "DELETE"; this._filters = []; return this; },
    eq: function(col, val) { this._filters = [...(this._filters||[]), `${col}=eq.${val}`]; return this; },
    order: function(col, opts={}) { this._order = `${col}.${opts.ascending===false?"desc":"asc"}`; return this; },
    then: async function(resolve, reject) {
      try {
        const base = `${SUPABASE_URL}/rest/v1/${this._table}`;
        const headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": this._upsert ? "resolution=merge-duplicates,return=representation" : "return=representation",
        };
        let url = base;
        const params = [];
        if (this._cols && !this._method) params.push(`select=${this._cols}`);
        if (this._filters) this._filters.forEach(f => params.push(f));
        if (this._order) params.push(`order=${this._order}`);
        if (params.length) url += "?" + params.join("&");
        const method = this._method || "GET";
        const res = await fetch(url, { method, headers, body: this._data ? JSON.stringify(this._data) : undefined });
        if (!res.ok) { const err = await res.text(); throw new Error(err); }
        const data = method === "DELETE" || method === "PATCH" ? [] : await res.json();
        resolve({ data, error: null });
      } catch(e) { resolve({ data: null, error: e }); }
    }
  })
};

const C = { bg:"#faf8f4", card:"#ffffff", border:"#ece7df", text:"#2a2218", sub:"#9a9088", accent:"#7a6848", red:"#c0392b", green:"#3fb98a", orange:"#e8924a" };

// ═══════════════════════════════════════════
// HPBサロンレポートPDF 解析ロジック
// 「① ご来店人数〜サイトアクセス状況」のページ(1ページ目)から、
// ラベル文字列を目印に、その右(同じ行)に続く数値を抜き出す方式。
// 表がExcel由来で結合セルが多く、pdf.jsの単純なテキスト抽出だと
// 隣り合う別の表の文字列が同じ行に混ざるため、①y座標で行にグルーピング
// →②ラベルを含む語を探す→③直後の非数値(「PV数」等の単位語、最大4語まで)を
// 読み飛ばす→④続く数値の並びを1つの系列として採用、という手順にしている。
// ═══════════════════════════════════════════

const REPORT_METRICS = [
  { key: "total_pv",            label: "総PV数" },
  { key: "salon_info_pv",       label: "サロン情報" },
  { key: "kodawari_pv",         label: "こだわり" },
  { key: "style_detail_pv",     label: "ｽﾀｲﾙ詳細" },
  { key: "coupon_menu_pv",      label: "ｸｰﾎﾟﾝﾒﾆｭｰﾍﾟｰｼﾞ" },
  { key: "coupon_print_pv",     label: "ｸｰﾎﾟﾝ印刷" },
  { key: "booking_complete_pv", label: "予約完了" },
  { key: "blog_posts",          label: "ﾌﾞﾛｸﾞ投稿数" },
  { key: "blog_views",          label: "ﾌﾞﾛｸﾞ閲覧数" },
  { key: "cvr",                 label: "CVR" },
  { key: "acr",                 label: "ACR" },
  { key: "net_bookings",        label: "NET予約数" },
  { key: "net_sales",           label: "NET予約売上" },
];
// エリア平均(「同プラン、同エリア平均」行)を持ちうる指標。8/6時点でPDFを確認した限り、
// 対になる行が"直後(1行下)"にある指標のみ実際に値が入る(例: ﾌﾞﾛｸﾞ投稿数は無く、直後のﾌﾞﾛｸﾞ閲覧数のみ有り)
const AREA_AVG_KEYS = ["total_pv", "salon_info_pv", "kodawari_pv", "style_detail_pv", "coupon_menu_pv", "coupon_print_pv", "booking_complete_pv", "blog_views", "cvr", "acr"];

const METRIC_JP = {
  total_pv: "総PV数", salon_info_pv: "サロン情報PV", kodawari_pv: "こだわり閲覧PV",
  style_detail_pv: "スタイル詳細PV", coupon_menu_pv: "クーポンメニューPV", coupon_print_pv: "クーポン印刷PV",
  booking_complete_pv: "予約完了PV",
  blog_posts: "ブログ投稿数", blog_views: "ブログ閲覧数",
  cvr: "CVR(クーポン一覧移行率)", acr: "ACR(予約完了率)",
  net_bookings: "NET予約数", net_sales: "NET予約売上(万円)",
};
// %表示すべき指標(CVR/ACR)。それ以外は件数として扱う
const PERCENT_KEYS = ["cvr", "acr"];

function isNumToken(s) {
  const t = (s||"").trim();
  if (!t) return false;
  const cleaned = t.replace(/,/g, "").replace(/%$/, "");
  return /^-?\d+\.?\d*$/.test(cleaned);
}
function parseNumToken(s) {
  return parseFloat(s.replace(/,/g, "").replace(/%$/, ""));
}

// pdf.jsのテキストアイテム配列 → y座標でグルーピングし、行ごとにx座標順へ並べる
// 注意: pdf.jsは数値と数値の間の空白を独立したアイテムとして返すため、
// 空白のみのアイテムを除外しないと数値の連続判定が最初の1個で途切れる(実PDFで検証済み)
// 各行配列にはy座標も.yプロパティとして持たせる(エリア平均行の位置特定に使う。8/6)
function clusterRows(items, yTol = 2.5) {
  const meaningful = items.filter(it => (it.str || "").trim() !== "");
  const used = new Array(meaningful.length).fill(false);
  const withIdx = meaningful.map((it, i) => ({ i, x: it.transform[4], y: it.transform[5], text: it.str.trim() }));
  const sortedByY = [...withIdx].sort((a, b) => b.y - a.y); // pdf.js座標は下から上に増えるので降順=上から順
  const rows = [];
  for (const cur of sortedByY) {
    if (used[cur.i]) continue;
    const group = withIdx.filter(w => !used[w.i] && Math.abs(w.y - cur.y) < yTol);
    group.forEach(w => { used[w.i] = true; });
    group.sort((a, b) => a.x - b.x);
    const rowArr = group.map(w => w.text);
    rowArr.y = cur.y;
    rows.push(rowArr);
  }
  return rows;
}

function findMetricSeries(rows, label, minCount = 3, maxSkip = 4) {
  const r = findMetricSeriesWithIndex(rows, label, minCount, maxSkip);
  return r ? r.series : null;
}

// findMetricSeriesと同じロジックだが、見つかった行のインデックスも返す(エリア平均行を直後の行から探すため)
function findMetricSeriesWithIndex(rows, label, minCount = 3, maxSkip = 4) {
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    const idx = row.findIndex(t => t.includes(label));
    if (idx === -1) continue;
    let i = idx + 1, skipped = 0;
    while (i < row.length && !isNumToken(row[i]) && skipped < maxSkip) { i++; skipped++; }
    const nums = [];
    while (i < row.length && isNumToken(row[i])) { nums.push(parseNumToken(row[i])); i++; }
    if (nums.length >= minCount) return { series: nums, rowIndex: r };
  }
  return null;
}

// ── エリア平均(「同プラン、同エリア平均」)の抽出 ──
// 8/6: 当初は「指標の行の直後1行」を見る方式で実装したが、実データ(pdfplumber)で検証したところ
// このPDFは1ページに複数の表が横並びになっており、行のy座標だけで単純にクラスタリングすると
// 左側の表(ご集客データ)の断片行が右側の表の行の間に紛れ込み、「直後の行」がズレることが判明した。
// そのため、生のテキストアイテムに対して直接「指標の行のy座標に最も近い(かつ直下の)、
// x座標がラベル列の範囲内にある『同プラン』を含むアイテム」を探す方式に変更。
// 見つかったラベルの正確なy座標を基準に、狭いy許容差(1.5)で数値だけを拾い直すことで、
// 数値側のごく僅かなy座標のブレ(実データで最大1pt程度確認)にも対応しつつ、
// 別指標のエリア平均行を誤って拾わないようにしている(実データで全指標を検証済み)。
function findAreaAvgSeries(items, metricY, minCount = 3, maxGap = 15, xMin = 500, xMax = 700, tightYTol = 1.5) {
  let bestItem = null, bestGap = Infinity;
  for (const it of items) {
    if (!it.text.includes("同プラン")) continue;
    if (it.x < xMin || it.x > xMax) continue;
    if (it.y >= metricY) continue; // 対象指標より下(pdf.js座標系ではyが小さい方が下)のみ
    const gap = metricY - it.y;
    if (gap < bestGap) { bestGap = gap; bestItem = it; }
  }
  if (!bestItem || bestGap > maxGap) return null; // 直後の行でなければ(=その指標にエリア平均は無い)nullを返す
  const rowItems = items.filter(it => Math.abs(it.y - bestItem.y) < tightYTol && it.x > bestItem.x).sort((a, b) => a.x - b.x);
  const nums = [];
  for (const it of rowItems) {
    if (isNumToken(it.text)) nums.push(parseNumToken(it.text));
    else if (nums.length) break;
  }
  return nums.length >= minCount ? nums : null;
}

// 系列(末尾が「ご掲載月号」の月に一致する)から、各値に対応する年月("YYYY-MM")を割り当てる
function assignMonths(series, reportYear, reportMonth) {
  const n = series.length;
  return series.map((v, i) => {
    const back = n - 1 - i;
    let y = reportYear, m = reportMonth - back;
    while (m <= 0) { m += 12; y -= 1; }
    return { month: `${y}-${String(m).padStart(2, "0")}`, value: v };
  });
}

// ページ7「スタイル閲覧ランキング」の1～64位列から、スタイル名・掲載No・閲覧数(PV)を抽出
// (1～64位に既にPV降順で入っているので、上位64件から更にソートしてtopNを返せば十分)
async function extractStyleViews(pdf, topN = 20) {
  if (pdf.numPages < 7) return [];
  const page = await pdf.getPage(7);
  const textContent = await page.getTextContent();
  const entries = [];
  // x座標が必要なため、textContent.itemsから直接x/y座標を使ってy方向にクラスタリングする
  const meaningful = textContent.items.filter(it => (it.str || "").trim() !== "");
  const withPos = meaningful.map(it => ({ text: it.str.trim(), x: it.transform[4], y: it.transform[5] }));
  const used = new Array(withPos.length).fill(false);
  const sortedByY = [...withPos.keys()].sort((a, b) => withPos[b].y - withPos[a].y);
  for (const idx of sortedByY) {
    if (used[idx]) continue;
    const y = withPos[idx].y;
    const group = withPos.filter((w, i) => !used[i] && Math.abs(w.y - y) < 3);
    group.forEach(w => { const i = withPos.indexOf(w); used[i] = true; });
    // 「スタイル閲覧(1～64)」列のみ対象: 名前=x 690〜890 / 掲載No=x 890〜920 / 閲覧数=x 920〜938
    const names = group.filter(w => w.x >= 690 && w.x < 890).sort((a,b)=>a.x-b.x).map(w => w.text);
    const nos = group.filter(w => w.x >= 890 && w.x < 920 && /^\d+$/.test(w.text));
    const pvs = group.filter(w => w.x >= 920 && w.x < 938 && /^\d+$/.test(w.text));
    if (names.length && nos.length && pvs.length) {
      entries.push({ name: names.join(" "), no: parseInt(nos[0].text, 10), pv: parseInt(pvs[0].text, 10) });
    }
  }
  entries.sort((a, b) => b.pv - a.pv);
  return entries.slice(0, topN);
}

async function extractReportFromPdf(arrayBuffer) {
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(1);
  const textContent = await page.getTextContent();
  const fullText = textContent.items.map(it => it.str).join(" ");

  const m = fullText.match(/ご掲載月号\s*(\d{2})(\d{2})月号/);
  if (!m) throw new Error("「ご掲載月号」が見つかりませんでした。HPBサロンレポート①のPDFか確認してください。");
  const reportYear = 2000 + parseInt(m[1], 10);
  const reportMonth = parseInt(m[2], 10);

  const rows = clusterRows(textContent.items);
  // エリア平均の探索用に、生のテキストアイテムも(x,y,text)の形で保持しておく
  const items = textContent.items
    .filter(it => (it.str || "").trim() !== "")
    .map(it => ({ x: it.transform[4], y: it.transform[5], text: it.str.trim() }));

  const byMonth = {}; // { "YYYY-MM": { total_pv: n, ..., areaAvg: { total_pv: n, ... } } }
  const missing = [];
  for (const { key, label } of REPORT_METRICS) {
    const found = findMetricSeriesWithIndex(rows, label);
    if (!found) { missing.push(METRIC_JP[key]); continue; }
    const withMonths = assignMonths(found.series, reportYear, reportMonth);
    withMonths.forEach(({ month, value }) => {
      byMonth[month] = byMonth[month] || { month };
      byMonth[month][key] = value;
    });
    // 8/6: 対応する指標のみ「同プラン、同エリア平均」を取得(実データにのみ存在する場合)
    if (AREA_AVG_KEYS.includes(key)) {
      const avgSeries = findAreaAvgSeries(items, rows[found.rowIndex].y);
      if (avgSeries && avgSeries.length === found.series.length) {
        const avgWithMonths = assignMonths(avgSeries, reportYear, reportMonth);
        avgWithMonths.forEach(({ month, value }) => {
          byMonth[month] = byMonth[month] || { month };
          byMonth[month].areaAvg = byMonth[month].areaAvg || {};
          byMonth[month].areaAvg[key] = value;
        });
      }
    }
  }
  const rowsOut = Object.values(byMonth).sort((a, b) => a.month.localeCompare(b.month));

  let styleViews = [];
  try { styleViews = await extractStyleViews(pdf, 20); } catch (e) { console.error("style views extraction failed:", e); }
  if (styleViews.length > 0 && rowsOut.length > 0) rowsOut[rowsOut.length - 1].styleViews = styleViews;

  return { rows: rowsOut, missing, styleViews, reportLabel: `${reportYear}年${reportMonth}月号` };
}

// ── DB mapper ──
const toDbReport = (r) => {
  const base = {
    month: r.month, total_pv: r.total_pv ?? null, salon_info_pv: r.salon_info_pv ?? null,
    kodawari_pv: r.kodawari_pv ?? null, style_detail_pv: r.style_detail_pv ?? null,
    coupon_menu_pv: r.coupon_menu_pv ?? null, coupon_print_pv: r.coupon_print_pv ?? null,
    booking_complete_pv: r.booking_complete_pv ?? null, blog_posts: r.blog_posts ?? null,
    blog_views: r.blog_views ?? null, cvr: r.cvr ?? null, acr: r.acr ?? null,
    net_bookings: r.net_bookings ?? null, net_sales: r.net_sales ?? null,
  };
  if (r.styleViews) base.style_views = r.styleViews; // 存在する月のみ送る(他の月の既存値を空で上書きしないため)
  if (r.areaAvg) base.area_avg = r.areaAvg; // 同上(エリア平均。無い月は送らない)
  return base;
};

// ── シンプルな折れ線チャート(依存ライブラリなし・SVG手書き) ──
function TrendChart({ data, dataKey, color, height = 150 }) {
  const points = data
    .map(d => ({ month: d.month, value: d[dataKey] }))
    .filter(p => p.value !== undefined && p.value !== null);
  if (points.length === 0) return <div style={{ fontSize:12, color:C.sub, padding:"20px 0", textAlign:"center" }}>データがありません</div>;
  const max = Math.max(...points.map(p => p.value), 1);
  const barAreaH = height - 40; // 上に数値ラベル、下に月ラベルを置く分の余白を確保
  const colW = 42; // 1本あたりの幅(bar+gap込み)。ここを元に内側行の合計幅を明示指定し、確実に横スクロールさせる
  return (
    <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch" }}>
      <div style={{ display:"flex", alignItems:"flex-end", gap:6, height, width: points.length * colW, paddingBottom:2 }}>
        {points.map((p, i) => {
          const barH = Math.max((p.value / max) * barAreaH, 3);
          return (
            <div key={i} style={{ flex:"0 0 auto", width:36, display:"flex", flexDirection:"column", alignItems:"center", height:"100%" }}>
              <div style={{ flex:1, display:"flex", flexDirection:"column", justifyContent:"flex-end", alignItems:"center", width:"100%" }}>
                <div style={{ fontSize:9.5, color:C.text, fontWeight:700, marginBottom:3, whiteSpace:"nowrap" }}>
                  {p.value >= 1000 ? Math.round(p.value).toLocaleString() : p.value}
                </div>
                <div style={{ width:20, height:barH, background:color, borderRadius:"3px 3px 0 0" }} />
              </div>
              <div style={{ fontSize:9, color:C.sub, marginTop:4, whiteSpace:"nowrap" }}>{p.month.slice(2).replace("-","/")}</div>
            </div>
          );
        })}
      </div>
      {points.length * colW > 380 && <div style={{ fontSize:9.5, color:C.sub, textAlign:"center", marginTop:2 }}>← 横にスクロールできます →</div>}
    </div>
  );
}

// %表示すべき指標(cvr/acr)は"23.5%"、それ以外は3桁区切りで表示
function fmtMetric(key, value) {
  if (value == null) return "-";
  return PERCENT_KEYS.includes(key) ? `${value}%` : value.toLocaleString();
}

function StatCard({ title, value, sub, color }) {
  return (
    <div style={{ background:C.card, borderRadius:14, padding:"14px 16px", border:`1px solid ${C.border}`, flex:1, minWidth:0 }}>
      <div style={{ fontSize:11, color:C.sub, marginBottom:6, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{title}</div>
      <div style={{ fontSize:22, fontWeight:800, color:color||C.text }}>{value}</div>
      {sub && <div style={{ fontSize:11, color:C.sub, marginTop:2 }}>{sub}</div>}
    </div>
  );
}

// ── 簡易ルールベースの気づきカード(v1: 本格AI分析ではなく、しきい値ベースの簡単な比較のみ) ──
function buildInsights(reports) {
  if (reports.length < 2) return [];
  const cur = reports[reports.length - 1];
  const prev = reports[reports.length - 2];
  const insights = [];
  if (cur.total_pv != null && prev.total_pv != null) {
    const diff = ((cur.total_pv - prev.total_pv) / (prev.total_pv || 1)) * 100;
    if (diff <= -10) insights.push({ type:"warn", text:`総PVが前月比${diff.toFixed(1)}%減っています。ブログ投稿数(${cur.blog_posts ?? "-"}件)やクーポン内容を見直すタイミングかもしれません。` });
    else if (diff >= 15) insights.push({ type:"good", text:`総PVが前月比${diff.toFixed(1)}%増えています。直近の投稿やクーポン変更が効いている可能性があります。` });
  }
  if (cur.blog_posts != null && prev.blog_posts != null && cur.total_pv != null && prev.total_pv != null) {
    if (cur.blog_posts > prev.blog_posts && cur.total_pv > prev.total_pv) {
      insights.push({ type:"good", text:`ブログ投稿数(${prev.blog_posts}→${cur.blog_posts})とPVが同時に伸びています。この投稿ペースを維持すると良さそうです。` });
    }
  }
  if (cur.booking_complete_pv != null && prev.booking_complete_pv != null && prev.booking_complete_pv > 0) {
    const diff = ((cur.booking_complete_pv - prev.booking_complete_pv) / prev.booking_complete_pv) * 100;
    if (diff <= -15) insights.push({ type:"warn", text:`予約完了PVが前月比${diff.toFixed(1)}%減っています。クーポン内容やメニューページの見え方を確認してみてください。` });
  }
  if (insights.length === 0) insights.push({ type:"neutral", text:"目立った増減はありません。引き続き投稿を継続しましょう。" });
  return insights;
}

function App() {
  const [reports, setReports] = useState([]);
  const [loading, setLoading] = useState(true);
  const [parsing, setParsing] = useState(false);
  const [preview, setPreview] = useState(null); // { rows, missing, reportLabel }
  const [saving, setSaving] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const fileInputRef = useRef(null);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await sb.from("hpb_reports").select().order("month");
    if (!error && data) setReports(data.map(r => ({ ...r, styleViews: r.style_views || null, areaAvg: r.area_avg || null })));
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErrorMsg(""); setParsing(true); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const result = await extractReportFromPdf(buf);
      if (result.rows.length === 0) throw new Error("数値を読み取れませんでした。レポート①(1ページ目)を含むPDFかご確認ください。");
      setPreview(result);
    } catch (err) {
      console.error(err);
      setErrorMsg("読み取りに失敗しました: " + (err.message || String(err)));
    } finally {
      setParsing(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const handleSave = async () => {
    if (!preview) return;
    setSaving(true);
    try {
      await Promise.all(preview.rows.map(row =>
        fetch(`${SUPABASE_URL}/rest/v1/hpb_reports?on_conflict=month`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json", Prefer: "resolution=merge-duplicates",
          },
          body: JSON.stringify([toDbReport(row)]),
        })
      ));
    } catch (err) {
      console.error(err);
      setErrorMsg("保存に失敗しました: " + (err.message || String(err)));
    }
    setSaving(false);
    setPreview(null);
    await load();
  };

  const insights = useMemo(() => buildInsights(reports), [reports]);
  const latestStyleViews = useMemo(() => {
    for (let i = reports.length - 1; i >= 0; i--) {
      if (reports[i].styleViews && reports[i].styleViews.length > 0) return { month: reports[i].month, list: reports[i].styleViews };
    }
    return null;
  }, [reports]);
  const latest = reports[reports.length - 1];
  const prevMonth = reports[reports.length - 2];

  // ── AI分析プロンプト生成(スタイルアップ等と同じパターン: コピーしてChatGPT/Geminiを起動) ──
  // 現状アプリで自動取得できているのはPV系・売上・NET予約数・スタイル閲覧TOPのみ。
  // CVR/ACR・エリア平均・来店人数内訳・新規リピート率・口コミは未対応のため、
  // プロンプト内に「手入力してください」の欄として残す(8/6時点)
  const generateAnalysisPrompt = (dest) => {
    const last3 = reports.slice(-3);
    const withAvg = (r, key, label) => {
      const self = r[key];
      const avg = r.areaAvg && r.areaAvg[key];
      if (self == null) return `${label} -`;
      return avg != null ? `${label} ${fmtMetric(key, self)}(エリア平均${fmtMetric(key, avg)})` : `${label} ${fmtMetric(key, self)}`;
    };
    const pvLines = last3.length
      ? last3.map(r => `${r.month}: ${withAvg(r,"total_pv","総PV")} / ${withAvg(r,"salon_info_pv","サロン情報PV")} / ${withAvg(r,"kodawari_pv","こだわり閲覧PV")} / ${withAvg(r,"coupon_menu_pv","クーポン閲覧PV")} / ${withAvg(r,"blog_views","ブログ閲覧PV")}`).join("\n")
      : "未取得";
    const cvrAcrLines = last3.length
      ? last3.map(r => `${r.month}: ${withAvg(r,"cvr","CVR")} / ${withAvg(r,"acr","ACR")}`).join("\n")
      : "未取得";
    const salesLines = last3.length
      ? last3.map(r => `${r.month}: 売上高 ${r.net_sales != null ? r.net_sales + "万円" : "-"} / NET予約数 ${r.net_bookings ?? "-"}`).join("\n")
      : "未取得";
    const avgUnitPrice = (latest && latest.net_sales != null && latest.net_bookings)
      ? Math.round((latest.net_sales * 10000) / latest.net_bookings).toLocaleString() + "円(売上高÷NET予約数の概算)"

## 目的

## 分析・出力フォーマット指示

以下の5つのステップに沿って、論理的かつ具体的に分析・出力してください。

                  const pct = Math.max((s.pv / max) * 100, 4);
                  return (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                      <div style={{ width:18, fontSize:11, color:C.sub, fontWeight:700, flexShrink:0, textAlign:"right" }}>{i + 1}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:11.5, color:C.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", marginBottom:2 }}>{s.name}<span style={{ color:C.sub, fontSize:10 }}> (No.{s.no})</span></div>
                        <div style={{ background:C.bg, borderRadius:4, height:6, overflow:"hidden" }}>
                          <div style={{ width:pct + "%", height:"100%", background:C.accent, borderRadius:4 }} />
                        </div>
                      </div>
                      <div style={{ width:34, fontSize:11.5, fontWeight:700, color:C.text, textAlign:"right", flexShrink:0 }}>{s.pv}</div>
                    </div>
                  );
                })}
              </div>
            )}

            <div style={{ fontSize:10.5, color:C.sub, textAlign:"center", padding:"8px 0 20px", lineHeight:1.6 }}>
              全{reports.length}ヶ月分のデータ({reports[0]?.month} 〜 {latest?.month})
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
