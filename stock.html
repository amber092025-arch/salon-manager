// あいまい照合用の正規化：空白除去・小文字化・カタカナ→ひらがな・全角英数→半角
const normalize = s => (s||"").toLowerCase()
  .replace(/[\s　]/g,"")
  .replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60))

// 音声入力共通フック：マイクボタンから検索欄などにテキストを流し込む(iOS Safari前提、非対応ブラウザではsupported=falseでボタン自体を出さない)
// status: idle→starting(タップ直後〜接続+安全バッファ待ち)→listening(合図音を鳴らして「話してOK」を通知)
// onstartが発火しても実際の音声キャプチャがすぐには安定しないため、onstart後にREADY_BUFFER_MSだけ余裕を持たせてから合図音+赤表示にしている
const READY_BUFFER_MS = 500;

const useVoiceInput = (onResult) => {
  const [status, setStatus] = useState("idle");
  const recRef = useRef(null);
  const bufferTimerRef = useRef(null);
  const audioCtxRef = useRef(null);
  const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const clearBufferTimer = () => { if (bufferTimerRef.current) { clearTimeout(bufferTimerRef.current); bufferTimerRef.current = null; } };

  const playReadyBeep = () => {
    try {
      const ctx = audioCtxRef.current;
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  };

  const toggle = () => {
    if (status === "listening") { recRef.current && recRef.current.stop(); return; }
    if (status === "starting" || !SR) return;

    // タップ直後(ユーザー操作と直結したタイミング)でAudioContextを用意しておく。
    // setTimeoutの中で新規生成すると自動再生制限で音が鳴らないことがあるため、ここで先に確保する
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!audioCtxRef.current) audioCtxRef.current = new AC();
        if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      }
    } catch (e) {}

    setStatus("starting");
    try {
      const rec = new SR();
      rec.lang = "ja-JP";
      rec.interimResults = false;
      rec.continuous = false;
      rec.onstart = () => {
        bufferTimerRef.current = setTimeout(() => {
          setStatus("listening");
          playReadyBeep();
        }, READY_BUFFER_MS);
      };
      rec.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript;
        onResult(text);
      };
      rec.onerror = () => { clearBufferTimer(); setStatus("idle"); };
      rec.onend = () => { clearBufferTimer(); setStatus("idle"); recRef.current = null; };
      recRef.current = rec;
      rec.start();
    } catch (err) { setStatus("idle"); }
  };

  return { toggle, supported: !!SR, listening: status === "listening", starting: status === "starting" };
};

// ネットワーク起因の一時的な失敗を吸収するため、失敗時は少し待って自動で再試行する
const withRetry = async (fn, attempts = 3, delayMs = 1000) => {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs)); }
  }
  throw lastErr;
};

// OCRテキストの各行を商品と照合。①商品コード（数字）優先 → ②商品名あいまい照合
const matchReceiptLines = (text, products) => {
  const lines = (text||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  const real = products.filter(p => !p.placeholder && p.name);
  const matches = []; const unmatched = [];
  const addMatch = (p, qty) => {
    const ex = matches.find(m => m.product.id === p.id);
    if (ex) ex.qty += qty; else matches.push({ product: p, qty });
  };
  lines.forEach(line => {
    // 数量推定：納品書は「…80g 数量 単価」の並びのため末尾から走査。
    // g付き=容量、3桁以上=単価/金額/コード として除外し、1〜99を数量とみなす
    let qty = 1;
    const toks = line.match(/\d[\d,]*g?/g) || [];
    for (let i = toks.length - 1; i >= 0; i--) {
      const t = toks[i];
      if (t.endsWith("g")) continue;
      const plain = t.replace(/,/g,"");
      if (plain.length >= 3) continue;
      const n = parseInt(plain);
      if (n >= 1 && n <= 99) { qty = n; break; }
    }
    // ①商品コード照合（最優先・完全一致）
    const codes = line.match(/\d{4,7}/g) || [];
    let hit = null;
    for (const c of codes) {
      hit = real.find(p => p.productCode && p.productCode === c) || null;
      if (hit) break;
    }
    // ②商品名あいまい照合（フォールバック）
    if (!hit) {
      const nl = normalize(line);
      if (nl.length >= 2) {
        real.forEach(p => {
          const np = normalize(p.name);
          if (np.length >= 2 && (nl.includes(np) || np.includes(nl))) {
            if (!hit || np.length > normalize(hit.name).length) hit = p;
          }
        });
      }
    }
    if (hit) addMatch(hit, qty);
    else {
      if (/[ぁ-んァ-ヶ一-龠a-zA-Zａ-ｚＡ-Ｚ]{2,}/.test(line) && !/合計|小計|消費税|税込|税抜|請求|納品|御中|様|TEL|FAX|〒|株式会社|有限会社|振込|銀行|支店/.test(line)) unmatched.push(line);
    }
  });
  return { matches, unmatched };
};

const css = {

const STOCK_VERSION = "v2026.08.07-c"; // このファイルのバージョン(ヘッダーに表示、アップロード反映確認用)

function App() {
  const [authed, setAuthed] = useState(localStorage.getItem("stock_auth") === "1");
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [checking, setChecking] = useState(false);

  const [view, setView] = useState("gyomu"); // gyomu | hanbai
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  const [products, setProducts] = useState([]);
  const [shopCats, setShopCats] = useState([]);
  const [movements, setMovements] = useState([]);
  const [recordDate, setRecordDate] = useState(""); // 入出庫の記録日(空欄=今日)。過去日付での入庫記録に使う
  const [movLoading, setMovLoading] = useState(false);

  const emptyForm = { name:"", code:"", category:"", subCategory:"", price:"", cost:"", stock:"", minStock:"3", isPublic:false };
  const [modal, setModal] = useState(null); // { mode:"add"|"edit", id? }
  const [selectMode, setSelectMode] = useState(false);
  const [openCats, setOpenCats] = useState({});
  const [searchText, setSearchText] = useState(""); // 商品名・商品コードのあいまい検索
  const voiceSearch = useVoiceInput(setSearchText);
  const [openSubs, setOpenSubs] = useState({});
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [bulkEditModal, setBulkEditModal] = useState(null);
  const [form, setForm] = useState(emptyForm);

  // 納品書/カラータグ読み取り
  const [scanModal, setScanModal] = useState(null); // { text, result, dir:"in"|"out" }
  const [ocrBusy, setOcrBusy] = useState(false);
  const [ocrProgress, setOcrProgress] = useState(0);
  const cameraInputRef = useRef(null);
  const libInputRef = useRef(null);
  const ocrServiceRef = useRef(null);

  // 画像→テキスト（PaddleOCR.js／PP-OCRv5、ブラウザ内で完結・API不要）
  const ocrImage = async (file) => {
    if (!file) return;
    setOcrBusy(true); setOcrProgress(0);
    try {
      // 大きい写真は縮小してから認識（速度改善）
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.filter = "grayscale(1) contrast(1.5)";
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      let service = ocrServiceRef.current;
      if (!service) {
        service = await withRetry(async () => {
          const dynImport = new Function("specifier", "return import(specifier)");
          const { PaddleOcrService } = await dynImport("https://esm.sh/ppu-paddle-ocr/web");
          const MODEL_BASE = "https://media.githubusercontent.com/media/PT-Perkasa-Pilar-Utama/ppu-paddle-ocr-models/refs/heads/main";
          const DICT_BASE = "https://raw.githubusercontent.com/PT-Perkasa-Pilar-Utama/ppu-paddle-ocr-models/refs/heads/main";
          const s = new PaddleOcrService({
            model: {
              detection: MODEL_BASE + "/detection/PP-OCRv5_mobile_det_infer.onnx",
              recognition: MODEL_BASE + "/recognition/multi/japan/v3/japan_PP-OCRv3_mobile_rec_infer.onnx",
              charactersDictionary: DICT_BASE + "/recognition/multi/japan/v3/japan_dict.txt",
            },
          });
          await s.initialize();
          return s;
        });
        ocrServiceRef.current = service; // 初期化済みインスタンスを保持し、次回以降はモデル再取得なしで使い回す
      }
      const result = await withRetry(() => service.recognize(canvas), 2, 800);
      const text = (result.text || "").trim();
      if (!text) { notify("文字を読み取れませんでした","error"); }
      else {
        setScanModal(p => p ? ({ ...p, text: (p.text ? p.text + "\n" : "") + text }) : p);
        notify("読み取りました(v8-japan-v3) ✓ 内容を確認して照合してください");
      }
    } catch(e) {
      notify("v8-japan-v3 失敗: " + String((e && e.message) || e).slice(0, 150), "error");
    }
    setOcrBusy(false); setOcrProgress(0);
  };

  const applyScan = async () => {
    const targets = (scanModal.result?.matches || []).filter(m => m.qty > 0);
    if (!targets.length) return notify("数量が入っている商品がありません","error");
    setSaving(true);
    try {
      for (const m of targets) {
        const cur = products.find(x => x.id === m.product.id) || m.product;
        const delta = scanModal.dir === "out" ? -m.qty : m.qty;
        const ns = Math.max(0, (cur.stock||0) + delta);
        const res = await fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + m.product.id, { method:"PATCH", headers:HDRS, body: JSON.stringify({ stock: ns }) });
        if (!res.ok) throw new Error();
        setProducts(prev => prev.map(x => x.id===m.product.id ? { ...x, stock: ns } : x));
        logStockMovement(cur, delta);
      }
      notify(targets.length + "品を" + (scanModal.dir==="out"?"出庫":"入庫") + "しました ✓");
      setScanModal(null);
    } catch(e) { notify("保存に失敗しました","error"); }
    setSaving(false);
  };

  const notify = (msg, type) => { setToast({ msg, type }); setTimeout(() => setToast(null), 2000); };

  const reload = async () => {
    try {
      setLoadError(false);
      const [pRes, sRes] = await Promise.all([
        fetch(SUPABASE_URL + "/rest/v1/products?select=id,name,price,cost,stock,min_stock,category,sub_category,placeholder,sort_order,product_code,is_public&order=sort_order", { headers: HDRS }),
        fetch(SUPABASE_URL + "/rest/v1/settings?select=value&key=eq.shopCategoryList", { headers: HDRS }),
      ]);
      if (!pRes.ok || !sRes.ok) throw new Error();
      const pRows = await pRes.json();
      setProducts(pRows.map(fromDb));
      const sRows = await sRes.json();
      if (sRows.length && sRows[0].value) { try { setShopCats(JSON.parse(sRows[0].value)||[]); } catch(e) { setShopCats([]); } }
      else setShopCats([]);
    } catch(e) { setLoadError(true); }
    finally { setLoading(false); }
  };
  useEffect(() => { if (authed) { setLoading(true); reload(); } }, [authed]);

  useEffect(() => {
    if (!authed || view !== "history" || movements.length > 0 || movLoading) return;
    setMovLoading(true);
    fetch(SUPABASE_URL + "/rest/v1/stock_movements?select=id,product_id,product_name,category,sub_category,delta,created_at&order=created_at.desc&limit=2000", { headers: HDRS })
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(rows => setMovements(rows))
      .catch(() => notify("入出庫履歴の取得に失敗しました", "error"))
      .finally(() => setMovLoading(false));
  }, [authed, view]);

  // ── PIN（経費ページと共通：settings.expensePin） ──
  const tryUnlock = async (v) => {
    setChecking(true);
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/settings?select=value&key=eq.expensePin", { headers: HDRS });
      if (!res.ok) throw new Error();
      const rows = await res.json();
      let pin = DEFAULT_PIN;
      if (rows.length && rows[0].value) { try { pin = JSON.parse(rows[0].value); } catch(e) { pin = rows[0].value; } }
      if (String(v) === String(pin)) {
        localStorage.setItem("stock_auth", "1");
        setAuthed(true); setPinInput(""); setPinError("");
      } else { setPinError("パスコードが違います"); setPinInput(""); }
    } catch(e) { setPinError("通信エラー。電波状況を確認して再入力してください"); setPinInput(""); }
    setChecking(false);
  };
  const lock = () => { localStorage.removeItem("stock_auth"); setAuthed(false); };

  // ── 入出庫履歴を「選択中の月」だけ、業務/店販→カテゴリ→サブカテゴリで集計 ──
  const [historyMonthOffset, setHistoryMonthOffset] = useState(0); // 0=今月、-1=先月、+1=来月
  const [historyFilter, setHistoryFilter] = useState("all"); // "all" | "in" | "out" — 入庫合計/出庫合計ボックスをタップして切替
  const historyTarget = (() => { const d = new Date(); d.setMonth(d.getMonth() + historyMonthOffset); return d; })();
  const historyMonthKey = historyTarget.getFullYear() + "-" + String(historyTarget.getMonth()+1).padStart(2,"0");
  const historyMonthLabel = historyTarget.getFullYear() + "年" + (historyTarget.getMonth()+1) + "月";

  // UTCのcreated_atをJSTのカレンダー日に変換してから月を取り出す(そのままsliceすると
  // JST深夜0時台〜朝9時前の記録が前日=前月のUTC日付になり、月境界でズレる問題があった)
  const jstMonthKey = (isoStr) => {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return "";
    const jst = new Date(d.getTime() + 9 * 3600 * 1000);
    return jst.getUTCFullYear() + "-" + String(jst.getUTCMonth() + 1).padStart(2, "0");
  };

  const monthlyMovements = useMemo(() => {
    const productOf = (m) => products.find(x => x.id === m.product_id) || products.find(x => x.name === m.product_name);
    const costOf = (m) => { const p = productOf(m); return p ? (p.cost || 0) : 0; };
    const isShop = c => shopCats.includes(c);
    const inMonth = movements.filter(m => jstMonthKey(m.created_at) === historyMonthKey);

    // typeKey → category → subCategory → productName → {qty, amount, rows[], side}
    const tree = {};
    for (const m of inMonth) {
      const side = m.delta > 0 ? "in" : m.delta < 0 ? "out" : null;
      if (!side) continue;
      const p = productOf(m);
      // 記録(movement)自体にカテゴリ/サブカテゴリが無い場合(sub_category追加前の古い履歴)は、
      // 商品の現在のカテゴリ/サブカテゴリで代用する(商品が削除済みなら未分類のまま)
      const cat = m.category || (p ? (p.category || "未分類") : "未分類");
      const rawSub = m.sub_category || (p ? p.subCategory : null);
      const sub = (rawSub && rawSub !== "一般") ? rawSub : "未分類";
      const typeKey = isShop(cat) ? "店販" : "業務";
      const qty = Math.abs(m.delta);
      const amount = qty * costOf(m);
      tree[typeKey] = tree[typeKey] || {};
      tree[typeKey][cat] = tree[typeKey][cat] || {};
      tree[typeKey][cat][sub] = tree[typeKey][cat][sub] || {};
      const bucket = tree[typeKey][cat][sub];
      const e = bucket[m.product_name] = bucket[m.product_name] || { in: null, out: null };
      const key = side;
      e[key] = e[key] || { qty: 0, amount: 0, rows: [] };
      e[key].qty += qty; e[key].amount += amount; e[key].rows.push(m);
    }

    const sumAmounts = (obj) => {
      let inAmount = 0, outAmount = 0, inQty = 0, outQty = 0;
      const walk = (o) => {
        if (o && (o.in || o.out)) {
          if (o.in) { inAmount += o.in.amount; inQty += o.in.qty; }
          if (o.out) { outAmount += o.out.amount; outQty += o.out.qty; }
          return;
        }
        Object.values(o).forEach(walk);
      };
      Object.values(obj).forEach(walk);
      return { inAmount, outAmount, inQty, outQty };
    };

    const typeList = Object.keys(tree).sort().map(typeKey => {
      const catList = Object.keys(tree[typeKey]).sort().map(cat => {
        const subList = Object.keys(tree[typeKey][cat]).sort().map(sub => {
          const entries = Object.entries(tree[typeKey][cat][sub]).sort((a,b) => {
            const qa = (a[1].in?.qty||0) + (a[1].out?.qty||0), qb = (b[1].in?.qty||0) + (b[1].out?.qty||0);
            return qb - qa;
          });
          return { sub, entries, ...sumAmounts({ [sub]: tree[typeKey][cat][sub] }) };
        });
        return { cat, subList, ...sumAmounts(tree[typeKey][cat]) };
      });
      return { typeKey, catList, ...sumAmounts(tree[typeKey]) };
    });

    const grand = sumAmounts(tree);
    return { typeList, grand, hasData: inMonth.length > 0 };
  }, [movements, products, shopCats, historyMonthKey]);

  // 履歴の修正: その月・その商品の記録済み行のdeltaを直接増減する(在庫数そのものは変えない=記録だけを直す)
  const adjustMovement = async (side, entry, dir) => {
    const step = (side === "in" ? 1 : -1) * dir; // 入庫は+方向、出庫(使用)は-方向が「増やす」
    const row = entry.rows[0];
    if (!row) return;
    if (dir < 0 && entry.qty <= 0) return;
    const newDelta = row.delta + step;
    try {
      const sameSign = (side === "in" && newDelta > 0) || (side === "out" && newDelta < 0);
      if (newDelta === 0 || !sameSign) {
        const res = await fetch(SUPABASE_URL + "/rest/v1/stock_movements?id=eq." + row.id, { method: "DELETE", headers: HDRS });
        if (!res.ok) throw new Error();
        setMovements(prev => prev.filter(x => x.id !== row.id));
      } else {
        const res = await fetch(SUPABASE_URL + "/rest/v1/stock_movements?id=eq." + row.id, { method: "PATCH", headers: HDRS, body: JSON.stringify({ delta: newDelta }) });
        if (!res.ok) throw new Error();
        setMovements(prev => prev.map(x => x.id === row.id ? { ...x, delta: newDelta } : x));
      }
    } catch (e) { notify("履歴の修正に失敗しました", "error"); }
  };

  // ── グルーピング（業務/店販） ──
  // ── アラート(要発注)関連 ──
  const [alertExcludedTypes, setAlertExcludedTypes] = useState(new Set());
  const [alertExcludedCats, setAlertExcludedCats] = useState(new Set());
  const [alertExcludedSubs, setAlertExcludedSubs] = useState(new Set());
  const toggleExcluded = (setFn, key) => setFn(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; });

  const lowStockAlert = useMemo(() => {
    const isShop = c => shopCats.includes(c);
    return products
      .filter(p => !p.placeholder && (p.stock||0) <= (p.minStock||0))
      .map(p => ({
        ...p,
        typeKey: isShop(p.category||"") ? "店販" : "業務",
        catKey: p.category || "未分類",
        subKey: (p.subCategory && p.subCategory !== "一般") ? p.subCategory : "未分類",
      }))
      .sort((a,b) => (a.stock - a.minStock) - (b.stock - b.minStock)); // 不足が大きいものを上に
  }, [products, shopCats]);

  const alertCatOptions = useMemo(() => [...new Set(lowStockAlert.map(p => p.catKey))].sort(), [lowStockAlert]);
  const alertSubOptions = useMemo(() => [...new Set(lowStockAlert.map(p => p.subKey))].sort(), [lowStockAlert]);

  const filteredAlert = useMemo(() => lowStockAlert.filter(p =>
    !alertExcludedTypes.has(p.typeKey) && !alertExcludedCats.has(p.catKey) && !alertExcludedSubs.has(p.subKey)
  ), [lowStockAlert, alertExcludedTypes, alertExcludedCats, alertExcludedSubs]);

  const alertTree = useMemo(() => {
    const tree = {};
    for (const p of filteredAlert) {
      tree[p.typeKey] = tree[p.typeKey] || {};
      tree[p.typeKey][p.catKey] = tree[p.typeKey][p.catKey] || {};
      tree[p.typeKey][p.catKey][p.subKey] = tree[p.typeKey][p.catKey][p.subKey] || [];
      tree[p.typeKey][p.catKey][p.subKey].push(p);
    }
    return Object.keys(tree).sort().map(typeKey => ({
      typeKey,
      cats: Object.keys(tree[typeKey]).sort().map(cat => ({
        cat,
        subs: Object.keys(tree[typeKey][cat]).sort().map(sub => ({ sub, items: tree[typeKey][cat][sub] })),
      })),
    }));
  }, [filteredAlert]);

  const grouped = useMemo(() => {
    const isShop = c => shopCats.includes(c);
    const q = normalize(searchText.trim());
    const filtered = products.filter(p => {
      const cat = p.category || "未分類";
      if ((view === "hanbai" ? !isShop(cat) : isShop(cat))) return false;
      if (!q) return true;
      return normalize(p.name).includes(q) || normalize(p.productCode||"").includes(q) || normalize(p.subCategory||"").includes(q);
    });
    const map = {};
    filtered.forEach(p => {
      const cat = p.category || "未分類"; const sub = (p.subCategory && p.subCategory !== "一般") ? p.subCategory : "未分類";
      if (!map[cat]) map[cat] = {};
      if (!map[cat][sub]) map[cat][sub] = [];
      map[cat][sub].push(p);
    });
    return map;
  }, [products, view, shopCats, searchText]);

  const existingCats = useMemo(() => {
    const isShop = c => shopCats.includes(c);
    const set = [];
    products.forEach(p => {
      const cat = p.category || "未分類";
      if ((view === "hanbai" ? isShop(cat) : !isShop(cat)) && !set.includes(cat)) set.push(cat);
    });
    return set;
  }, [products, view, shopCats]);
  // 業務⇔店販の切り替え用：現在のタブと逆側に分類されている既存カテゴリ一覧
  const otherCats = useMemo(() => {
    const isShop = c => shopCats.includes(c);
    const set = [];
    products.forEach(p => {
      const cat = p.category || "未分類";
      if ((view === "hanbai" ? !isShop(cat) : isShop(cat)) && !set.includes(cat)) set.push(cat);
    });
    return set;
  }, [products, view, shopCats]);
  const existingSubs = useMemo(() => {
    const set = [];
    products.forEach(p => { if ((p.category||"未分類") === form.category && p.subCategory && !set.includes(p.subCategory)) set.push(p.subCategory); });
    return set;
  }, [products, form.category]);
  const getSubsForCat = (cat) => {
    const set = [];
    products.forEach(p => { if ((p.category||"未分類") === cat && p.subCategory && !set.includes(p.subCategory)) set.push(p.subCategory); });
    return set;
  };

  // ── 店販タブで新カテゴリを作った場合、shopCategoryListにも追加（read-modify-write） ──
  const ensureShopCategory = async (cat) => {
    if (view !== "hanbai" || !cat) return;
    const res = await fetch(SUPABASE_URL + "/rest/v1/settings?select=value&key=eq.shopCategoryList", { headers: HDRS });
    if (!res.ok) throw new Error();
    const rows = await res.json();
    let list = [], exists = false;
    if (rows.length) { exists = true; try { list = JSON.parse(rows[0].value)||[]; } catch(e) {} }
    if (list.includes(cat)) { setShopCats(list); return; }
    const next = [...list, cat];
    const body = JSON.stringify({ value: JSON.stringify(next) });
    if (exists) await fetch(SUPABASE_URL + "/rest/v1/settings?key=eq.shopCategoryList", { method:"PATCH", headers:HDRS, body });
    else await fetch(SUPABASE_URL + "/rest/v1/settings", { method:"POST", headers:HDRS, body: JSON.stringify({ key:"shopCategoryList", value: JSON.stringify(next) }) });
    setShopCats(next);
  };

  // ── 追加・編集・削除・在庫増減 ──
  const openAdd = () => { setForm(emptyForm); setModal({ mode:"add" }); };
  const openEdit = (p) => { setForm({ name:p.name, code:p.productCode||"", category:p.category||"", subCategory:p.subCategory||"", price:String(p.price||0), cost:String(p.cost||0), stock:String(p.stock||0), minStock:String(p.minStock||3), isPublic:p.isPublic||false }); setModal({ mode:"edit", id:p.id }); };

  const saveProduct = async () => {
    if (!form.name.trim()) return notify("商品名を入力してください","error");
    if (!form.category.trim()) return notify("カテゴリを入力してください","error");
    const body = {
      name: form.name.trim(),
      product_code: (form.code||"").trim() || null,
      category: form.category.trim(),
      sub_category: (form.subCategory||"").trim() || null,
      price: parseInt(form.price)||0,
      cost: parseInt(form.cost)||0,
      stock: parseInt(form.stock)||0,
      min_stock: parseInt(form.minStock)||3,
      is_public: form.isPublic||false,
    };
    setSaving(true);
    try {
      await ensureShopCategory(body.category);
      if (modal.mode === "add") {
        const res = await fetch(SUPABASE_URL + "/rest/v1/products", { method:"POST", headers:HDRS,
          body: JSON.stringify({ ...body, placeholder:false, photos:[], description:null, sort_order: Date.now() }) });
        if (!res.ok) throw new Error(await res.text());
        const rows = await res.json();
        if (rows.length) setProducts(p => [...p, fromDb(rows[0])]);
        notify("追加しました ✓");
      } else {
        const res = await fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + modal.id, { method:"PATCH", headers:HDRS, body: JSON.stringify(body) });
        if (!res.ok) throw new Error(await res.text());
        setProducts(p => p.map(x => x.id===modal.id ? { ...x, name:body.name, productCode:body.product_code||"", category:body.category, subCategory:body.sub_category||"", price:body.price, cost:body.cost, stock:body.stock, minStock:body.min_stock } : x));
        notify("更新しました ✓");
      }
      setModal(null);
    } catch(e) { notify("保存に失敗しました","error"); }
    setSaving(false);
  };

  const deleteProduct = async (p) => {
    if (!window.confirm(`「${p.name}」を削除しますか？`)) return;
    setSaving(true);
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + p.id, { method:"DELETE", headers:HDRS });
      if (!res.ok) throw new Error();
      setProducts(prev => prev.filter(x => x.id !== p.id));
      notify("削除しました");
    } catch(e) { notify("削除に失敗しました","error"); }
    setSaving(false);
  };

  const logStockMovement = async (p, delta) => {
    if (!delta) return;
    try {
      const row = { product_id: p.id, product_name: p.name, category: p.category || null, sub_category: (p.subCategory && p.subCategory !== "一般") ? p.subCategory : "未分類", delta };
      if (recordDate) row.created_at = recordDate + "T12:00:00+09:00"; // 記録日が指定されていればその日付で記録(未指定=今日)
      await fetch(SUPABASE_URL + "/rest/v1/stock_movements", {
        method: "POST", headers: HDRS,
        body: JSON.stringify([row]),
      });
    } catch (e) { /* 履歴の記録に失敗しても在庫数自体の更新は成功させたいので握りつぶす */ }
  };

  const changeStock = async (p, delta) => {
    const ns = Math.max(0, (p.stock||0) + delta);
    setProducts(prev => prev.map(x => x.id===p.id ? { ...x, stock: ns } : x));
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + p.id, { method:"PATCH", headers:HDRS, body: JSON.stringify({ stock: ns }) });
      if (!res.ok) throw new Error();
      logStockMovement(p, delta);
    } catch(e) { notify("保存に失敗しました","error"); }
  };

  // ── 店販→業務 卸し ──
  const [transferModal, setTransferModal] = useState(null); // { source, qty, targetId, targetSearch }
  const [transferSaving, setTransferSaving] = useState(false);
  const doTransfer = async () => {
    const { source, qty, targetId } = transferModal;
    const q = Number(qty);
    if (!q || q <= 0) return notify("数量を入力してください","error");
    if (q > (source.stock||0)) return notify("店販側の在庫数を超えています","error");
    const target = products.find(x => x.id === targetId);
    if (!target) return notify("卸し先の業務商品を選択してください","error");
    setTransferSaving(true);
    try {
      const newSourceStock = (source.stock||0) - q;
      const newTargetStock = (target.stock||0) + q;
      const [r1, r2] = await Promise.all([
        fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + source.id, { method:"PATCH", headers:HDRS, body: JSON.stringify({ stock: newSourceStock }) }),
        fetch(SUPABASE_URL + "/rest/v1/products?id=eq." + target.id, { method:"PATCH", headers:HDRS, body: JSON.stringify({ stock: newTargetStock }) }),
      ]);
      if (!r1.ok || !r2.ok) throw new Error();
      setProducts(prev => prev.map(x => x.id===source.id ? {...x, stock:newSourceStock} : x.id===target.id ? {...x, stock:newTargetStock} : x));
      await Promise.all([ logStockMovement(source, -q), logStockMovement(target, q) ]);
      notify(`${source.name} を ${q}個、${target.name}(業務)に卸しました ✓`);
      setTransferModal(null);
    } catch (e) { notify("卸しの保存に失敗しました","error"); }
    setTransferSaving(false);
  };

  const stockColor = p => (p.stock||0) < (p.minStock||3) ? C.red : (p.stock||0) < (p.minStock||3)*2 ? C.orange : C.green;

  const toggleGroupSelect = (items) => {
    const ids = items.filter(p => !p.placeholder).map(p => p.id);
    setSelectedIds(prev => {
      const n = new Set(prev);
      const allIn = ids.length > 0 && ids.every(id => n.has(id));
      ids.forEach(id => allIn ? n.delete(id) : n.add(id));
      return n;
    });
  };
  const groupAllSelected = (items) => {
    const ids = items.filter(p => !p.placeholder).map(p => p.id);
    return ids.length > 0 && ids.every(id => selectedIds.has(id));
  };
  const toggleSelect = (id) => setSelectedIds(prev => {
    const n = new Set(prev);
    if (n.has(id)) n.delete(id); else n.add(id);
    return n;
  });
  const exitSelectMode = () => { setSelectMode(false); setSelectedIds(new Set()); };

  const applyBulkEdit = async (fields) => {
    // fields: { category?, subCategory?, price?, cost?, minStock? } チェックされた項目のみ含む
    if (Object.keys(fields).length === 0) return notify("変更する項目を選んでください","error");
    const ids = [...selectedIds];
    if (ids.length === 0) return;
    const body = {};
    if ("category" in fields) body.category = fields.category.trim();
    if ("subCategory" in fields) body.sub_category = fields.subCategory.trim() || null;
    if ("price" in fields) body.price = parseInt(fields.price)||0;
    if ("cost" in fields) body.cost = parseInt(fields.cost)||0;
    if ("minStock" in fields) body.min_stock = parseInt(fields.minStock)||3;
    setSaving(true);
    try {
      if (body.category) await ensureShopCategory(body.category);
      const res = await fetch(SUPABASE_URL + "/rest/v1/products?id=in.(" + ids.join(",") + ")", { method:"PATCH", headers:HDRS, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(await res.text());
      setProducts(prev => prev.map(p => {
        if (!selectedIds.has(p.id)) return p;
        return {
          ...p,
          ...(body.category !== undefined ? { category: body.category } : {}),
          ...(body.sub_category !== undefined ? { subCategory: body.sub_category||"" } : {}),
          ...(body.price !== undefined ? { price: body.price } : {}),
          ...(body.cost !== undefined ? { cost: body.cost } : {}),
          ...(body.min_stock !== undefined ? { minStock: body.min_stock } : {}),
        };
      }));
      notify(ids.length + "品を更新しました ✓");
      setBulkEditModal(null); exitSelectMode();
    } catch(e) { notify("保存に失敗しました","error"); }
    setSaving(false);
  };

  const bulkRegister = async (lines, common) => {
    if (!lines.length) return notify("登録する行を選んでください","error");
    if (!common.category.trim()) return notify("カテゴリを入力してください","error");
    setSaving(true);
    try {
      await ensureShopCategory(common.category.trim());
      const rows = lines.map((ln, i) => {
        const cm = ln.match(/\d{4,7}/);
        return {
          name: ln.replace(/\d{4,7}/, "").replace(/\s+/g," ").trim() || ln,
          product_code: cm ? cm[0] : null,
          category: common.category.trim(),
          sub_category: common.subCategory.trim() || null,
          price: parseInt(common.price)||0,
          cost: parseInt(common.cost)||0,
          stock: 0,
          min_stock: parseInt(common.minStock)||3,
          placeholder: false, photos: [], is_public: false, description: null,
          sort_order: Date.now() + i,
        };
      });
      const res = await fetch(SUPABASE_URL + "/rest/v1/products", { method:"POST", headers:HDRS, body: JSON.stringify(rows) });
      if (!res.ok) throw new Error(await res.text());
      const inserted = await res.json();
      setProducts(prev => [...prev, ...inserted.map(fromDb)]);
      notify(inserted.length + "品を登録しました ✓");
      return true;
    } catch(e) { notify("登録に失敗しました","error"); return false; }
    finally { setSaving(false); }
  };

  // ── ロック画面 ──
  if (!authed) {
    return (
      <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:24 }}>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ marginBottom:16 }}>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
        <div style={{ fontWeight:800, fontSize:18, marginBottom:4, color:C.text }}>在庫管理</div>
        <div style={{ fontSize:13, color:C.sub, marginBottom:20 }}>パスコードを入力してください</div>
        <input type="tel" inputMode="numeric" maxLength={4} value={pinInput} autoFocus disabled={checking}
          onChange={e => {
            const v = e.target.value.replace(/[^0-9]/g,"").slice(0,4);
            setPinInput(v); setPinError("");
            if (v.length === 4) tryUnlock(v);
          }}
          style={{ width:160, textAlign:"center", fontSize:28, letterSpacing:12, padding:"12px 0", border:"1.5px solid "+(pinError?C.red:C.border), borderRadius:12, background:checking?"#f5f2ec":"#fff", outline:"none" }} />
        {checking && <div style={{ fontSize:13, color:C.sub, marginTop:12 }}>確認中...</div>}
        {!checking && pinError && <div style={{ fontSize:13, color:C.red, marginTop:12, textAlign:"center", padding:"0 20px" }}>{pinError}</div>}
      </div>
    );
  }

  return (
    <div style={{ minHeight:"100vh", paddingBottom:90 }}>
      {/* ヘッダー */}
      <div style={{ position:"sticky", top:0, zIndex:100, background:C.bg, padding:"14px 16px 10px", borderBottom:"1px solid "+C.border }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
          <div style={{ fontWeight:800, fontSize:17, color:C.text }}>在庫管理 <span style={{ fontSize:10, fontWeight:400, color:C.sub }}>{STOCK_VERSION}</span></div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => { setLoading(true); reload(); }} style={{ background:"none", border:"1px solid "+C.border, borderRadius:10, padding:"6px 10px", cursor:"pointer" }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button onClick={lock} style={{ background:"none", border:"1px solid "+C.border, borderRadius:10, padding:"6px 10px", cursor:"pointer" }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </button>
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          {[["gyomu","業務"],["hanbai","店販"],["history","入出庫履歴"],["alert","アラート"]].map(([k,l]) => (
            <button key={k} onClick={() => setView(k)}
              style={{ flex:1, padding:"9px 0", borderRadius:20, border:"1.5px solid "+(view===k?C.accent:C.border), background:view===k?C.accent:"#fff", color:view===k?"#fff":C.text, fontWeight:700, fontSize:12, cursor:"pointer", position:"relative" }}>
              {l}
              {k==="alert" && lowStockAlert.length > 0 && (
                <span style={{ position:"absolute", top:-6, right:-4, background:C.red, color:"#fff", fontSize:10, fontWeight:800, borderRadius:10, minWidth:16, height:16, padding:"0 4px", display:"flex", alignItems:"center", justifyContent:"center" }}>{lowStockAlert.length}</span>
              )}
            </button>
          ))}
        </div>
        {view !== "history" && view !== "alert" && (
          <div style={{ position:"relative", marginTop:10 }}>
            <input value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="商品名・商品コードで検索"
              style={{ width:"100%", boxSizing:"border-box", padding:"10px 68px 10px 14px", borderRadius:12, border:"1px solid "+C.border, fontSize:14, background:"#fff", outline:"none" }} />
            {voiceSearch.supported && (
              <button onClick={voiceSearch.toggle} disabled={voiceSearch.starting}
                style={{ position:"absolute", right: searchText ? 38 : 6, top:"50%", transform:"translateY(-50%)", width:26, height:26, borderRadius:"50%", border:"none", background:voiceSearch.listening?C.red:voiceSearch.starting?C.orange:C.bg, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={(voiceSearch.listening||voiceSearch.starting)?"#fff":C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
              </button>
            )}
            {searchText && (
              <button onClick={() => setSearchText("")}
                style={{ position:"absolute", right:6, top:"50%", transform:"translateY(-50%)", width:26, height:26, borderRadius:"50%", border:"none", background:C.bg, color:C.sub, fontSize:14, fontWeight:700, cursor:"pointer" }}>×</button>
            )}
          </div>
        )}
        <div style={{ display:"flex", justifyContent:"flex-end", gap:14, marginTop:8 }}>
          {view !== "history" && view !== "alert" && (
            <div style={{ display:"flex", alignItems:"center", gap:6, marginRight:"auto" }}>
              <span style={{ fontSize:12, color:C.sub, fontWeight:700 }}>記録日</span>
              <input type="date" value={recordDate} onChange={e => setRecordDate(e.target.value)}
                style={{ border:"1px solid "+C.border, borderRadius:8, padding:"4px 8px", fontSize:12, background:"#fff", color:C.text }} />
              {recordDate
                ? <button onClick={() => setRecordDate("")} style={{ background:"none", border:"none", color:C.red, fontSize:11, fontWeight:700, cursor:"pointer" }}>解除</button>
                : <span style={{ fontSize:10.5, color:C.sub }}>未選択=今日</span>}
            </div>
          )}
          {selectMode && (
            <button onClick={() => {
              const allIds = Object.values(grouped).flatMap(subs => Object.values(subs).flat()).filter(p => !p.placeholder).map(p => p.id);
              setSelectedIds(prev => prev.size >= allIds.length && allIds.length > 0 ? new Set() : new Set(allIds));
            }}
              style={{ background:"none", border:"none", color:C.accent, fontSize:13, fontWeight:700, cursor:"pointer", padding:"4px 2px" }}>
              {(() => { const total = Object.values(grouped).flatMap(subs => Object.values(subs).flat()).filter(p => !p.placeholder).length; return selectedIds.size >= total && total > 0 ? "全解除" : "全選択"; })()}
            </button>
          )}
          {view !== "alert" && (
          <button onClick={() => selectMode ? exitSelectMode() : setSelectMode(true)}
            style={{ background:"none", border:"none", color:selectMode?C.red:C.accent, fontSize:13, fontWeight:700, cursor:"pointer", padding:"4px 2px" }}>
            {selectMode ? "選択をやめる" : "商品を選択して一括編集"}
          </button>
          )}
        </div>
      </div>

      <div style={{ padding:16 }}>

                        ))}
                      </div>
                    )}
                  </div>
                ) : (
                  <input type="number" inputMode="numeric" disabled={!bulkEditModal.use[f.key]} value={bulkEditModal[f.key]}
                    onChange={e=>setBulkEditModal(p=>({...p,[f.key]:e.target.value}))} style={{ ...css.input, textAlign:"right" }} />
                )}
              </div>
            ))}

            <button onClick={() => {
              const fields = {};
              if (bulkEditModal.use.category) fields.category = bulkEditModal.category;

              if (bulkEditModal.use.price) fields.price = bulkEditModal.price;
              if (bulkEditModal.use.cost) fields.cost = bulkEditModal.cost;
              if (bulkEditModal.use.minStock) fields.minStock = bulkEditModal.minStock;
              applyBulkEdit(fields);
            }} disabled={saving}
              style={{ width:"100%", marginTop:4, padding:14, borderRadius:12, border:"none", background:saving?C.sub:C.accent, color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer" }}>
              {saving ? "保存中..." : selectedIds.size + "件に反映する"}
            </button>
          </div>
        </div>
      )}

      {/* 読み取りモーダル */}

          onClick={e => { if (e.target === e.currentTarget) setScanModal(null); }}>
          <div style={{ background:C.card, borderRadius:20, width:"100%", maxWidth:440, maxHeight:"80vh", overflowY:"auto", WebkitOverflowScrolling:"touch", padding:20, boxShadow:"0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={{ fontWeight:800, fontSize:16 }}>納品書・タグ読み取り</div>
              <button onClick={() => setScanModal(null)} style={{ background:"none", border:"none", fontSize:22, color:C.sub, cursor:"pointer", padding:"0 4px" }}>✕</button>
            </div>

            {!scanModal.result ? (
              <div>
                <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                  <button onClick={() => cameraInputRef.current && cameraInputRef.current.click()} disabled={ocrBusy}
                    style={{ flex:1, padding:"12px 0", borderRadius:12, border:"none", background:ocrBusy?C.sub:C.accent, color:"#fff", fontWeight:800, fontSize:14, cursor:"pointer" }}>
                    📷 カメラで撮影
                  </button>
                  <button onClick={() => libInputRef.current && libInputRef.current.click()} disabled={ocrBusy}
                    style={{ flex:1, padding:"12px 0", borderRadius:12, border:"1.5px solid "+C.accent, background:"#fff", color:ocrBusy?C.sub:C.accent, fontWeight:800, fontSize:14, cursor:"pointer" }}>

                <input type="file" accept="image/*" ref={libInputRef} style={{ display:"none" }}

                {ocrBusy && (
                  <div style={{ marginBottom:10 }}>

                  const r = matchReceiptLines(scanModal.text, products);

                  setScanModal(p => ({ ...p, result: r }));

                  style={{ width:"100%", marginTop:10, padding:13, borderRadius:12, border:"none", background:C.accent, color:"#fff", fontWeight:800, fontSize:14, cursor:"pointer" }}>

              <div>

                      style={{ flex:1, padding:"9px 0", borderRadius:20, border:"1.5px solid "+(scanModal.dir===k?C.accent:C.border), background:scanModal.dir===k?C.accent:"#fff", color:scanModal.dir===k?"#fff":C.text, fontWeight:700, fontSize:13, cursor:"pointer" }}>{l}</button>

                {scanModal.result.matches.length === 0

                      </div>

                              const cs = new Set(p.bulkChecked || p.result.unmatched.map((_,idx)=>idx));

                        <input type="number" inputMode="numeric" value={scanModal.bulkMin||""} onChange={e=>setScanModal(p=>({...p,bulkMin:e.target.value}))}
                          placeholder="最小" style={{ ...css.input, textAlign:"right", fontSize:14 }} />
                      </div>
                      <button onClick={async () => {
                        const checkedSet = scanModal.bulkChecked || new Set(scanModal.result.unmatched.map((_,idx)=>idx));

                        const ok = await bulkRegister(lines, { category:scanModal.bulkCat||"", subCategory:scanModal.bulkSub||"", price:scanModal.bulkPrice||"", cost:scanModal.bulkCost||"", minStock:scanModal.bulkMin||"3" });
                        if (ok) setScanModal(null);
                      }} disabled={saving}
                        style={{ width:"100%", marginTop:10, padding:13, borderRadius:12, border:"none", background:saving?C.sub:C.accent, color:"#fff", fontWeight:800, fontSize:14, cursor:"pointer" }}>

                      </button>
                      <div style={{ fontSize:11, color:C.sub, marginTop:6, lineHeight:1.6 }}>

                      </div>
                    </div>
                  </div>
                )}

                <button onClick={() => setScanModal(p=>({ ...p, result:null }))}
                  style={{ width:"100%", marginTop:12, padding:10, borderRadius:10, border:"1px solid "+C.border, background:"#fff", color:C.sub, fontWeight:700, fontSize:13, cursor:"pointer" }}>
                  ← 読み取りをやり直す
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* トースト */}
      {toast && (
        <div style={{ position:"fixed", bottom:96, left:"50%", transform:"translateX(-50%)", background:toast.type==="error"?C.red:"#2a2218", color:"#fff", padding:"10px 20px", borderRadius:12, fontSize:14, fontWeight:700, zIndex:1000, whiteSpace:"pre-wrap", maxWidth:"85vw", textAlign:"center", boxShadow:"0 4px 12px rgba(0,0,0,0.25)" }}>
          {toast.msg}
        </div>
      )}

      {/* 下部固定：商品追加 / 選択モード時は一括編集バー */}
      <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:100 }}>
        {selectMode ? (
          <div style={{ maxWidth:480, margin:"0 auto", padding:"10px 16px calc(10px + env(safe-area-inset-bottom))", background:"rgba(250,248,244,0.97)", borderTop:"1px solid "+C.border, display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ fontSize:13, fontWeight:700, color:C.text, whiteSpace:"nowrap" }}>{selectedIds.size}件選択中</div>
            <button onClick={exitSelectMode}
              style={{ padding:"12px 14px", borderRadius:12, border:"1px solid "+C.border, background:"#fff", color:C.sub, fontWeight:700, fontSize:14, cursor:"pointer" }}>
              キャンセル
            </button>
            <button onClick={() => setBulkEditModal({ category:"", subCategory:"", price:"", cost:"", minStock:"", use:{} })} disabled={selectedIds.size===0}
              style={{ flex:1, padding:14, borderRadius:12, border:"none", background:selectedIds.size===0?C.sub:C.accent, color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer" }}>
              一括編集
            </button>
          </div>
        ) : (
          <div style={{ maxWidth:480, margin:"0 auto", padding:"10px 16px calc(10px + env(safe-area-inset-bottom))", background:"rgba(250,248,244,0.95)", borderTop:"1px solid "+C.border, display:"flex", gap:8 }}>
            <button onClick={() => setScanModal({ text:"", result:null, dir:"in" })}
              style={{ flex:1, padding:14, borderRadius:12, border:"1.5px solid "+C.accent, background:"#fff", color:C.accent, fontWeight:800, fontSize:15, cursor:"pointer" }}>
              読み取り
            </button>
            <button onClick={openAdd}
              style={{ flex:1, padding:14, borderRadius:12, border:"none", background:C.accent, color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer" }}>
              ＋ 商品を追加
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
