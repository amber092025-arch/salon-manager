<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber Style Gallery</title>
<meta name="apple-mobile-web-app-title" content="Amber" />
<link rel="apple-touch-icon" href="icon_style.png" />
<link rel="icon" href="icon_style.png" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf8f5;
    --charcoal: #1a1a1a;
    --warm: #c8a97e;
    --warm-light: #f0e8dc;
    --muted: #8a8278;
    --border: #e8e2da;
    --hp-red: #e8001b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--charcoal); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; min-height: 100vh; }

  .header { background: var(--charcoal); padding: 28px 24px 24px; text-align: center; position: sticky; top: 0; z-index: 100; }
  .header-salon { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: #fff; letter-spacing: 6px; text-transform: uppercase; }
  .header-sub { font-size: 10px; color: var(--warm); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }

  /* 絞り込みバー */
  .filter-wrap { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 16px; position: sticky; top: 93px; z-index: 90; display: none; }
  .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .filter-trigger-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: #fff; color: var(--charcoal); font-size: 12px; font-family: 'Noto Sans JP', sans-serif; font-weight: 400; cursor: pointer; transition: all 0.2s; }
  .filter-trigger-btn.has-filter { background: var(--charcoal); border-color: var(--charcoal); color: #fff; }
  .filter-active-tags { display: flex; gap: 5px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .filter-active-tags::-webkit-scrollbar { display: none; }
  .filter-active-tag { padding: 4px 10px; border-radius: 20px; background: var(--warm-light); color: var(--warm); font-size: 11px; white-space: nowrap; }
  .filter-clear-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--warm); background: #fff; color: var(--warm); font-size: 11px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

  /* 絞り込みモーダル */
  .filter-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-end; }
  .filter-modal-overlay.open { display: flex; }
  .filter-modal { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-height: 80vh; overflow-y: auto; padding: 20px 0 36px; }
  .filter-modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .filter-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 16px; border-bottom: 1px solid var(--border); }
  .filter-modal-title { font-size: 16px; font-weight: 700; }
  .filter-modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; }
  .filter-modal-body { padding: 16px 20px; }
  .filter-cat-section { margin-bottom: 20px; }
  .filter-cat-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .filter-check-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .filter-check-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; background: #fff; transition: background 0.15s; }
  .filter-check-item:last-child { border-bottom: none; }
  .filter-check-item:active { background: var(--warm-light); }
  .filter-check-item.checked { background: var(--warm-light); }
  .filter-check-name { font-size: 14px; color: var(--charcoal); }
  .filter-check-box { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .filter-check-item.checked .filter-check-box { background: var(--charcoal); border-color: var(--charcoal); }
  .filter-check-item.checked .filter-check-box::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .filter-modal-footer { padding: 16px 20px 0; display: flex; gap: 10px; }
  .filter-apply-btn { flex: 1; padding: 14px; border-radius: 12px; background: var(--charcoal); color: #fff; border: none; font-size: 15px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; cursor: pointer; }
  .filter-reset-btn { padding: 14px 20px; border-radius: 12px; background: #fff; color: var(--muted); border: 1px solid var(--border); font-size: 15px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; }

  .gallery-header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .gallery-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; font-style: italic; }
  .gallery-count { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .gallery { padding: 0 12px 100px; columns: 2; column-gap: 10px; }
  .card { break-inside: avoid; margin-bottom: 10px; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.06); animation: fadeUp 0.4s ease both; cursor: pointer; }
  .card:active { opacity: 0.85; transform: scale(0.98); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-photos { position: relative; width: 100%; }
  .card-img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }
  .card-img-placeholder { width: 100%; aspect-ratio: 4/5; background: linear-gradient(135deg, var(--warm-light), var(--border)); display: flex; align-items: center; justify-content: center; font-size: 32px; opacity: 0.5; }
  .card-body { padding: 8px 10px 10px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 3px; }
  .card-tag { font-size: 9px; padding: 2px 7px; border-radius: 10px; background: var(--warm-light); color: var(--warm); font-weight: 400; }
  .card-tag.cat { background: var(--charcoal); color: #fff; }

  /* Slideshow */
  .slideshow-overlay { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .slideshow-overlay.open { display: flex; }
  .slideshow-img { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
  .slideshow-img.active { opacity: 1; }
  .slideshow-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 32px 24px 48px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: #fff; z-index: 1; }
  .slideshow-style-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; font-style: italic; margin-bottom: 6px; }
  .slideshow-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .slideshow-tag { font-size: 10px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; }
  .slideshow-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 18px; cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .slideshow-progress { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--warm); transition: width linear; z-index: 2; }
  .slideshow-counter { position: absolute; top: 20px; left: 20px; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 2px; z-index: 2; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; flex-direction: column; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-inner { background: var(--cream); border-radius: 20px 20px 0 0; margin-top: auto; max-height: 92vh; overflow-y: auto; transform: translateY(40px); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .modal-overlay.open .modal-inner { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.3); border: none; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

  /* Modal photo */
  .modal-photo-wrap { position: relative; width: 100%; background: #000; }
  .modal-main-img { width: 100%; max-height: 80vw; object-fit: contain; display: block; background: #000; }
  .modal-ba-row { display: flex; gap: 6px; padding: 10px 14px 0; }
  .modal-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: pointer; opacity: 0.6; border: 2px solid transparent; transition: all 0.2s; flex-shrink: 0; }
  .modal-thumb.active { opacity: 1; border-color: var(--warm); }
  .modal-thumb-label { font-size: 9px; color: var(--muted); text-align: center; margin-top: 3px; }

  /* Modal body */
  .modal-body { padding: 16px 20px 24px; }
  .modal-style-name { font-size: 17px; font-weight: 700; color: var(--charcoal); margin-bottom: 8px; line-height: 1.4; }
  .modal-style-comment { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  .modal-menus { margin-bottom: 14px; }
  .modal-menu-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .modal-menu-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warm); flex-shrink: 0; }
  .modal-menu-name { font-size: 14px; color: var(--charcoal); }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
  .modal-tag { font-size: 11px; padding: 4px 12px; border-radius: 20px; background: var(--warm-light); color: var(--warm); }
  .modal-tag.cat { background: var(--charcoal); color: #fff; }
  .modal-btn-reserve { display: block; width: 100%; padding: 15px; border-radius: 12px; background: var(--hp-red); color: #fff; font-size: 15px; font-weight: 500; font-family: 'Noto Sans JP', sans-serif; text-decoration: none; text-align: center; letter-spacing: 1px; margin-bottom: 10px; }
  .modal-btn-close { display: block; width: 100%; padding: 13px; border-radius: 12px; background: #fff; color: var(--muted); font-size: 14px; font-family: 'Noto Sans JP', sans-serif; border: 1px solid var(--border); cursor: pointer; text-align: center; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-text { font-size: 14px; }
  .loading { text-align: center; padding: 80px 20px; }
  .loading-spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--warm); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--muted); }
  .page-tabs { display:flex; background:#fff; border-bottom:1px solid var(--border); }
  .page-tab { flex:1; padding:12px; border:none; background:transparent; font-size:14px; font-family:'Noto Sans JP',sans-serif; font-weight:300; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
  .page-tab.active { color:var(--charcoal); border-bottom-color:var(--warm); font-weight:500; }
  .products-grid { padding:16px 12px 100px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .prod-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.06); cursor:pointer; animation:fadeUp 0.4s ease both; }
  .prod-card:active { opacity:0.85; transform:scale(0.98); }
  .prod-img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .prod-img-placeholder { width:100%; aspect-ratio:1; background:linear-gradient(135deg,var(--warm-light),var(--border)); display:flex; align-items:center; justify-content:center; font-size:32px; opacity:0.5; }
  .prod-body { padding:10px 12px 12px; }
  .prod-name { font-size:13px; font-weight:500; color:var(--charcoal); margin-bottom:4px; line-height:1.4; }
  .prod-price { font-size:14px; font-weight:700; color:var(--warm); }
  .prod-category { font-size:10px; color:var(--muted); margin-bottom:4px; }
  .modal-prod-imgs { display:flex; gap:6px; padding:10px 14px 0; }
  .modal-prod-thumb { width:56px; height:56px; object-fit:cover; border-radius:8px; cursor:pointer; opacity:0.6; border:2px solid transparent; transition:all 0.2s; }
  .modal-prod-thumb.active { opacity:1; border-color:var(--warm); }
  .modal-prod-price { font-size:22px; font-weight:700; color:var(--warm); margin-bottom:8px; }
  .modal-prod-desc { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:16px; }
  .modal-prod-meta { font-size:11px; color:var(--muted); margin-bottom:16px; }
  .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); background: #fff; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="header">
  <div class="header-salon">Amber</div>
  <div class="header-sub">Style &amp; Products</div>
</div>

<div class="page-tabs">
  <button class="page-tab active" id="tab-style" onclick="switchTab('style')">スタイル</button>
  <button class="page-tab" id="tab-products" onclick="switchTab('products')">商品</button>
</div>
<div class="filter-wrap" id="filterWrap">
  <div class="filter-bar">
    <button class="filter-trigger-btn" id="filterTriggerBtn" onclick="openFilterModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      絞り込み
    </button>
    <div class="filter-active-tags" id="filterActiveTags"></div>
    <button class="filter-clear-btn" id="filterClearBtn" onclick="clearAllFilters()" style="display:none">クリア</button>
  </div>
</div>

<!-- 絞り込みモーダル -->
<div class="filter-modal-overlay" id="filterModalOverlay" onclick="handleFilterOverlayClick(event)">
  <div class="filter-modal">
    <div class="filter-modal-handle"></div>
    <div class="filter-modal-header">
      <div class="filter-modal-title">絞り込み</div>
      <button class="filter-modal-close" onclick="closeFilterModal()">✕</button>
    </div>
    <div class="filter-modal-body" id="filterModalBody"></div>
    <div class="filter-modal-footer">
      <button class="filter-reset-btn" onclick="resetFilterModal()">リセット</button>
      <button class="filter-apply-btn" onclick="applyFilterModal()">絞り込む</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>
</div>

<div id="productsApp" style="display:none">
  <!-- 商品絞り込みバー -->
  <div class="filter-wrap" id="prodFilterWrap" style="display:block; top:140px;">
    <div class="filter-bar">
      <button class="filter-trigger-btn" id="prodFilterTriggerBtn" onclick="openProdFilterModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        絞り込み
      </button>
      <div class="filter-active-tags" id="prodFilterActiveTags"></div>
      <button class="filter-clear-btn" id="prodFilterClearBtn" onclick="clearProdFilters()" style="display:none">クリア</button>
    </div>
  </div>
  <div id="prodList"></div>
</div>

<!-- 商品絞り込みモーダル -->
<div class="filter-modal-overlay" id="prodFilterModalOverlay" onclick="handleProdFilterOverlayClick(event)">
  <div class="filter-modal">
    <div class="filter-modal-handle"></div>
    <div class="filter-modal-header">
      <div class="filter-modal-title">カテゴリで絞り込み</div>
      <button class="filter-modal-close" onclick="closeProdFilterModal()">✕</button>
    </div>
    <div class="filter-modal-body" id="prodFilterModalBody"></div>
    <div class="filter-modal-footer">
      <button class="filter-reset-btn" onclick="resetProdFilterModal()">リセット</button>
      <button class="filter-apply-btn" onclick="applyProdFilterModal()">絞り込む</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="slideshow-overlay" id="slideshow" onclick="stopSlideshow()">
  <button class="slideshow-close" onclick="stopSlideshow(event)">✕</button>
  <div class="slideshow-counter" id="slideshowCounter"></div>
  <img class="slideshow-img" id="slideshowImgA" src="" alt="">
  <img class="slideshow-img" id="slideshowImgB" src="" alt="">
  <div class="slideshow-info" id="slideshowInfo"></div>
  <div class="slideshow-progress" id="slideshowProgress" style="width:0%"></div>
</div>

<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal-inner" id="modalInner">
    <div class="modal-handle"></div>
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="footer">
  大阪府茨木市春日1－4－14 春日ビル4階　072－665－4644
</div>

<script>
const SUPABASE_URL = "https://yvsavbxijdggzihvoram.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2c2F2YnhpamRnZ3ppaHZvcmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTkyNTEsImV4cCI6MjA5NTUzNTI1MX0.v_5yFWKizgOSUHifx10vSm7OEafy6fZhjy5cff-QHQw";
const HP_URL = "https://beauty.hotpepper.jp/slnH000767692/";
const MENU_COLORS = ["#00b4a6","#ff9500","#ff4d88","#5856d6","#34c759","#ff6b6b","#007aff","#c8a97e"];
const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY };

let allStyles = [];
let tagCategories = [];
let allProducts = [];
let activeFilters = new Set();
let currentModalId = null;
let currentModalPhotoType = "after";

async function fetchData() {
  const [visitsRes, catRes, itemRes, prodsRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/visits?select=id,date,photo_data,tags,menus,style_name,style_comment,is_public&order=date.desc`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/tag_categories?select=*&order=sort_order`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/tag_items?select=*&order=sort_order`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,price,category,sub_category,description,is_public&order=id`, { headers }),
  ]);
  const visits = await visitsRes.json();
  const cats = await catRes.json();
  const items = await itemRes.json();

  tagCategories = (cats || []).map(c => ({
    id: c.id, name: c.name,
    items: (items || []).filter(i => i.category_id === c.id).map(i => i.name)
  }));

  allStyles = (visits || []).map(v => {
    let pd = {};
    try { pd = v.photo_data ? JSON.parse(v.photo_data) : {}; } catch(e) {}
    return {
      id: v.id, date: v.date,
      isPublic: v.is_public || false,
      after: pd.after || [], before: pd.before || [],
      tags: v.tags || [],
      menus: v.menus || [],
      styleName: v.style_name || "",
      styleComment: v.style_comment || ""
    };
  }).filter(s => (s.after.length > 0 || s.before.length > 0) && s.isPublic);

  const prodsData = await prodsRes.json();
  allProducts = (prodsData || []).filter(p => p.is_public).map(p => ({
    id: p.id, name: p.name, price: p.price||0,
    category: p.category||"", maker: p.sub_category||"",
    photos: [], photosLoaded: false, description: p.description||""
  }));

  buildFilters();
  renderGallery();
  renderProducts();
}

let tempFilters = new Set();

function buildFilters() {
  const wrap = document.getElementById("filterWrap");
  if (!tagCategories.length) return;
  wrap.style.display = "block";
  updateFilterBar();
}

function openFilterModal() {
  tempFilters = new Set(activeFilters);
  buildFilterModalBody();
  document.getElementById("filterModalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeFilterModal() {
  document.getElementById("filterModalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function handleFilterOverlayClick(e) {
  if (e.target === document.getElementById("filterModalOverlay")) closeFilterModal();
}

function buildFilterModalBody() {
  const body = document.getElementById("filterModalBody");
  body.innerHTML = "";
  tagCategories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "filter-cat-section";
    const label = document.createElement("div");
    label.className = "filter-cat-label";
    label.textContent = cat.name;
    const list = document.createElement("div");
    list.className = "filter-check-list";
    cat.items.forEach(tag => {
      const item = document.createElement("div");
      item.className = "filter-check-item" + (tempFilters.has(tag) ? " checked" : "");
      item.innerHTML = `<span class="filter-check-name">${tag}</span><span class="filter-check-box"></span>`;
      item.onclick = () => {
        if (tempFilters.has(tag)) { tempFilters.delete(tag); item.classList.remove("checked"); }
        else { tempFilters.add(tag); item.classList.add("checked"); }
      };
      list.appendChild(item);
    });
    section.appendChild(label);
    section.appendChild(list);
    body.appendChild(section);
  });
}

function resetFilterModal() {
  tempFilters.clear();
  buildFilterModalBody();
}

function applyFilterModal() {
  activeFilters = new Set(tempFilters);
  closeFilterModal();
  updateFilterBar();
  renderGallery();
}

function clearAllFilters() {
  activeFilters.clear();
  updateFilterBar();
  renderGallery();
}

function updateFilterBar() {
  const triggerBtn = document.getElementById("filterTriggerBtn");
  const activeTagsEl = document.getElementById("filterActiveTags");
  const clearBtn = document.getElementById("filterClearBtn");
  if (activeFilters.size > 0) {
    triggerBtn.classList.add("has-filter");
    clearBtn.style.display = "block";
    activeTagsEl.innerHTML = [...activeFilters].map(t => `<span class="filter-active-tag">${t}</span>`).join("");
  } else {
    triggerBtn.classList.remove("has-filter");
    clearBtn.style.display = "none";
    activeTagsEl.innerHTML = "";
  }
}

function renderGallery() {
  const app = document.getElementById("app");
  const catNames = new Set(tagCategories.map(c => c.name));
  let filtered = allStyles;
  if (activeFilters.size > 0) {
    filtered = allStyles.filter(s => [...activeFilters].every(f => s.tags.includes(f)));
  }
  if (!filtered.length) {
    app.innerHTML = `<div class="empty"><div class="empty-icon">✂️</div><div class="empty-text">スタイルがまだありません</div></div>`;
    return;
  }

  let html = `
    <div class="gallery-header">
      <div class="gallery-title">Latest Styles</div>
      <div class="gallery-count">${filtered.length} styles</div>
    </div>
    <div class="gallery">`;

  filtered.forEach((s, idx) => {
    const imgUrl = (s.after[0] || s.before[0])?.url || "";
    const catTags = s.tags.filter(t => catNames.has(t));
    const subTags = s.tags.filter(t => !catNames.has(t));
    html += `
      <div class="card" style="animation-delay:${idx * 0.04}s" onclick="openModal(${s.id})">
        <div class="card-photos">
          ${imgUrl ? `<img class="card-img" src="${imgUrl}" alt="style" loading="lazy">` : `<div class="card-img-placeholder">📷</div>`}
        </div>
        <div class="card-body">
          <div class="card-tags">
            ${catTags.map(t => `<span class="card-tag cat">${t}</span>`).join("")}
            ${subTags.map(t => `<span class="card-tag">${t}</span>`).join("")}
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function openModal(id) {
  const s = allStyles.find(x => x.id === id);
  if (!s) return;
  currentModalId = id;
  currentModalPhotoType = s.after.length > 0 ? "after" : "before";
  const catNames = new Set(tagCategories.map(c => c.name));
  const catTags = s.tags.filter(t => catNames.has(t));
  const subTags = s.tags.filter(t => !catNames.has(t));
  const hasBA = s.after.length > 0 && s.before.length > 0;
  const mainImg = (currentModalPhotoType === "after" ? s.after[0] : s.before[0])?.url || "";

  // サムネイル行（Before/After）
  let thumbsHtml = "";
  if (hasBA) {
    thumbsHtml = `<div class="modal-ba-row">`;
    s.after.forEach((img, i) => {
      thumbsHtml += `
        <div>
          <img class="modal-thumb ${i === 0 && currentModalPhotoType === 'after' ? 'active' : ''}"
            src="${img.url}" onclick="switchModalPhoto('after', ${i})" loading="lazy">
          ${i === 0 ? `<div class="modal-thumb-label">After</div>` : ""}
        </div>`;
    });
    s.before.forEach((img, i) => {
      thumbsHtml += `
        <div>
          <img class="modal-thumb ${i === 0 && currentModalPhotoType === 'before' ? 'active' : ''}"
            src="${img.url}" onclick="switchModalPhoto('before', ${i})" loading="lazy">
          ${i === 0 ? `<div class="modal-thumb-label">Before</div>` : ""}
        </div>`;
    });
    thumbsHtml += `</div>`;
  }

  // メニュー
  const menusHtml = s.menus.length > 0
    ? `<div class="modal-menus">${s.menus.map((m, i) => `
        <div class="modal-menu-item">
          <div class="modal-menu-dot" style="background:${MENU_COLORS[i % MENU_COLORS.length]}"></div>
          <div class="modal-menu-name">${m.name}</div>
        </div>`).join("")}</div>`
    : "";

  document.getElementById("modalContent").innerHTML = `
    <div class="modal-photo-wrap">
      <img id="modalMainImg" class="modal-main-img" src="${mainImg}" alt="style">
    </div>
    ${thumbsHtml}
    <div class="modal-body">
      ${s.styleName ? `<div class="modal-style-name">${s.styleName}</div>` : ""}
      ${s.styleComment ? `<div class="modal-style-comment">${s.styleComment}</div>` : ""}
      ${menusHtml}
      ${s.tags.length > 0 ? `<div class="modal-tags">
        ${catTags.map(t => `<span class="modal-tag cat">${t}</span>`).join("")}
        ${subTags.map(t => `<span class="modal-tag">${t}</span>`).join("")}
      </div>` : ""}
      <a href="${HP_URL}" target="_blank" class="modal-btn-reserve">ホットペッパーで予約する</a>
      <button class="modal-btn-close" onclick="closeModal()">閉じる</button>
    </div>`;

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

window.switchModalPhoto = (type, idx) => {
  const s = allStyles.find(x => x.id === currentModalId);
  if (!s) return;
  currentModalPhotoType = type;
  const imgs = type === "after" ? s.after : s.before;
  if (!imgs[idx]) return;
  document.getElementById("modalMainImg").src = imgs[idx].url;
  document.querySelectorAll(".modal-thumb").forEach(el => el.classList.remove("active"));
  const allImgs = [...s.after, ...s.before];
  const globalIdx = type === "after" ? idx : s.after.length + idx;
  document.querySelectorAll(".modal-thumb")[globalIdx]?.classList.add("active");
};

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  currentModalId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("modal")) closeModal();
}


function switchTab(tab) {
  document.getElementById("tab-style").classList.toggle("active", tab === "style");
  document.getElementById("tab-products").classList.toggle("active", tab === "products");
  document.getElementById("filterWrap").style.display = tab === "style" ? "block" : "none";
  document.getElementById("app").style.display = tab === "style" ? "block" : "none";
  document.getElementById("productsApp").style.display = tab === "products" ? "block" : "none";
  // タブ切り替え時にスライドショー起動
  stopSlideshow();
  if (tab === "style") {
    setTimeout(startSlideshow, 300);
  } else if (tab === "products") {
    setTimeout(startProductSlideshow, 300);
  }
}

let activeProdFilters = new Set();
let tempProdFilters = new Set();

function openProdFilterModal() {
  tempProdFilters = new Set(activeProdFilters);
  buildProdFilterModalBody();
  document.getElementById("prodFilterModalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeProdFilterModal() {
  document.getElementById("prodFilterModalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function handleProdFilterOverlayClick(e) {
  if (e.target === document.getElementById("prodFilterModalOverlay")) closeProdFilterModal();
}

function buildProdFilterModalBody() {
  const body = document.getElementById("prodFilterModalBody");
  body.innerHTML = "";
  const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
  const section = document.createElement("div");
  section.className = "filter-cat-section";
  const label = document.createElement("div");
  label.className = "filter-cat-label";
  label.textContent = "カテゴリ";
  const list = document.createElement("div");
  list.className = "filter-check-list";
  cats.forEach(cat => {
    const item = document.createElement("div");
    item.className = "filter-check-item" + (tempProdFilters.has(cat) ? " checked" : "");
    item.innerHTML = `<span class="filter-check-name">${cat}</span><span class="filter-check-box"></span>`;
    item.onclick = () => {
      if (tempProdFilters.has(cat)) { tempProdFilters.delete(cat); item.classList.remove("checked"); }
      else { tempProdFilters.add(cat); item.classList.add("checked"); }
    };
    list.appendChild(item);
  });
  section.appendChild(label);
  section.appendChild(list);
  body.appendChild(section);
}

function resetProdFilterModal() {
  tempProdFilters.clear();
  buildProdFilterModalBody();
}

function applyProdFilterModal() {
  activeProdFilters = new Set(tempProdFilters);
  closeProdFilterModal();
  updateProdFilterBar();
  renderProducts();
}

function clearProdFilters() {
  activeProdFilters.clear();
  updateProdFilterBar();
  renderProducts();
}

function updateProdFilterBar() {
  const triggerBtn = document.getElementById("prodFilterTriggerBtn");
  const activeTagsEl = document.getElementById("prodFilterActiveTags");
  const clearBtn = document.getElementById("prodFilterClearBtn");
  if (activeProdFilters.size > 0) {
    triggerBtn.classList.add("has-filter");
    clearBtn.style.display = "block";
    activeTagsEl.innerHTML = [...activeProdFilters].map(t => `<span class="filter-active-tag">${t}</span>`).join("");
  } else {
    triggerBtn.classList.remove("has-filter");
    clearBtn.style.display = "none";
    activeTagsEl.innerHTML = "";
  }
}

function renderProducts() {
  const el = document.getElementById("prodList");
  if (!allProducts.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🛍️</div><div class="empty-text">商品はまだありません</div></div>`;
    return;
  }
  const filtered = activeProdFilters.size > 0
    ? allProducts.filter(p => activeProdFilters.has(p.category))
    : allProducts;
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🛍️</div><div class="empty-text">該当する商品がありません</div></div>`;
    return;
  }
  let html = `<div class="products-grid">`;
  filtered.forEach((p, idx) => {
    html += `<div class="prod-card" style="animation-delay:${idx*0.04}s" id="prod-card-${p.id}" onclick="openProductModal(${p.id})">
      <div class="prod-img-placeholder" id="prod-thumb-${p.id}"><span style="font-size:32px;opacity:0.3">📦</span></div>
      <div class="prod-body">
        <div class="prod-category">${p.category}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">¥${p.price.toLocaleString()}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;

  // 写真を非同期で個別取得してサムネイルを差し替え
  filtered.forEach(async (p) => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=photos&id=eq.${p.id}`, { headers });
      const data = await res.json();
      p.photos = data[0]?.photos || [];
      p.photosLoaded = true;
      const thumb = document.getElementById(`prod-thumb-${p.id}`);
      if (thumb && p.photos[0]?.url) {
        thumb.outerHTML = `<img class="prod-img" src="${p.photos[0].url}" loading="lazy">`;
      }
    } catch(e) { p.photosLoaded = true; }
  });
}

window.openProductModal = async (id) => {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;

  // 写真がまだ取得されていない場合は個別取得
  if (!p.photosLoaded) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=photos&id=eq.${id}`, { headers });
      const data = await res.json();
      p.photos = (data[0]?.photos) || [];
      p.photosLoaded = true;
    } catch(e) { p.photos = []; p.photosLoaded = true; }
  }

  const mainImg = p.photos[0]?.url || "";
  const thumbsHtml = p.photos.length > 1 ? `<div class="modal-prod-imgs">${p.photos.map((ph, i) =>
    `<img class="modal-prod-thumb ${i===0?'active':''}" src="${ph.url}" onclick="switchProdPhoto(${id},${i})" loading="lazy">`
  ).join("")}</div>` : "";

  document.getElementById("modalContent").innerHTML = `
    <div class="modal-photo-wrap">
      <img id="modalMainImg" class="modal-main-img" src="${mainImg || ''}" alt="${p.name}" style="background:#f5f5f5;">
    </div>
    ${thumbsHtml}
    <div class="modal-body">
      <div class="modal-style-name">${p.name}</div>
      <div class="prod-modal-meta" style="font-size:11px;color:var(--muted);margin-bottom:8px;">${p.category}${p.maker ? ' / ' + p.maker : ''}</div>
      <div class="modal-prod-price">¥${p.price.toLocaleString()}</div>
      ${p.description ? `<div class="modal-prod-desc">${p.description}</div>` : ""}
      <a href="${HP_URL}" target="_blank" class="modal-btn-reserve">ホットペッパーで予約・お問い合わせ</a>
      <button class="modal-btn-close" onclick="closeModal()">閉じる</button>
    </div>`;

  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
};

window.switchProdPhoto = (id, idx) => {
  const p = allProducts.find(x => x.id === id);
  if (!p || !p.photos[idx]) return;
  document.getElementById("modalMainImg").src = p.photos[idx].url;
  document.querySelectorAll(".modal-prod-thumb").forEach((el, i) => el.classList.toggle("active", i === idx));
};

// ── Product Slideshow ──
async function startProductSlideshow() {
  // 写真がまだ取得されていない商品を先に全取得
  const prods = allProducts.filter(p => p.photos === undefined || !p.photosLoaded);
  await Promise.all(prods.map(async p => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=photos&id=eq.${p.id}`, { headers });
      const data = await res.json();
      p.photos = data[0]?.photos || [];
      p.photosLoaded = true;
    } catch(e) { p.photos = []; p.photosLoaded = true; }
  }));

  const imgs = [];
  allProducts.forEach(p => {
    if (p.photos && p.photos[0]?.url) {
      imgs.push({ url: p.photos[0].url, styleName: p.name, tags: p.category ? [p.category] : [] });
    }
  });
  if (imgs.length === 0) return;

  ssImages = imgs;
  ssIndex = 0;
  ssActive = true;
  document.getElementById("slideshow").classList.add("open");
  document.body.style.overflow = "hidden";
  showSlide(ssIndex);
}

// ── Slideshow ──
let ssIndex = 0;
let ssImages = [];
let ssTimer = null;
let ssProgressTimer = null;
let ssActive = false;
const SLIDE_INTERVAL = 3000;

function buildSlideshowImages() {
  const imgs = [];
  allStyles.forEach(s => {
    const url = (s.after[0] || s.before[0])?.url || "";
    if (url) imgs.push({ url, styleName: s.styleName, tags: s.tags });
  });
  return imgs;
}

function startSlideshow() {
  ssImages = buildSlideshowImages();
  if (ssImages.length === 0) return;
  ssIndex = 0;
  ssActive = true;
  document.getElementById("slideshow").classList.add("open");
  document.body.style.overflow = "hidden";
  showSlide(ssIndex);
}

function stopSlideshow(e) {
  if (e) e.stopPropagation();
  ssActive = false;
  clearTimeout(ssTimer);
  clearInterval(ssProgressTimer);
  document.getElementById("slideshow").classList.remove("open");
  document.body.style.overflow = "";
  // imgをリセット
  document.getElementById("slideshowImgA").classList.remove("active");
  document.getElementById("slideshowImgB").classList.remove("active");
}

function showSlide(idx) {
  if (!ssActive) return;
  const item = ssImages[idx];
  if (!item) return;

  const counter = document.getElementById("slideshowCounter");
  const info = document.getElementById("slideshowInfo");
  const progress = document.getElementById("slideshowProgress");
  const imgA = document.getElementById("slideshowImgA");
  const imgB = document.getElementById("slideshowImgB");

  // A/Bバッファで交互にフェード
  const current = imgA.classList.contains("active") ? imgA : imgB;
  const next = current === imgA ? imgB : imgA;

  next.src = item.url;
  next.onload = () => {
    current.classList.remove("active");
    next.classList.add("active");
  };
  // 画像が既にキャッシュ済みの場合onloadが呼ばれないケースへの対応
  if (next.complete) {
    current.classList.remove("active");
    next.classList.add("active");
  }

  counter.textContent = `${idx + 1} / ${ssImages.length}`;
  info.innerHTML = item.styleName
    ? `<div class="slideshow-style-name">${item.styleName}</div><div class="slideshow-tags">${item.tags.map(t => `<span class="slideshow-tag">${t}</span>`).join("")}</div>`
    : `<div class="slideshow-tags">${item.tags.map(t => `<span class="slideshow-tag">${t}</span>`).join("")}</div>`;

  // プログレスバー
  clearInterval(ssProgressTimer);
  progress.style.transition = "none";
  progress.style.width = "0%";
  setTimeout(() => {
    progress.style.transition = `width ${SLIDE_INTERVAL}ms linear`;
    progress.style.width = "100%";
  }, 30);

  clearTimeout(ssTimer);
  ssTimer = setTimeout(() => {
    ssIndex = (ssIndex + 1) % ssImages.length;
    showSlide(ssIndex);
  }, SLIDE_INTERVAL);
}

fetchData().then(() => {
  // データ読み込み完了後にスライドショー自動スタート
  setTimeout(startSlideshow, 500);
}).catch(() => {
  document.getElementById("app").innerHTML = `
    <div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">読み込みに失敗しました</div></div>`;
});
</script>
