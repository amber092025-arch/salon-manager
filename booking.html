<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ご予約 | Amber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --cream:#faf8f5; --ink:#3d3833; --amber:#c8a97e; --amber-deep:#a8865a;
    --border:#e8e2da; --muted:#8a8278; --closed:#f1ece4; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--cream);color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.6}
  .serif{font-family:'Cormorant Garamond',serif}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  button:disabled{opacity:.4}
  button:focus-visible,a:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
// トークン取得: 通常URL(?t=xxx)とLIFF経由(?liff.state=%3Ft%3Dxxx)の両対応
const token = (() => {
  const sp = new URLSearchParams(location.search);
  let t = sp.get("t");
  if (!t && sp.get("liff.state")) {
    const ls = sp.get("liff.state");
    t = new URLSearchParams(ls.startsWith("?") ? ls.slice(1) : ls).get("t");
  }
  return t || "";
})();
const STEPS = ["メニュー選択", "日時選択", "内容確認"];

function Gem({ active }) {
  return (
    <span style={{
      display:"inline-block", width:12, height:12, borderRadius:"50%",
      background: active
        ? "radial-gradient(circle at 35% 30%, #e6cfa4, #a8865a)"
        : "radial-gradient(circle at 35% 30%, #ead9b8, #c8a97e)",
      boxShadow: active ? "0 0 0 4px rgba(200,169,126,.28)" : "0 1px 2px rgba(61,56,51,.18)",
    }}/>
  );
}

/* ── ヘッダー：ワードマーク＋①②③ステップバー ── */
function Header({ step }) {
  return (
    <header style={{padding:"18px 16px 4px", textAlign:"center"}}>
      <div className="serif" style={{fontSize:28, fontWeight:600, letterSpacing:"0.12em"}}>Amber</div>
      {step >= 0 && (
        <div style={{display:"flex", justifyContent:"center", gap:6, marginTop:12, marginBottom:4}}>
          {STEPS.map((label, i) => (
            <div key={label} style={{display:"flex", alignItems:"center", gap:6}}>
              <div style={{
                width:22, height:22, borderRadius:"50%", fontSize:11, fontWeight:700,
                display:"flex", alignItems:"center", justifyContent:"center",
                background: i <= step ? "var(--amber-deep)" : "var(--border)",
                color: i <= step ? "#fff" : "var(--muted)",
              }}>{i+1}</div>
              <span style={{fontSize:11, color: i===step ? "var(--ink)" : "var(--muted)", fontWeight: i===step?700:400}}>{label}</span>
              {i < STEPS.length-1 && <span style={{width:14, height:1, background:"var(--border)", margin:"0 4px"}}/>}
            </div>
          ))}
        </div>
      )}
    </header>
  );
}

function ErrorScreen({ title, sub, retry }) {
  return (
    <div>
      <Header step={-1}/>
      <div style={{maxWidth:340, margin:"48px auto", textAlign:"center", padding:"0 16px"}}>
        <p style={{fontWeight:700, marginBottom:10}}>{title}</p>
        {sub && <p style={{color:"var(--muted)", fontSize:13}}>{sub}</p>}
        {retry && <button onClick={retry} style={{marginTop:16, padding:"10px 28px", background:"var(--amber)", color:"#fff", borderRadius:22, fontWeight:700}}>再読み込み</button>}
      </div>
    </div>
  );
}

function App() {
  const [phase, setPhase] = useState("loadingMenus"); // loadingMenus|menus|loadingGrid|grid|confirm|expired|error|done
  const [menus, setMenus] = useState([]);
  const [menuImages, setMenuImages] = useState({}); // {menuId: dataURL} 後追いで届いた画像
  const [menu, setMenu] = useState(null);

  // メニュー画像は一覧表示後にバックグラウンドで取得(失敗しても予約はできる)
  const loadImages = () => {
    fetch(`/api/booking-slots?t=${token}&images=1`)
      .then(r => r.json())
      .then(d => {
        if (!d.ok || !d.images) return;
        const map = {};
        d.images.forEach(x => { map[x.id] = x.image; });
        setMenuImages(map);
      })
      .catch(() => {});
  };
  const [grid, setGrid] = useState(null);
  const [page, setPage] = useState(0);
  const [sel, setSel] = useState(null);
  const [msg, setMsg] = useState("");
  const [sending, setSending] = useState(false);
  const [notice, setNotice] = useState("");
  const [done, setDone] = useState(null);

  const loadMenus = () => {
    setPhase("loadingMenus");
    fetch(`/api/booking-slots?t=${token}`)
      .then(r => r.status === 401 ? Promise.reject("expired") : r.json())
      .then(d => { if (!d.ok) throw "error"; setMenus(d.menus); setPhase("menus"); loadImages(); })
      .catch(e => setPhase(e === "expired" ? "expired" : "error"));
  };
  useEffect(loadMenus, []);

  const chooseMenu = (m) => {
    setMenu(m); setSel(null); setPage(0); setNotice("");
    setPhase("loadingGrid");
    fetch(`/api/booking-slots?t=${token}&menuId=${m.id}`)
      .then(r => r.status === 401 ? Promise.reject("expired") : r.json())
      .then(d => { if (!d.ok) throw "error"; setGrid(d); setPhase("grid"); })
      .catch(e => setPhase(e === "expired" ? "expired" : "error"));
  };

  const reloadGrid = () => {
    if (!menu) return;
    fetch(`/api/booking-slots?t=${token}&menuId=${menu.id}`)
      .then(r => r.json()).then(d => { if (d.ok) setGrid(d); });
  };

  const confirm = () => {
    if (!sel || sending) return;
    setSending(true);
    fetch("/api/booking-confirm", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ t: token, date: sel.date, time: sel.time, message: msg, menuId: menu.id })
    })
    .then(r => r.json().then(d => ({ status:r.status, d })))
    .then(({status, d}) => {
      if (d.ok) { setDone(d); setPhase("done"); return; }
      if (status === 409) { setSel(null); setNotice("申し訳ありません、たった今その時間が埋まりました。空き状況を更新しました。"); setPhase("grid"); reloadGrid(); }
      else if (status === 401) { setPhase("expired"); }
      else { setNotice("エラーが発生しました。もう一度お試しください。"); }
    })
    .catch(() => setNotice("通信エラーが発生しました。電波の良い場所でもう一度お試しください。"))
    .finally(() => setSending(false));
  };

  if (phase === "loadingMenus" || phase === "loadingGrid") return (
    <div><Header step={phase==="loadingMenus"?-1:0}/><p style={{textAlign:"center", color:"var(--muted)", marginTop:60}}>読み込んでいます…</p></div>
  );
  if (phase === "expired") return <ErrorScreen title="このリンクの有効期限が切れました" sub="LINEのトーク画面に戻り、もう一度「予約」と送信してください。"/>;
  if (phase === "error") return <ErrorScreen title="読み込みに失敗しました" retry={loadMenus}/>;

  /* ── ①メニュー選択(HPBスタイル: クーポン/メニュー2区分・バッジ・写真) ── */
  if (phase === "menus") {
    const coupons = menus.filter(m => m.kind === "coupon");
    const normals = menus.filter(m => m.kind !== "coupon");
    const Badge = ({ target }) => {
      if (target !== "new" && target !== "repeat") return null;
      return (
        <span style={{display:"inline-block", background: target==="new" ? "var(--amber-deep)" : "#8a8278",
          color:"#fff", fontSize:10, fontWeight:700, borderRadius:4, padding:"2px 7px", marginRight:6, verticalAlign:"middle", letterSpacing:"0.08em"}}>
          {target === "new" ? "新規" : "再来"}
        </span>
      );
    };
    const Card = ({ m, cta }) => (
      <div style={{background:"var(--white)", border:"1px solid var(--border)", borderRadius:12, padding:"14px 14px 12px", marginBottom:12}}>
        <div style={{fontSize:15, fontWeight:700, lineHeight:1.5}}>
          <Badge target={m.target}/>{m.name}
        </div>
        <div className="serif" style={{fontSize:22, fontWeight:600, color:"var(--amber-deep)", marginTop:4}}>
          ¥{m.price.toLocaleString()}
        </div>
        <div style={{display:"flex", gap:12, alignItems:"center", marginTop:8}}>
          {menuImages[m.id] ? (
            <img src={menuImages[m.id]} alt="" style={{width:88, height:88, objectFit:"cover", borderRadius:10, border:"1px solid var(--border)", flexShrink:0}}/>
          ) : null}
          <div style={{flex:1}}>
            <div style={{fontSize:12, color:"var(--muted)"}}>施術目安 {m.duration}分</div>
            <button onClick={()=>chooseMenu(m)} style={{width:"100%", marginTop:8, padding:"11px 0", borderRadius:22,
              background:"linear-gradient(135deg, #d3b58a, #a8865a)", color:"#fff", fontWeight:700, fontSize:13, letterSpacing:"0.04em"}}>
              {cta} ›
            </button>
          </div>
        </div>
      </div>
    );
    return (
      <div>
        <Header step={0}/>
        <div style={{maxWidth:420, margin:"8px auto", padding:"8px 14px 40px"}}>
          {menus.length === 0 && <p style={{textAlign:"center", color:"var(--muted)", marginTop:40}}>ご予約可能なメニューがありません。お電話にてお問い合わせください。</p>}
          {menus.length > 0 && (
            <div style={{fontSize:12, color:"var(--muted)", marginBottom:10, textAlign:"center"}}>
              クーポン <b style={{color:"var(--ink)"}}>{coupons.length}</b>件　メニュー <b style={{color:"var(--ink)"}}>{normals.length}</b>件
            </div>
          )}
          {coupons.length > 0 && (
            <div style={{fontSize:13, fontWeight:700, background:"var(--closed)", borderRadius:8, padding:"7px 12px", marginBottom:10}}>クーポン</div>
          )}
          {coupons.map(m => <Card key={m.id} m={m} cta="このクーポンで予約"/>)}
          {normals.length > 0 && (
            <div style={{fontSize:13, fontWeight:700, background:"var(--closed)", borderRadius:8, padding:"7px 12px", margin:"6px 0 10px"}}>メニュー</div>
          )}
          {normals.map(m => <Card key={m.id} m={m} cta="このメニューで予約"/>)}
        </div>
      </div>
    );
  }

  /* ── ②日時選択 ── */
  if (phase === "grid") {
    const days = grid.days.slice(page*7, page*7+7);
    const range = `${days[0].date.slice(5).replace("-","/")} 〜 ${days[days.length-1].date.slice(5).replace("-","/")}`;
    return (
      <div style={{paddingBottom: sel ? 200 : 40}}>
        <Header step={1}/>
        <div style={{maxWidth:420, margin:"0 auto"}}>
          <button onClick={()=>{setPhase("menus"); setSel(null);}} style={{padding:"6px 14px 0", color:"var(--amber-deep)", fontSize:12, fontWeight:700}}>‹ メニューを選び直す</button>
          <div style={{textAlign:"center", padding:"6px 14px 8px", fontSize:13, color:"var(--muted)"}}>
            {menu.name}（{menu.duration}分・¥{menu.price.toLocaleString()}）
          </div>

          <div style={{display:"flex", alignItems:"center", justifyContent:"center", gap:14, padding:"4px 0 10px"}}>
            <button aria-label="前の週" disabled={page===0} onClick={()=>setPage(0)}
              style={{width:34,height:34,borderRadius:"50%",border:"1px solid var(--border)",background:"var(--white)",opacity:page===0?0.35:1,fontSize:16}}>‹</button>
            <div style={{fontSize:13, fontWeight:700, letterSpacing:"0.06em", minWidth:120, textAlign:"center"}}>{range}</div>
            <button aria-label="次の週" disabled={page===1} onClick={()=>setPage(1)}
              style={{width:34,height:34,borderRadius:"50%",border:"1px solid var(--border)",background:"var(--white)",opacity:page===1?0.35:1,fontSize:16}}>›</button>
          </div>

          {notice && (
            <div role="status" style={{margin:"0 14px 10px", padding:"9px 12px", background:"#fff6ea", border:"1px solid var(--amber)", borderRadius:8, fontSize:12}}>{notice}</div>
          )}

          <div style={{margin:"0 8px", background:"var(--white)", border:"1px solid var(--border)", borderRadius:12, overflow:"hidden"}}>
            <table style={{width:"100%", borderCollapse:"collapse", tableLayout:"fixed"}}>
              <thead><tr>
                <th style={{width:44}}></th>
                {days.map(d => (
                  <th key={d.date} style={{padding:"8px 0 6px", borderLeft:"1px solid var(--border)", fontWeight:500}}>
                    <div style={{fontSize:15, fontWeight:700}}>{Number(d.date.slice(8))}</div>
                    <div style={{fontSize:10, color: d.w==="日" ? "#c0392b" : d.w==="土" ? "#2e6da4" : "var(--muted)"}}>{d.w}</div>
                  </th>
                ))}
              </tr></thead>
              <tbody>
                {grid.rows.map(t => (
                  <tr key={t}>
                    <td style={{fontSize:10, color:"var(--muted)", textAlign:"right", padding:"0 5px 0 0", borderTop:"1px solid var(--border)", height:34, fontWeight: t.endsWith(":00") ? 700 : 400}}>{t}</td>
                    {days.map(d => {
                      const ok = !d.holiday && d.avail.includes(t);
                      const isSel = sel && sel.date===d.date && sel.time===t;
                      return (
                        <td key={d.date+t} style={{borderTop:"1px solid var(--border)", borderLeft:"1px solid var(--border)", textAlign:"center", height:34,
                          background: d.holiday ? "var(--closed)" : ok ? (isSel ? "#f6eddd" : "var(--white)") : "var(--closed)"}}>
                          {ok && (
                            <button aria-label={`${d.date} ${t}を選択`} onClick={()=>{setSel({date:d.date, time:t, label:`${Number(d.date.slice(5,7))}/${Number(d.date.slice(8))}`, w:d.w}); setNotice("");}}
                              style={{width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center"}}>
                              <Gem active={isSel}/>
                            </button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{textAlign:"center", fontSize:11, color:"var(--muted)", marginTop:10}}><Gem/> <span style={{marginLeft:4}}>が空きのあるお時間です</span></p>
        </div>

        {sel && (
          <div style={{position:"fixed", left:0, right:0, bottom:0, background:"var(--white)", borderTop:"1px solid var(--border)", borderRadius:"18px 18px 0 0",
            boxShadow:"0 -10px 30px rgba(61,56,51,.14)", padding:"16px 18px calc(16px + env(safe-area-inset-bottom))"}}>
            <div style={{display:"flex", alignItems:"baseline", justifyContent:"center", gap:8}}>
              <span className="serif" style={{fontSize:26, fontWeight:600}}>{sel.label}</span>
              <span style={{fontSize:13, color:"var(--muted)"}}>({sel.w})</span>
              <span className="serif" style={{fontSize:26, fontWeight:600}}>{sel.time}〜</span>
            </div>
            <button onClick={()=>setPhase("confirm")} style={{width:"100%", marginTop:12, padding:"14px", borderRadius:26,
              background:"linear-gradient(135deg, #d3b58a, #a8865a)", color:"#fff", fontWeight:700, fontSize:15, letterSpacing:"0.06em"}}>
              内容確認へ ›
            </button>
          </div>
        )}
      </div>
    );
  }

  /* ── ③内容確認 ── */
  if (phase === "confirm") return (
    <div>
      <Header step={2}/>
      <div style={{maxWidth:420, margin:"8px auto", padding:"8px 16px 40px"}}>
        <button onClick={()=>setPhase("grid")} style={{color:"var(--amber-deep)", fontSize:12, fontWeight:700, marginBottom:12}}>‹ 日時を選び直す</button>

        <div style={{background:"var(--white)", border:"1px solid var(--border)", borderRadius:12, overflow:"hidden"}}>
          {[
            ["予約日時", `${sel.label}(${sel.w}) ${sel.time}〜`],
            ["メニュー", menu.name],
            ["料金", `¥${menu.price.toLocaleString()}`],
            ["施術予測時間", `${menu.duration}分`],
          ].map(([k,v],i) => (
            <div key={k} style={{display:"flex", padding:"13px 16px", borderTop: i===0?"none":"1px solid var(--border)"}}>
              <span style={{width:110, color:"var(--muted)", fontSize:13}}>{k}</span>
              <span style={{fontWeight:700, fontSize:14}}>{v}</span>
            </div>
          ))}
        </div>

        <div style={{marginTop:16, fontSize:12, fontWeight:700, marginBottom:6}}>一言メッセージ（任意）</div>
        <textarea value={msg} onChange={e=>setMsg(e.target.value)} maxLength={300}
          placeholder="例：前回と同じ感じでお願いします"
          style={{width:"100%", padding:"10px 12px", border:"1px solid var(--border)", borderRadius:10, fontFamily:"inherit", fontSize:13, minHeight:70, resize:"none", background:"var(--white)"}}/>

        {notice && (
          <div role="status" style={{marginTop:12, padding:"9px 12px", background:"#fff6ea", border:"1px solid var(--amber)", borderRadius:8, fontSize:12}}>{notice}</div>
        )}

        <button onClick={confirm} disabled={sending} style={{width:"100%", marginTop:16, padding:"15px", borderRadius:26,
          background: sending ? "#d9c7a8" : "linear-gradient(135deg, #d3b58a, #a8865a)", color:"#fff", fontWeight:700, fontSize:15, letterSpacing:"0.08em"}}>
          {sending ? "送信中…" : "この内容で予約する"}
        </button>
        <p style={{textAlign:"center", fontSize:11, color:"var(--muted)", marginTop:10}}>この時点ではまだ予約は確定していません</p>
      </div>
    </div>
  );

  /* ── 完了 ── */
  if (phase === "done") return (
    <div>
      <Header step={-1}/>
      <div style={{maxWidth:340, margin:"36px auto", padding:"0 16px"}}>
        <div style={{background:"var(--white)", border:"1px solid var(--border)", borderRadius:14, padding:"30px 20px", textAlign:"center", boxShadow:"0 8px 28px rgba(61,56,51,.07)"}}>
          <div style={{fontSize:12, letterSpacing:"0.28em", color:"var(--amber-deep)", fontWeight:700}}>ご予約を承りました</div>
          <div style={{width:34, height:1, background:"var(--amber)", margin:"14px auto"}}/>
          <div className="serif" style={{fontSize:32, fontWeight:600, lineHeight:1.3}}>{done.dateLabel}</div>
          <div className="serif" style={{fontSize:28, fontWeight:500}}>{done.time}〜</div>
          <div style={{fontSize:13, color:"var(--muted)", marginTop:10}}>{done.menu.name}（¥{done.menu.price.toLocaleString()}）</div>
          <p style={{fontSize:12, color:"var(--muted)", marginTop:16}}>LINEにも確認メッセージをお送りしました。<br/>変更・キャンセルはお電話にてお願いいたします。</p>
        </div>
        <p style={{textAlign:"center", fontSize:12, color:"var(--muted)", marginTop:18}}>この画面は閉じていただいて構いません。</p>
      </div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
