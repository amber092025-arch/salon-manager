}

function StyleFormTab({ setTab, notify, menus, styles, editingStyleId, addStyle, updateStyle }) {
  const editing = editingStyleId ? styles.find(s => s.id === editingStyleId) : null;
  const [form, setForm] = useState(() => editing ? {
    images: [], // 個別取得までは空(カルテ写真と同じ遅延読込方針)。読込後にセット
    category: editing.category || "ladies",
    length: editing.length || "",
    stylistName: editing.stylistName || "",
    stylistComment: editing.stylistComment || "",
    styleName: editing.styleName || "",
    menuFlags: editing.menuFlags || [],
    menuText: editing.menuText || "",
    couponMenuId: editing.couponMenuId || "",
    hashtags: editing.hashtags || [],
    modelVolume: editing.modelVolume || "設定しない",
    modelTexture: editing.modelTexture || "設定しない",
    modelThickness: editing.modelThickness || "設定しない",
    modelCurl: editing.modelCurl || "設定しない",
    modelFace: editing.modelFace || "設定しない",
    modelAge: editing.modelAge || "設定しない",
  } : {
    images: [], category: "ladies", length: "", stylistName: "", stylistComment: "", styleName: "",
    menuFlags: [], menuText: "", couponMenuId: "", hashtags: [],
    modelVolume: "設定しない", modelTexture: "設定しない", modelThickness: "設定しない", modelCurl: "設定しない", modelFace: "設定しない", modelAge: "設定しない",
  });
  const [hashtagInput, setHashtagInput] = useState("");
  const [imgLoaded, setImgLoaded] = useState(!editing); // 新規は既存画像がないので最初から編集可
  const [saving, setSaving] = useState(false);
  const fileRefs = [useRef(), useRef(), useRef()];

  // 編集時のみ、この1件分の写真を単発取得(起動時の一括読込はしない・カルテ/メニュー写真と同じ方針)
  useEffect(() => {
    if (!editing) return;
    (async () => {
      const r = await sbRetry(() => sb.from("styles").select("id,images").eq("id", editing.id));
      if (!r.error && r.data && r.data[0]) {
        setForm(p => ({ ...p, images: r.data[0].images || [] }));
        setImgLoaded(true);
      }
    })();
  }, [editing && editing.id]);

  const couponMenus = menus.filter(m => m.menuKind === "coupon");

  // 画像を3:4に中央クロップし、フル画質(カルテより鮮明)＋一覧用サムネイルの2種を生成
  const processStyleImage = (dataUrl, cb) => {
    const img = new Image();
    img.onload = () => {
      const targetRatio = 3 / 4;
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (sw / sh > targetRatio) { sw = sh * targetRatio; sx = (img.width - sw) / 2; }
      else { sh = sw / targetRatio; sy = (img.height - sh) / 2; }
      const mkCanvas = (outW) => {
        const outH = Math.round(outW / targetRatio);
        const c = document.createElement("canvas");
        c.width = outW; c.height = outH;
        c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        return c;
      };
      const full = mkCanvas(1000).toDataURL("image/jpeg", 0.88);   // フル画質(カルテ:800px/0.6より鮮明)
      const thumb = mkCanvas(160).toDataURL("image/jpeg", 0.6);     // 一覧用サムネイル(軽量)
      cb(full, thumb);
    };
    img.src = dataUrl;
  };

  const handlePickImage = (idx, e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      processStyleImage(ev.target.result, (full, thumb) => {
        setForm(p => {
          const next = [...p.images];
          next[idx] = full;
          return { ...p, images: next };
        });
        if (idx === 0) setForm(p => ({ ...p, __coverImage: thumb }));
      });
    };
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  const removeImage = (idx) => setForm(p => { const next = [...p.images]; next[idx] = null; return { ...p, images: next }; });

  const addHashtag = () => {
    const t = hashtagInput.trim().replace(/^#/, "");
    if (!t) return;
    if (form.hashtags.includes(t)) { setHashtagInput(""); return; }
    setForm(p => ({ ...p, hashtags: [...p.hashtags, t] }));
    setHashtagInput("");
  };
  const removeHashtag = (t) => setForm(p => ({ ...p, hashtags: p.hashtags.filter(x => x !== t) }));
  const toggleMenuFlag = (key) => setForm(p => ({ ...p, menuFlags: p.menuFlags.includes(key) ? p.menuFlags.filter(x => x !== key) : [...p.menuFlags, key] }));

  const save = async () => {
    if (!imgLoaded) return notify("写真の読み込みが完了していません。少し待ってから保存してください", "error");
    if (!form.styleName.trim()) return notify("スタイル名を入力してください", "error");
    setSaving(true);
    const images = form.images.filter(Boolean);
    const coverImage = form.__coverImage || (editing ? editing.coverImage : null) || null;
    const payload = { ...form, images, coverImage, couponMenuId: form.couponMenuId ? Number(form.couponMenuId) : null };
    delete payload.__coverImage;
    if (editing) await updateStyle(editing.id, payload);
    else await addStyle(payload);
    setSaving(false);
    notify(editing ? "更新しました ✓" : "登録しました ✓");
    setTab("styleList");
  };

  const lengthOptions = STYLE_LENGTHS[form.category] || STYLE_LENGTHS.ladies;

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      <div style={{ background: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.border}` }}>
        <button onClick={() => setTab("styleList")} style={{ background: "none", border: "none", color: "#7a6848", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>← 一覧</button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>{editing ? "スタイル編集" : "新規スタイル登録"}</div>
        <div style={{ width: 60 }} />
      </div>
      <div style={{ padding: 16, paddingBottom: 100 }}>

        {/* 写真 */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 4 }}>スタイル写真（最大3枚・3:4）</div>
          {!imgLoaded ? (
            <div style={{ fontSize: 12, color: C.sub, padding: "8px 0" }}>写真を読み込み中…（完了するまで変更できません）</div>
          ) : (
            <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
              {[0, 1, 2].map(idx => (
                <div key={idx} style={{ flex: 1 }}>
                  <div onClick={() => fileRefs[idx].current && fileRefs[idx].current.click()}
                    style={{ width: "100%", aspectRatio: "3/4", borderRadius: 10, overflow: "hidden", background: "#f0ece4", border: `1px dashed ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", position: "relative" }}>
                    {form.images[idx] ? (
                      <img src={form.images[idx]} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    ) : (
                      <span style={{ fontSize: 24, color: C.sub, fontWeight: 300 }}>＋</span>
                    )}
                  </div>
                  {form.images[idx] && (
                    <button onClick={() => removeImage(idx)} style={{ width: "100%", marginTop: 6, padding: "5px 0", fontSize: 11, color: C.sub, background: "#fff", border: `1px solid ${C.border}`, borderRadius: 6, cursor: "pointer" }}>削除</button>
                  )}
                  <input ref={fileRefs[idx]} type="file" accept="image/*" style={{ display: "none" }} onChange={e => handlePickImage(idx, e)} />
                </div>
              ))}
            </div>
          )}
        </div>

        {/* スタイリストコメント */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>スタイリスト名</div>
          <input type="text" value={form.stylistName} onChange={e => setForm(p => ({ ...p, stylistName: e.target.value }))}
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, marginBottom: 14, outline: "none" }} />
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>スタイリストコメント</div>
          <textarea value={form.stylistComment} onChange={e => setForm(p => ({ ...p, stylistComment: e.target.value }))} rows={3}
            placeholder="【気に入って頂いたスタイルは、ブックマークをしてご提示ください】〔レイヤーカット/ボブ/ショートボブ...〕"
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 13, lineHeight: 1.6, resize: "vertical", outline: "none", fontFamily: "inherit" }} />
        </div>

        {/* スタイル */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>スタイル名 *</div>
          <input type="text" value={form.styleName} onChange={e => setForm(p => ({ ...p, styleName: e.target.value }))} maxLength={30}
            placeholder="例：オリーブカラー×カラー専用髪質改善トリートメント"
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, marginBottom: 14, outline: "none" }} />

          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>カテゴリ</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {[["ladies","レディース"],["mens","メンズ"]].map(([v,l]) => (
              <button key={v} onClick={() => setForm(p => ({ ...p, category: v, length: "" }))}
                style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: form.category === v ? "2px solid #b5548a" : `1px solid ${C.border}`, background: form.category === v ? "#faf0f5" : "#fff", color: form.category === v ? "#b5548a" : C.sub, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>{l}</button>
            ))}
          </div>

          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>長さ</div>
          <select value={form.length} onChange={e => setForm(p => ({ ...p, length: e.target.value }))}
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, marginBottom: 14, background: "#fff", outline: "none" }}>
            <option value="">未設定</option>
            {lengthOptions.map(l => <option key={l} value={l}>{l}</option>)}
          </select>

          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>メニュー内容</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
            {STYLE_MENU_FLAGS.map(f => (
              <button key={f.key} onClick={() => toggleMenuFlag(f.key)}
                style={{ padding: "7px 12px", borderRadius: 20, border: form.menuFlags.includes(f.key) ? "1.5px solid #b5548a" : `1px solid ${C.border}`, background: form.menuFlags.includes(f.key) ? "#faf0f5" : "#fff", color: form.menuFlags.includes(f.key) ? "#b5548a" : C.sub, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>
                {f.label}
              </button>
            ))}
          </div>
          <input type="text" value={form.menuText} onChange={e => setForm(p => ({ ...p, menuText: e.target.value }))}
            placeholder="例：カラー+カラー専用髪質改善トリートメント"
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, marginBottom: 14, outline: "none" }} />

          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>クーポン</div>
          <select value={form.couponMenuId} onChange={e => setForm(p => ({ ...p, couponMenuId: e.target.value }))}
            style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, background: "#fff", outline: "none" }}>
            <option value="">未設定</option>
            {couponMenus.map(m => <option key={m.id} value={m.id}>{m.name}（¥{m.price.toLocaleString()}）</option>)}
          </select>
          {couponMenus.length === 0 && <div style={{ fontSize: 11, color: C.sub, marginTop: 6 }}>メニュー管理で区分「クーポン」のメニューを作ると、ここで選べるようになります</div>}
        </div>

        {/* ハッシュタグ */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 8 }}>ハッシュタグ</div>
          <div style={{ display: "flex", gap: 8, marginBottom: form.hashtags.length > 0 ? 10 : 0 }}>
            <input type="text" value={hashtagInput} onChange={e => setHashtagInput(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addHashtag(); } }}
              placeholder="#なしで入力" style={{ flex: 1, boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", fontSize: 14, outline: "none" }} />
            <button onClick={addHashtag} style={{ padding: "0 18px", borderRadius: 10, border: "none", background: "#b5548a", color: "#fff", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>追加</button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {form.hashtags.map(t => (
              <span key={t} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#faf0f5", color: "#b5548a", borderRadius: 14, padding: "5px 10px", fontSize: 12, fontWeight: 700 }}>
                #{t}
                <button onClick={() => removeHashtag(t)} style={{ background: "none", border: "none", color: "#b5548a", cursor: "pointer", fontSize: 13, padding: 0, lineHeight: 1 }}>✕</button>
              </span>
            ))}
          </div>
        </div>

        {/* モデル情報 */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 4 }}>スタイルのモデル情報</div>
          <div style={{ fontSize: 11, color: C.sub, marginBottom: 12 }}>すべて任意項目です</div>
          {[["髪量","modelVolume","volume"],["髪質","modelTexture","texture"],["太さ","modelThickness","thickness"],["クセ","modelCurl","curl"],["顔型","modelFace","face"],["年代","modelAge","age"]].map(([label, field, optKey]) => (
            <div key={field} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 6 }}>{label}</div>
              <select value={form[field]} onChange={e => setForm(p => ({ ...p, [field]: e.target.value }))}
                style={{ width: "100%", boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", fontSize: 13, background: "#fff", outline: "none" }}>
                {STYLE_MODEL_OPTIONS[optKey].map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
          ))}
        </div>

        <button onClick={save} disabled={saving}
          style={{ width: "100%", padding: 14, borderRadius: 12, border: "none", background: saving ? C.sub : "#b5548a", color: "#fff", fontWeight: 800, fontSize: 15, cursor: "pointer" }}>
          {saving ? "保存中..." : editing ? "更新する" : "登録する"}
        </button>
        <div style={{ fontSize: 11, color: C.sub, marginTop: 10, lineHeight: 1.7, textAlign: "center" }}>
          この内容はアプリ内の記録用です。実際のサロンボードへの掲載は、これまでどおり手動での入力が必要です。
        </div>
      </div>
    </div>
  );
}

function LineBookingSettingsTab({ setTab, notify, lineBooking, setLineBooking, saveSetting }) {

    remind: { enabled: lineBooking.remind?.enabled !== false, text: lineBooking.remind?.text || "" },
    confirmMode: lineBooking.confirmMode === "manual" ? "manual" : "auto",

function LogoSettingsTab({ setTab, notify, salonLogo, setSalonLogo, saveSetting }) {
  const fileRef = useRef();
  const [preview, setPreview] = useState(salonLogo);
  const [saving, setSaving] = useState(false);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024 * 2) {
      notify("画像は2MB以下にしてください", "error");
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => setPreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const save = async () => {
    setSaving(true);
    await saveSetting("salonLogo", preview);
    setSalonLogo(preview);
    setSaving(false);
    notify("ロゴを保存しました ✓");
  };

  const remove = async () => {
    setSaving(true);
    await saveSetting("salonLogo", null);
    setSalonLogo(null);
    setPreview(null);
    setSaving(false);

    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* ヘッダー */}

            }
          </div>
          <div style={{ fontSize: 12, color: C.sub }}>

function TagSettingsTab({ setTab, notify, tagCategories, setTagCategories }) {
  const [editCatId, setEditCatId] = useState(null);
  const [editCatName, setEditCatName] = useState("");
  const [newCatName, setNewCatName] = useState("");
  const [editItemId, setEditItemId] = useState(null);
  const [editItemName, setEditItemName] = useState("");
  const [newItemName, setNewItemName] = useState("");
  const [openCatId, setOpenCatId] = useState(null);

  const addCategory = async () => {
    const name = newCatName.trim();
    if (!name) return;
    const { data } = await sb.from("tag_categories").insert([{ name, sort_order: tagCategories.length }]).select();
    if (data && data[0]) {
      setTagCategories(p => [...p, { id: data[0].id, name, sortOrder: data[0].sort_order, items: [] }]);
      setNewCatName("");
      notify("カテゴリを追加しました ✓");
    }
  };

  const updateCategory = async (id) => {
    const name = editCatName.trim();
    if (!name) return;
    await sb.from("tag_categories").update({ name }).eq("id", id);
    setTagCategories(p => p.map(c => c.id === id ? { ...c, name } : c));
    setEditCatId(null);
    notify("更新しました ✓");
  };

  const deleteCategory = async (id) => {
    if (!window.confirm("このカテゴリとサブタグを全て削除しますか？")) return;
    await sb.from("tag_categories").delete().eq("id", id);
    setTagCategories(p => p.filter(c => c.id !== id));
    notify("削除しました");
  };

  const addItem = async (catId) => {
    const name = newItemName.trim();
    if (!name) return;
    const cat = tagCategories.find(c => c.id === catId);
    const { data } = await sb.from("tag_items").insert([{ category_id: catId, name, sort_order: (cat?.items||[]).length }]).select();
    if (data && data[0]) {
      setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: [...(c.items||[]), { id: data[0].id, name, sortOrder: data[0].sort_order }] } : c));
      setNewItemName("");
      notify("タグを追加しました ✓");
    }
  };

  const updateItem = async (catId, itemId) => {
    const name = editItemName.trim();
    if (!name) return;
    await sb.from("tag_items").update({ name }).eq("id", itemId);
    setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: c.items.map(i => i.id === itemId ? { ...i, name } : i) } : c));
    setEditItemId(null);
    notify("更新しました ✓");
  };

  const deleteItem = async (catId, itemId) => {
    await sb.from("tag_items").delete().eq("id", itemId);
    setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: c.items.filter(i => i.id !== itemId) } : c));
    notify("削除しました");
  };

  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      <div style={{ background:"#E8DCC3", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <button onClick={() => setTab("more")} style={{ background:"none", border:"none", color:"#fff", fontSize:15, fontWeight:700, cursor:"pointer" }}>← 戻る</button>
        <div style={{ fontWeight:800, fontSize:16, color:"#fff" }}>タグ設定</div>
        <div style={{ width:48 }} />
      </div>
      <div style={{ padding:16 }}>
        {tagCategories.map(cat => (
          <div key={cat.id} style={{ background:"#fff", borderRadius:12, marginBottom:12, boxShadow:"0 1px 4px rgba(0,0,0,0.06)", overflow:"hidden" }}>
            <div style={{ display:"flex", alignItems:"center", padding:"12px 16px", gap:8 }}>
              {editCatId === cat.id ? (
                <>
                  <input value={editCatName} onChange={e => setEditCatName(e.target.value)}
                    style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14 }} />
                  <button onClick={() => updateCategory(cat.id)} style={{ padding:"6px 12px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:13, cursor:"pointer" }}>保存</button>
                  <button onClick={() => setEditCatId(null)} style={{ padding:"6px 12px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", fontSize:13, cursor:"pointer" }}>✕</button>
                </>
              ) : (
                <>
                  <button onClick={() => setOpenCatId(openCatId === cat.id ? null : cat.id)} style={{ flex:1, background:"none", border:"none", textAlign:"left", fontSize:15, fontWeight:800, color:C.text, cursor:"pointer" }}>
                    {cat.name} {openCatId === cat.id ? "▲" : "▼"}
                  </button>
                  <button onClick={() => { setEditCatId(cat.id); setEditCatName(cat.name); }} style={{ background:"none", border:"none", fontSize:14, cursor:"pointer", color:C.sub }}>編集</button>
                  <button onClick={() => deleteCategory(cat.id)} style={{ background:"none", border:"none", fontSize:14, cursor:"pointer", color:"#ff6b6b" }}>削除</button>
                </>
              )}
            </div>
            {openCatId === cat.id && (
              <div style={{ padding:"0 16px 14px", borderTop:`1px solid ${C.border}` }}>
                {(cat.items||[]).map(item => (
                  <div key={item.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                    {editItemId === item.id ? (
                      <>
                        <input value={editItemName} onChange={e => setEditItemName(e.target.value)}
                          style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 8px", fontSize:13 }} />
                        <button onClick={() => updateItem(cat.id, item.id)} style={{ padding:"5px 10px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:12, cursor:"pointer" }}>保存</button>
                        <button onClick={() => setEditItemId(null)} style={{ padding:"5px 10px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", fontSize:12, cursor:"pointer" }}>✕</button>
                      </>
                    ) : (
                      <>
                        <span style={{ flex:1, fontSize:14, color:C.text }}>{item.name}</span>
                        <button onClick={() => { setEditItemId(item.id); setEditItemName(item.name); }} style={{ background:"none", border:"none", fontSize:13, cursor:"pointer", color:C.sub }}>編集</button>
                        <button onClick={() => deleteItem(cat.id, item.id)} style={{ background:"none", border:"none", fontSize:13, cursor:"pointer", color:"#ff6b6b" }}>削除</button>
                      </>
                    )}
                  </div>
                ))}
                <div style={{ display:"flex", gap:8, marginTop:10 }}>
                  <input value={newItemName} onChange={e => setNewItemName(e.target.value)} placeholder="新しいタグを追加"
                    style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:13, outline:"none" }} />
                  <button onClick={() => addItem(cat.id)} style={{ padding:"6px 14px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:13, cursor:"pointer" }}>追加</button>
                </div>
              </div>
            )}
          </div>
        ))}
        <div style={{ background:"#fff", borderRadius:12, padding:"14px 16px", boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}>
          <div style={{ fontSize:13, fontWeight:700, color:C.text, marginBottom:10 }}>新しいカテゴリを追加</div>
          <div style={{ display:"flex", gap:8 }}>
            <input value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="カテゴリ名"
              style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", fontSize:14, outline:"none" }} />
            <button onClick={addCategory} style={{ padding:"8px 16px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:14, cursor:"pointer" }}>追加</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ドラッグ並べ替え用: 最も近いスクロール可能な親要素を探す(画面端での自動スクロールに使用)
function findScrollParent(el) {
  let cur = el && el.parentElement;
  while (cur) {
    const st = window.getComputedStyle(cur);
    if (/(auto|scroll)/.test(st.overflowY) && cur.scrollHeight > cur.clientHeight) return cur;
    cur = cur.parentElement;
  }
  return null;
}

// Get business open/close hours for a date
function getBizForDate(date, bizHours, closedDaysOfWeek, personalHolidays) {
  if (!bizHours) return { open: "06:00", close: "23:00", isHoliday: false };
  const d = new Date(date + "T00:00:00");
  const dayIdx = d.getDay(); // 0=Sun
  const dayKeys = ["sun","mon","tue","wed","thu","fri","sat"];
  const dayJp = ["日","月","火","水","木","金","土"];
  const key = dayKeys[dayIdx];
  const jp = dayJp[dayIdx];
  const isPersonalHoliday = (personalHolidays||[]).includes(date);
  const isClosedDay = (closedDaysOfWeek||[]).includes(jp);
  const dayHours = bizHours[key] || { open:"06:00", close:"23:00", closed:false };
  const isHoliday = isPersonalHoliday || isClosedDay || dayHours.closed;
  return { open: dayHours.open, close: dayHours.close, isHoliday };
}

function getDefaultBizOpen(bizHours) {
  if (!bizHours) return "10:00";
  const opens = Object.values(bizHours).filter(h => !h.closed).map(h => h.open);
  return opens.sort()[0] || "10:00";
}

function getWeekStart(offset = 0) {
  const now = new Date();
  // JST基準で今日の曜日を取得（0=日,1=月,...,6=土）
  const jstDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = jstDate.getDay(); // 0=日
  // 月曜始まり：月曜日を週の先頭に
  const diffToMon = day === 0 ? -6 : -(day - 1);
  const mon = new Date(jstDate);
  mon.setDate(jstDate.getDate() + diffToMon + offset * 7);
  return mon;
}

    if (overlapsPe && !window.confirm("この時間帯はプライベート予定でブロックされています。予約を作成しますか？")) return;
    // 次回予約ボタン経由の場合はLINE送信の確認をとる(どちらを選んでも予約は作成される)
    let doSendLine = false;
    if (sendLine === true) {
      const cust = customers.find(c => c.id === parseInt(form.customerId));
      doSendLine = window.confirm(`予約を作成し、${cust ? cust.name + "様" : "お客様"}のLINEへ予約内容をお送りします。送信してよろしいですか？\n\n（キャンセル＝LINEは送信せず予約のみ作成）`);
    }
    const custIdx = customers.findIndex(c => c.id === parseInt(form.customerId));
    const color = APPT_COLORS[custIdx % APPT_COLORS.length];
    const apptData = { ...form, customerId: parseInt(form.customerId), menuIds: form.menuIds.map(Number), color, duration: parseInt(form.duration) || 60, customerType: form.customerType || "existing" };
    // Supabaseに保存してDBのidを取得
    let savedAppt;
    if (typeof addAppointment === "function") {
      savedAppt = await addAppointment(apptData);
    }
    if (!savedAppt) {
      // フォールバック：ローカルのみ
      savedAppt = { ...apptData, id: Date.now() };
      setAppointments(p => [...p, savedAppt]);
    }
    // 次回予約メモのLINE送信(送信可否・連携有無はサーバー側でも判定。失敗しても予約作成には影響しない)
    if (doSendLine && savedAppt && savedAppt.id) {
      fetch("/api/line-notify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ apptId: savedAppt.id }) })
        .then(r => r.json())
        .then(d => {
          if (d && d.sent) notify("お客様のLINEへ予約内容を送信しました ✓");
          else if (d && d.reason === "no_line") notify("このお客様はLINE未連携のため送信されませんでした", "error");
          else if (d && d.reason === "disabled") notify("次回予約メモの送信がOFFのため送信されませんでした", "error");
        })
        .catch(() => {});
    }
    // 空カルテを自動作成（DBのappointment idで紐付け）
    const emptyVisit = {
      customerId: parseInt(form.customerId),
      date: form.date,
      time: form.time,
      duration: parseInt(form.duration) || 60,
      menus: form.menuIds.map(id => { const m = menus.find(x=>x.id===Number(id)); return m ? {menuId:m.id, name:m.name, price:m.price} : null; }).filter(Boolean),
      total: 0,
      notes: "",
      beforeImgs: [], afterImgs: [], otherImgs: [],
      products: [],
      appointmentId: savedAppt.id,
      customerType: form.customerType || "existing",
    };
    if (typeof addVisit === "function") await addVisit(emptyVisit);
    else setVisits(p => [...p, { ...emptyVisit, id: Date.now()+1 }]);
    if (setPendingCustomerId) setPendingCustomerId(null);
    setShowAdd(false);
    setForm({ customerId: "", date: todayStr(), time: "10:00", endTime: "11:00", duration: 60, menuIds: [], notes: "", paid: false, shimeika: "shimeika", customerType: "existing" });
    setCustSearch("");
    notify("予約を追加しました ✓");
  };

  // Show full day but highlight business hours
  const dynHourStart = HOUR_START;
  const dynHourEnd = HOUR_END;
  // Cell height: fit all hours in ~85vh (approx 650px on mobile)
  const totalHours = dynHourEnd - dynHourStart;
  const dynCellH = CELL_H;
  const hours = Array.from({ length: totalHours }, (_, i) => dynHourStart + i);

  const timeToPx2 = (timeStr) => {
    const [h, m] = timeStr.split(":").map(Number);
    return (h - dynHourStart + m / 60) * dynCellH;
  };
  const pxToTime2 = (px) => {
    const totalMin = Math.round(((px / dynCellH) + dynHourStart) * 60 / 15) * 15;
    const h = Math.min(Math.max(Math.floor(totalMin / 60), dynHourStart), dynHourEnd - 1);
    const m = totalMin % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  };

  const apptsByDate = (date) => appointments.filter(a => a.date === date);

  const barAppts = viewMode === "day"
    ? apptsByDate(currentDay)
    : viewMode === "week"
      ? weekDays.flatMap(d => apptsByDate(d))
      : monthAppts;
  const barRevenue = barAppts.reduce((s, a) => {
    const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
    return s + am.reduce((ss, m) => ss + (m.price||0), 0);
  }, 0);
  const barLabel = viewMode === "day"
    ? `今日の売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`
    : viewMode === "week"
      ? `今週の売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`
      : `${monthDate.getMonth()+1}/1 〜 ${monthDate.getMonth()+1}/${new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0).getDate()}　売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "calc(100vh - 120px)" }}
      onClick={() => tapMenu && closeTapMenu()}>

      {/* Teal header */}
      <div style={{ background: "#E8DCC3", padding: "8px 14px 10px", flexShrink: 0 }}>
        {/* View mode tabs + nav */}
        {/* Row1: 今日ボタン + 日/週/月タブ */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
          <button onClick={() => { setWeekOffset(0); setDayOffset(0); setMonthOffset(0); }} style={{ background:"rgba(42,34,24,0.1)", border:"1px solid rgba(42,34,24,0.2)", color:"#2a2218", borderRadius:8, padding:"6px 12px", fontWeight:700, cursor:"pointer", fontSize:13, flexShrink:0 }}>今日</button>
          <div style={{ flex:1, display:"flex", background:"rgba(42,34,24,0.1)", borderRadius:8, padding:3, gap:2 }}>
            {[["day","日"], ["week","週"], ["month","月"]].map(([k, l]) => (
              <button key={k} onClick={() => setViewMode(k)} style={{ flex:1, padding:"6px 4px", borderRadius:6, border:"none", background:viewMode===k?"#fff":"transparent", color:viewMode===k?"#2a2218":"rgba(42,34,24,0.5)", fontWeight:700, fontSize:14, cursor:"pointer" }}>{l}</button>
            ))}
          </div>
        </div>
        {/* Row2: 先週/昨日 + 日付ラベル + 来週/明日 */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <button onClick={() => {
            if (viewMode==="day") setDayOffset(o=>o-1);
            else if (viewMode==="week") setWeekOffset(w=>w-1);
            else setMonthOffset(o=>o-1);
          }} style={{ background:"rgba(42,34,24,0.1)", border:"none", color:"#2a2218", borderRadius:8, padding:"5px 10px", fontWeight:700, cursor:"pointer", fontSize:12 }}>
            {viewMode==="day" ? "＜昨日" : viewMode==="week" ? "＜先週" : (() => { const d=new Date(); d.setMonth(d.getMonth()+monthOffset-1); return `＜${d.getMonth()+1}月`; })()}
          </button>
          <div style={{ color:"#2a2218", fontWeight:700, fontSize:13, textAlign:"center" }}>
            {viewMode==="day" && (() => { const dt=new Date(currentDay+"T00:00:00"); return `${dt.getFullYear()}年${String(dt.getMonth()+1).padStart(2,"0")}月${String(dt.getDate()).padStart(2,"0")}日（${DAY_LABELS[dt.getDay()]}）`; })()}
            {viewMode==="week" && weekLabel}
            {viewMode==="month" && `${monthDate.getFullYear()}年${monthDate.getMonth()+1}月`}
          </div>
          <button onClick={() => {
            if (viewMode==="day") setDayOffset(o=>o+1);
            else if (viewMode==="week") setWeekOffset(w=>w+1);
            else setMonthOffset(o=>o+1);
          }} style={{ background:"rgba(42,34,24,0.1)", border:"none", color:"#2a2218", borderRadius:8, padding:"5px 10px", fontWeight:700, cursor:"pointer", fontSize:12 }}>
            {viewMode==="day" ? "明日＞" : viewMode==="week" ? "来週＞" : (() => { const d=new Date(); d.setMonth(d.getMonth()+monthOffset+1); return `${d.getMonth()+1}月＞`; })()}
          </button>
        </div>

        {/* Week day headers (week mode only) */}
        {viewMode === "week" && (
          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", gap: 2, marginTop: 8 }}>
            <div />
            {weekDays.map(d => {
              const dt = new Date(d + "T00:00:00");
              const isToday = d === todayStr();
              const dow = dt.getDay();
              return (
                <div key={d} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: dow === 0 ? "#e05050" : dow === 6 ? "#9a9088" : "#2a2218", fontWeight: 600 }}>{DAY_LABELS[dow]}</div>
                  <div style={{ width: 28, height: 28, borderRadius: "50%", margin: "2px auto 0", background: isToday ? "#2a2218" : "transparent", color: isToday ? "#fff" : dow === 0 ? "#e05050" : dow === 6 ? "#9a9088" : "#2a2218", fontWeight: 800, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center" }}>{dt.getDate()}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── DAY VIEW ── */}
      {viewMode === "day" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f5f5f5", touchAction: "pan-y" }}
          ref={dayRef}
          onTouchStart={e => { swipeTouchStartX.current = e.touches[0].clientX; }}
          onTouchEnd={e => {
            if (swipeTouchStartX.current === null) return;
            const dx = e.changedTouches[0].clientX - swipeTouchStartX.current;
            swipeTouchStartX.current = null;
            if (Math.abs(dx) < 50) return;
            if (dx < 0) setDayOffset(o => o + 1);
            else setDayOffset(o => o - 1);
          }}>
          <div style={{ position: "relative" }}>
            {hours.map(h => {
              const dayBiz = getBizForDate(currentDay, bizHours, closedDaysOfWeek, personalHolidays);
              const openH = parseInt((dayBiz.open||"10:00").split(":")[0]);
              const closeH = parseInt((dayBiz.close||"20:00").split(":")[0]);
              const isOutside = dayBiz.isHoliday || h < openH || h >= closeH;
              const cellBg = dayBiz.isHoliday ? "#e0e0e0" : isOutside ? "#f2f2f2" : "#fff";
              return (
                <div key={h} style={{ display: "flex", borderTop: "1px solid #e8e8e8", minHeight: dynCellH, cursor: "pointer", background: cellBg }}
                  onPointerDown={e => onCellPointerDown(e, currentDay, h)}
                  onPointerUp={onCellPointerUp} onPointerCancel={onCellPointerCancel} onPointerLeave={onCellPointerUp}>
                  <div style={{ width: 50, flexShrink: 0, paddingTop: 4, paddingRight: 8, textAlign: "right" }}>
                    <span style={{ fontSize: 11, color: C.sub }}>{h}:00</span>
                  </div>
                  <div style={{ flex: 1, borderLeft: "1px solid #e0e0e0", position: "relative" }}>
                    {slotUnit === 15 ? (
                      <>
                        <div style={{ height: "25%", borderBottom: "1px dashed #f1f1f1" }} />
                        <div style={{ height: "25%", borderBottom: "1px dashed #e8e8e8" }} />
                        <div style={{ height: "25%", borderBottom: "1px dashed #f1f1f1" }} />
                      </>
                    ) : (
                      <div style={{ height: "50%", borderBottom: "1px dashed #e8e8e8" }} />
                    )}
                  </div>
                </div>
              );
            })}
            {/* Appt blocks */}
            {apptsByDate(currentDay).map(a => {
              const top = timeToPx2(a.time) + 1;
              const dur = a.duration || 60;
              const height = Math.max((dur / 60) * dynCellH - 4, 40);
              const cust = customers.find(c => c.id === a.customerId);
              const color = a.color || APPT_COLORS[0];
              const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
              const endT = calcEndTime(a.time, dur);
              return (
                <div key={a.id} onClick={(e) => { openTapMenu(e, a); }}
                  style={{ position: "absolute", top, left: 52, right: 8, height, borderRadius: 10, background: color, padding: "6px 10px", overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.15)", zIndex: 2, cursor: "pointer" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#fff", marginBottom: 3 }}>{a.time}-{endT}{a.bookingStatus === "pending" && <span style={{ background: "#fff", color: "#b57a00", fontSize: 9, fontWeight: 800, borderRadius: 4, padding: "1px 6px", marginLeft: 6 }}>仮</span>}</div>
                  {a.paid && <span style={{ background: "rgba(0,0,0,0.5)", color: "#fff", fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 6px", marginRight: 6 }}>会計済</span>}
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>{cust?.name || "不明"}様</div>
                  {height > 60 && <div style={{ fontSize: 11, color: "rgba(255,255,255,0.9)", marginTop: 3 }}>
                    {am.map((m,i) => <span key={i}>{i>0?"、":""}<span style={{ width:8, height:8, borderRadius:"50%", background:"rgba(255,255,255,0.7)", display:"inline-block", marginRight:3, verticalAlign:"middle" }} />{m.name}</span>)}
                  </div>}
                </div>
              );
            })}
            {/* プライベート予定ブロック（ストライプ柄で通常予約と区別） */}
            {peOnDate(currentDay).map(e => {
              const top = timeToPx2(e.time||"00:00") + 1;
              const [sh,sm] = (e.time||"00:00").split(":").map(Number);
              const [eh,em] = (e.endTime||"23:59").split(":").map(Number);
              const dur = Math.max((eh*60+em)-(sh*60+sm), 20);
              const height = Math.max((dur / 60) * dynCellH - 4, 32);
              const color = e.color || PE_COLORS[0];
              return (
                <div key={"pe"+e.id} onClick={() => setTapPe(e)}
                  style={{ position: "absolute", top, left: 52, right: 8, height, borderRadius: 10, background: `repeating-linear-gradient(45deg, ${color}, ${color} 8px, ${color}cc 8px, ${color}cc 16px)`, padding: "6px 10px", overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.15)", zIndex: 2, cursor: "pointer", border: "1px solid rgba(255,255,255,0.4)" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{e.time}-{e.endTime}</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>🔒 {e.title}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── WEEK VIEW ── */}
      {viewMode === "week" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f2f2f2", position: "relative", touchAction: "pan-y" }}
          ref={gridRef}
          onTouchStart={e => { swipeTouchStartX.current = e.touches[0].clientX; }}
          onTouchEnd={e => {
            if (swipeTouchStartX.current === null) return;
            const dx = e.changedTouches[0].clientX - swipeTouchStartX.current;
            swipeTouchStartX.current = null;
            if (Math.abs(dx) < 50) return;
            if (dx < 0) setWeekOffset(w => w + 1);
            else setWeekOffset(w => w - 1);
          }}>
          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", position: "relative" }}>
            <div>
              {hours.map(h => (
                <div key={h} style={{ height: dynCellH, display: "flex", alignItems: "flex-start", justifyContent: "flex-end", paddingRight: 6, paddingTop: 4 }}>
                  <span style={{ fontSize: 10, color: C.sub, fontWeight: 500 }}>{h}:00</span>
                </div>
              ))}
            </div>
            {weekDays.map((d, di) => {
              const isToday = d === todayStr();
              const dayBiz = getBizForDate(d, bizHours, closedDaysOfWeek, personalHolidays);
              const openH = parseInt((dayBiz.open||"10:00").split(":")[0]);
              const closeH = parseInt((dayBiz.close||"20:00").split(":")[0]);
              const dayAppts = appointments.filter(a => a.date === d);
              return (
                <div key={d} style={{ position: "relative", borderLeft: "1px solid #e0e0e0", background: isToday ? "rgba(42,34,24,0.04)" : "transparent" }}>
                  {hours.map(h => {
                    const wBiz = getBizForDate(d, bizHours, closedDaysOfWeek, personalHolidays);
                    const wOpenH = parseInt((wBiz.open||"10:00").split(":")[0]);
                    const wCloseH = parseInt((wBiz.close||"20:00").split(":")[0]);
                    const wOutside = wBiz.isHoliday || h < wOpenH || h >= wCloseH;
                    const wBg = wBiz.isHoliday ? "#e0e0e0" : wOutside ? (isToday ? "#f5f0e8" : "#f2f2f2") : (isToday ? "#faf5ee" : "#ffffff");
                    return (
                      <div key={h}
                        style={{ height: dynCellH, borderTop: "1px solid #ececec", cursor: "pointer", background: wBg }}
                        onPointerDown={e => onCellPointerDown(e, d, h)}
                        onPointerUp={onCellPointerUp} onPointerCancel={onCellPointerCancel} onPointerLeave={onCellPointerUp}>
                        {slotUnit === 15 ? (
                          <>
                            <div style={{ height: "25%", borderBottom: "1px dashed #ededed" }} />
                            <div style={{ height: "25%", borderBottom: "1px dashed #e0e0e0" }} />
                            <div style={{ height: "25%", borderBottom: "1px dashed #ededed" }} />
                          </>
                        ) : (
                          <div style={{ height: "50%", borderBottom: "1px dashed #e0e0e0" }} />
                        )}
                      </div>
                    );
                  })}
                  {dayAppts.map(a => {
                    const top = timeToPx2(a.time);
                    const dur = a.duration || 60;
                    const height = Math.max((dur / 60) * dynCellH - 4, 28);
                    const cust = customers.find(c => c.id === a.customerId);
                    const color = a.color || APPT_COLORS[0];
                    const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
                    return (
                      <div key={a.id}
                        style={{ position: "absolute", top: top+1, left: 2, right: 2, height, borderRadius: 8, background: color, padding: "4px 5px", overflow: "hidden", boxShadow: "0 2px 6px rgba(0,0,0,0.18)", zIndex: 2, cursor: "grab", userSelect: "none", WebkitUserSelect: "none" }}
                        onClick={(e) => { openTapMenu(e, a); }}>
                        {a.bookingStatus === "pending" && <div style={{ background: "#fff", color: "#b57a00", fontSize: 9, fontWeight: 800, borderRadius: 4, padding: "1px 5px", display: "inline-block", marginBottom: 2, marginRight: 3 }}>仮</div>}
                        {a.paid && <div style={{ background: "rgba(0,0,0,0.55)", color: "#fff", fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 5px", display: "inline-block", marginBottom: 2 }}>会計済</div>}
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#fff", lineHeight: 1.3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cust?.name || "不明"}様</div>
                        {height > 42 && <div style={{ display: "flex", gap: 3, marginTop: 3, flexWrap: "wrap" }}>{am.slice(0,5).map((m,i) => <div key={i} style={{ width: 9, height: 9, borderRadius: "50%", background: "rgba(255,255,255,0.75)" }} />)}</div>}
                      </div>
                    );
                  })}
                  {peOnDate(d).map(e => {
                    const top = timeToPx2(e.time||"00:00");
                    const [sh,sm] = (e.time||"00:00").split(":").map(Number);
                    const [eh,em] = (e.endTime||"23:59").split(":").map(Number);
                    const dur = Math.max((eh*60+em)-(sh*60+sm), 20);
                    const height = Math.max((dur / 60) * dynCellH - 4, 24);
                    const color = e.color || PE_COLORS[0];
                    return (
                      <div key={"pe"+e.id} onClick={() => setTapPe(e)}
                        style={{ position: "absolute", top: top+1, left: 2, right: 2, height, borderRadius: 8, background: `repeating-linear-gradient(45deg, ${color}, ${color} 6px, ${color}cc 6px, ${color}cc 12px)`, padding: "4px 5px", overflow: "hidden", boxShadow: "0 2px 6px rgba(0,0,0,0.18)", zIndex: 2, cursor: "pointer" }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#fff", lineHeight: 1.3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>🔒{e.title}</div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── MONTH VIEW ── */}
      {viewMode === "month" && (() => {
        const year = monthDate.getFullYear();
        const month = monthDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const startMon = (firstDay === 0 ? 6 : firstDay - 1);
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startMon; i++) cells.push(null);
        for (let i = 1; i <= daysInMonth; i++) cells.push(i);
        while (cells.length % 7 !== 0) cells.push(null);

        return (
          <div style={{ flex: 1, overflowY: "auto", background: "#f5f5f5", touchAction: "pan-y" }}
            onTouchStart={e => { swipeTouchStartX.current = e.touches[0].clientX; }}
            onTouchEnd={e => {
              if (swipeTouchStartX.current === null) return;
              const dx = e.changedTouches[0].clientX - swipeTouchStartX.current;
              swipeTouchStartX.current = null;
              if (Math.abs(dx) < 50) return;
              if (dx < 0) setMonthOffset(o => o + 1);
              else setMonthOffset(o => o - 1);
            }}>
            {/* Day-of-week headers */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", background: "#fff", borderBottom: "1px solid #e0e0e0" }}>
              {["月","火","水","木","金","土","日"].map((d,i) => (
                <div key={d} style={{ textAlign: "center", padding: "8px 0", fontSize: 12, fontWeight: 700, color: i===5?"#90caf9":i===6?"#ff6b6b":C.sub }}>{d}</div>
              ))}
            </div>
            {/* Calendar grid */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)" }}>
              {cells.map((day, idx) => {
                if (!day) return <div key={idx} style={{ minHeight: 64, borderBottom: "1px solid #e8e8e8", borderRight: idx%7!==6?"1px solid #e8e8e8":"none", background: "#fafafa" }} />;
                const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                const da = apptsByDate(dateStr);
                const isToday = dateStr === todayStr();
                const dow = idx % 7; // 0=Mon
                const isSun = dow === 6, isSat = dow === 5;
                return (

function InventoryTab({ products, setProducts, addProduct, updateProduct, deleteProduct: deleteProductGlobal, notify, setTab, visits, purchaseCosts, setPurchaseCosts, purchaseMakers, setPurchaseMakers, purchasePayMethods, setPurchasePayMethods, purchaseCategories, setPurchaseCategories }) {
  const [view, setView] = useState("gyomu");
  const [stockHistory, setStockHistory] = useState([]);
  const [openCats, setOpenCats] = useState({});
  const [openSubs, setOpenSubs] = useState({});
  const [newCatName, setNewCatName] = useState("");
  const [newCatType, setNewCatType] = useState("gyomu"); // 追加カテゴリの種別
  const [newSubName, setNewSubName] = useState({});
  const [showAddCat, setShowAddCat] = useState(false);
  const [showAddSub, setShowAddSub] = useState(null);
  const [minEdit, setMinEdit] = useState({});
  const [addForm, setAddForm] = useState({ name:"", price:"", cost:"", stock:"", minStock:"3", category:"", subCategory:"", photos:[], description:"", isPublic:false });
  const [editingProd, setEditingProd] = useState(null);
  const [addIsShop, setAddIsShop] = useState(true);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [bulkEditModal, setBulkEditModal] = useState(null);
  const [editProdForm, setEditProdForm] = useState({});
  const [editingSubKey, setEditingSubKey] = useState(null);
  const [editSubName, setEditSubName] = useState("");
  const [editingCatKey, setEditingCatKey] = useState(null);
  const [editCatName, setEditCatName] = useState("");
  const [deleteProdCatMode, setDeleteProdCatMode] = useState(false);
  const [prodSortMode, setProdSortMode] = useState(false);
  const [sortSelIds, setSortSelIds] = useState(new Set()); // 並び替えモード中の複数選択(チェックした商品をまとめて移動)
  const toggleSortSel = (id) => setSortSelIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const moveProduct = (p, dir) => {
    const list = (catMap[p.category||"未分類"]||{})[subCatName(p.subCategory)]||[];
    const idx = list.findIndex(x => x.id === p.id);
    const j = idx + dir;
    if (j < 0 || j >= list.length) return;
    const other = list[j];
    const aO = p.sortOrder||0, bO = other.sortOrder||0;
    // setProducts(=setProductsW)が差分を検知してSupabaseへ自動同期する
    setProducts(prev => prev.map(x => x.id===p.id ? {...x, sortOrder:bO} : x.id===other.id ? {...x, sortOrder:aO} : x));
  };

  // ── 三本線ハンドルのドラッグ並べ替え(メニュー並べ替えと同方式。サブカテゴリ内のリスト単位で並べ替え) ──
  const [prodDrag, setProdDrag] = useState(null); // { id, listKey, fromIdx, toIdx, dy, rowH, startY }
  const prodDragRef = useRef(null);
  const prodListOf = (p) => (catMap[p.category||"未分類"]||{})[subCatName(p.subCategory)]||[];
  const startProdDrag = (e, p, idx) => {
    e.preventDefault(); e.stopPropagation();
    const row = e.currentTarget.closest("[data-prow]");
    const rowH = row ? row.getBoundingClientRect().height : 60;
    const container = findScrollParent(row);
    const d = { id: p.id, product: p, fromIdx: idx, toIdx: idx, dy: 0, rowH, startY: e.clientY, lastY: e.clientY, container, startScroll: container ? container.scrollTop : 0, edgeDir: 0 };
    prodDragRef.current = d;
    setProdDrag(d);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    const loop = () => {
      const cur = prodDragRef.current;
      if (!cur) return;
      if (cur.container && cur.edgeDir !== 0) {
        cur.container.scrollTop += cur.edgeDir * 9;
        recalcProdDrag(cur.lastY);
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  };
  const recalcProdDrag = (clientY) => {
    const d = prodDragRef.current;
    if (!d) return;
    const list = prodListOf(d.product);
    const scrollDelta = d.container ? d.container.scrollTop - d.startScroll : 0;
    const dy = (clientY - d.startY) + scrollDelta;
    const toIdx = Math.max(0, Math.min(list.length - 1, d.fromIdx + Math.round(dy / d.rowH)));
    let edgeDir = 0;
    if (d.container) {
      const rect = d.container.getBoundingClientRect();
      if (clientY < rect.top + 70) edgeDir = -1;
      else if (clientY > rect.bottom - 70) edgeDir = 1;
    }
    const nd = { ...d, dy, toIdx, lastY: clientY, edgeDir };
    prodDragRef.current = nd;
    setProdDrag(nd);
  };
  const moveProdDrag = (e) => { if (prodDragRef.current) recalcProdDrag(e.clientY); };
  const endProdDrag = () => {
    const d = prodDragRef.current;
    prodDragRef.current = null;
    setProdDrag(null);
    if (!d || d.toIdx === d.fromIdx) return;
    const list = prodListOf(d.product);
    let newList;
    if (sortSelIds.has(d.id) && [...sortSelIds].filter(id => list.some(x => x.id === id)).length > 1) {
      // チェック済み商品をまとめて移動: 選択外の商品リストの中の落とし先位置に、選択済みを元の順のままブロック挿入
      const selectedInOrder = list.filter(x => sortSelIds.has(x.id));
      const rest = list.filter(x => !sortSelIds.has(x.id));
      const insertAt = list.slice(0, d.toIdx + (d.toIdx > d.fromIdx ? 1 : 0)).filter(x => !sortSelIds.has(x.id)).length;
      newList = [...rest];
      newList.splice(Math.min(insertAt, newList.length), 0, ...selectedInOrder);
    } else {
      newList = [...list];
      const [moved] = newList.splice(d.fromIdx, 1);
      newList.splice(d.toIdx, 0, moved);
    }
    let orders = list.map(x => x.sortOrder||0).sort((a,b)=>a-b);
    if (new Set(orders).size !== orders.length) orders = newList.map((_, i) => Date.now() + i);
    const orderById = {};
    newList.forEach((x, i) => { orderById[x.id] = orders[i]; });
    // sort_orderだけを明示的に保存する。全項目更新の自動同期(setProductsWの差分同期)は
    // 状態に読み込んでいないphotos等も送ってしまい、黙って失敗または上書きの危険があるため使わない
    Object.entries(orderById).forEach(([id, order]) => {
      sb.from("products").update({ sort_order: order }).eq("id", id).then(({ error }) => {
        if (error) notify("並び順の保存に失敗しました", "error");
      });
    });
    setProducts(products.map(x => orderById[x.id] !== undefined ? { ...x, sortOrder: orderById[x.id] } : x));
  };
  // 店販カテゴリリスト（Supabase settings保存）- 初期値は空（Supabaseから読み込む）
  const [shopCategoryList, setShopCategoryList] = useState([]);
  const [shopCatLoaded, setShopCatLoaded] = useState(false);

  const [showOrderModal, setShowOrderModal] = useState(false);
  const [showPurchaseModal, setShowPurchaseModal] = useState(false);
  const [purchaseEditMonth, setPurchaseEditMonth] = useState(() => { const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0"); });
  const [purchaseView, setPurchaseView] = useState("list");
  const [purchaseEditItem, setPurchaseEditItem] = useState(null);
  const [purchaseCameFrom, setPurchaseCameFrom] = useState("list"); // 取引先/科目管理から戻る先(入力中の内容を消さないため)
  const [purchaseForm, setPurchaseForm] = useState({ category:"material", maker:"", amount:"", date:"", payMethod:"", memo:"" });
  const [makerForm, setMakerForm] = useState({ name:"" });
  const [editingMaker, setEditingMaker] = useState(null);

                                      <button onClick={()=>setMinEdit(prev=>({...prev,[p.id]:true}))} style={{ fontSize:11, color:C.sub, background:"none", border:"none", cursor:"pointer", textDecoration:"underline", marginBottom:6, display:"block" }}>

                                          notify(`${p.name}: ${delta>0?"+":""}${delta}個`);
                                        }} style={{ flex:1, padding:"8px 2px", borderRadius:8, border:`1px solid ${delta>0?"#E8DCC3":C.red}`, background: delta>0?"#e8faf9":"#fff5f5", color:delta>0?"#E8DCC3":C.red, fontWeight:700, fontSize:13, cursor:"pointer" }}>
                                          {delta>0?"+":""}{delta}
                                        </button>
                                      ))}
                                      <button onClick={async ()=>{setEditingProd(p.id);setEditProdForm({name:p.name,price:p.price,cost:p.cost||0,stock:p.stock||0,minStock:p.minStock||3,category:p.category,subCategory:subCatName(p.subCategory),photos:[],description:p.description||"",isPublic:p.isPublic||false});const ph=await sb.from("products").select("photos").eq("id",p.id);if(ph.data&&ph.data[0])setEditProdForm(prev=>({...prev,photos:ph.data[0].photos||[]}));}} style={{ padding:"8px 10px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", color:C.sub, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center" }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
