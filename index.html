}

const sb = {
  from: (table) => ({
    _table: table,
    select: function(cols = "*") { this._cols = cols; this._filters = []; return this; },
    insert: function(data) { this._method = "POST"; this._data = data; return this; },
    upsert: function(data) { this._method = "POST"; this._data = data; this._upsert = true; return this; },
    update: function(data) { this._method = "PATCH"; this._data = data; this._filters = []; return this; },
    delete: function() { this._method = "DELETE"; this._filters = []; return this; },
    eq: function(col, val) { this._filters = [...(this._filters||[]), `${col}=eq.${val}`]; return this; },
    order: function(col, opts={}) { this._order = `${col}.${opts.ascending===false?"desc":"asc"}`; return this; },
    then: async function(resolve, reject) {
      try {
        const base = `${SUPABASE_URL}/rest/v1/${this._table}`;
        const headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": this._upsert ? "resolution=merge-duplicates,return=representation" : "return=representation",
        };
        let url = base;
        const params = [];
        if (this._cols && !this._method) params.push(`select=${this._cols}`);
        if (this._filters) this._filters.forEach(f => params.push(f));
        if (this._order) params.push(`order=${this._order}`);
        if (params.length) url += "?" + params.join("&");

        const method = this._method || "GET";
        const res = await fetch(url, {
          method,
          headers,
          body: this._data ? JSON.stringify(this._data) : undefined,
        });
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }
        const data = method === "DELETE" || method === "PATCH" ? [] : await res.json();
        resolve({ data, error: null });
      } catch(e) {
        resolve({ data: null, error: e });
      }
    }
  })
};

// ── 通信リトライヘルパー（失敗時は1秒→2秒→3秒待って最大3回試行） ──
const sbRetry = async (buildQuery, tries = 3) => {
  let last = null;
  for (let i = 0; i < tries; i++) {
    const r = await buildQuery();
    if (!r.error) return r;
    last = r;
    console.warn("sbRetry: attempt " + (i + 1) + " failed", r.error);
    if (i < tries - 1) await new Promise(res => setTimeout(res, 1000 * (i + 1)));
  }
  return last;
};

const parseReceiptText = (text, makers) => {
  const out = {};
  const t = text || "";
  const dm = t.match(/(20\d{2})\s*[\/\-年\.]\s*(\d{1,2})\s*[\/\-月\.]\s*(\d{1,2})/);
  if (dm) out.date = dm[1] + "-" + String(parseInt(dm[2])).padStart(2,"0") + "-" + String(parseInt(dm[3])).padStart(2,"0");
  // 「合計」「総額」「税込」を含む行の金額を優先、なければ全体の最大値
  let goukei = 0;
  t.split(/\n/).forEach(ln => {
    if (/合計|総額|税込|請求/.test(ln)) {
      const mm = ln.match(/([0-9][0-9,]{2,})/);
      if (mm) { const n = parseInt(mm[1].replace(/,/g,"")); if (n >= 100) goukei = Math.max(goukei, n); }
    }
  });
  if (!goukei) {
    const nums = [];
    const re = /[¥￥]?\s*([0-9][0-9,]{2,})\s*円?/g;
    let m;
    while ((m = re.exec(t))) { const n = parseInt(m[1].replace(/,/g,"")); if (n >= 100 && n < 10000000) nums.push(n); }
    if (nums.length) goukei = Math.max(...nums);
  }
  if (goukei) out.amount = String(goukei);
  const mk = (makers||[]).find(x => x.name && t.includes(x.name));
  if (mk) out.maker = mk.name;
  return out;
};

function bdayToStored(d) {
  var s = (d || "").replace(/[^0-9]/g, "");
  if (s.length !== 8) return "";
  return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
}

const csvField = (v) => {
  const s = (v === undefined || v === null) ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const downloadCSV = (filename, rows) => {
  const body = rows.map(r => r.map(csvField).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + body], { type: "text/csv;charset=utf-8;" }); // UTF-8 BOM付き(Excel文字化け防止)
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

// 音声入力共通フック：マイクボタンから検索欄などにテキストを流し込む(iOS Safari前提、非対応ブラウザではsupported=falseでボタン自体を出さない)
// status: idle→starting(タップ直後〜接続+安全バッファ待ち)→listening(合図音を鳴らして「話してOK」を通知)
// onstartが発火しても実際の音声キャプチャがすぐには安定しないため、onstart後にREADY_BUFFER_MSだけ余裕を持たせてから合図音+赤表示にしている(stock.htmlと同じ実装)
const READY_BUFFER_MS = 500;

const useVoiceInput = (onResult) => {
  const [status, setStatus] = useState("idle");
  const recRef = useRef(null);
  const bufferTimerRef = useRef(null);
  const audioCtxRef = useRef(null);
  const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  const clearBufferTimer = () => { if (bufferTimerRef.current) { clearTimeout(bufferTimerRef.current); bufferTimerRef.current = null; } };

  const playReadyBeep = () => {
    try {
      const ctx = audioCtxRef.current;
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  };

  const toggle = () => {
    if (status === "listening") { recRef.current && recRef.current.stop(); return; }
    if (status === "starting" || !SR) return;

    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!audioCtxRef.current) audioCtxRef.current = new AC();
        if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
      }
    } catch (e) {}

    setStatus("starting");
    try {
      const rec = new SR();
      rec.lang = "ja-JP";
      rec.interimResults = false;
      rec.continuous = false;
      rec.onstart = () => {
        bufferTimerRef.current = setTimeout(() => {
          setStatus("listening");
          playReadyBeep();
        }, READY_BUFFER_MS);
      };
      rec.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript;
        onResult(text);
      };
      rec.onerror = () => { clearBufferTimer(); setStatus("idle"); };
      rec.onend = () => { clearBufferTimer(); setStatus("idle"); recRef.current = null; };
      recRef.current = rec;
      rec.start();
    } catch (err) { setStatus("idle"); }
  };

  return { toggle, supported: !!SR, listening: status === "listening", starting: status === "starting" };
};

// 検索欄用マイクボタン(useVoiceInputとセットで使う共通UI部品)
function VoiceMicButton({ voiceSearch, hasClearBtn = false }) {

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={(voiceSearch.listening || voiceSearch.starting) ? "#fff" : C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    </button>
  );
}

        heartbeat = setInterval(() => send({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }), 25000);
      };
      ws.onmessage = ({ data }) => {
        try {
          const msg = JSON.parse(data);
          if (msg.event !== "postgres_changes") return;
          const d = msg.payload?.data;
          if (!d) return;
          const { table, type, record, old_record } = d;
          if (table === "appointments") {
            if (type === "INSERT") setAppointments(p => p.find(x => x.id === record.id) ? p : [...p, fromDb.appointment(record)]);
            if (type === "UPDATE") setAppointments(p => p.map(x => x.id === record.id ? fromDb.appointment(record) : x));
            if (type === "DELETE") setAppointments(p => p.filter(x => x.id !== old_record.id));
          }
          if (table === "visits") {
            if (type === "INSERT") setVisits(p => p.find(x => x.id === record.id) ? p : [...p, fromDb.visit(record)]);
            if (type === "UPDATE") setVisits(p => p.map(x => {
              if (x.id !== record.id) return x;
              const nv = fromDb.visit(record);
              // Realtimeの仕様：未変更の大きいカラム(TOAST)はペイロードに含まれないため既存値を保持
              if (!("photo_data" in record)) { nv.beforeImgs = x.beforeImgs; nv.afterImgs = x.afterImgs; nv.otherImgs = x.otherImgs; nv.photosLoaded = x.photosLoaded; nv.photosLoadFailed = x.photosLoadFailed; }
              else { nv.photosLoaded = true; }
              if (!("images" in record)) nv.images = x.images;
              return nv;
            }));
            if (type === "DELETE") setVisits(p => p.filter(x => x.id !== old_record.id));
          }
          if (table === "customers") {
            if (type === "INSERT") setCustomers(p => p.find(x => x.id === record.id) ? p : [...p, fromDb.customer(record)]);
            if (type === "UPDATE") setCustomers(p => p.map(x => x.id === record.id ? fromDb.customer(record) : x));
            if (type === "DELETE") setCustomers(p => p.filter(x => x.id !== old_record.id));
          }
          if (table === "products") {
            const bySort = (a,b) => (a.sortOrder||0)-(b.sortOrder||0);
            if (type === "INSERT") setProducts(p => p.find(x => x.id === record.id) ? p : [...p, fromDb.product(record)].sort(bySort));
            if (type === "UPDATE") setProducts(p => p.map(x => x.id === record.id ? fromDb.product(record) : x).sort(bySort));
            if (type === "DELETE") setProducts(p => p.filter(x => x.id !== old_record.id));
          }
        } catch(e) {}
      };
      ws.onclose = () => {
        clearInterval(heartbeat);
        if (!destroyed) setTimeout(async () => {
          // 再接続前に最新データを再取得
          try {
            const [a, v, c] = await Promise.all([
              sbRetry(() => sb.from("appointments").select("*").order("date").order("time")),
              sbRetry(() => sb.from("visits").select(VISIT_LIGHT_COLS).order("date")),
              sbRetry(() => sb.from("customers").select().order("name")),
            ]);
            if (a.data) setAppointments(a.data.map(fromDb.appointment));
            if (v.data) setVisits(prev => {
              // 軽量クエリには写真が含まれないため、既に読み込み済みの写真を保持して合流
              const byId = {};
              prev.forEach(x => { byId[x.id] = x; });
              return v.data.map(r => {
                const nv = fromDb.visit(r);
                const old = byId[nv.id];
                if (old) { nv.beforeImgs = old.beforeImgs; nv.afterImgs = old.afterImgs; nv.otherImgs = old.otherImgs; nv.images = old.images; nv.photosLoaded = old.photosLoaded; nv.photosLoadFailed = old.photosLoadFailed; }
                return nv;
              });
            });
            if (c.data) setCustomers(c.data.map(fromDb.customer));
          } catch(e) {}
          connect();
        }, 5000);
      };
      ws.onerror = () => ws.close();
    }

    connect();
    return () => { destroyed = true; clearInterval(heartbeat); if (ws) { ws.onclose = null; ws.close(); } };
  }, []);

    setMenus(prev => {
      const next = fn(prev);
      // Sync changes to DB
      const added = next.filter(n => !prev.find(p => p.id === n.id));
      const removed = prev.filter(p => !next.find(n => n.id === p.id));
      const updated = next.filter(n => { const old = prev.find(p => p.id === n.id); return old && JSON.stringify(old) !== JSON.stringify(n); });
      added.forEach(m => sb.from("menus").insert([toDb.menu(m)]));
      removed.forEach(m => sb.from("menus").delete().eq("id", m.id));
      updated.forEach(m => sb.from("menus").update(toDb.menu(m)).eq("id", m.id));

function HomeTab({ visits, customers, appointments, menus, setTab, products, purchaseCosts, purchaseCategories, monthlyGoals, bizHours, closedDaysOfWeek, personalHolidays }) {
  const now = new Date();
  const mStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

  // 今日の日付表示 + 今月の残り出勤日数(今日を含む。定休日・臨時休業を除いた営業日でカウント)
  const todayLabel = `${now.getMonth()+1}月${now.getDate()}日(${["日","月","火","水","木","金","土"][now.getDay()]})`;
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  let remainingWorkDays = 0;
  for (let d = now.getDate(); d <= daysInMonth; d++) {
    const dStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if (!getBizForDate(dStr, bizHours, closedDaysOfWeek, personalHolidays).isHoliday) remainingWorkDays++;
  }
  const mv = visits.filter(v => v.date.startsWith(mStr));
  const rev = mv.reduce((s, v) => s + v.total, 0);
  const avg = mv.length ? Math.round(rev / mv.length) : 0;
  const shopRev = mv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.price * p.qty, 0), 0);

  // 分析タブと同じルール：未会計visits（paid=false && total=0）を除外して集計

  const drugCostTotal = mv.reduce((s, v) => s + (v.drugCost||0), 0);
  const techRev = rev - shopRev - drugCostTotal;

  // 今月の仕入れ（材料費・総経費）

  const costItems = Array.isArray(rawCost) ? rawCost : [];
  const costLegacy = (!Array.isArray(rawCost) && rawCost) ? rawCost : null;
  const materialCost = costLegacy ? (costLegacy.material||0) : costItems.filter(i=>i.category==="material").reduce((s,i)=>s+(i.amount||0),0);
  const totalCost = costLegacy ? ((costLegacy.material||0)+(costLegacy.retail||0)+(costLegacy.supplies||0)) : costItems.reduce((s,i)=>s+(i.amount||0),0);

    { label:"客単価", goal:parseInt(goals.avgPrice)||0, actual:techAvg, fmt:yen },

// Helper: days since a date string
function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((new Date() - new Date(dateStr + "T00:00:00")) / 86400000);
}
function timeAgoLabel(dateStr) {
  if (!dateStr) return null;
  const d = daysSince(dateStr);
  if (d === 0) return "今日";
  if (d === 1) return "昨日";
  if (d < 30) return d + "日前";
  const m = Math.floor(d / 30);
  if (m < 12) return m + "ヶ月前";
  return Math.floor(m / 12) + "年前";
}
function isOverdue(dateStr, months = 3) {
  if (!dateStr) return false;
  return daysSince(dateStr) > months * 30;
}

const GOJUON = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","つ","て","と","な","に","の","は","ひ","ふ","ま","み","む","も","や","ゆ","よ","ら","り","る","れ","ろ","わ"];
function kanaGroup(kana) {
  if (!kana) return "他";
  const first = kana.charAt(0);
  const map = {あ:"あ",い:"い",う:"う",え:"え",お:"お",か:"か",が:"か",き:"き",ぎ:"き",く:"く",ぐ:"く",け:"け",げ:"け",こ:"こ",ご:"こ",さ:"さ",ざ:"さ",し:"し",じ:"し",す:"す",ず:"す",せ:"せ",ぜ:"せ",そ:"そ",ぞ:"そ",た:"た",だ:"た",ち:"つ",つ:"つ",づ:"つ",て:"て",で:"て",と:"と",ど:"と",な:"な",に:"に",ぬ:"な",ね:"な",の:"の",は:"は",ば:"は",ぱ:"は",ひ:"ひ",び:"ひ",ぴ:"ひ",ふ:"ふ",ぶ:"ふ",ぷ:"ふ",ま:"ま",み:"み",む:"む",め:"ま",も:"も",や:"や",ゆ:"ゆ",よ:"よ",ら:"ら",り:"り",る:"る",れ:"れ",ろ:"ろ",わ:"わ"};
  return map[first] || "他";
}

function CustomersTab({ customers, setCustomers, visits, setVisits, menus, products, notify, addCustomer, openKarteDetail, setTab, setPendingCustomerId }) {

    if (!form.name) return notify("氏名を入力してください", "error");
    const payload = { ...form, birthday: bdayToStored(form.birthday), joinDate: todayStr() };
    if (addCustomer) await addCustomer(payload);
    else setCustomers(p => [...p, { ...payload, id: Date.now() }]);

  const qL = q.toLowerCase();
  let list = customers.filter(c =>
    !q || c.name.includes(q) || (c.kana || "").includes(q) || (c.phone || "").includes(q)
  );

  const cvMap = {};
  customers.forEach(c => { cvMap[c.id] = (visits||[]).filter(v => v.customerId === c.id); });

  if (sort === "50音順") {
    list = [...list].sort((a, b) => (a.kana || a.name).localeCompare(b.kana || b.name, "ja"));
  } else if (sort === "最終来店日") {
    list = [...list].sort((a, b) => {
      const la = cvMap[a.id].sort((x,y) => y.date.localeCompare(x.date))[0]?.date || "";
      const lb = cvMap[b.id].sort((x,y) => y.date.localeCompare(x.date))[0]?.date || "";

    });

      const avgB = cvMap[b.id].length ? cvMap[b.id].reduce((s,v) => s+v.total,0)/cvMap[b.id].length : 0;
      return avgB - avgA;

  const groups = {};
  if (grouped) {
    list.forEach(c => {
      const g = kanaGroup((c.kana || c.name || "").toLowerCase());
      if (!groups[g]) groups[g] = [];
      groups[g].push(c);
    });
  }

  const CustomerRow = ({ c }) => {
    const cv = cvMap[c.id] || [];
    const last = cv.sort((a,b) => b.date.localeCompare(a.date))[0];
    const lastLabel = timeAgoLabel(last?.date);

        </div>

          {lastLabel && <div style={{ fontSize: 13, color: overdue ? C.orange : C.sub, marginTop: 1 }}>{lastLabel}に来店</div>}
        </div>

  return (

          onClick={e => { if (e.target === e.currentTarget) setShowAdd(false); }}>
          <div style={{ background: C.card, borderRadius: 20, padding: "20px 16px", width: "100%", maxWidth: 440, maxHeight: "85vh", overflowY: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>

            {[["name","氏名 *","text"],["kana","ふりがな","text"],["phone","電話番号","tel"],["birthday","生年月日","date"]].map(([k,l,t]) => (

                  : k === "kana"

            <div style={{ marginBottom: 16 }}>
              <label style={css.label}>新規 / 既存</label>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setForm(p => ({...p, customerType: "new"}))}
                  style={{ flex: 1, padding: "11px 8px", borderRadius: 10, border: `2px solid ${form.customerType === "new" ? C.orange : C.border}`, background: form.customerType === "new" ? "#fff3e0" : C.card, color: form.customerType === "new" ? C.orange : C.sub, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>

            <button onClick={save} style={{...css.btn("#7a6848"), width:"100%", fontSize:15}}>登録する</button>

  );
}

const MENU_DOT_COLORS = ["#C8A15A","#e8829a","#e8a864","#7a9aba","#9a88c8","#72b08a","#e87878"];

function CustomerDetail({ c, visits, menus, products, onBack, notify, setCustomers, setVisits, openKarteDetail, setTab, setPendingCustomerId }) {
  const [localVisits, setLocalVisits] = useState(visits);
  const cv = localVisits.filter(v => v.customerId === c.id).sort((a,b) => b.date.localeCompare(a.date));
  const total = cv.reduce((s,v) => s+(v.total||0), 0);
  const avg = cv.length ? Math.round(total/cv.length) : 0;
  const lastVisit = cv[0];
  const lastLabel = timeAgoLabel(lastVisit?.date);
  const [activeKarte, setActiveKarte] = useState(null);
  const [showEditForm, setShowEditForm] = useState(false);
  const [editForm, setEditForm] = useState({ name: c.name, kana: c.kana||"", phone: c.phone||"", birthday: bdayDigits(c.birthday)||"", gender: c.gender||"female", notes: c.notes||"" });

  const saveEdit = async () => {
    if (!editForm.name) return notify("氏名を入力してください", "error");
    const bd = bdayToStored(editForm.birthday);
    await sb.from("customers").update({ name: editForm.name, kana: editForm.kana, phone: editForm.phone, birthday: bd, gender: editForm.gender, notes: editForm.notes }).eq("id", c.id);
    setCustomers(p => p.map(x => x.id === c.id ? { ...x, ...editForm, birthday: bd } : x));
    setShowEditForm(false);
    notify("顧客情報を更新しました ✓");
  };

  const deleteCustomer = async () => {
    if (!window.confirm(`「${c.name}」を削除しますか？\nカルテ・予約など全データが削除されます。`)) return;
    await sb.from("visits").delete().eq("customer_id", c.id);
    await sb.from("appointments").delete().eq("customer_id", c.id);
    await sb.from("customers").delete().eq("id", c.id);
    setCustomers(p => p.filter(x => x.id !== c.id));
    if (setVisits) setVisits(p => p.filter(x => x.customerId !== c.id));
    setShowEditForm(false);
    notify("顧客を削除しました");
    onBack();
  };

  // visit period (avg days between visits)
  const visitPeriod = (() => {
    if (cv.length < 2) return null;
    const dates = cv.map(v => new Date(v.date + "T00:00:00"));
    const totalDays = (dates[0] - dates[dates.length-1]) / 86400000;
    const avgDays = Math.round(totalDays / (cv.length-1));
    if (avgDays < 30) return avgDays + "日";
    return Math.round(avgDays/30) + "ヶ月";
  })();

  const handleKarteBack = function(updatedPhotos) {
    if (updatedPhotos) {
      setLocalVisits(localVisits.map(function(visit) {
        if (visit.id !== activeKarte.id) return visit;
        visit.beforeImgs = updatedPhotos.before;
        visit.afterImgs = updatedPhotos.after;
        visit.otherImgs = updatedPhotos.other;
        return visit;
      }));
    }
    setActiveKarte(null);
  };
  // activeKarte removed - now using openKarteDetail

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* Nav */}
      <div style={{ background: "#E8DCC3", padding: "10px 16px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", display:"flex",alignItems:"center",gap:4 }}>← 戻る</button>
        <div style={{ flex:1, textAlign:"center", fontWeight:800, fontSize:16, color:"#fff" }}>{c.name} 様</div>
        <button onClick={() => setShowEditForm(true)} style={{ background:"none", border:"1px solid rgba(255,255,255,0.6)", borderRadius:20, padding:"4px 10px", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", gap:4 }}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> 編集</button>
      </div>

      {/* Profile */}
      <div style={{ background:"#fff", padding:"16px", display:"flex", gap:14, alignItems:"flex-start" }}>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
          <div style={{ width:64, height:64, borderRadius:"50%", background:"#e8e8e8", display:"flex", alignItems:"center", justifyContent:"center", opacity:0.4 }}><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#888" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
          <div style={{ fontSize:11, color:C.sub }}>MEMO-</div>
        </div>
        <div style={{ flex:1 }}>
          <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"4px 12px", fontSize:13, color:C.sub }}>
            <span>性別-</span><span>{c.gender==="female"?"女性":c.gender==="male"?"男性":"—"}</span>
            <span>年齢-</span><span>{c.birthday ? Math.floor((new Date()-new Date(c.birthday))/31557600000)+"歳" : "--歳"}</span>
            <span>電話-</span><span>{c.phone || "—"}</span>
            <span>LINE-</span><span style={{ color: c.lineUserId ? "#06955f" : C.orange, fontWeight:700 }}>{c.lineUserId ? "連携済み(メッセージ送信可)" : "未連携(メッセージ送信不可)"}</span>
          </div>
          {c.notes && <div style={{ fontSize:12, color:C.orange, marginTop:6 }}>⚠ {c.notes}</div>}
        </div>
      </div>

      {/* Stats strip */}
      <div style={{ background:"#f0f0f0", padding:"10px 16px", fontSize:13, color:C.sub, display:"flex", gap:6, flexWrap:"wrap" }}>
        {lastLabel && <span><span style={{color:C.text, fontWeight:700}}>{lastLabel}</span>に来店</span>}
        {avg > 0 && <><span>/</span><span><span style={{color:C.text, fontWeight:700}}>{avg.toLocaleString()}円</span> 平均予算</span></>}
        {visitPeriod && <><span>/</span><span><span style={{color:C.text, fontWeight:700}}>{visitPeriod}</span>来店周期</span></>}
      </div>

      {/* Karte list */}
      <div style={{ padding:"0 0 16px" }}>
        <div style={{ padding:"16px 16px 8px", display:"flex", justifyContent:"center" }}>
          <button onClick={() => { if(setTab) { setPendingCustomerId && setPendingCustomerId(c.id); setTab("appointments"); } }} style={{ border:"1.5px solid #ccc", borderRadius:10, padding:"10px 20px", background:"#fff", fontSize:14, fontWeight:700, color:C.text, cursor:"pointer", width:"100%" }}>＋ 新規カルテを作成する</button>
        </div>

        {cv.length === 0 ? (
          <div style={{ textAlign:"center", color:C.sub, padding:32, fontSize:14 }}>カルテなし</div>
        ) : cv.map((v, vi) => {
          const thumb = (v.afterImgs && v.afterImgs[0]) || (v.beforeImgs && v.beforeImgs[0]);
          const dow = ["日","月","火","水","木","金","土"][new Date(v.date+"T00:00:00").getDay()];
          const dt = new Date(v.date+"T00:00:00");
          const dateLabel = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}(${dow}) ${v.time}〜`;

          return (
            <div key={v.id} style={{ padding:"0 0 12px" }}>
              {/* Date badge */}
              <div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}>
                <div style={{ background:"#333", color:"#fff", borderRadius:20, padding:"4px 16px", fontSize:12, fontWeight:700 }}>{dateLabel}</div>
              </div>

              {/* Card */}
              <div onClick={() => openKarteDetail ? openKarteDetail(v, c, "customers") : setActiveKarte(v)} style={{ background:"#fff", margin:"0 12px", borderRadius:12, overflow:"hidden", boxShadow:"0 1px 6px rgba(0,0,0,0.08)", cursor:"pointer" }}>
                <div style={{ display:"flex", minHeight:100 }}>
                  {/* Thumbnail */}
                  <div style={{ width:110, height:110, flexShrink:0, background:"#e8e8e8", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                    {thumb ? <img src={thumb.url} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#aaa" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.4 }}><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><circle cx="12" cy="14" r="3"/></svg>}
                  </div>
                  {/* Info */}
                  <div style={{ flex:1, padding:"10px 12px", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
                    <div>
                      {v.menus.map((m, i) => (
                        <div key={m.menuId||i} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:3 }}>
                          <div style={{ width:10, height:10, borderRadius:"50%", background:MENU_DOT_COLORS[i % MENU_DOT_COLORS.length], flexShrink:0 }} />
                          <span style={{ fontSize:13, color:C.text }}>{m.name}</span>

                <div style={{ display:"flex", borderTop:`1px solid ${C.border}` }}>

                  <button style={{ flex:1, padding:"10px", border:"none", background:"#E8DCC3", color:"#2a2218", fontSize:13, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:4 }}>カルテを見る ›</button>

      </div>
      {/* ── Edit customer overlay ── */}

        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 900, display: "flex", alignItems: "flex-end" }}>
          <div style={{ background: C.card, borderRadius: "20px 20px 0 0", padding: "20px 16px 36px", width: "100%", maxWidth: 480, margin: "0 auto", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 17 }}>顧客情報を編集</div>
              <button onClick={() => setShowEditForm(false)} style={{ background: "none", border: "none", fontSize: 22, color: C.sub, cursor: "pointer" }}>✕</button>
            </div>
            {[["name","氏名 *","text"],["kana","ふりがな","text"],["phone","電話番号","tel"],["birthday","生年月日","date"]].map(([k,l,t]) => (
              <div key={k} style={{ marginBottom: 12 }}>

                {k === "birthday"
                  ? <input type="tel" inputMode="numeric" maxLength={8} placeholder="例：19900315" value={editForm[k]} onChange={e => setEditForm(p => ({...p,[k]:e.target.value.replace(/[^0-9]/g,"").slice(0,8)}))} style={css.input} />
                  : k === "kana"
                    ? <input type={t} value={editForm[k]} onChange={e => setEditForm(p => ({...p,[k]:e.target.value}))} onCompositionEnd={e => { const v = kataToHira(e.target.value); setEditForm(p => ({...p,[k]:v})); }} onBlur={e => { const v = kataToHira(e.target.value); setEditForm(p => ({...p,[k]:v})); }} style={css.input} />

                ))}

            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={css.label}>備考・アレルギー等</label>
              <textarea value={editForm.notes} onChange={e => setEditForm(p => ({...p,notes:e.target.value}))} rows={2} style={{...css.input, resize:"vertical"}} />

          </div>
        </div>
      )}
    </div>
  );
}

function CheckoutPage({ visit: v, customer: c, menus: allMenus, products: allProducts, shopCategoryList, onBack, notify, onPaid, onDeleted, onDraftSaved }) {
  const [editMenus, setEditMenus] = useState((v.menus||[]).map(m => ({ ...m })));
  const [editProds, setEditProds] = useState((v.products||[]).map(p => ({ ...p })));
  const [showMenuPicker, setShowMenuPicker] = useState(false);
  const [showProdPicker, setShowProdPicker] = useState(false);
  const [prodPickerCat, setProdPickerCat] = useState(null);
  const [draft, setDraft] = useState(false);
  const [paid, setPaid] = useState(v.paid || false);
  const [paidAt, setPaidAt] = useState(v.paidAt || null);
  const [payCash, setPayCash] = useState(v.paymentMethod === "cash" ? v.total : 0);
  const [payCard, setPayCard] = useState(v.paymentMethod === "card" ? v.total : 0);
  const [payOther, setPayOther] = useState(v.paymentMethod === "qr" || v.paymentMethod === "point" ? v.total : 0);
  const [cashReceived, setCashReceived] = useState(0);
  const [showPointDiscount, setShowPointDiscount] = useState((v.hpbPoint||0) > 0);
  const [hpbPoint, setHpbPoint] = useState(v.hpbPoint || 0);

  const menuTotal = editMenus.reduce((s, m) => s + (parseInt(m.price) || 0), 0);
  const prodTotal = editProds.reduce((s, p) => s + (parseInt(p.price) || 0) * (p.qty || 1), 0);
  const subTotal = menuTotal + prodTotal + (v.drugCost || 0);
  const pointDisc = parseInt(hpbPoint) || 0;
  const grand = Math.max(0, subTotal - pointDisc);
  const change = Math.max(0, (parseInt(cashReceived) || 0) - (parseInt(payCash) || 0));

  const dt = new Date(v.date + "T00:00:00");
  const mLabel = `${dt.getMonth()+1}月 ${dt.getDate()}日`;

  const removeMenu = (idx) => setEditMenus(p => p.filter((_, i) => i !== idx));
  const updateMenuPrice = (idx, val) => setEditMenus(p => p.map((m, i) => i === idx ? { ...m, price: parseInt(val) || 0 } : m));
  const updateProdPrice = (idx, val) => setEditProds(p => p.map((pr, i) => i === idx ? { ...pr, price: parseInt(val) || 0 } : pr));
  const addMenu = (m) => { setEditMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]); setShowMenuPicker(false); };
  const removeProd = (idx) => setEditProds(p => p.filter((_, i) => i !== idx));
  const addProd = (p2) => { setEditProds(p => [...p, { productId: p2.id, name: p2.name, price: p2.price, qty: 1 }]); setShowProdPicker(false); };

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* Nav */}

          <Divider />
          {[["メニュー合計", menuTotal], ["店販合計", prodTotal], ["小計", subTotal]].map(([l, val]) => (

          <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0 2px", fontWeight: 800, fontSize: 16, color: "#7a6848", borderTop: `1px solid ${C.border}`, marginTop: 4 }}>

          <div style={{ display: "flex", border: "1px solid #7a6848", borderRadius: 8, overflow: "hidden", marginBottom: 14 }}>
            {[["cash","現金"],["card","カード"],["other","その他"]].map(([k,l]) => {

          {payCard > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>

              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ color:C.sub }}>¥</span>
                <input type="number" value={payCard} onChange={e => !paid && setPayCard(parseInt(e.target.value)||0)} readOnly={paid} style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right", background: paid?C.bg:"#fff", color: paid?C.sub:C.text }} />
              </div>

          {payOther > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>

              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ color:C.sub }}>¥</span>
                <input type="number" value={payOther} onChange={e => !paid && setPayOther(parseInt(e.target.value)||0)} readOnly={paid} style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right", background: paid?C.bg:"#fff", color: paid?C.sub:C.text }} />
              </div>
            </div>
          )}
          {payCash > 0 && !paid && (<>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
            <span style={{ fontSize:14 }}>現金お預かり</span>
            <div style={{ display:"flex", alignItems:"center", gap:4 }}>
              <span style={{ color:C.sub }}>¥</span>
              <input type="number" value={cashReceived} onChange={e => setCashReceived(parseInt(e.target.value)||0)}
                style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right" }} />
            </div>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", padding:"10px 0 4px", fontSize:15, fontWeight:700 }}>
            <span>おつり</span><span style={{ color: change>0?C.green:C.text }}>¥ {change.toLocaleString()}</span>
          </div>
          </>)}
        </div>

        {/* Checkout button or complete */}
        {paid ? (
          <div style={{ background:"#fff", borderRadius:12, padding:"16px", boxShadow:"0 1px 4px rgba(0,0,0,0.06)", textAlign:"center" }}>
            <div style={{ color:"#7a6848", fontWeight:700, fontSize:16, marginBottom:12, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
              <span>✓</span><span>お会計が完了しました</span>
            </div>
            {paid && <div style={{ fontSize:11, color:C.sub }}>会計をした日時：{paidAt || (v.date + " " + v.time)}</div>}
            <div style={{ display:"flex", justifyContent:"flex-end", gap:16, marginTop:10 }}>
              <button style={{ background:"none", border:"none", color:C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>レシートを印刷する</button>
              <button onClick={async () => {
                setPaid(false);
                await sb.from("visits").update({ paid: false, total: 0, payment_method: "cash" }).eq("id", v.id);
                if (v.appointmentId) await sb.from("appointments").update({ paid: false }).eq("id", v.appointmentId);
                if (onDeleted) onDeleted();
                notify("会計を削除しました");
              }} style={{ background:"none", border:"none", color:C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>お会計を削除する</button>
            </div>
          </div>
        ) : (
          <>
            <button onClick={async () => {
              setPaid(true);
              const nowStr = nowTimeStr();
              setPaidAt(nowStr);
              const total = grand;
              const paymentMethod = payCard > 0 ? "card" : payOther > 0 ? "qr" : "cash";
              if (v.id) {
                await sb.from("visits").update({ paid: true, menus: editMenus, products: editProds, total, payment_method: paymentMethod, paid_at: nowStr, hpb_point: pointDisc }).eq("id", v.id);
              }
              if (onPaid) onPaid({ menus: editMenus, products: editProds, total, paymentMethod, hpbPoint: pointDisc });
              notify("会計を完了しました ✓");
            }}
              style={{ width:"100%", padding:"16px", borderRadius:100, border:"none", background:"#ff6b6b", color:"#fff", fontWeight:800, fontSize:17, cursor:"pointer", boxShadow:"0 4px 16px rgba(255,107,107,0.4)" }}>
              お会計
            </button>
            <div style={{ textAlign:"right", marginTop:12 }}>
              <button onClick={async () => {
                if (v.id) {
                  await sb.from("visits").update({ menus: editMenus, products: editProds, hpb_point: parseInt(hpbPoint)||0, total: grand }).eq("id", v.id);
                  if (onDraftSaved) onDraftSaved({ menus: editMenus, products: editProds, hpbPoint: parseInt(hpbPoint)||0, total: grand });
                }
                setDraft(true);
                notify("下書きを保存しました ✓");
              }} style={{ background:"none", border:"none", color: draft ? "#E8DCC3" : C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>{draft ? "✓ 下書き保存済み" : "下書きを保存する"}</button>
            </div>
          </>
        )}
      </div>

      {/* Menu picker */}
      {showMenuPicker && (
        <MenuPickerSheet
          menus={allMenus}
          selectedIds={editMenus.map(m => m.menuId)}
          onToggle={(m) => {
            const has = editMenus.find(x => x.menuId === m.id);
            if (has) setEditMenus(p => p.filter(x => x.menuId !== m.id));
            else setEditMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]);
          }}
          onClose={() => setShowMenuPicker(false)}
          visits={[]}
        />
      )}
      {/* Product picker sheet */}
      {showProdPicker && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:900, display:"flex", alignItems:"flex-end" }}>
          <div style={{ background:C.card, borderRadius:"20px 20px 0 0", padding:"20px 16px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"70vh", overflowY:"auto" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                {prodPickerCat && (
                  <button onClick={() => setProdPickerCat(null)} style={{ background:"none", border:"none", fontSize:18, color:C.sub, cursor:"pointer", padding:"0 4px" }}>←</button>
                )}
                <div style={{ fontWeight:800, fontSize:16 }}>{prodPickerCat ? prodPickerCat : "店販を追加"}</div>
              </div>
              <button onClick={() => { setShowProdPicker(false); setProdPickerCat(null); }} style={{ background:"none", border:"none", fontSize:22, color:C.sub, cursor:"pointer" }}>✕</button>
            </div>
            {!prodPickerCat ? (
              (shopCategoryList||[]).filter(cat => (allProducts||[]).some(p2 => !p2.placeholder && p2.category === cat)).map(cat => {
                const IconComp = PROD_CATEGORY_ICONS_SVG[cat];
                return (
                  <div key={cat} onClick={() => setProdPickerCat(cat)} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 0", borderBottom:`1px solid ${C.border}`, cursor:"pointer" }}>
                    <span style={{ width:28, display:"flex", alignItems:"center", justifyContent:"center" }}>{IconComp ? <IconComp /> : <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a6848" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>}</span>
                    <span style={{ fontSize:15 }}>{cat}</span>
                  </div>
                );
              })
            ) : (
              (allProducts||[]).filter(p2 => !p2.placeholder && p2.category === prodPickerCat).map(p2 => (
                <div key={p2.id} onClick={() => { addProd(p2); setProdPickerCat(null); }} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", borderBottom:`1px solid ${C.border}`, cursor:"pointer" }}>
                  <div>
                    <div style={{ fontSize:15 }}>{p2.name}</div>
                    <div style={{ fontSize:12, color:C.sub }}>在庫 {p2.stock}</div>
                  </div>
                  <span style={{ color:"#7a6848", fontWeight:700 }}>¥ {p2.price.toLocaleString()}</span>
                </div>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function KarteDetail({ visit: v, customer: c, menus: allMenus, products: allProducts, visits: allVisits, onBack, notify, onDeleteVisit, appointments, updateVisit, updateAppointment, setVisits, setVisitsRaw, setAppointments, setAppointmentsRaw, tagCategories, shopCategoryList }) {
  const beforeRef = useRef();
  const afterRef = useRef();
  const otherRef = useRef();
  const [beforeImgs, setBeforeImgs] = useState(v.beforeImgs || []);
  const [afterImgs, setAfterImgs] = useState(v.afterImgs || []);
  const [otherImgs, setOtherImgs] = useState(v.otherImgs || []);
  // 写真の後追い読み込みが届いたら表示に反映（ユーザーが写真を追加/削除した後は上書きしない）
  // 写真の読み込みが完了確認できるまで写真の追加・削除・保存を全て無効化（写真消失の構造的防止）
  const photosReady = !!v.photosLoaded;
  const photosDirty = useRef(false);
  useEffect(() => {
    if (photosDirty.current) return;
    setBeforeImgs(v.beforeImgs || []);
    setAfterImgs(v.afterImgs || []);
    setOtherImgs(v.otherImgs || []);
  }, [v.beforeImgs, v.afterImgs, v.otherImgs]);
  const [photoTab, setPhotoTab] = useState("after");
  const [selectedIdx, setSelectedIdx] = useState(0);
  const [memo, setMemo] = useState(v.notes || "");
  const [editMemo, setEditMemo] = useState(false);
  const [showMemoPage, setShowMemoPage] = useState(false);
  const [showPastMemos, setShowPastMemos] = useState(false);
  const [showCheckout, setShowCheckout] = useState(false);
  const [showBlogPage, setShowBlogPage] = useState(false);
  const [blogLoading, setBlogLoading] = useState(false);
  const [blogResult, setBlogResult] = useState(null);
  const [karteMenus, setKarteMenus] = useState(v.menus || []);
  const [karteProds, setKarteProds] = useState(v.products || []);
  const [showMenuPicker, setShowMenuPicker] = useState(false);
  const [showProdPicker2, setShowProdPicker2] = useState(false);
  const [prodPickerCat2, setProdPickerCat2] = useState(null);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [paid, setPaid] = useState(v.paid || false);

  // Realtimeで他デバイスから会計が更新されたときにpaidを同期
  useEffect(() => {
    const latest = (allVisits || []).find(x => x.id === v.id);
    if (latest && latest.paid !== paid) setPaid(latest.paid);
  }, [allVisits]);
  const [karteTags, setKarteTags] = useState(v.tags || []);
  const [tagsOpen, setTagsOpen] = useState(false);
  const [newTagInput, setNewTagInput] = useState("");
  const PRESET_TAGS = ["カット","カラー","パーマ","ストレート","トリートメント","ヘッドスパ","ブルー系","ピンク系","アッシュ系","ベージュ系","ブラウン系","グレー系","ハイライト","ブリーチあり","ショート","ボブ","ミディアム","ロング","ツヤ感","ふんわり","まとまり","軽め"];

  const pastPurchases = (allVisits || [])
    .filter(x => x.customerId === c.id && x.products && x.products.length > 0 && x.id !== v.id)
    .sort((a, b) => b.date.localeCompare(a.date));

  const tabDefs = [
    { key:"before", label:"ビフォー", imgs:beforeImgs, setImgs:setBeforeImgs, ref:beforeRef, color:"#ff9500" },
    { key:"after",  label:"アフター", imgs:afterImgs,  setImgs:setAfterImgs,  ref:afterRef,  color:"#7a6848" },
    { key:"other",  label:"その他",   imgs:otherImgs,  setImgs:setOtherImgs,  ref:otherRef,  color:"#9a9088" },
  ];
  const curTab = tabDefs.find(function(t){ return t.key === photoTab; });

  const compressImg = function(url, cb) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var MAX = 800;
      var ratio = Math.min(MAX/img.width, MAX/img.height, 1);
      canvas.width = img.width * ratio;
      canvas.height = img.height * ratio;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = url;
  };

  const savePhotos = function(before, after, other) {
    // 【最終防壁】写真の読み込み完了が確認できていない状態では絶対にphoto_dataを書き込まない
    if (!v.photosLoaded) { if (notify) notify("写真の読み込みが完了していないため保存できません", "error"); return; }
    var photoData = JSON.stringify({ before: before, after: after, other: other });
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ photo_data: photoData }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, beforeImgs: before, afterImgs: after, otherImgs: other} : x; }); });
  };

  const saveMemo = function() {
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ notes: memo }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, notes: memo} : x; }); });
    setShowMemoPage(false);
  };

  const saveTags = function(tags) {
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ tags: tags }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, tags: tags} : x; }); });
  };

  const handleAddCatImg = function(setImgs, cat, e) {
    if (!photosReady) { if (notify) notify("写真を読み込み中です。少し待ってから追加してください", "error"); e.target.value = ""; return; }
    photosDirty.current = true;
    Array.from(e.target.files).forEach(function(f) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        compressImg(ev.target.result, function(compressed) {
          setImgs(function(p) {
            if (p.length >= 3) return p;
            var next = [...p, { name: f.name, url: compressed }];
            var nb = cat==="before"?next:beforeImgs;
