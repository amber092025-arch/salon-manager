            else if (viewMode==="week") setWeekOffset(w=>w-1);
            else setMonthOffset(o=>o-1);
          }} style={{ background:"rgba(42,34,24,0.1)", border:"none", color:"#2a2218", borderRadius:8, padding:"5px 10px", fontWeight:700, cursor:"pointer", fontSize:12 }}>
            {viewMode==="day" ? "＜昨日" : viewMode==="week" ? "＜先週" : (() => { const d=new Date(); d.setMonth(d.getMonth()+monthOffset-1); return `＜${d.getMonth()+1}月`; })()}
          </button>
          <div style={{ color:"#2a2218", fontWeight:700, fontSize:13, textAlign:"center" }}>
            {viewMode==="day" && (() => { const dt=new Date(currentDay+"T00:00:00"); return `${dt.getFullYear()}年${String(dt.getMonth()+1).padStart(2,"0")}月${String(dt.getDate()).padStart(2,"0")}日（${DAY_LABELS[dt.getDay()]}）`; })()}

            {viewMode==="month" && `${monthDate.getFullYear()}年${monthDate.getMonth()+1}月`}
          </div>
          <button onClick={() => {
            if (viewMode==="day") setDayOffset(o=>o+1);
            else if (viewMode==="week") setWeekOffset(w=>w+1);

          }} style={{ background:"rgba(42,34,24,0.1)", border:"none", color:"#2a2218", borderRadius:8, padding:"5px 10px", fontWeight:700, cursor:"pointer", fontSize:12 }}>
            {viewMode==="day" ? "明日＞" : viewMode==="week" ? "来週＞" : (() => { const d=new Date(); d.setMonth(d.getMonth()+monthOffset+1); return `${d.getMonth()+1}月＞`; })()}

          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", gap: 2, marginTop: 8 }}>
            <div />

              const isToday = d === todayStr();
              const dow = dt.getDay();

                <div key={d} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: dow === 0 ? "#e05050" : dow === 6 ? "#9a9088" : "#2a2218", fontWeight: 600 }}>{DAY_LABELS[dow]}</div>
                  <div style={{ width: 28, height: 28, borderRadius: "50%", margin: "2px auto 0", background: isToday ? "#2a2218" : "transparent", color: isToday ? "#fff" : dow === 0 ? "#e05050" : dow === 6 ? "#9a9088" : "#2a2218", fontWeight: 800, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center" }}>{dt.getDate()}</div>
                </div>
              );
            })}
          </div>

      </div>

      {/* ── DAY VIEW ── */}
      {viewMode === "day" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f5f5f5", touchAction: dragging ? "none" : "auto" }}

          onPointerCancel={dragging ? onPointerCancel : undefined}>
          <div style={{ position: "relative" }}>

              const closeH = parseInt((dayBiz.close||"20:00").split(":")[0]);
              const isOutside = dayBiz.isHoliday || h < openH || h >= closeH;

                  <div style={{ width: 50, flexShrink: 0, paddingTop: 4, paddingRight: 8, textAlign: "right" }}>
                    <span style={{ fontSize: 11, color: C.sub }}>{h}:00</span>
                  </div>
                  <div style={{ flex: 1, borderLeft: "1px solid #e0e0e0", position: "relative" }}>
                    <div style={{ height: "50%", borderBottom: "1px dashed #e8e8e8" }} />
                  </div>
                </div>
              );

            {apptsByDate(currentDay).map(a => {

              const dur = a.duration || 60;
              const height = Math.max((dur / 60) * dynCellH - 4, 40);
              const cust = customers.find(c => c.id === a.customerId);
              const color = a.color || APPT_COLORS[0];

                <div key={a.id} onClick={(e) => { if (!isDragging.current) openTapMenu(e, a); }}

                  <div style={{ fontSize: 12, fontWeight: 700, color: "#fff", marginBottom: 3 }}>{a.time}-{endT}</div>
                  {a.paid && <span style={{ background: "rgba(0,0,0,0.5)", color: "#fff", fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 6px", marginRight: 6 }}>会計済</span>}
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>{cust?.name || "不明"}様</div>
                  {height > 60 && <div style={{ fontSize: 11, color: "rgba(255,255,255,0.9)", marginTop: 3 }}>
                    {am.map((m,i) => <span key={i}>{i>0?"、":""}<span style={{ width:8, height:8, borderRadius:"50%", background:"rgba(255,255,255,0.7)", display:"inline-block", marginRight:3, verticalAlign:"middle" }} />{m.name}</span>)}
                  </div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── WEEK VIEW ── */}
      {viewMode === "week" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f2f2f2", position: "relative", touchAction: dragging ? "none" : "auto" }}
          ref={gridRef}
          onPointerMove={dragging ? onPointerMove : undefined}
          onPointerUp={dragging ? onPointerUp : undefined}
          onPointerCancel={dragging ? onPointerCancel : undefined}>
          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", position: "relative" }}>
            <div>
              {hours.map(h => (
                <div key={h} style={{ height: dynCellH, display: "flex", alignItems: "flex-start", justifyContent: "flex-end", paddingRight: 6, paddingTop: 4 }}>

                </div>

              const isToday = d === todayStr();
              const dayBiz = getBizForDate(d, bizHours, closedDaysOfWeek, personalHolidays);
              const openH = parseInt((dayBiz.open||"10:00").split(":")[0]);
              const closeH = parseInt((dayBiz.close||"20:00").split(":")[0]);
              const dayAppts = appointments.filter(a => a.date === d && (!dragging || a.id !== dragging.appt.id));
              return (
                <div key={d} style={{ position: "relative", borderLeft: "1px solid #e0e0e0", background: isToday ? "rgba(42,34,24,0.04)" : "transparent" }}>

                    const wBiz = getBizForDate(d, bizHours, closedDaysOfWeek, personalHolidays);
                    const wOpenH = parseInt((wBiz.open||"10:00").split(":")[0]);
                    const wCloseH = parseInt((wBiz.close||"20:00").split(":")[0]);
                    const wOutside = wBiz.isHoliday || h < wOpenH || h >= wCloseH;

                      <div key={h}

                        <div style={{ height: "50%", borderBottom: "1px dashed #e0e0e0" }} />
                      </div>
                    );
                  })}
                  {dayAppts.map(a => {
                    const top = timeToPx2(a.time);
                    const dur = a.duration || 60;
                    const height = Math.max((dur / 60) * dynCellH - 4, 28);
                    const cust = customers.find(c => c.id === a.customerId);
                    const color = a.color || APPT_COLORS[0];
                    const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
                    return (
                      <div key={a.id}

                        onClick={(e) => { if (!isDragging.current) openTapMenu(e, a); }}
                        onPointerDown={(e) => onPointerDown(e, a)}>

                        <div style={{ fontSize: 11, fontWeight: 700, color: "#fff", lineHeight: 1.3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cust?.name || "不明"}様</div>

                      </div>
                    );
                  })}
                  {dragging && dragPos && dragPos.dayIdx === di && (() => {
                    const a = dragging.appt;
                    const dur = a.duration || 60;
                    const height = Math.max((dur / 60) * dynCellH - 4, 28);
                    const color = a.color || APPT_COLORS[0];
                    const cust = customers.find(c => c.id === a.customerId);
                    return (
                      <div style={{ position: "absolute", top: dragPos.top+1, left: 2, right: 2, height, borderRadius: 8, background: color, opacity: 0.85, padding: "4px 5px", overflow: "hidden", zIndex: 10, pointerEvents: "none", boxShadow: "0 6px 20px rgba(0,0,0,0.3)", border: "2px solid #fff" }}>
                        <div style={{ fontSize: 10, color: "#fff", fontWeight: 700, opacity: 0.9 }}>{pxToTime2(dragPos.top)}</div>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#fff" }}>{cust?.name || ""}様</div>
                      </div>
                    );
                  })()}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── MONTH VIEW ── */}
      {viewMode === "month" && (() => {
        const year = monthDate.getFullYear();
        const month = monthDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const startMon = (firstDay === 0 ? 6 : firstDay - 1);
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startMon; i++) cells.push(null);
        for (let i = 1; i <= daysInMonth; i++) cells.push(i);
        while (cells.length % 7 !== 0) cells.push(null);

        return (
          <div style={{ flex: 1, overflowY: "auto", background: "#f5f5f5" }}>
            {/* Day-of-week headers */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", background: "#fff", borderBottom: "1px solid #e0e0e0" }}>
              {["月","火","水","木","金","土","日"].map((d,i) => (
                <div key={d} style={{ textAlign: "center", padding: "8px 0", fontSize: 12, fontWeight: 700, color: i===5?"#90caf9":i===6?"#ff6b6b":C.sub }}>{d}</div>
              ))}
            </div>
            {/* Calendar grid */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)" }}>
              {cells.map((day, idx) => {
                if (!day) return <div key={idx} style={{ minHeight: 64, borderBottom: "1px solid #e8e8e8", borderRight: idx%7!==6?"1px solid #e8e8e8":"none", background: "#fafafa" }} />;
                const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                const da = apptsByDate(dateStr);
                const isToday = dateStr === todayStr();
                const dow = idx % 7; // 0=Mon
                const isSun = dow === 6, isSat = dow === 5;
                return (
                  <div key={idx} onClick={() => { setViewMode("day"); const d2 = new Date(dateStr+"T00:00:00"); const t = new Date(); const today0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()); const diff = Math.round((d2-today0)/86400000); setDayOffset(diff); }}
                    style={{ minHeight: 64, borderBottom: "1px solid #e8e8e8", borderRight: dow!==6?"1px solid #e8e8e8":"none", background: "#fff", padding: "4px", cursor: "pointer", position: "relative" }}>
                    <div style={{ width: 26, height: 26, borderRadius: "50%", background: isToday ? "#2a2218" : "transparent", color: isToday ? "#fff" : isSun ? "#ff6b6b" : isSat ? "#9a9088" : C.text, fontWeight: isToday ? 800 : 600, fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 2 }}>{day}</div>
                    {da.length > 0 && (
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#7a6848", textAlign: "center" }}>{da.length}人</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      <div style={{ background: "#2a2218", padding: "5px 16px", flexShrink: 0 }}>

      </div>

        const cust = customers.find(c => c.id === a.customerId);
        const custVisits = visits ? visits.filter(v => v.customerId === a.customerId).sort((x,y) => y.date.localeCompare(x.date)) : [];
        // appointmentIdで紐づいたvisitを優先、なければ最新のvisit
        const targetVisit = custVisits.find(v => v.appointmentId === a.id) || custVisits[0];
        if (!targetVisit || !cust) return (
          <div style={{ position:"fixed", inset:0, background:C.bg, zIndex:800, padding:20 }}>
            <button onClick={() => setShowKarteAppt(null)} style={{ ...css.btn(C.sub,false), marginBottom:16 }}>← 戻る</button>
            <p style={{ color:C.sub, marginBottom:16 }}>この顧客のカルテがまだありません。</p>
          </div>
        );
        const handleApptKarteBack = function(updatedPhotos) {
          if (updatedPhotos) {
            setVisits(function(prev) {
              return prev.map(function(v) {
                if (v.id !== targetVisit.id) return v;
                return Object.assign({}, v, { beforeImgs: updatedPhotos.before, afterImgs: updatedPhotos.after, otherImgs: updatedPhotos.other });
              });
            });
          }
          setShowKarteAppt(null);

        return (
          <div style={{ position:"fixed", inset:0, zIndex:800, background:C.bg, display:"flex", alignItems:"center", justifyContent:"center" }}
            ref={el => { if (el && openKarteDetail) { setTimeout(() => { openKarteDetail(targetVisit, cust, "appointments"); setShowKarteAppt(null); }, 0); } }}>
            <div style={{ color:C.sub }}>読み込み中...</div>
          </div>
        );
      })()}

      {/* ── Checkout from appointment ── */}
      {showCheckoutAppt && (() => {
        const a = showCheckoutAppt;
        const latestAppt = appointments.find(ap => ap.id === a.id) || a;
        const cust = customers.find(c => c.id === a.customerId);
        const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
        const realVisit = visits.find(v => v.customerId === a.customerId && v.date === a.date && v.time === a.time);
        const latestVisitPaid = realVisit ? realVisit.paid : false;
        const synthVisit = {
          id: realVisit ? realVisit.id : null,
          customerId: a.customerId, date: a.date, time: a.time,
          menus: realVisit ? (realVisit.menus||[]) : am.map(m => ({ menuId: m.id, name: m.name, price: m.price })),
          products: realVisit ? (realVisit.products||[]) : [],
          drugCost: 0, total: realVisit ? (realVisit.total||0) : am.reduce((s,m)=>s+m.price,0),
          paymentMethod: realVisit ? (realVisit.paymentMethod||"cash") : "cash",
          paid: latestAppt.paid && latestVisitPaid,
          duration: a.duration||60,
          appointmentId: a.id,
          paidAt: realVisit ? (realVisit.paidAt||null) : null,
          hpbPoint: realVisit ? (realVisit.hpbPoint||0) : 0,
        };
        return (
          <div style={{ position:"fixed", inset:0, zIndex:800, background:C.bg, overflowY:"auto" }}>

                await sb.from("visits").update({ paid: true, menus: result.menus, products: result.products, total: result.total, payment_method: result.paymentMethod, paid_at: nowTimeStr(), hpb_point: result.hpbPoint||0 }).eq("id", realVisit.id);
                setVisits(p => p.map(v => v.id === realVisit.id ? {...v, paid:true, menus:result.menus, products:result.products, total:result.total, paymentMethod:result.paymentMethod, paidAt:nowTimeStr(), hpbPoint:result.hpbPoint||0} : v));
              }
              setShowCheckoutAppt(null);
            }} onDeleted={() => {
              setAppointments(p => p.map(ap => ap.id === a.id ? {...ap, paid:false} : ap));
              if (realVisit) setVisits(p => p.map(v => v.id === realVisit.id ? {...v, paid:false, total:0, paymentMethod:"cash"} : v));
            }} onDraftSaved={(result) => {
              if (realVisit) setVisits(p => p.map(v => v.id === realVisit.id ? {...v, menus:result.menus, products:result.products, hpbPoint:result.hpbPoint, total:result.total} : v));

          { label: "カルテ詳細", icon: "🪪", color: "#7a6848", action: () => { setShowKarteAppt(a); closeTapMenu(); } },
          { label: "予約編集", icon: "📅", color: "#7a6848", action: () => handleEditOpen(a) },
          { label: "削除する", icon: "🗑️", color: "#ff3b30", action: () => handleDelete(a.id) },
        ];
        const goToKarteList = () => {
          closeTapMenu();
          const c2 = customers.find(c => c.id === a.customerId);
          if (c2 && setTab) setTab("customerDetail_" + c2.id);
        };
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 800, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }} onClick={closeTapMenu}>
            <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.55)" }} />
            <div style={{ position: "relative", zIndex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }} onClick={e => e.stopPropagation()}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {actions.map(ac => (
                  <button key={ac.label} onClick={ac.action} style={{ width: 150, height: 130, borderRadius: 16, background: "#fff", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, boxShadow: "0 4px 20px rgba(0,0,0,0.15)" }}>
                    <span style={{ fontSize: 42 }}>{ac.icon}</span>
                    <span style={{ fontSize: 15, fontWeight: 700, color: ac.color }}>{ac.label}</span>
                  </button>
                ))}
              </div>
              <div style={{ background: "#fff", borderRadius: 14, padding: "14px 20px", width: 310, boxShadow: "0 4px 20px rgba(0,0,0,0.15)" }}>
                <div style={{ fontWeight: 800, fontSize: 18, textAlign: "center", marginBottom: 6 }}>{cust?.name || "不明"} 様</div>
                <div style={{ display: "flex", justifyContent: "center", gap: 20, fontSize: 13, color: C.sub }}>
                  <span>性別　{cust?.gender === "female" ? "女性" : cust?.gender === "male" ? "男性" : "—"}</span>
                  <span>来店　{appointments.filter(x => x.customerId === a.customerId).length}回</span>
                </div>
                {cust?.notes && <div style={{ fontSize: 12, color: C.orange, textAlign: "center", marginTop: 4 }}>⚠ {cust.notes}</div>}
              </div>

function CustomerPickerOverlay({ customers, setCustomers, onSelect, onClose, custSearch, setCustSearch, notify, visits, addCustomer }) {
  const [showAddNew, setShowAddNew] = useState(false);
  const [newForm, setNewForm] = useState({ name: "", kana: "", phone: "", birthday: "", gender: "female", notes: "", customerType: "new" });

  const saveNew = async () => {
    if (!newForm.name) return notify("氏名を入力してください", "error");
    let newC;
    if (addCustomer) {
      newC = await addCustomer({ ...newForm, joinDate: todayStr() });
      if (!newC) return;
    } else {
      newC = { ...newForm, id: Date.now(), joinDate: todayStr() };
      setCustomers(p => [...p, newC]);
    }
    notify("顧客を追加しました ✓");
    onSelect(newC.id, newForm.customerType || "new");
  };

  const filteredCusts = customers.filter(c =>
    !custSearch || c.name.includes(custSearch) || (c.kana||"").includes(custSearch)
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: C.bg, zIndex: 960, display: "flex", flexDirection: "column", maxWidth: 480, margin: "0 auto" }}>
      <div style={{ background: "#E8DCC3", padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 }}>
        <button onClick={onClose} style={{ background: "none", border: "none", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>← 戻る</button>
        <div style={{ flex: 1, fontWeight: 800, fontSize: 16, color: "#fff" }}>お客様を選択</div>
      </div>
      <div style={{ padding: "12px 16px", background: C.card, borderBottom: `1px solid ${C.border}` }}>
        <input value={custSearch} onChange={e => setCustSearch(e.target.value)} placeholder="名前・カナで検索" style={{ ...css.input }} autoFocus />
      </div>
      {/* カルテ一覧ヘッダー */}
      <div style={{ background: "#fff", padding: "10px 12px", display: "flex", alignItems: "center", gap: 8, borderBottom: `1px solid ${C.border}` }}>
        <div style={{ fontSize: 15, fontWeight: 800, color: C.text }}>
          顧客一覧 <span>{customers.length}</span><span style={{ fontWeight: 400, fontSize: 13, color: C.sub }}>名</span>
        </div>
        <button onClick={() => setShowAddNew(true)} style={{ marginLeft: "auto", width: 36, height: 36, borderRadius: "50%", background: "#E8DCC3", border: "none", color: "#2a2218", fontSize: 22, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>＋</button>
      </div>

      <div style={{ flex: 1, overflowY: "scroll", WebkitOverflowScrolling: "touch" }}>
        {(() => {
          const groups = {};
          filteredCusts.forEach(c => {
            const g = kanaGroup(c.kana || c.name || "");
            if (!groups[g]) groups[g] = [];
            groups[g].push(c);
          });
          return Object.keys(groups).sort((a,b) => a.localeCompare(b, "ja")).map(g => (
            <div key={g}>
              <div style={{ background: "#E8DCC3", padding: "4px 16px", fontSize: 13, fontWeight: 800, color: "#2a2218" }}>{g}</div>
              {groups[g].map(c => {
                const cv = (visits||[]).filter(v => v.customerId === c.id);
                const last = cv.sort((a,b) => b.date.localeCompare(a.date))[0];
                const lastLabel = timeAgoLabel(last?.date);
                const overdue = isOverdue(last?.date, 3);
                return (
                  <div key={c.id} onClick={() => onSelect(c.id, "existing")}
                    style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", background: "#fff", borderBottom: `1px solid ${C.border}`, cursor: "pointer" }}>
                    <div style={{ width: 46, height: 46, borderRadius: "50%", background: "#e8e8e8", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <span style={{ fontSize: 22, opacity: 0.5 }}>👤</span>
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 16, fontWeight: 700, color: C.text }}>{c.name} <span style={{ fontWeight: 400, color: C.sub }}>様</span></div>
                      {lastLabel && <div style={{ fontSize: 13, color: overdue ? C.red : C.sub, marginTop: 2 }}>{lastLabel}に来店</div>}
                    </div>
                    <span style={{ fontSize: 18, color: "#d0d0d0" }}>›</span>
                  </div>
                );
              })}
            </div>
          ));
        })()}
      </div>

      {/* 新規顧客登録モーダル */}
      {showAddNew && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 970, display: "flex", alignItems: "flex-end", maxWidth: 480, margin: "0 auto" }}>
          <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 36px", width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 17 }}>新規顧客登録</div>
              <button onClick={() => setShowAddNew(false)} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: C.sub }}>×</button>
            </div>
            {[["name","氏名 *","text"],["kana","ふりがな","text"],["phone","電話番号","tel"],["birthday","生年月日","date"]].map(([k,l,t]) => (
              <div key={k} style={{ marginBottom: 12 }}>
                <label style={css.label}>{l}</label>
                <input type={t} value={newForm[k]} onChange={e => setNewForm(p => ({...p,[k]:e.target.value}))} style={css.input} />
              </div>
            ))}
            <div style={{ marginBottom: 12 }}>
              <label style={css.label}>性別</label>
              <div style={{ display: "flex", gap: 8 }}>
                {[["female","女性"],["male","男性"],["other","その他"]].map(([v,l]) => (
                  <button key={v} onClick={() => setNewForm(p => ({...p,gender:v}))} style={{ ...css.btn(GEN_COLOR[v], newForm.gender===v), flex:1, padding:"9px 4px", fontSize:13 }}>{l}</button>
                ))}
              </div>
            </div>
            <div style={{ marginBottom: 12 }}>
              <label style={css.label}>備考・アレルギー等</label>
              <textarea value={newForm.notes} onChange={e => setNewForm(p => ({...p,notes:e.target.value}))} rows={2} style={{...css.input, resize:"vertical"}} />
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={css.label}>新規 / 既存</label>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setNewForm(p => ({...p, customerType: "new"}))}
                  style={{ flex: 1, padding: "11px 8px", borderRadius: 10, border: `2px solid ${newForm.customerType === "new" ? C.orange : C.border}`, background: newForm.customerType === "new" ? "#fff3e0" : C.card, color: newForm.customerType === "new" ? C.orange : C.sub, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  新規
                </button>
                <button onClick={() => setNewForm(p => ({...p, customerType: "existing"}))}
                  style={{ flex: 1, padding: "11px 8px", borderRadius: 10, border: `2px solid ${newForm.customerType === "existing" ? "#E8DCC3" : C.border}`, background: newForm.customerType === "existing" ? "#e8faf9" : C.card, color: newForm.customerType === "existing" ? "#E8DCC3" : C.sub, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  既存
                </button>
              </div>
            </div>
            <button onClick={saveNew} style={{...css.btn("#7a6848"), width:"100%", fontSize:15}}>登録する</button>
          </div>
        </div>
      )}
    </div>
  );
}


function InventoryTab({ products, setProducts, addProduct, updateProduct, deleteProduct: deleteProductGlobal, notify, setTab, visits }) {
  const [view, setView] = useState("gyomu");
  const [stockHistory, setStockHistory] = useState([]);
  const [openCats, setOpenCats] = useState({});
  const [openSubs, setOpenSubs] = useState({});
  const [newCatName, setNewCatName] = useState("");
  const [newCatType, setNewCatType] = useState("gyomu"); // 追加カテゴリの種別
  const [newSubName, setNewSubName] = useState({});
  const [showAddCat, setShowAddCat] = useState(false);
  const [showAddSub, setShowAddSub] = useState(null);
  const [minEdit, setMinEdit] = useState({});
  const [addForm, setAddForm] = useState({ name:"", price:"", cost:"", stock:"", minStock:"3", category:"", subCategory:"", photos:[], description:"", isPublic:false });
  const [editingProd, setEditingProd] = useState(null);
  const [editProdForm, setEditProdForm] = useState({});
  const [editingSubKey, setEditingSubKey] = useState(null);
  const [editSubName, setEditSubName] = useState("");
  const [editingCatKey, setEditingCatKey] = useState(null);
  const [editCatName, setEditCatName] = useState("");
  const [deleteProdCatMode, setDeleteProdCatMode] = useState(false);
  // 店販カテゴリリスト（Supabase settings保存）- 初期値は空（Supabaseから読み込む）
  const [shopCategoryList, setShopCategoryList] = useState([]);
  const [shopCatLoaded, setShopCatLoaded] = useState(false);

  const [showOrderModal, setShowOrderModal] = useState(false);
  const [orderLinks, setOrderLinks] = useState([
    { id: 1, name: "フユヒロ", url: "https://fuyuhiro.co.jp" },
    { id: 2, name: "WHELM", url: "https://whelm.jp" },
  ]);
  const [editingOrderId, setEditingOrderId] = useState(null);
  const [orderForm, setOrderForm] = useState({ name: "", url: "" });
  const [showAddOrder, setShowAddOrder] = useState(false);
  const [addOrderForm, setAddOrderForm] = useState({ name: "", url: "" });

  // 発注先・店販カテゴリをsettingsから読み込み
  useEffect(() => {
    sb.from("settings").select().then(({ data }) => {
      const DEFAULT_SHOP_CATS = ["シャンプー","トリートメント","スタイリング剤","アウトバス・ヘアケア","美容器具・アイテム","コスメ・スキンケア","スキャルプ・ウィッグ","アウトバス","その他"];
      if (!data) { setShopCategoryList(DEFAULT_SHOP_CATS); setShopCatLoaded(true); return; }
      const m = {};
      data.forEach(r => { m[r.key] = r.value; });
      if (m.shopCategoryList) {
        try { setShopCategoryList(JSON.parse(m.shopCategoryList)); } catch(e) { setShopCategoryList(DEFAULT_SHOP_CATS); }
      } else {
        // 未保存の場合はデフォルト値をSupabaseに保存
        setShopCategoryList(DEFAULT_SHOP_CATS);
        const json = JSON.stringify(DEFAULT_SHOP_CATS);
        sb.from("settings").insert([{ key: "shopCategoryList", value: json }]);
      }
      if (m.orderLinks) {
        try { setOrderLinks(JSON.parse(m.orderLinks)); } catch(e) {}
      }
      setShopCatLoaded(true);
    });
  }, []);

  const saveOrderLinks = async (list) => {
    const key = "orderLinks";
    const json = JSON.stringify(list);
    const { data: ex } = await sb.from("settings").select().eq("key", key);
    if (ex && ex.length > 0) {
      await sb.from("settings").update({ value: json }).eq("key", key);
    } else {
      await sb.from("settings").insert([{ key, value: json }]);
    }
  };

  const addOrderLink = async () => {
    if (!addOrderForm.name.trim() || !addOrderForm.url.trim()) return notify("名前とURLを入力してください", "error");
    let url = addOrderForm.url.trim();
    if (!url.startsWith("http")) url = "https://" + url;
    const newList = [...orderLinks, { id: Date.now(), name: addOrderForm.name.trim(), url }];
    setOrderLinks(newList);
    await saveOrderLinks(newList);
    setAddOrderForm({ name: "", url: "" });
    setShowAddOrder(false);
    notify("追加しました ✓");
  };

  const updateOrderLink = async (id) => {
    if (!orderForm.name.trim() || !orderForm.url.trim()) return notify("名前とURLを入力してください", "error");
    let url = orderForm.url.trim();
    if (!url.startsWith("http")) url = "https://" + url;
    const newList = orderLinks.map(o => o.id === id ? { ...o, name: orderForm.name.trim(), url } : o);
    setOrderLinks(newList);
    await saveOrderLinks(newList);
    setEditingOrderId(null);
    notify("更新しました ✓");
  };

  const deleteOrderLink = async (id) => {
    const newList = orderLinks.filter(o => o.id !== id);
    setOrderLinks(newList);
    await saveOrderLinks(newList);
    notify("削除しました");
  };

  const saveShopCatList = async (list) => {
    const key = "shopCategoryList";
    const json = JSON.stringify(list);
    const { data: ex } = await sb.from("settings").select().eq("key", key);
    if (ex && ex.length > 0) {
      await sb.from("settings").update({ value: json }).eq("key", key);
    } else {
      await sb.from("settings").insert([{ key, value: json }]);
    }
  };

  const lowStock = products.filter(p => (p.stock||0) < (p.minStock||3));
  const soldMap  = {};
  visits.forEach(v => v.products.forEach(p => { soldMap[p.productId] = (soldMap[p.productId]||0) + p.qty; }));

  const catMap = {};
  products.forEach(p => {
    const cat = p.category || "未分類";
    const sub = p.subCategory || "一般";
    if (!catMap[cat]) catMap[cat] = {};
    if (!catMap[cat][sub]) catMap[cat][sub] = [];
    catMap[cat][sub].push(p);
  });

  const allCats = [...new Set(products.map(p => p.category || "未分類"))];
  const allSubs = (cat) => [...new Set(products.filter(p => (p.category||"未分類") === cat).map(p => p.subCategory || "一般"))];



  const saveAddProduct = async () => {
    if (!addForm.name || !addForm.price) return notify("商品名と価格を入力してください", "error");
    const newP = { name: addForm.name, price: parseInt(addForm.price)||0, cost: parseInt(addForm.cost)||0, stock: parseInt(addForm.stock)||0, minStock: parseInt(addForm.minStock)||3, category: addForm.category || "未分類", subCategory: addForm.subCategory || "一般", photos: addForm.photos||[], description: addForm.description||"", isPublic: addForm.isPublic||false };
    await addProduct(newP);
    setAddForm({ name:"", price:"", cost:"", stock:"", minStock:"3", category:"", subCategory:"", photos:[], description:"", isPublic:false });
    setView("gyomu");
    notify("商品を追加しました ✓");
  };

  const saveEditProduct = async () => {
    const changes = { ...editProdForm, price:parseInt(editProdForm.price)||0, cost:parseInt(editProdForm.cost)||0, stock:parseInt(editProdForm.stock)||0, minStock:parseInt(editProdForm.minStock)||3 };
    await updateProduct(editingProd, changes);
    notify("更新しました ✓"); setEditingProd(null);
  };

  const deleteProduct = async (id) => {
    if (!window.confirm("この商品を削除しますか？")) return;
    await deleteProductGlobal(id);
    notify("削除しました");
  };
  const deleteSub = (cat, sub) => { setProducts(prev => prev.filter(x => !(x.category===cat && x.subCategory===sub))); notify("削除しました"); };

  const deleteProdCategory = async (cat) => {
    const count = products.filter(p => (p.category||"未分類") === cat).length;
    if (!window.confirm(`「${cat}」カテゴリを削除しますか？\n含まれる${count}件の商品も削除されます。`)) return;
    const ids = products.filter(p => (p.category||"未分類") === cat).map(p => p.id);
    for (const id of ids) await deleteProductGlobal(id);
    // shopCategoryListからも削除
    const newList = shopCategoryList.filter(c => c !== cat);
    setShopCategoryList(newList);
    await saveShopCatList(newList);
    notify(`「${cat}」を削除しました`);
  };

  const renameProdCategory = async (oldCat) => {
    const newCat = editCatName.trim();
    if (!newCat || newCat === oldCat) { setEditingCatKey(null); return; }
    setProducts(prev => prev.map(p => (p.category||"未分類") === oldCat ? { ...p, category: newCat } : p));
    // shopCategoryListも更新
    if (shopCategoryList.includes(oldCat)) {
      const newList = shopCategoryList.map(c => c === oldCat ? newCat : c);
      setShopCategoryList(newList);
      await saveShopCatList(newList);
    }
    setEditingCatKey(null);
    notify(`「${oldCat}」→「${newCat}」に変更しました ✓`);
  };

  const getDisplayMap = () => {
    if (view === "history" || view === "addProduct") return catMap;
    if (!shopCatLoaded) return {}; // 読み込み完了前は何も表示しない
    const filtered = {};
    Object.entries(catMap).forEach(([cat, subs]) => {
      const isShop = shopCategoryList.includes(cat);
      if (view === "hanbahin" && isShop) filtered[cat] = subs;
      if (view === "gyomu" && !isShop) filtered[cat] = subs;
    });
    return filtered;
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {view === "addProduct" ? (
        <div>
          <div style={{ background:"#fff", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${C.border}` }}>
            <button onClick={() => setView("gyomu")} style={{ background:"none", border:"none", color:"#7a6848", fontSize:15, fontWeight:700, cursor:"pointer" }}>← 戻る</button>
            <div style={{ fontWeight:800, fontSize:16 }}>商品を追加</div>
            <button onClick={saveAddProduct} style={{ background:"none", border:"none", color:"#7a6848", fontSize:15, fontWeight:700, cursor:"pointer" }}>保存</button>
          </div>
          <div style={{ padding:"16px" }}>
            <div style={{ background:"#fff", borderRadius:12, overflow:"hidden", marginBottom:12 }}>
              {[["name","商品名 *","text"],["price","売価（円）*","number"],["cost","原価（円）","number"],["stock","現在の在庫数","number"],["minStock","最小在庫数（発注アラート）","number"]].map(([k,l,t]) => (
                <div key={k} style={{ display:"flex", alignItems:"center", padding:"13px 16px", borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ fontSize:14, color:C.sub, width:160, flexShrink:0 }}>{l}</span>
                  <input type={t} value={addForm[k]} onChange={e => setAddForm(p=>({...p,[k]:e.target.value}))}
                    placeholder="未入力" style={{ flex:1, border:"none", fontSize:15, outline:"none", textAlign:t==="number"?"right":"left", background:"transparent" }} />
                  {t==="number" && <span style={{ fontSize:13, color:C.sub, marginLeft:4 }}>{k==="stock"||k==="minStock"?"個":"円"}</span>}
                </div>
              ))}
              <div style={{ display:"flex", alignItems:"center", padding:"13px 16px", borderBottom:`1px solid ${C.border}` }}>
                <span style={{ fontSize:14, color:C.sub, width:160, flexShrink:0 }}>カテゴリ</span>
                <input list="cat-list2" value={addForm.category} onChange={e => setAddForm(p=>({...p,category:e.target.value}))} placeholder="例：カラー剤" style={{ flex:1, border:"none", fontSize:15, outline:"none", background:"transparent" }} />
                <datalist id="cat-list2">{allCats.map(c => <option key={c} value={c}/>)}</datalist>
              </div>
              <div style={{ display:"flex", alignItems:"center", padding:"13px 16px", borderBottom:`1px solid ${C.border}` }}>
                <span style={{ fontSize:14, color:C.sub, width:160, flexShrink:0 }}>メーカー</span>
                <input list="sub-list2" value={addForm.subCategory} onChange={e => setAddForm(p=>({...p,subCategory:e.target.value}))} placeholder="例：Milbon" style={{ flex:1, border:"none", fontSize:15, outline:"none", background:"transparent" }} />
                <datalist id="sub-list2">{addForm.category && allSubs(addForm.category).map(s => <option key={s} value={s}/>)}</datalist>
              </div>
              <div style={{ padding:"13px 16px", borderBottom:`1px solid ${C.border}` }}>
                <div style={{ fontSize:14, color:C.sub, marginBottom:8 }}>商品説明</div>
                <textarea value={addForm.description} onChange={e => setAddForm(p=>({...p,description:e.target.value}))} placeholder="商品の特徴・使い方など" rows={3} style={{ width:"100%", border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", fontSize:14, outline:"none", resize:"none", boxSizing:"border-box" }} />
              </div>
              <div style={{ padding:"13px 16px", borderBottom:`1px solid ${C.border}` }}>
                <div style={{ fontSize:14, color:C.sub, marginBottom:8 }}>商品写真（最大3枚）</div>
                <div style={{ display:"flex", gap:8 }}>
                  {[0,1,2].map(i => (
                    <label key={i} style={{ width:80, height:80, borderRadius:10, border:`1.5px dashed ${C.border}`, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", overflow:"hidden", flexShrink:0, position:"relative" }}>
                      {addForm.photos[i] ? <img src={addForm.photos[i].url} style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : <span style={{ fontSize:24, opacity:0.3 }}>📷</span>}
                      <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                        const file = e.target.files[0]; if (!file) return;
                        const reader = new FileReader();
                        reader.onload = ev => {
                          const url = ev.target.result;
                          setAddForm(p => { const photos=[...p.photos]; photos[i]={url}; return {...p,photos}; });
                        };
                        reader.readAsDataURL(file);
                      }} />
                    </label>
                  ))}
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"13px 16px" }}>
                <span style={{ fontSize:14, color:C.sub }}>お客様ページへの公開</span>
                <button onClick={() => setAddForm(p=>({...p,isPublic:!p.isPublic}))} style={{ width:48, height:28, borderRadius:14, border:"none", background:addForm.isPublic?"#E8DCC3":"#d1d1d6", cursor:"pointer", position:"relative", flexShrink:0 }}>
                  <div style={{ width:22, height:22, borderRadius:"50%", background:"#fff", position:"absolute", top:3, left:addForm.isPublic?23:3, transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.2)" }} />
                </button>
              </div>
            </div>
            <div style={{ fontSize:12, color:C.sub, textAlign:"center" }}>カテゴリ・メーカーは自由入力。既存のものはサジェストされます。</div>
          </div>
        </div>
      ) : (
        <div style={{ padding:"0 0 16px" }}>
          <div style={{ padding:"12px 16px" }}>
            <button onClick={() => setTab("more")} style={{ ...css.btn(C.sub,false), marginBottom:12, fontSize:13 }}>← 戻る</button>

            {/* Low stock alert */}
            {lowStock.length > 0 && (
              <div style={{ background:"#fff5f5", border:`1px solid ${C.red}44`, borderRadius:12, padding:"10px 14px", marginBottom:10 }}>
                <div style={{ fontWeight:700, color:C.red, fontSize:13, marginBottom:4 }}>⚠ 発注アラート</div>
                {lowStock.map(p => (
                  <div key={p.id} style={{ fontSize:12, display:"flex", justifyContent:"space-between", marginBottom:2 }}>
                    <span>{p.name}</span>
                    <span style={{ color:C.red, fontWeight:700 }}>残{p.stock||0}個</span>
                  </div>
                ))}
              </div>
            )}

            {/* Tabs */}
            <div style={{ display:"flex", gap:6, marginBottom:14, alignItems:"center" }}>
              {[["gyomu","業務"],["hanbahin","店販"],["history","入出庫履歴"]].map(([k,l]) => (
                <button key={k} onClick={() => setView(k)} style={{ padding:"7px 14px", borderRadius:20, border:"none", background:view===k?C.accent:C.border+"88", color:view===k?"#fff":C.sub, fontWeight:700, fontSize:13, cursor:"pointer" }}>{l}</button>
              ))}
              <button onClick={() => setShowOrderModal(true)}
                style={{ marginLeft:"auto", padding:"7px 14px", borderRadius:20, border:"none", background:"#2a2218", color:"#E8DCC3", fontWeight:700, fontSize:13, cursor:"pointer", whiteSpace:"nowrap" }}>
                📦 発注
              </button>
            </div>

            {/* Action buttons - below tabs */}
            {(view === "gyomu" || view === "hanbahin") && (
              <div style={{ marginBottom:12 }}>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <button onClick={() => setView("addProduct")} style={{ flex:1, padding:"10px 8px", borderRadius:10, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:13, cursor:"pointer" }}>＋ 商品を追加</button>
                  <button onClick={() => { setShowAddCat(!showAddCat); setNewCatType("gyomu"); setNewCatName(""); }} style={{ flex:1, padding:"10px 8px", borderRadius:10, border:`1.5px solid #E8DCC3`, background:"#fff", color:"#7a6848", fontWeight:700, fontSize:13, cursor:"pointer" }}>＋ カテゴリ追加</button>
                  <button onClick={() => { setDeleteProdCatMode(p => !p); setEditingCatKey(null); }}
                    style={{ padding:"10px 10px", borderRadius:10, border:`1.5px solid ${deleteProdCatMode ? C.red : C.border}`, background:"#fff", color: deleteProdCatMode ? C.red : C.sub, fontWeight:700, fontSize:12, cursor:"pointer", whiteSpace:"nowrap" }}>
                    {deleteProdCatMode ? "完了" : "編集/削除"}
                  </button>
                </div>
                {showAddCat && (
                  <div style={{ ...css.card, marginBottom:8, border:`1.5px solid #7a6848` }}>
                    <div style={{ fontSize:13, fontWeight:700, marginBottom:8 }}>新しいカテゴリを追加</div>
                    {/* 業務/店販選択 */}
                    <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                      <button onClick={() => setNewCatType("gyomu")}
                        style={{ flex:1, padding:"8px", borderRadius:8, border:`2px solid ${newCatType==="gyomu"?"#7a6848":C.border}`, background:newCatType==="gyomu"?"#f5ede0":"#fff", color:newCatType==="gyomu"?"#7a6848":C.sub, fontWeight:700, fontSize:13, cursor:"pointer" }}>業務用</button>
                      <button onClick={() => setNewCatType("hanbahin")}
                        style={{ flex:1, padding:"8px", borderRadius:8, border:`2px solid ${newCatType==="hanbahin"?"#6a90b8":C.border}`, background:newCatType==="hanbahin"?"#eef2f8":"#fff", color:newCatType==="hanbahin"?"#6a90b8":C.sub, fontWeight:700, fontSize:13, cursor:"pointer" }}>店販用</button>
                    </div>
                    <div style={{ display:"flex", gap:8 }}>
                      <input value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="カテゴリ名..." style={{ ...css.input, flex:1 }} />
                      <button onClick={async () => {
                        if (!newCatName.trim()) return;
                        const catName = newCatName.trim();
                        // 店販の場合はshopCategoryListに追加
                        if (newCatType === "hanbahin") {
                          const newList = [...shopCategoryList, catName];
                          setShopCategoryList(newList);
                          await saveShopCatList(newList);
                        }
                        // Supabaseにプレースホルダー商品として保存
                        const newP = { name:`（${catName}の商品を追加）`, price:0, cost:0, stock:0, min_stock:3, category:catName, sub_category:"一般", placeholder:true };
                        const { data, error } = await sb.from("products").insert([newP]).select();
                        if (!error && data && data[0]) {
                          setProducts(p => [...p, { id:data[0].id, name:newP.name, price:0, cost:0, stock:0, minStock:3, category:catName, subCategory:"一般", placeholder:true, photos:[], description:"", isPublic:false }]);
                        } else {
                          setProducts(p => [...p, { id:Date.now(), name:newP.name, price:0, cost:0, stock:0, minStock:3, category:catName, subCategory:"一般", placeholder:true }]);
                        }
                        notify(`「${catName}」(${newCatType==="hanbahin"?"店販":"業務"})を追加しました ✓`);
                        setNewCatName(""); setNewCatType("gyomu"); setShowAddCat(false);
                      }} style={css.btn("#7a6848")}>追加</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Category tree */}
            {(view === "gyomu" || view === "hanbahin") && Object.entries(getDisplayMap()).map(([cat, subs]) => {
              const catOpen = openCats[cat] === true;
              const catTotal = Object.values(subs).flat().reduce((s,p)=>s+(p.stock||0),0);
              const catLow   = Object.values(subs).flat().filter(p=>(p.stock||0)<(p.minStock||3)).length;
              return (
                <div key={cat} style={{ marginBottom:10 }}>
                  {/* カテゴリ編集モード */}
                  {editingCatKey === cat ? (
                    <div style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 14px", background:"#2a2a2a", borderRadius:catOpen?"10px 10px 0 0":"10px" }}>
                      <input value={editCatName} onChange={e => setEditCatName(e.target.value)} autoFocus
                        style={{ flex:1, borderRadius:6, padding:"6px 10px", fontSize:14, border:"none", outline:"none" }}
                        onKeyDown={e => { if (e.key === "Enter") renameProdCategory(cat); if (e.key === "Escape") setEditingCatKey(null); }} />
                      <button onClick={() => renameProdCategory(cat)}
                        style={{ background:"#E8DCC3", border:"none", borderRadius:6, padding:"6px 12px", fontWeight:700, fontSize:12, color:"#2a2218", cursor:"pointer" }}>保存</button>
                      <button onClick={() => setEditingCatKey(null)}
                        style={{ background:"none", border:"1px solid #666", borderRadius:6, padding:"6px 10px", fontWeight:700, fontSize:12, color:"#aaa", cursor:"pointer" }}>取消</button>
                    </div>
                  ) : (
                  <div onClick={() => !deleteProdCatMode && setOpenCats(prev=>({...prev,[cat]:!catOpen}))}
                    style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px", background:"#2a2a2a", borderRadius:catOpen?"10px 10px 0 0":"10px", cursor: deleteProdCatMode ? "default" : "pointer" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      {deleteProdCatMode && (
                        <button onClick={e => { e.stopPropagation(); deleteProdCategory(cat); }}
                          style={{ width:24,height:24,borderRadius:"50%",background:C.red,border:"none",color:"#fff",fontSize:18,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:1 }}>－</button>
                      )}
                      <span style={{ fontWeight:800, fontSize:15, color:"#fff" }}>{cat}</span>
                      {catLow > 0 && <span style={{ background:C.red, color:"#fff", fontSize:10, fontWeight:700, borderRadius:20, padding:"2px 8px" }}>要発注{catLow}品</span>}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      {deleteProdCatMode ? (
                        <button onClick={e => { e.stopPropagation(); setEditCatName(cat); setEditingCatKey(cat); }}
                          style={{ background:"#f5ede0", border:"none", borderRadius:6, padding:"4px 10px", fontSize:11, fontWeight:700, color:"#7a6848", cursor:"pointer" }}>編集</button>
                      ) : (
                        <>
                          <span style={{ fontSize:12, color:"#aaa" }}>計{catTotal}個</span>
                          <span style={{ color:"#aaa", fontSize:14 }}>{catOpen?"▲":"▼"}</span>
                        </>
                      )}
                    </div>
                  </div>
                  )}
                  {catOpen && (
                    <div style={{ border:"1px solid #e0e0e0", borderTop:"none", borderRadius:"0 0 10px 10px", overflow:"hidden", background:"#fff" }}>
                      {Object.entries(subs).map(([sub, items]) => {
                        const subKey = cat+"_"+sub;
                        const subOpen = openSubs[subKey] === true;
                        return (
                          <div key={sub}>
                            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 16px", background:"#f8f8f8", borderBottom:`1px solid ${C.border}` }}>
                              {editingSubKey === subKey ? (
                                <div style={{ display:"flex", gap:6, flex:1, alignItems:"center" }}>
                                  <input value={editSubName} onChange={e=>setEditSubName(e.target.value)}
                                    style={{ flex:1, border:`1px solid #7a6848`, borderRadius:6, padding:"4px 8px", fontSize:13 }} autoFocus />
                                  <button onClick={() => {
                                    if (editSubName.trim()) {
                                      setProducts(prev=>prev.map(x=>(x.category===cat&&x.subCategory===sub)?{...x,subCategory:editSubName.trim()}:x));
                                      notify("変更しました ✓");
                                    }
                                    setEditingSubKey(null);
                                  }} style={{ color:"#7a6848", background:"none", border:"none", fontWeight:700, cursor:"pointer", fontSize:12 }}>完了</button>
                                  <button onClick={()=>setEditingSubKey(null)} style={{ color:C.sub, background:"none", border:"none", cursor:"pointer", fontSize:12 }}>✕</button>
                                </div>
                              ) : (
                                <>
                                  <div onClick={()=>setOpenSubs(prev=>({...prev,[subKey]:!subOpen}))} style={{ display:"flex", alignItems:"center", gap:8, flex:1, cursor:"pointer" }}>
                                    <span style={{ fontSize:13, fontWeight:700, color:C.sub }}>📦 {sub}</span>
                                    <span style={{ color:C.sub, fontSize:12 }}>{subOpen?"▲":"▼"}</span>
                                  </div>
                                  <div style={{ display:"flex", gap:4 }}>
                                    <button onClick={e=>{e.stopPropagation();setEditingSubKey(subKey);setEditSubName(sub);}} style={{ fontSize:11, color:C.sub, background:"none", border:`1px solid ${C.border}`, borderRadius:6, padding:"2px 8px", cursor:"pointer" }}>✏</button>
                                    <button onClick={e=>{e.stopPropagation();deleteSub(cat,sub);}} style={{ fontSize:11, color:C.red, background:"none", border:`1px solid ${C.red}`, borderRadius:6, padding:"2px 8px", cursor:"pointer" }}>🗑</button>
                                    <button onClick={e=>{e.stopPropagation();setShowAddSub(showAddSub===subKey?null:subKey);}} style={{ fontSize:11, color:"#7a6848", background:"none", border:"1px solid #E8DCC3", borderRadius:6, padding:"2px 8px", cursor:"pointer" }}>＋追加</button>
                                  </div>
                                </>
                              )}
                            </div>
                            {showAddSub === subKey && (
                              <div style={{ padding:"8px 16px", background:"#f0fffe", borderBottom:`1px solid ${C.border}`, display:"flex", gap:8 }}>
                                <input value={newSubName[subKey]||""} onChange={e=>setNewSubName(p=>({...p,[subKey]:e.target.value}))} placeholder="新しいメーカー名..." style={{ ...css.input, flex:1, fontSize:13 }} />
                                <button onClick={()=>{
                                  const name=(newSubName[subKey]||"").trim();
                                  if(!name) return;
                                  setProducts(p=>[...p,{id:Date.now(),name:`（${name}の商品を追加）`,price:0,cost:0,stock:0,minStock:3,category:cat,subCategory:name,placeholder:true}]);
                                  setNewSubName(p=>({...p,[subKey]:""})); setShowAddSub(null);
                                  notify(`「${name}」を追加しました ✓`);
                                }} style={{...css.btn("#7a6848"),fontSize:12,padding:"6px 12px"}}>追加</button>
                              </div>
                            )}
                            {subOpen && items.map(p => (
                              <div key={p.id} style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}` }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 }}>
                                  <div style={{ flex:1 }}>
                                    <div style={{ fontWeight:p.placeholder?400:700, fontSize:14, color:p.placeholder?C.sub:C.text }}>{p.name}</div>
                                    {!p.placeholder && <div style={{ fontSize:11, color:C.sub, marginTop:2 }}>売価{yen(p.price)} · 原価{yen(p.cost||0)} · 最小{p.minStock||3}個</div>}
                                  </div>
                                  {!p.placeholder && (
                                    <div style={{ textAlign:"right", marginLeft:12 }}>
                                      <div style={{ fontSize:22, fontWeight:800, color:(p.stock||0)<(p.minStock||3)?C.red:(p.stock||0)<(p.minStock||3)*2?C.orange:C.green }}>{p.stock||0}</div>
                                      <div style={{ fontSize:10, color:C.sub }}>個</div>
                                    </div>
                                  )}
                                </div>
                                {!p.placeholder && (
                                  <>
                                    {minEdit[p.id] ? (
                                      <div style={{ display:"flex", gap:8, marginBottom:8, alignItems:"center" }}>
                                        <span style={{ fontSize:12, color:C.sub }}>発注アラート：</span>
                                        <input type="number" defaultValue={p.minStock||3}
                                          onChange={e=>setProducts(prev=>prev.map(x=>x.id===p.id?{...x,minStock:parseInt(e.target.value)||0}:x))}
                                          style={{ width:60, border:`1px solid ${C.border}`, borderRadius:6, padding:"4px 8px", fontSize:13 }} />
                                        <span style={{ fontSize:12, color:C.sub }}>個以下で発注</span>
                                        <button onClick={()=>setMinEdit(prev=>({...prev,[p.id]:false}))} style={{ fontSize:11, color:"#7a6848", background:"none", border:"none", cursor:"pointer" }}>完了</button>
                                      </div>
                                    ) : (
                                      <button onClick={()=>setMinEdit(prev=>({...prev,[p.id]:true}))} style={{ fontSize:11, color:C.sub, background:"none", border:"none", cursor:"pointer", textDecoration:"underline", marginBottom:6, display:"block" }}>
                                        最小個数: {p.minStock||3}個（変更）
                                      </button>
                                    )}
                                    {/* Quick adjust buttons */}
                                    <div style={{ display:"flex", gap:6, marginBottom:6 }}>
                                      {[+1,+5,-1,-5].map(delta => (
                                        <button key={delta} onClick={() => {
                                          setProducts(prev => prev.map(x => x.id===p.id ? {...x, stock:Math.max(0,(x.stock||0)+delta)} : x));
                                          setStockHistory(h => [...h, { productId:p.id, date:todayStr(), delta, note:delta>0?"仕入れ":"使用" }]);
                                          notify(`${p.name}: ${delta>0?"+":""}${delta}個`);
                                        }} style={{ flex:1, padding:"8px 2px", borderRadius:8, border:`1px solid ${delta>0?"#E8DCC3":C.red}`, background: delta>0?"#e8faf9":"#fff5f5", color:delta>0?"#E8DCC3":C.red, fontWeight:700, fontSize:13, cursor:"pointer" }}>
                                          {delta>0?"+":""}{delta}
                                        </button>
                                      ))}
                                      <button onClick={()=>{setEditingProd(p.id);setEditProdForm({name:p.name,price:p.price,cost:p.cost||0,stock:p.stock||0,minStock:p.minStock||3,category:p.category,subCategory:p.subCategory||"一般",photos:p.photos||[],description:p.description||"",isPublic:p.isPublic||false});}} style={{ padding:"8px 10px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", color:C.sub, fontSize:13, cursor:"pointer" }}>✏</button>
                                      <button onClick={()=>deleteProduct(p.id)} style={{ padding:"8px 10px", borderRadius:8, border:`1px solid ${C.red}`, background:"#fff", color:C.red, fontSize:13, cursor:"pointer" }}>🗑</button>
                                    </div>
                                  </>
                                )}
                                {p.placeholder && (
                                  <button onClick={()=>{setAddForm(f=>({...f,category:p.category,subCategory:p.subCategory}));setView("addProduct");}} style={{...css.btn("#7a6848",false),width:"100%",fontSize:13}}>＋ 商品を追加する</button>
                                )}
                              </div>
                            ))}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}

            {/* History */}
            {view === "history" && (
              stockHistory.length === 0
                ? <div style={{...css.card,textAlign:"center",color:C.sub,fontSize:14}}>入出庫履歴なし</div>
                : [...stockHistory].reverse().map((h,i) => {
                  const p = products.find(x=>x.id===h.productId);
                  return (
                    <div key={i} style={css.card}>
                      <div style={{ display:"flex", justifyContent:"space-between" }}>
                        <div><div style={{ fontWeight:600 }}>{p?.name||"不明"}</div><div style={{ fontSize:12, color:C.sub }}>{h.date} · {h.note}</div></div>
                        <div style={{ fontWeight:800, fontSize:18, color:h.delta>0?C.green:C.red }}>{h.delta>0?"+":""}{h.delta}</div>
                      </div>
                    </div>
                  );
                })
            )}
          </div>
        </div>
      )}

      {/* Edit product modal */}
      {editingProd && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:900, display:"flex", alignItems:"flex-end" }}>
          <div style={{ background:C.card, borderRadius:"20px 20px 0 0", padding:"20px 16px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"85vh", overflowY:"auto" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div style={{ fontWeight:800, fontSize:17 }}>商品を編集</div>
              <button onClick={()=>setEditingProd(null)} style={{ background:"none", border:"none", fontSize:22, color:C.sub, cursor:"pointer" }}>✕</button>
            </div>
            {[["name","商品名","text"],["price","売価（円）","number"],["cost","原価（円）","number"],["stock","在庫数","number"],["minStock","最小在庫数","number"]].map(([k,l,t]) => (
              <div key={k} style={{ marginBottom:10 }}>
                <label style={css.label}>{l}</label>
                <input type={t} value={editProdForm[k]||""} onChange={e=>setEditProdForm(f=>({...f,[k]:e.target.value}))} style={css.input} />
              </div>
            ))}
            <div style={{ marginBottom:10 }}>
              <label style={css.label}>カテゴリ</label>
              <input list="edit-cat" value={editProdForm.category||""} onChange={e=>setEditProdForm(f=>({...f,category:e.target.value}))} style={css.input} />
              <datalist id="edit-cat">{allCats.map(c=><option key={c} value={c}/>)}</datalist>
            </div>
            <div style={{ marginBottom:16 }}>
              <label style={css.label}>メーカー</label>
              <input value={editProdForm.subCategory||""} onChange={e=>setEditProdForm(f=>({...f,subCategory:e.target.value}))} style={css.input} />
            </div>
            <div style={{ marginBottom:12 }}>
              <label style={css.label}>商品説明</label>
              <textarea value={editProdForm.description||""} onChange={e=>setEditProdForm(f=>({...f,description:e.target.value}))} rows={3} style={{ ...css.input, resize:"none", lineHeight:1.7 }} />
            </div>
            <div style={{ marginBottom:12 }}>
              <label style={css.label}>商品写真（最大3枚）</label>
              <div style={{ display:"flex", gap:8 }}>
                {[0,1,2].map(i => (
                  <label key={i} style={{ width:80, height:80, borderRadius:10, border:`1.5px dashed ${C.border}`, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", overflow:"hidden", flexShrink:0, position:"relative" }}>
                    {(editProdForm.photos||[])[i] ? <img src={(editProdForm.photos||[])[i].url} style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : <span style={{ fontSize:24, opacity:0.3 }}>📷</span>}
                    <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => {
                      const file = e.target.files[0]; if (!file) return;
                      const reader = new FileReader();
                      reader.onload = ev => {
                        setEditProdForm(f => { const photos=[...(f.photos||[])]; photos[i]={url:ev.target.result}; return {...f,photos}; });
                      };
                      reader.readAsDataURL(file);
                    }} />
                  </label>
                ))}
              </div>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <span style={{ fontSize:14, color:C.sub }}>お客様ページへの公開</span>
              <button onClick={() => setEditProdForm(f=>({...f,isPublic:!f.isPublic}))} style={{ width:48, height:28, borderRadius:14, border:"none", background:(editProdForm.isPublic)?"#E8DCC3":"#d1d1d6", cursor:"pointer", position:"relative", flexShrink:0 }}>
                <div style={{ width:22, height:22, borderRadius:"50%", background:"#fff", position:"absolute", top:3, left:(editProdForm.isPublic)?23:3, transition:"left 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.2)" }} />
              </button>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={saveEditProduct} style={{...css.btn("#7a6848"),flex:1}}>保存する</button>
              <button onClick={()=>{deleteProduct(editingProd);setEditingProd(null);}} style={css.btn(C.red,false)}>削除</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 発注モーダル ── */}
      {showOrderModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:950, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px 16px" }}
          onClick={e => { if (e.target === e.currentTarget) setShowOrderModal(false); }}>
          <div style={{ background:C.card, borderRadius:20, width:"100%", maxWidth:440, maxHeight:"80vh", overflowY:"auto", boxShadow:"0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px 20px", borderBottom:`1px solid ${C.border}` }}>
              <div style={{ fontWeight:800, fontSize:17 }}>📦 発注先</div>
              <button onClick={() => setShowOrderModal(false)} style={{ background:"none", border:"none", fontSize:22, color:C.sub, cursor:"pointer" }}>✕</button>
            </div>
            <div style={{ padding:"12px 16px" }}>
              {orderLinks.length === 0 && (
                <div style={{ textAlign:"center", color:C.sub, fontSize:14, padding:"20px 0" }}>発注先が登録されていません</div>
              )}
              {orderLinks.map(o => (
                <div key={o.id} style={{ marginBottom:10 }}>
                  {editingOrderId === o.id ? (
                    <div style={{ background:C.bg, borderRadius:12, padding:12, border:`1px solid ${C.border}` }}>
                      <input value={orderForm.name} onChange={e => setOrderForm(p=>({...p,name:e.target.value}))}
                        placeholder="発注先名" style={{ ...css.input, marginBottom:8 }} />
                      <input value={orderForm.url} onChange={e => setOrderForm(p=>({...p,url:e.target.value}))}
                        placeholder="URL（例：https://...）" style={{ ...css.input, marginBottom:10 }} />
                      <div style={{ display:"flex", gap:8 }}>
                        <button onClick={() => updateOrderLink(o.id)}
                          style={{ flex:1, padding:"9px", borderRadius:10, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:13, cursor:"pointer" }}>保存</button>
                        <button onClick={() => setEditingOrderId(null)}
                          style={{ padding:"9px 16px", borderRadius:10, border:`1px solid ${C.border}`, background:"#fff", color:C.sub, fontWeight:700, fontSize:13, cursor:"pointer" }}>取消</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <button onClick={() => window.open(o.url, "_blank")}
                        style={{ flex:1, padding:"13px 16px", borderRadius:12, border:"none", background:"#2a2218", color:"#E8DCC3", fontWeight:700, fontSize:15, cursor:"pointer", textAlign:"left" }}>
                        {o.name} →
                      </button>
                      <button onClick={() => { setOrderForm({ name:o.name, url:o.url }); setEditingOrderId(o.id); }}
                        style={{ padding:"10px 12px", borderRadius:10, border:`1px solid ${C.border}`, background:"#f5ede0", color:"#7a6848", fontWeight:700, fontSize:12, cursor:"pointer" }}>編集</button>
                      <button onClick={() => deleteOrderLink(o.id)}
                        style={{ padding:"10px 12px", borderRadius:10, border:"none", background:"#fff0f0", color:C.red, fontWeight:700, fontSize:12, cursor:"pointer" }}>削除</button>
                    </div>
                  )}
                </div>
              ))}
              {showAddOrder ? (
                <div style={{ background:C.bg, borderRadius:12, padding:12, border:`1.5px solid #7a6848`, marginTop:8 }}>

                    placeholder="発注先名（例：フユヒロ）" style={{ ...css.input, marginBottom:8 }} />
                  <input value={addOrderForm.url} onChange={e => setAddOrderForm(p=>({...p,url:e.target.value}))}
