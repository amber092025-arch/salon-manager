const sb = {
  from: (table) => ({
    _table: table,
    select: function(cols = "*") { this._cols = cols; this._filters = []; return this; },
    insert: function(data) { this._method = "POST"; this._data = data; return this; },
    upsert: function(data) { this._method = "POST"; this._data = data; this._upsert = true; return this; },
    update: function(data) { this._method = "PATCH"; this._data = data; this._filters = []; return this; },
    delete: function() { this._method = "DELETE"; this._filters = []; return this; },
    eq: function(col, val) { this._filters = [...(this._filters||[]), `${col}=eq.${val}`]; return this; },
    order: function(col, opts={}) { this._order = `${col}.${opts.ascending===false?"desc":"asc"}`; return this; },
    then: async function(resolve, reject) {
      try {
        const base = `${SUPABASE_URL}/rest/v1/${this._table}`;
        const headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": this._upsert ? "resolution=merge-duplicates,return=representation" : "return=representation",
        };
        let url = base;
        const params = [];
        if (this._cols && !this._method) params.push(`select=${this._cols}`);
        if (this._filters) this._filters.forEach(f => params.push(f));
        if (this._order) params.push(`order=${this._order}`);
        if (params.length) url += "?" + params.join("&");

        const method = this._method || "GET";
        const res = await fetch(url, {
          method,
          headers,
          body: this._data ? JSON.stringify(this._data) : undefined,
        });
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }
        const data = method === "DELETE" || method === "PATCH" ? [] : await res.json();
        resolve({ data, error: null });
      } catch(e) {
        resolve({ data: null, error: e });
      }
    }
  })
};

// Helper: days since a date string
function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((new Date() - new Date(dateStr + "T00:00:00")) / 86400000);
}
function timeAgoLabel(dateStr) {
  if (!dateStr) return null;
  const d = daysSince(dateStr);
  if (d === 0) return "今日";
  if (d === 1) return "昨日";
  if (d < 30) return d + "日前";
  const m = Math.floor(d / 30);
  if (m < 12) return m + "ヶ月前";
  return Math.floor(m / 12) + "年前";
}
function isOverdue(dateStr, months = 3) {
  if (!dateStr) return false;
  return daysSince(dateStr) > months * 30;
}

function kanaGroup(kana) {
  if (!kana) return "他";
  const first = kana.charAt(0);
  const map = {あ:"あ",い:"い",う:"う",え:"え",お:"お",か:"か",が:"か",き:"き",ぎ:"き",く:"く",ぐ:"く",け:"け",げ:"け",こ:"こ",ご:"こ",さ:"さ",ざ:"さ",し:"し",じ:"し",す:"す",ず:"す",せ:"せ",ぜ:"せ",そ:"そ",ぞ:"そ",た:"た",だ:"た",ち:"つ",つ:"つ",づ:"つ",て:"て",で:"て",と:"と",ど:"と",な:"な",に:"に",ぬ:"な",ね:"な",の:"の",は:"は",ば:"は",ぱ:"は",ひ:"ひ",び:"ひ",ぴ:"ひ",ふ:"ふ",ぶ:"ふ",ぷ:"ふ",ま:"ま",み:"み",む:"む",め:"ま",も:"も",や:"や",ゆ:"ゆ",よ:"よ",ら:"ら",り:"り",る:"る",れ:"れ",ろ:"ろ",わ:"わ"};
  return map[first] || "他";
}

function CustomerDetail({ c, visits, menus, products, onBack, notify, setCustomers, updateVisit, updateCustomer, addVisit }) {
  const cv = visits.filter(v => v.customerId === c.id).sort((a,b) => b.date.localeCompare(a.date));
  const total = cv.reduce((s,v) => s+v.total, 0);
  const avg = cv.length ? Math.round(total/cv.length) : 0;
  const lastVisit = cv[0];
  const lastLabel = timeAgoLabel(lastVisit?.date);
  const [activeKarte, setActiveKarte] = useState(null);
  const [showEditForm, setShowEditForm] = useState(false);
  const [editForm, setEditForm] = useState({ name: c.name, kana: c.kana||"", phone: c.phone||"", birthday: c.birthday||"", gender: c.gender||"female", notes: c.notes||"" });

  const saveEdit = () => {
    if (!editForm.name) return notify("氏名を入力してください", "error");
    if (updateCustomer) updateCustomer(c.id, editForm);
    else setCustomers(p => p.map(x => x.id === c.id ? { ...x, ...editForm } : x));
    setShowEditForm(false);
    notify("顧客情報を更新しました ✓");
  };

  // visit period (avg days between visits)
  const visitPeriod = (() => {
    if (cv.length < 2) return null;
    const dates = cv.map(v => new Date(v.date));
    const totalDays = (dates[0] - dates[dates.length-1]) / 86400000;
    const avgDays = Math.round(totalDays / (cv.length-1));
    if (avgDays < 30) return avgDays + "日";
    return Math.round(avgDays/30) + "ヶ月";
  })();

  if (activeKarte) return <KarteDetail visit={activeKarte} customer={c} menus={menus} products={products} visits={visits} onBack={() => setActiveKarte(null)} notify={notify} updateVisit={updateVisit} />;

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* Nav */}
      <div style={{ background: "#00b4a6", padding: "10px 16px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", display:"flex",alignItems:"center",gap:4 }}>← 戻る</button>
        <div style={{ flex:1, textAlign:"center", fontWeight:800, fontSize:16, color:"#fff" }}>{c.name} 様</div>
        <button onClick={() => setShowEditForm(true)} style={{ background:"none", border:"1px solid rgba(255,255,255,0.6)", borderRadius:20, padding:"4px 10px", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer" }}>✏ 編集</button>
      </div>

      {/* Profile */}
      <div style={{ background:"#fff", padding:"16px", display:"flex", gap:14, alignItems:"flex-start" }}>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
          <div style={{ width:64, height:64, borderRadius:"50%", background:"#e8e8e8", display:"flex", alignItems:"center", justifyContent:"center", fontSize:32, opacity:0.4 }}>👤</div>
          <div style={{ fontSize:11, color:C.sub }}>MEMO-</div>
        </div>
        <div style={{ flex:1 }}>
          <div style={{ display:"grid", gridTemplateColumns:"auto 1fr", gap:"4px 12px", fontSize:13, color:C.sub }}>
            <span>性別-</span><span>{c.gender==="female"?"女性":c.gender==="male"?"男性":"—"}</span>
            <span>年齢-</span><span>{c.birthday ? Math.floor((new Date()-new Date(c.birthday))/31557600000)+"歳" : "--歳"}</span>
            <span>電話-</span><span>{c.phone || "—"}</span>
          </div>
          {c.notes && <div style={{ fontSize:12, color:C.orange, marginTop:6 }}>⚠ {c.notes}</div>}
        </div>
      </div>

      {/* Stats strip */}
      <div style={{ background:"#f0f0f0", padding:"10px 16px", fontSize:13, color:C.sub, display:"flex", gap:6, flexWrap:"wrap" }}>
        {lastLabel && <span><span style={{color:C.text, fontWeight:700}}>{lastLabel}</span>に来店</span>}
        {avg > 0 && <><span>/</span><span><span style={{color:C.text, fontWeight:700}}>{avg.toLocaleString()}円</span> 平均予算</span></>}
        {visitPeriod && <><span>/</span><span><span style={{color:C.text, fontWeight:700}}>{visitPeriod}</span>来店周期</span></>}
      </div>

      {/* Karte list */}
      <div style={{ padding:"0 0 16px" }}>
        <div style={{ padding:"16px 16px 8px", display:"flex", justifyContent:"center" }}>
          <button onClick={() => {
            const newVisit = { id: Date.now(), customerId: c.id, date: todayStr(), time: "10:00", menus: [], products: [], drugCost: 0, paymentMethod: "cash", total: 0, notes: "", images: [], customerType: "existing", paid: false, duration: 60 };
            if (addVisit) addVisit(newVisit).then(saved => setActiveKarte(saved || newVisit));
            else setActiveKarte(newVisit);
          }} style={{ border:"1.5px solid #ccc", borderRadius:10, padding:"10px 20px", background:"#fff", fontSize:14, fontWeight:700, color:C.text, cursor:"pointer", width:"100%" }}>＋ 新規カルテを作成する</button>
        </div>

        {cv.length === 0 ? (
          <div style={{ textAlign:"center", color:C.sub, padding:32, fontSize:14 }}>カルテなし</div>
        ) : cv.map((v, vi) => {
          const thumb = v.images && v.images[0];
          const dow = ["日","月","火","水","木","金","土"][new Date(v.date+"T00:00:00").getDay()];
          const dt = new Date(v.date+"T00:00:00");
          const dateLabel = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}(${dow}) ${v.time}〜`;

          return (
            <div key={v.id} style={{ padding:"0 0 12px" }}>
              {/* Date badge */}
              <div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}>
                <div style={{ background:"#333", color:"#fff", borderRadius:20, padding:"4px 16px", fontSize:12, fontWeight:700 }}>{dateLabel}</div>
              </div>

              {/* Card */}
              <div onClick={() => setActiveKarte(v)} style={{ background:"#fff", margin:"0 12px", borderRadius:12, overflow:"hidden", boxShadow:"0 1px 6px rgba(0,0,0,0.08)", cursor:"pointer" }}>
                <div style={{ display:"flex", minHeight:100 }}>
                  {/* Thumbnail */}
                  <div style={{ width:110, height:110, flexShrink:0, background:"#e8e8e8", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                    {thumb ? <img src={thumb.url} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : <span style={{ fontSize:28, opacity:0.3 }}>📷</span>}
                  </div>
                  {/* Info */}
                  <div style={{ flex:1, padding:"10px 12px", display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
                    <div>
                      {v.menus.map((m, i) => (
                        <div key={m.menuId} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:3 }}>
                          <div style={{ width:10, height:10, borderRadius:"50%", background:MENU_DOT_COLORS[i % MENU_DOT_COLORS.length], flexShrink:0 }} />
                          <span style={{ fontSize:13, color:C.text }}>{m.name}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{ textAlign:"right", fontSize:15, fontWeight:700, color:C.text }}>{v.total.toLocaleString()}円</div>
                  </div>
                </div>
                {/* Bottom action */}
                <div style={{ display:"flex", borderTop:`1px solid ${C.border}` }}>
                  <button style={{ flex:1, padding:"10px", border:"none", background:"transparent", color:C.sub, fontSize:13, fontWeight:700, cursor:"pointer", borderRight:`1px solid ${C.border}` }}>指名</button>
                  <button style={{ flex:1, padding:"10px", border:"none", background:"#00b4a6", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:4 }}>カルテを見る ›</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {/* ── Edit customer overlay ── */}
      {showEditForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 900, display: "flex", alignItems: "flex-end" }}>
          <div style={{ background: C.card, borderRadius: "20px 20px 0 0", padding: "20px 16px 36px", width: "100%", maxWidth: 480, margin: "0 auto", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 17 }}>顧客情報を編集</div>
              <button onClick={() => setShowEditForm(false)} style={{ background: "none", border: "none", fontSize: 22, color: C.sub, cursor: "pointer" }}>✕</button>
            </div>
            {[["name","氏名 *","text"],["kana","フリガナ","text"],["phone","電話番号","tel"],["birthday","生年月日","date"]].map(([k,l,t]) => (
              <div key={k} style={{ marginBottom: 12 }}>
                <label style={css.label}>{l}</label>
                <input type={t} value={editForm[k]} onChange={e => setEditForm(p => ({...p,[k]:e.target.value}))} style={css.input} />
              </div>
            ))}
            <div style={{ marginBottom: 12 }}>
              <label style={css.label}>性別</label>
              <div style={{ display: "flex", gap: 8 }}>
                {[["female","女性"],["male","男性"],["other","その他"]].map(([v,l]) => (
                  <button key={v} onClick={() => setEditForm(p => ({...p,gender:v}))} style={{ ...css.btn(GEN_COLOR[v], editForm.gender===v), flex:1, padding:"9px 4px", fontSize:13 }}>{l}</button>
                ))}
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={css.label}>備考・アレルギー等</label>
              <textarea value={editForm.notes} onChange={e => setEditForm(p => ({...p,notes:e.target.value}))} rows={2} style={{...css.input, resize:"vertical"}} />
            </div>
            <button onClick={saveEdit} style={{...css.btn("#00b4a6"), width:"100%", fontSize:15}}>保存する</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CheckoutPage({ visit: v, customer: c, menus: allMenus, products: allProducts, onBack, notify, onComplete }) {
  const [editMenus, setEditMenus] = useState(v.menus.map(m => ({ ...m })));
  const [editProds, setEditProds] = useState(v.products.map(p => ({ ...p })));
  const [showMenuPicker, setShowMenuPicker] = useState(false);
  const [showProdPicker, setShowProdPicker] = useState(false);
  const [draft, setDraft] = useState(false);
  const [paid, setPaid] = useState(v.paid || false);
  const [payCash, setPayCash] = useState(v.paymentMethod === "cash" ? v.total : 0);
  const [payCard, setPayCard] = useState(v.paymentMethod === "card" ? v.total : 0);
  const [payOther, setPayOther] = useState(v.paymentMethod === "qr" || v.paymentMethod === "point" ? v.total : 0);
  const [cashReceived, setCashReceived] = useState(0);
  const [showPointDiscount, setShowPointDiscount] = useState(false);
  const [hpbPoint, setHpbPoint] = useState(0);

  const menuTotal = editMenus.reduce((s, m) => s + (parseInt(m.price) || 0), 0);
  const prodTotal = editProds.reduce((s, p) => s + (parseInt(p.price) || 0) * (p.qty || 1), 0);
  const subTotal = menuTotal + prodTotal + (v.drugCost || 0);
  const pointDisc = parseInt(hpbPoint) || 0;
  const grand = Math.max(0, subTotal - pointDisc);
  const change = Math.max(0, (parseInt(cashReceived) || 0) - (parseInt(payCash) || 0));

  const dt = new Date(v.date + "T00:00:00");
  const mLabel = `${dt.getMonth()+1}月 ${dt.getDate()}日`;

  const removeMenu = (idx) => setEditMenus(p => p.filter((_, i) => i !== idx));
  const updateMenuPrice = (idx, val) => setEditMenus(p => p.map((m, i) => i === idx ? { ...m, price: parseInt(val) || 0 } : m));
  const addMenu = (m) => { setEditMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]); setShowMenuPicker(false); };
  const removeProd = (idx) => setEditProds(p => p.filter((_, i) => i !== idx));
  const addProd = (p2) => { setEditProds(p => [...p, { productId: p2.id, name: p2.name, price: p2.price, qty: 1 }]); setShowProdPicker(false); };

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* Nav */}
      <div style={{ background: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.border}` }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#00b4a6", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>✕</button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>お会計</div>
        <div style={{ width: 40 }} />
      </div>

      <div style={{ padding: 16 }}>
        {/* Title */}
        <div style={{ textAlign: "center", fontSize: 20, fontWeight: 800, marginBottom: 16 }}>
          {paid ? "お会計済み" : "お会計"}
        </div>

        {/* Receipt card */}
        <div style={{ background: "#fff", borderRadius: 12, padding: "16px", marginBottom: 12, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: C.sub, marginBottom: 6 }}>
            <span>{mLabel}</span><span>{c.name} 様</span>
          </div>
          <div style={{ fontSize: 12, color: C.sub, textAlign: "right", marginBottom: 8 }}>担当者：—</div>
          <Divider />
          <div style={{ textAlign: "center", fontSize: 12, fontWeight: 700, color: C.sub, letterSpacing: "0.15em", padding: "8px 0 6px" }}>MENU</div>

          {/* Editable menu rows */}
          {editMenus.map((m, idx) => (
            <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${C.border}` }}>
              <span style={{ flex: 1, fontSize: 14 }}>{m.name}</span>
              <input type="number" value={m.price} onChange={e => updateMenuPrice(idx, e.target.value)}
                style={{ width: 80, border: `1px solid ${C.border}`, borderRadius: 6, padding: "4px 8px", fontSize: 13, textAlign: "right" }} />
              <span style={{ fontSize: 12, color: C.sub }}>円</span>
              <button onClick={() => removeMenu(idx)} style={{ background: "none", border: "none", color: C.red, fontSize: 16, cursor: "pointer" }}>✕</button>
            </div>
          ))}

          {/* 店販 rows */}
          {editProds.map((p2, idx) => (
            <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${C.border}` }}>
              <span style={{ flex: 1, fontSize: 14, color: C.green }}>{p2.name}</span>
              <span style={{ fontSize: 13, color: C.sub }}>¥{(p2.price * p2.qty).toLocaleString()}</span>
              <button onClick={() => removeProd(idx)} style={{ background: "none", border: "none", color: C.red, fontSize: 16, cursor: "pointer" }}>✕</button>
            </div>
          ))}

          {/* Add menu / product links */}
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 16, marginTop: 10 }}>
            <button onClick={() => setShowMenuPicker(true)} style={{ background: "none", border: "none", color: "#00b4a6", fontSize: 14, cursor: "pointer" }}>＋ メニューを追加</button>
            <button onClick={() => setShowProdPicker(true)} style={{ background: "none", border: "none", color: "#00b4a6", fontSize: 14, cursor: "pointer" }}>＋ 店販を追加</button>
          </div>

          <Divider />
          {[["メニュー合計", menuTotal], ["店販合計", prodTotal], ["小計", subTotal]].map(([l, val]) => (
            <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 13, color: C.sub }}>
              <span>{l}</span><span>¥ {val.toLocaleString()}</span>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0 2px", fontWeight: 800, fontSize: 16, color: "#00b4a6", borderTop: `1px solid ${C.border}`, marginTop: 4 }}>
            <span>お支払い金額</span><span>¥ {grand.toLocaleString()}</span>
          </div>
        </div>

        {/* Point discount */}
        <div style={{ textAlign: "right", marginBottom: 12 }}>
          <button onClick={() => setShowPointDiscount(p => !p)} style={{ background: "none", border: "none", color: "#00b4a6", fontSize: 14, cursor: "pointer" }}>
            {showPointDiscount ? "－" : "＋"} ポイント割引
          </button>
        </div>
        {showPointDiscount && (
          <div style={{ background: "#fff", borderRadius: 12, padding: "12px 16px", marginBottom: 12, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 14, fontWeight: 600 }}>HPBポイント割引</span>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <input type="number" value={hpbPoint || ""} onChange={e => setHpbPoint(parseInt(e.target.value) || 0)} placeholder="0"
                  style={{ width: 90, border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 10px", fontSize: 14, textAlign: "right" }} />
                <span style={{ fontSize: 13, color: C.sub }}>円</span>
              </div>
            </div>
            {pointDisc > 0 && <div style={{ fontSize: 13, color: "#00b4a6", marginTop: 6, textAlign: "right" }}>－¥ {pointDisc.toLocaleString()}</div>}
            <Divider />
            <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0 0", fontWeight: 800, fontSize: 16, color: "#00b4a6" }}>
              <span>お支払い金額</span><span>¥ {grand.toLocaleString()}</span>
            </div>
          </div>
        )}

        {/* Payment method */}
        <div style={{ background: "#fff", borderRadius: 12, padding: "16px", marginBottom: 12, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
          <div style={{ textAlign: "center", fontWeight: 800, fontSize: 15, marginBottom: 12 }}>お支払い</div>
          <div style={{ display: "flex", border: "1px solid #00b4a6", borderRadius: 8, overflow: "hidden", marginBottom: 14 }}>
            {[["cash","現金"],["card","カード"],["other","その他"]].map(([k,l]) => {
              const active = (k==="cash"&&payCash>0)||(k==="card"&&payCard>0)||(k==="other"&&payOther>0);
              return (
                <button key={k} onClick={() => {
                  if (k==="cash") setPayCash(p => p>0?0:grand);
                  if (k==="card") setPayCard(p => p>0?0:grand);
                  if (k==="other") setPayOther(p => p>0?0:grand);
                }} style={{ flex:1, padding:"11px 4px", border:"none", background: active?"#00b4a6":"#fff", color: active?"#fff":"#00b4a6", fontWeight:700, fontSize:14, cursor:"pointer" }}>{l}</button>
              );
            })}
          </div>
          {payCash > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
              <span style={{ fontSize:14 }}>現金 のお支払い</span>
              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ color:C.sub }}>¥</span>
                <input type="number" value={payCash} onChange={e => setPayCash(parseInt(e.target.value)||0)} style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right" }} />
              </div>
            </div>
          )}
          {payCard > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
              <span style={{ fontSize:14 }}>カード のお支払い</span>
              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ color:C.sub }}>¥</span>
                <input type="number" value={payCard} onChange={e => setPayCard(parseInt(e.target.value)||0)} style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right" }} />
              </div>
            </div>
          )}
          {payOther > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
              <span style={{ fontSize:14 }}>その他 のお支払い</span>
              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <span style={{ color:C.sub }}>¥</span>
                <input type="number" value={payOther} onChange={e => setPayOther(parseInt(e.target.value)||0)} style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right" }} />
              </div>
            </div>
          )}
          {payCash > 0 && (<>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
            <span style={{ fontSize:14 }}>現金お預かり</span>
            <div style={{ display:"flex", alignItems:"center", gap:4 }}>
              <span style={{ color:C.sub }}>¥</span>
              <input type="number" value={cashReceived} onChange={e => setCashReceived(parseInt(e.target.value)||0)}
                style={{ width:90, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14, textAlign:"right" }} />
            </div>
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", padding:"10px 0 4px", fontSize:15, fontWeight:700 }}>
            <span>おつり</span><span style={{ color: change>0?C.green:C.text }}>¥ {change.toLocaleString()}</span>
          </div>
          </>)}
        </div>

        {/* Checkout button or complete */}
        {paid ? (
          <div style={{ background:"#fff", borderRadius:12, padding:"16px", boxShadow:"0 1px 4px rgba(0,0,0,0.06)", textAlign:"center" }}>
            <div style={{ color:"#00b4a6", fontWeight:700, fontSize:16, marginBottom:12, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
              <span>✓</span><span>お会計が完了しました</span>
            </div>
            {paid && <div style={{ fontSize:11, color:C.sub }}>会計をした日時：{v.date} {v.time}</div>}
            <div style={{ display:"flex", justifyContent:"flex-end", gap:16, marginTop:10 }}>
              <button style={{ background:"none", border:"none", color:C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>レシートを印刷する</button>
              <button onClick={() => { setPaid(false); if (onComplete) onComplete({ paid: false }); }} style={{ background:"none", border:"none", color:C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>お会計を削除する</button>
            </div>
          </div>
        ) : (
          <>
            <button onClick={() => { setPaid(true); notify("会計を完了しました ✓"); if (onComplete) onComplete({ paid: true }); }}
              style={{ width:"100%", padding:"18px", borderRadius:100, border:"none", background:"#ff6b6b", color:"#fff", fontWeight:800, fontSize:19, cursor:"pointer", boxShadow:"0 4px 16px rgba(255,107,107,0.4)" }}>お会計を完了する</button>
            <div style={{ textAlign:"right", marginTop:12 }}>
              <button onClick={() => { setDraft(true); notify("下書きを保存しました ✓"); }} style={{ background:"none", border:"none", color: draft ? "#00b4a6" : C.sub, fontSize:13, cursor:"pointer", textDecoration:"underline" }}>{draft ? "✓ 下書き保存済み" : "下書きを保存する"}</button>
            </div>
          </>
        )}
      </div>

      {/* Menu picker */}
      {showMenuPicker && (
        <MenuPickerSheet
          menus={allMenus}
          selectedIds={editMenus.map(m => m.menuId)}
          onToggle={(m) => {
            const has = editMenus.find(x => x.menuId === m.id);
            if (has) setEditMenus(p => p.filter(x => x.menuId !== m.id));
            else setEditMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]);
          }}
          onClose={() => setShowMenuPicker(false)}
          visits={[]}
        />
      )}
      {/* Product picker sheet */}
      {showProdPicker && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:900, display:"flex", alignItems:"flex-end" }}>
          <div style={{ background:C.card, borderRadius:"20px 20px 0 0", padding:"20px 16px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"70vh", overflowY:"auto" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>

const MENU_CATEGORY_COLORS = {
  "カット": "#00b4a6", "カラー": "#ff9500", "パーマ": "#af52de",
  "ストレート": "#ff2d55", "トリートメント": "#5ac8fa", "ヘッドスパ": "#34c759",
  "セット": "#007aff",
};
const MENU_CATEGORY_ICONS = {
  "カット": "✂️", "カラー": "🎨", "パーマ": "〰️",
  "ストレート": "📏", "トリートメント": "✨", "ヘッドスパ": "💆",
  "セット": "⭐",
};

function MenuPickerSheet({ menus, selectedIds, onToggle, onClose, visits }) {
  const [openCats, setOpenCats] = useState({});

  // "よく使う" = top 5 by frequency in visits
  const menuFreq = {};
  (visits || []).forEach(v => (v.menus || []).forEach(m => {
    menuFreq[m.menuId] = (menuFreq[m.menuId] || 0) + 1;
  }));
  const popular = [...menus]
    .sort((a, b) => (menuFreq[b.id] || 0) - (menuFreq[a.id] || 0))
    .slice(0, 5);

  const cats = {};
  menus.forEach(m => {
    if (!cats[m.category]) cats[m.category] = [];
    cats[m.category].push(m);
  });

  const toggleCat = (cat) => setOpenCats(p => ({ ...p, [cat]: !p[cat] }));

  const MenuRow = ({ m }) => {
    const sel = (selectedIds || []).includes(m.id);
    return (
      <div onClick={() => onToggle(m)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 16px", borderBottom: `1px solid ${C.border}`, cursor: "pointer", background: sel ? "#f0fffe" : "#fff" }}>
        <span style={{ fontSize: 15, color: sel ? "#00b4a6" : C.text, fontWeight: sel ? 700 : 400 }}>{m.name}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {m.price > 0 && <span style={{ fontSize: 13, color: C.sub }}>{m.price.toLocaleString()} 円</span>}
          {sel && <span style={{ color: "#00b4a6", fontWeight: 800, fontSize: 16 }}>✓</span>}
        </div>
      </div>
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 950, display: "flex", alignItems: "flex-end" }}>
      <div style={{ background: C.bg, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 480, margin: "0 auto", maxHeight: "85vh", display: "flex", flexDirection: "column" }}>
        <div style={{ background: "#fff", overflowY: "auto", flex: 1 }}>
          {/* よく使うメニュー */}
          {popular.length > 0 && (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#f0f0f0", borderBottom: `1px solid ${C.border}` }}>
                <div style={{ width: 36, height: 36, borderRadius: 8, background: "#555", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🕐</div>
                <span style={{ fontWeight: 700, fontSize: 15 }}>よく使うメニュー</span>
              </div>
              {popular.map(m => <MenuRow key={"pop_" + m.id} m={m} />)}
            </>
          )}

          {/* Category dropdowns */}
          {Object.entries(cats).map(([cat, items]) => {
            const color = MENU_CATEGORY_COLORS[cat] || "#00b4a6";
            const icon = MENU_CATEGORY_ICONS[cat] || "📋";
            const isOpen = openCats[cat] !== false;
            return (
              <div key={cat}>
                <div onClick={() => toggleCat(cat)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#fff", borderBottom: `1px solid ${C.border}`, cursor: "pointer" }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{icon}</div>
                  <span style={{ fontWeight: 700, fontSize: 15, flex: 1 }}>{cat}</span>
                  <span style={{ color: C.sub, fontSize: 14 }}>{isOpen ? "▲" : "▼"}</span>
                </div>
                {isOpen && items.map(m => <MenuRow key={m.id} m={m} />)}
              </div>
            );
          })}
        </div>

        {/* Complete button */}
        <div style={{ padding: "12px 16px 28px", background: "#fff", borderTop: `1px solid ${C.border}` }}>
          <button onClick={onClose} style={{ width: "100%", padding: "16px", borderRadius: 12, border: "none", background: "#00b4a6", color: "#fff", fontWeight: 800, fontSize: 17, cursor: "pointer" }}>メニュー選択を完了する</button>
        </div>
      </div>
    </div>
  );
}

function PastVisitsPanel({ visits: pv }) {
  const [open, setOpen] = useState(false);
  const PREVIEW = 3;
  const shown = open ? pv : pv.slice(0, PREVIEW);
  return (
    <div style={{ ...css.card, background: "#f0f7ff", border: `1px solid ${C.accent}33`, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.accent }}>📋 過去の施術履歴（全{pv.length}回）</span>
        {pv.length > PREVIEW && (
          <button onClick={() => setOpen(o => !o)} style={{ background: "none", border: `1px solid ${C.accent}`, borderRadius: 20, padding: "2px 10px", fontSize: 11, color: C.accent, fontWeight: 700, cursor: "pointer" }}>
            {open ? "閉じる ▲" : `全て見る ▼`}
          </button>
        )}
      </div>
      <div style={{ maxHeight: open ? 320 : "none", overflowY: open ? "auto" : "visible" }}>
        {shown.map((v, i) => (
          <div key={v.id} style={{ padding: "7px 0", borderBottom: i < shown.length - 1 ? `1px solid ${C.border}` : "none" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{v.date} {v.time}</div>
                <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>{v.menus.map(m => m.name).join("・")}</div>
                {v.notes ? <div style={{ fontSize: 11, color: C.sub, marginTop: 1 }}>📝 {v.notes}</div> : null}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.accent, flexShrink: 0, marginLeft: 8 }}>{yen(v.total)}</div>
            </div>
          </div>
        ))}
      </div>
      {!open && pv.length > PREVIEW && (
        <div style={{ fontSize: 11, color: C.sub, textAlign: "center", marginTop: 6 }}>
          他 {pv.length - PREVIEW}件…
        </div>
      )}
    </div>
  );
}


function AnalyticsTab({ visits, customers, menus, products, appointments }) {
  const [period, setPeriod] = useState("month");
  const [subTab, setSubTab] = useState("sales");

  const now = new Date();
  const fv = visits.filter(v => {
    const d = new Date(v.date);
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "3m") { const cut = new Date(now); cut.setMonth(cut.getMonth() - 3); return d >= cut; }
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  });

  const totalRev = fv.reduce((s, v) => s + v.total, 0);
  const shopRev = fv.reduce((s, v) => s + v.products.reduce((ss, p) => ss + p.price * p.qty, 0), 0);
  const techRev = totalRev - shopRev - fv.reduce((s, v) => s + (v.drugCost || 0), 0);
  const avg = fv.length ? Math.round(totalRev / fv.length) : 0;

  const menuCnt = {};
  fv.forEach(v => v.menus.forEach(m => { menuCnt[m.name] = (menuCnt[m.name] || 0) + 1; }));
  const totalMenuCnt = Object.values(menuCnt).reduce((s, n) => s + n, 0);

  const prodCnt = {};
  fv.forEach(v => v.products.forEach(p => { prodCnt[p.name] = (prodCnt[p.name] || 0) + p.qty; }));

  const visitMap = {};
  visits.forEach(v => { visitMap[v.customerId] = (visitMap[v.customerId] || 0) + 1; });
  const returnCount = Object.values(visitMap).filter(n => n > 1).length;
  const returnRate = customers.length > 0 ? pct(returnCount, customers.length) : 0;

  // New vs existing from appointments customerType field (period-filtered)
  const allAppts = appointments || [];
  const periodAppts = allAppts.filter(a => {
    const d = new Date(a.date);
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "3m") { const cut = new Date(now); cut.setMonth(cut.getMonth()-3); return d >= cut; }
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  });
  // Also count from visits (来店記録) in addition to appointments
  const periodVisits2 = visits.filter(v => {
    const d = new Date(v.date);
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "3m") { const cut = new Date(now); cut.setMonth(cut.getMonth()-3); return d >= cut; }
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  });
  const allPeriodRecords = [...periodAppts, ...periodVisits2];
  const newVisitors = allPeriodRecords.filter(a => a.customerType === "new").length;
  const existingVisitors = allPeriodRecords.filter(a => a.customerType === "existing").length;
  const totalPeriodAppts = newVisitors + existingVisitors;
  const newRate = totalPeriodAppts > 0 ? pct(newVisitors, totalPeriodAppts) : 0;
  const existingRate = totalPeriodAppts > 0 ? pct(existingVisitors, totalPeriodAppts) : 0;

  const monthlyNewEx = [];
  for (let i = 5; i >= 0; i--) {
    const d3 = new Date(now); d3.setMonth(d3.getMonth() - i);
    const mStr3 = d3.toISOString().slice(0, 7);
    const mAppts = allAppts.filter(a => a.date.startsWith(mStr3));
    monthlyNewEx.push({
      label: (d3.getMonth()+1) + "月",
      newV: mAppts.filter(a => a.customerType === "new").length,
      existV: mAppts.filter(a => a.customerType !== "new").length,
    });
  }

  const payBrk = { cash: 0, card: 0, qr: 0, point: 0 };
  fv.forEach(v => { payBrk[v.paymentMethod] = (payBrk[v.paymentMethod] || 0) + v.total; });

  // HPB point discount total (from hpbPoint field on visits)
  const hpbTotal = fv.reduce((s, v) => s + (v.hpbPoint || 0), 0);
  const monthlyHpb = [];
  for (let i = 5; i >= 0; i--) {
    const d2 = new Date(now); d2.setMonth(d2.getMonth() - i);
    const mStr2 = d2.toISOString().slice(0, 7);
    const mv2 = visits.filter(v => v.date.startsWith(mStr2));
    monthlyHpb.push({ label: (d2.getMonth() + 1) + "月", hpb: mv2.reduce((s, v) => s + (v.hpbPoint || 0), 0) });
  }

  const genBrk = { female: 0, male: 0, other: 0 };
  fv.forEach(v => { const c = customers.find(x => x.id === v.customerId); if (c) genBrk[c.gender] = (genBrk[c.gender] || 0) + 1; });

  // Monthly trend (last 6 months)
  const monthlyData = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now); d.setMonth(d.getMonth() - i);
    const mStr = d.toISOString().slice(0, 7);
    const mv = visits.filter(v => v.date.startsWith(mStr));
    monthlyData.push({ label: (d.getMonth() + 1) + "月", rev: mv.reduce((s, v) => s + v.total, 0), count: mv.length });
  }
  const maxRev = Math.max(...monthlyData.map(m => m.rev), 1);

  const HBar = ({ label, value, max, color, suffix = "" }) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
        <span style={{ color: C.text }}>{label}</span>
        <span style={{ fontWeight: 700, color }}>{value}{suffix}</span>
      </div>
      <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
        <div style={{ height: 6, borderRadius: 3, background: color, width: `${Math.min(pct(value, max), 100)}%`, transition: "width 0.5s" }} />
      </div>
    </div>
  );

  const SUBTABS = [["sales", "売上"], ["menu", "メニュー"], ["customer", "顧客"], ["product", "店販"]];

  return (
    <div style={{ padding: "12px 16px" }}>
      {/* Period selector */}
      <div style={{ display: "flex", background: C.border + "88", borderRadius: 10, padding: 3, marginBottom: 16 }}>
        {[["month", "今月"], ["3m", "3ヶ月"], ["year", "今年"], ["all", "全期間"]].map(([k, l]) => (
          <button key={k} onClick={() => setPeriod(k)} style={{ flex: 1, padding: "7px 4px", borderRadius: 8, border: "none", background: period === k ? C.card : "transparent", color: period === k ? C.accent : C.sub, fontWeight: 700, fontSize: 12, cursor: "pointer", boxShadow: period === k ? "0 1px 3px rgba(0,0,0,0.12)" : "none" }}>{l}</button>
        ))}
      </div>

      {/* KPI strip */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
        {[["総売上", yen(totalRev), C.accent], ["来店件数", fv.length + "件", C.green], ["再来率", returnRate + "%", C.purple], ["HPB利用", yen(hpbTotal), "#ff6b35"]].map(([l, v, c]) => (
          <div key={l} style={{ ...css.card, marginBottom: 0, textAlign: "center", padding: "14px 8px" }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: c }}>{v}</div>
            <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>{l}</div>
          </div>
        ))}
      </div>

      {/* Sub-tab nav */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
        {SUBTABS.map(([k, l]) => (
          <button key={k} onClick={() => setSubTab(k)} style={{ padding: "7px 16px", borderRadius: 20, border: "none", background: subTab === k ? C.accent : C.border + "88", color: subTab === k ? "#fff" : C.sub, fontWeight: 700, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>{l}</button>
        ))}
      </div>

      {/* Sales sub-tab */}
      {subTab === "sales" && (
        <>
          {/* Monthly trend chart */}
          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 14 }}>月別売上推移（6ヶ月）</div>
            <div style={{ display: "flex", gap: 6, alignItems: "flex-end", height: 100 }}>
              {monthlyData.map((m, i) => (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <div style={{ fontSize: 10, color: C.sub }}>{m.rev > 0 ? Math.round(m.rev / 1000) + "k" : ""}</div>
                  <div style={{ width: "100%", background: C.accent, borderRadius: "4px 4px 0 0", height: Math.max(4, (m.rev / maxRev) * 80), transition: "height 0.5s" }} />
                  <div style={{ fontSize: 10, color: C.sub }}>{m.label}</div>
                </div>
              ))}
            </div>
          </div>

          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>売上内訳</div>
            <HBar label="技術売上" value={techRev} max={totalRev} color={C.accent} suffix="円" />
            <HBar label="店販売上" value={shopRev} max={totalRev} color={C.green} suffix="円" />
            <Divider />
            <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 14 }}>
              <span style={{ color: C.sub }}>客単価</span><span style={{ fontWeight: 700 }}>{yen(avg)}</span>
            </div>
          </div>

          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>支払方法別</div>
            {Object.entries(payBrk).filter(([, v]) => v > 0).map(([k, v]) => (
              <HBar key={k} label={PAY[k]} value={v} max={totalRev} color={PAY_COLOR[k]} suffix="円" />
            ))}
          </div>

          {/* HPB Point usage card */}
          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span>HPBポイント割引利用額</span>
              <span style={{ fontSize: 20, fontWeight: 800, color: "#ff6b35" }}>{yen(hpbTotal)}</span>
            </div>
            <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 72 }}>
              {monthlyHpb.map((m, i) => {
                const maxH = Math.max(...monthlyHpb.map(x => x.hpb), 1);
                return (
                  <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                    <div style={{ fontSize: 9, color: C.sub }}>{m.hpb > 0 ? Math.round(m.hpb/100)*100 === m.hpb ? (m.hpb/1000).toFixed(1)+"k" : m.hpb : ""}</div>
                    <div style={{ width: "100%", background: m.hpb > 0 ? "#ff6b35" : "#f0f0f0", borderRadius: "3px 3px 0 0", height: Math.max(4, (m.hpb / maxH) * 56), transition: "height 0.5s" }} />
                    <div style={{ fontSize: 9, color: C.sub }}>{m.label}</div>
                  </div>
                );
              })}
            </div>
            {hpbTotal === 0 && <div style={{ fontSize: 13, color: C.sub, textAlign: "center", marginTop: 8 }}>この期間のポイント利用なし</div>}
          </div>
        </>
      )}

      {/* Menu sub-tab */}
      {subTab === "menu" && (
        <>
          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>メニュー比率・販売数</div>
            {Object.entries(menuCnt).length === 0 ? <div style={{ color: C.sub, fontSize: 14 }}>データなし</div>
              : Object.entries(menuCnt).sort((a, b) => b[1] - a[1]).map(([name, cnt]) => (
                <div key={name} style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
                    <span>{name}</span>
                    <span style={{ fontWeight: 700, color: C.accent }}>{cnt}回 <span style={{ color: C.sub, fontWeight: 400 }}>({pct(cnt, totalMenuCnt)}%)</span></span>
                  </div>
                  <div style={{ height: 8, background: C.border, borderRadius: 4 }}>
                    <div style={{ height: 8, borderRadius: 4, background: `hsl(${(Object.keys(menuCnt).indexOf(name) * 50)},70%,55%)`, width: `${pct(cnt, Math.max(...Object.values(menuCnt)))}%` }} />
                  </div>
                </div>
              ))}
          </div>

          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>性別比率</div>
            <div style={{ display: "flex", gap: 10 }}>
              {[["female", "女性", "👩"], ["male", "男性", "👨"], ["other", "その他", "🧑"]].map(([k, l, emoji]) => (
                <div key={k} style={{ flex: 1, textAlign: "center", padding: "12px 6px", background: GEN_COLOR[k] + "11", borderRadius: 10 }}>
                  <div style={{ fontSize: 20 }}>{emoji}</div>
                  <div style={{ fontWeight: 800, fontSize: 20, color: GEN_COLOR[k] }}>{genBrk[k]}</div>
                  <div style={{ fontSize: 11, color: C.sub }}>{l}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {/* Customer sub-tab */}
      {subTab === "customer" && (
        <>
          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客分析</div>
            {[
              ["登録顧客数", customers.length + "名"],
              ["リピート顧客", returnCount + "名"],
              ["再来率（全期間）", returnRate + "%"],
              ["新規顧客（全期間）", (customers.length - returnCount) + "名"],
            ].map(([l, v]) => (
              <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                <span style={{ color: C.sub }}>{l}</span><span style={{ fontWeight: 700 }}>{v}</span>
              </div>
            ))}
            {/* Tag analysis */}
            {(() => {
              const tagCounts = {};
              const totalVisitors = new Set();
              fv.forEach(v => {
                totalVisitors.add(v.customerId);
                v.menus.forEach(vm => {
                  const menuDef = menus.find(m => m.id === vm.menuId);
                  const tags = menuDef?.tags || [];
                  tags.forEach(tag => {
                    if (!tagCounts[tag]) tagCounts[tag] = new Set();
                    tagCounts[tag].add(v.customerId);
                  });
                });
              });
              const totalUniq = totalVisitors.size || 1;
              const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1].size - a[1].size);
              // Set menus (category === "セット")
              const setMenuCnt = fv.reduce((s,v) => s + v.menus.filter(vm => {
                const md = menus.find(m => m.id === vm.menuId);
                return md?.category === "セット";
              }).length, 0);
              return sortedTags.length > 0 ? (
                <div style={{ marginTop:16 }}>
                  <div style={{ fontWeight:700,fontSize:14,marginBottom:10 }}>タグ別 客数・比率</div>
                  {sortedTags.map(([tag, custSet]) => (
                    <div key={tag} style={{ marginBottom:10 }}>
                      <div style={{ display:"flex",justifyContent:"space-between",marginBottom:3,fontSize:13 }}>
                        <span style={{ fontWeight:600 }}>{tag}</span>
                        <span style={{ color:"#00b4a6",fontWeight:700 }}>{custSet.size}人 <span style={{ color:C.sub,fontWeight:400 }}>({pct(custSet.size,totalUniq)}%)</span></span>
                      </div>
                      <div style={{ height:6,background:C.border,borderRadius:3 }}>
                        <div style={{ height:6,borderRadius:3,background:"#00b4a6",width:`${pct(custSet.size,totalUniq)}%`,transition:"width 0.5s" }} />
                      </div>
                    </div>
                  ))}
                  {setMenuCnt > 0 && (
                    <div style={{ marginTop:12,padding:"10px 14px",background:"#f0fffe",borderRadius:10,border:"1px solid #00b4a644" }}>
                      <div style={{ fontSize:13,color:"#00b4a6",fontWeight:700 }}>⭐ セットメニュー件数：{setMenuCnt}件</div>
                    </div>
                  )}
                </div>
              ) : null;
            })()}

            {/* New vs Existing breakdown */}
            <div style={{ marginTop: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>新規・再来内訳（{period === "month" ? "今月" : period === "3m" ? "3ヶ月" : period === "year" ? "今年" : "全期間"}）</div>
              {totalPeriodAppts === 0 ? (
                <div style={{ fontSize: 13, color: C.sub }}>予約データなし</div>
              ) : (
                <>
                  <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                    <div style={{ flex: 1, textAlign: "center", padding: "12px 8px", background: "#fff3e0", borderRadius: 10 }}>
                      <div style={{ fontSize: 22, fontWeight: 800, color: C.orange }}>{newVisitors}人</div>
                      <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>新規</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.orange }}>{newRate}%</div>
                    </div>
                    <div style={{ flex: 1, textAlign: "center", padding: "12px 8px", background: "#e8faf9", borderRadius: 10 }}>
                      <div style={{ fontSize: 22, fontWeight: 800, color: "#00b4a6" }}>{existingVisitors}人</div>
                      <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>再来</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#00b4a6" }}>{existingRate}%</div>
                    </div>
                  </div>
                  {/* Ratio bar */}
                  <div style={{ height: 10, borderRadius: 5, overflow: "hidden", display: "flex", marginBottom: 12 }}>
                    <div style={{ background: C.orange, width: `${newRate}%`, transition: "width 0.5s" }} />
                    <div style={{ background: "#00b4a6", flex: 1 }} />
                  </div>
                  {/* Monthly bar chart */}
                  <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>月別 新規（オレンジ）・再来（ティール）推移</div>
                  <div style={{ display: "flex", gap: 4, alignItems: "flex-end", height: 60 }}>
                    {monthlyNewEx.map((m, i) => {
                      const maxV = Math.max(...monthlyNewEx.map(x => x.newV + x.existV), 1);
                      return (
                        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                          <div style={{ width: "100%", display: "flex", flexDirection: "column", justifyContent: "flex-end", height: 48, gap: 1 }}>
                            <div style={{ width: "100%", background: C.orange, borderRadius: "2px 2px 0 0", height: Math.max(2, (m.newV / maxV) * 24) }} />
                            <div style={{ width: "100%", background: "#00b4a6", height: Math.max(2, (m.existV / maxV) * 24) }} />
                          </div>
                          <div style={{ fontSize: 9, color: C.sub }}>{m.label}</div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Top customers */}
          <div style={css.card}>
            <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客別売上 TOP</div>
            {customers.map(c => {
              const cv = visits.filter(v => v.customerId === c.id);
              return { name: c.name, total: cv.reduce((s, v) => s + v.total, 0), count: cv.length };
            }).sort((a, b) => b.total - a.total).slice(0, 5).map((c, i) => (
              <div key={c.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 22, height: 22, borderRadius: "50%", background: [C.orange, C.sub, "#b87333"][Math.min(i, 2)] + "22", color: [C.orange, C.sub, "#b87333"][Math.min(i, 2)], display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800 }}>{i + 1}</span>
                  <span>{c.name}</span>
                </div>
                <div style={{ textAlign: "right" }}>

              <span style={{ color: C.sub }}>店販売上</span><span style={{ fontWeight: 700, color: C.green }}>{yen(shopRev)}</span>
            </div>

  );
}

const APPT_COLORS = ["#00b4a6", "#ff4d88", "#ff9500", "#007aff", "#af52de", "#34c759"];
const DAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
const HOUR_START = 6;
const HOUR_END = 23;
const CELL_H = 60;

// Get business open/close hours for a date
function getBizForDate(date, bizHours, closedDaysOfWeek, personalHolidays) {
  if (!bizHours) return { open: "06:00", close: "23:00", isHoliday: false };
  const d = new Date(date + "T00:00:00");
  const dayIdx = d.getDay(); // 0=Sun
  const dayKeys = ["sun","mon","tue","wed","thu","fri","sat"];
  const dayJp = ["日","月","火","水","木","金","土"];
  const key = dayKeys[dayIdx];
  const jp = dayJp[dayIdx];
  const isPersonalHoliday = (personalHolidays||[]).includes(date);
  const isClosedDay = (closedDaysOfWeek||[]).includes(jp);
  const dayHours = bizHours[key] || { open:"06:00", close:"23:00", closed:false };
  const isHoliday = isPersonalHoliday || isClosedDay || dayHours.closed;
  return { open: dayHours.open, close: dayHours.close, isHoliday };
}

function getDefaultBizOpen(bizHours) {
  if (!bizHours) return "10:00";
  const opens = Object.values(bizHours).filter(h => !h.closed).map(h => h.open);
  return opens.sort()[0] || "10:00";
}

function getWeekStart(offset = 0) {
  const d = new Date();
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function AppointmentsTab({ appointments, setAppointments, customers, setCustomers, visits, products, menus, notify, setTab, bizHours, closedDaysOfWeek, personalHolidays, updateAppointment, deleteAppointment, addAppointment, addCustomer }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [viewMode, setViewMode] = useState("week");
  const [dayOffset, setDayOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);
  const [showAdd, setShowAdd] = useState(false);
  const [showEdit, setShowEdit] = useState(null);
  const [showEditMenuPicker, setShowEditMenuPicker] = useState(false);
  const [tapMenu, setTapMenu] = useState(null);
  const [dragging, setDragging] = useState(null);
  const [showKarteAppt, setShowKarteAppt] = useState(null); // appt to show karte for
  const [showCheckoutAppt, setShowCheckoutAppt] = useState(null); // appt to checkout

  const [dragPos, setDragPos] = useState(null);     // { top, dayIdx } current drag position
  const [form, setForm] = useState({ customerId: "", date: todayStr(), time: "10:00", endTime: "11:00", duration: 60, menuIds: [], notes: "", paid: false, shimeika: "shimeika" });
  const [showCustomerPicker, setShowCustomerPicker] = useState(false);
  const [custSearch, setCustSearch] = useState("");
  const [showFormMenuPicker, setShowFormMenuPicker] = useState(false);

  const gridRef = useRef(null);   // week view grid
  const dayRef = useRef(null);    // day view grid

  // Scroll to business open time on mount and view change
  useEffect(() => {
    const biz = bizHours || {};
    const dayKeys = ["sun","mon","tue","wed","thu","fri","sat"];
    const todayKey = dayKeys[new Date().getDay()];
    const todayHours = biz[todayKey] || { open:"10:00" };
    const openH = parseInt((todayHours.open||"10:00").split(":")[0]);
    const scrollPx = Math.max(0, (openH - dynHourStart - 1) * dynCellH);
    setTimeout(() => {
      if (gridRef.current) gridRef.current.scrollTop = scrollPx;
      if (dayRef.current) dayRef.current.scrollTop = scrollPx;
    }, 100);
  }, [viewMode, bizHours]);

  const calcDuration = (menuIds) => {
    const total = menuIds.reduce((s, id) => {
      const m = menus.find(x => x.id === id);
      return s + (m?.duration || 60);
    }, 0);
    return Math.max(total, 30);
  };
  const calcEndTime = (startTime, dur) => {
    const [h, m] = startTime.split(":").map(Number);
    const totalMin = h * 60 + m + dur;
    return `${String(Math.floor(totalMin/60)).padStart(2,"0")}:${String(totalMin%60).padStart(2,"0")}`;
  };

  const currentDay = (() => {
    const d = new Date(); d.setDate(d.getDate() + dayOffset);
    return d.toISOString().split("T")[0];
  })();
  const monthDate = (() => { const d = new Date(); d.setMonth(d.getMonth() + monthOffset); return d; })();
  const monthStr = monthDate.toISOString().slice(0,7);
  const monthAppts = appointments.filter(a => a.date.startsWith(monthStr));

  const weekStart = getWeekStart(weekOffset);
  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    return d.toISOString().split("T")[0];
  });

  const weekLabel = (() => {
    const s = weekDays[0], e = weekDays[6];
    const sd = new Date(s + "T00:00:00"), ed = new Date(e + "T00:00:00");
    return `${sd.getFullYear()}年${String(sd.getMonth()+1).padStart(2,"0")}月${String(sd.getDate()).padStart(2,"0")}日〜${String(ed.getDate()).padStart(2,"0")}日`;
  })();

  const timeToPx = (timeStr) => {
    const [h, m] = timeStr.split(":").map(Number);
    return (h - HOUR_START + m / 60) * CELL_H;
  };
  const pxToTime = (px) => {
    const totalMin = Math.round(((px / CELL_H) + HOUR_START) * 60 / 15) * 15;
    const h = Math.min(Math.max(Math.floor(totalMin / 60), HOUR_START), HOUR_END - 1);
    const m = totalMin % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  };

  const openTapMenu = (e, appt) => {
    e.stopPropagation();
    setTapMenu({ appt });
  };
  const closeTapMenu = () => setTapMenu(null);

  const handlePaid = (appt) => {
    const newPaid = !appt.paid;
    setAppointments(p => p.map(a => a.id === appt.id ? { ...a, paid: newPaid } : a));
    if (updateAppointment) updateAppointment(appt.id, { paid: newPaid });
    notify(appt.paid ? "会計を取り消しました" : "会計済にしました ✓");
    closeTapMenu();
  };
  const handleDelete = (id) => {
    if (deleteAppointment) deleteAppointment(id);
    else setAppointments(p => p.filter(a => a.id !== id));
    notify("予約を削除しました");
    closeTapMenu();
  };
  const handleEditOpen = (appt) => {
    setShowEdit({ ...appt, menuIds: appt.menuIds || [] });
    closeTapMenu();
  };
  const handleEditSave = () => {
    if (updateAppointment) updateAppointment(showEdit.id, showEdit);
    else setAppointments(p => p.map(a => a.id === showEdit.id ? { ...showEdit } : a));
    setShowEdit(null);
    notify("予約を更新しました ✓");
  };

  const longPressTimer = useRef(null);
  const isDragging = useRef(false);
  const cellLongPressTimer = useRef(null);

  const onCellPointerDown = (e, date, hour) => {
    cellLongPressTimer.current = setTimeout(() => {
      const timeStr = `${String(hour).padStart(2,"0")}:00`;
      const endStr = calcEndTime(timeStr, 60);
      setForm(p => ({ ...p, date, time: timeStr, endTime: endStr, duration: 60, menuIds: [], customerId: "", shimeika: "shimeika" }));
      setShowAdd(true);
    }, 500);
  };
  const onCellPointerUp = () => { clearTimeout(cellLongPressTimer.current); };
  const onCellPointerCancel = () => { clearTimeout(cellLongPressTimer.current); };

  const onPointerDown = (e, appt) => {
    e.stopPropagation();
    isDragging.current = false;
    longPressTimer.current = setTimeout(() => {
      isDragging.current = true;
      const dayIdx = viewMode === "week" ? weekDays.indexOf(appt.date) : 0;
      setDragging({ appt, pointerId: e.pointerId, mode: viewMode });
      setDragPos({ top: timeToPx2(appt.time), dayIdx, date: appt.date });
      try { e.target.setPointerCapture(e.pointerId); } catch(_) {}
    }, 420);
  };

  const onPointerMove = (e) => {
    if (!dragging) return;
    const ref = dragging.mode === "week" ? gridRef.current : dayRef.current;
    if (!ref) return;
    e.preventDefault();
    const gridRect = ref.getBoundingClientRect();
    const rawTop = e.clientY - gridRect.top;
    const newTop = Math.max(0, Math.min(rawTop, (dynHourEnd - dynHourStart) * dynCellH - 4));
    if (dragging.mode === "week") {
      const timeColW = 36;
      const colW = (gridRect.width - timeColW) / 7;
      const rawLeft = e.clientX - gridRect.left - timeColW;
      const newDayIdx = Math.min(Math.max(Math.floor(rawLeft / colW), 0), 6);
      setDragPos(p => ({ ...p, top: newTop, dayIdx: newDayIdx }));
    } else {
      // day view: only vertical movement
      setDragPos(p => ({ ...p, top: newTop }));
    }
  };

  const onPointerUp = (e) => {
    clearTimeout(longPressTimer.current);
    if (dragging && dragPos) {
      const newTime = pxToTime2(dragPos.top);
      const newDate = dragging.mode === "week" ? weekDays[dragPos.dayIdx] : currentDay;
      setAppointments(p => p.map(a =>
        a.id === dragging.appt.id ? { ...a, time: newTime, date: newDate } : a
      ));
      notify(`${newDate} ${newTime} に移動しました`);
    }
    setDragging(null);
    setDragPos(null);
    isDragging.current = false;
  };

  const onPointerCancel = () => {
    clearTimeout(longPressTimer.current);
    setDragging(null);
    setDragPos(null);
    isDragging.current = false;
  };

  const addAppt = async () => {
    if (!form.customerId || !form.date || !form.time) return notify("必須項目を入力してください", "error");
    const custIdx = customers.findIndex(c => c.id === parseInt(form.customerId));
    const color = APPT_COLORS[custIdx % APPT_COLORS.length];
    const newAppt = { ...form, customerId: parseInt(form.customerId), menuIds: form.menuIds.map(Number), color, duration: parseInt(form.duration) || 60, customerType: form.customerType || "existing" };
    if (addAppointment) await addAppointment(newAppt);
    else setAppointments(p => [...p, { ...newAppt, id: Date.now() }]);
    setShowAdd(false);
    setForm({ customerId: "", date: todayStr(), time: "10:00", endTime: "11:00", duration: 60, menuIds: [], notes: "", paid: false, shimeika: "shimeika" });
    setCustSearch("");
    notify("予約を追加しました ✓");
  };

  // Show full day but highlight business hours
  const dynHourStart = HOUR_START;
  const dynHourEnd = HOUR_END;
  // Cell height: fit all hours in ~85vh (approx 650px on mobile)
  const totalHours = dynHourEnd - dynHourStart;
  const dynCellH = CELL_H;
  const hours = Array.from({ length: totalHours }, (_, i) => dynHourStart + i);

  const timeToPx2 = (timeStr) => {
    const [h, m] = timeStr.split(":").map(Number);
    return (h - dynHourStart + m / 60) * dynCellH;
  };
  const pxToTime2 = (px) => {
    const totalMin = Math.round(((px / dynCellH) + dynHourStart) * 60 / 15) * 15;
    const h = Math.min(Math.max(Math.floor(totalMin / 60), dynHourStart), dynHourEnd - 1);
    const m = totalMin % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  };

  const apptsByDate = (date) => appointments.filter(a => a.date === date);

  const barAppts = viewMode === "day"
    ? apptsByDate(currentDay)
    : viewMode === "week"
      ? weekDays.flatMap(d => apptsByDate(d))
      : monthAppts;
  const barRevenue = barAppts.reduce((s, a) => {
    const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
    return s + am.reduce((ss, m) => ss + (m.price||0), 0);
  }, 0);
  const barLabel = viewMode === "day"
    ? `今日の売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`
    : viewMode === "week"
      ? `今週の売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`
      : `${monthDate.getMonth()+1}/1 〜 ${monthDate.getMonth()+1}/${new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0).getDate()}　売上予定：${yen(barRevenue)}　人数：${barAppts.length}人`;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "calc(100vh - 120px)" }}
      onClick={() => tapMenu && closeTapMenu()}>

      {/* Teal header */}
      <div style={{ background: "#00b4a6", padding: "8px 14px 10px", flexShrink: 0 }}>
        {/* View mode tabs + nav */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          {/* Left nav */}
          <button onClick={() => {
            if (viewMode === "day") setDayOffset(o => o - 1);
            else if (viewMode === "week") setWeekOffset(w => w - 1);
            else setMonthOffset(o => o - 1);
          }} style={{ background: "rgba(255,255,255,0.25)", border: "none", color: "#fff", borderRadius: 8, padding: "5px 10px", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>
            {viewMode === "day" ? "＜昨日" : viewMode === "week" ? "＜先週" : "＜"}
          </button>

          {/* Center label */}
          <div style={{ color: "#fff", fontWeight: 700, fontSize: 13, textAlign: "center" }}>
            {viewMode === "day" && (() => {
              const dt = new Date(currentDay + "T00:00:00");
              return `${dt.getFullYear()}年${String(dt.getMonth()+1).padStart(2,"0")}月${String(dt.getDate()).padStart(2,"0")}日（${DAY_LABELS[dt.getDay()]}）`;
            })()}
            {viewMode === "week" && weekLabel}
            {viewMode === "month" && `${monthDate.getFullYear()}年${monthDate.getMonth()+1}月`}
          </div>

          {/* Right nav */}
          <button onClick={() => {
            if (viewMode === "day") setDayOffset(o => o + 1);
            else if (viewMode === "week") setWeekOffset(w => w + 1);
            else setMonthOffset(o => o + 1);
          }} style={{ background: "rgba(255,255,255,0.25)", border: "none", color: "#fff", borderRadius: 8, padding: "5px 10px", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>
            {viewMode === "day" ? "明日＞" : viewMode === "week" ? "来週＞" : "＞"}
          </button>
        </div>

        {/* Day / 週 / 月 switcher */}
        <div style={{ display: "flex", background: "rgba(255,255,255,0.15)", borderRadius: 8, padding: 3, gap: 2 }}>
          {[["day","日"], ["week","週"], ["month","月"]].map(([k, l]) => (
            <button key={k} onClick={() => setViewMode(k)} style={{ flex: 1, padding: "6px 4px", borderRadius: 6, border: "none", background: viewMode === k ? "#fff" : "transparent", color: viewMode === k ? "#00b4a6" : "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>{l}</button>
          ))}
        </div>

        {/* Week day headers (week mode only) */}
        {viewMode === "week" && (
          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", gap: 2, marginTop: 8 }}>
            <div />
            {weekDays.map(d => {
              const dt = new Date(d + "T00:00:00");
              const isToday = d === todayStr();
              const dow = dt.getDay();
              return (
                <div key={d} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: dow === 0 ? "#ffcdd2" : dow === 6 ? "#b3e5fc" : "rgba(255,255,255,0.8)", fontWeight: 600 }}>{DAY_LABELS[dow]}</div>
                  <div style={{ width: 28, height: 28, borderRadius: "50%", margin: "2px auto 0", background: isToday ? "#fff" : "transparent", color: isToday ? "#00b4a6" : dow === 0 ? "#ff6b6b" : dow === 6 ? "#90caf9" : "#fff", fontWeight: 800, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center" }}>{dt.getDate()}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── DAY VIEW ── */}
      {viewMode === "day" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f5f5f5", touchAction: dragging ? "none" : "auto" }}
          ref={dayRef}
          onPointerMove={dragging ? onPointerMove : undefined}
          onPointerUp={dragging ? onPointerUp : undefined}
          onPointerCancel={dragging ? onPointerCancel : undefined}>
          <div style={{ position: "relative" }}>
            {hours.map(h => {
              const dayBiz = getBizForDate(currentDay, bizHours, closedDaysOfWeek, personalHolidays);
              const openH = parseInt((dayBiz.open||"10:00").split(":")[0]);
              const closeH = parseInt((dayBiz.close||"20:00").split(":")[0]);
              const isOutside = dayBiz.isHoliday || h < openH || h >= closeH;
              const cellBg = dayBiz.isHoliday ? "#e0e0e0" : isOutside ? "#f2f2f2" : "#fff";
              return (
                <div key={h} style={{ display: "flex", borderTop: "1px solid #e8e8e8", minHeight: dynCellH, cursor: "pointer", background: cellBg }}
                  onPointerDown={e => onCellPointerDown(e, currentDay, h)}
                  onPointerUp={onCellPointerUp} onPointerCancel={onCellPointerCancel} onPointerLeave={onCellPointerUp}>
                  <div style={{ width: 50, flexShrink: 0, paddingTop: 4, paddingRight: 8, textAlign: "right" }}>
                    <span style={{ fontSize: 11, color: C.sub }}>{h}:00</span>
                  </div>
                  <div style={{ flex: 1, borderLeft: "1px solid #e0e0e0", position: "relative" }}>
                    <div style={{ height: "50%", borderBottom: "1px dashed #e8e8e8" }} />
                  </div>
                </div>
              );
            })}
            {/* Appt blocks */}
            {apptsByDate(currentDay).map(a => {
              const top = timeToPx2(a.time) + 1;
              const dur = a.duration || 60;
              const height = Math.max((dur / 60) * dynCellH - 4, 40);
              const cust = customers.find(c => c.id === a.customerId);
              const color = a.color || APPT_COLORS[0];
              const am = menus.filter(m => (a.menuIds||[]).includes(m.id));
              const endT = calcEndTime(a.time, dur);
              return (
                <div key={a.id} onClick={(e) => { if (!isDragging.current) openTapMenu(e, a); }}
                  onPointerDown={(e) => onPointerDown(e, a)}
                  style={{ position: "absolute", top, left: 52, right: 8, height, borderRadius: 10, background: color, padding: "6px 10px", overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.15)", zIndex: 2, cursor: "pointer" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: "#fff", marginBottom: 3 }}>{a.time}-{endT}</div>
                  {a.paid && <span style={{ background: "rgba(0,0,0,0.5)", color: "#fff", fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 6px", marginRight: 6 }}>会計済</span>}
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>{cust?.name || "不明"}様</div>
                  {height > 60 && <div style={{ fontSize: 11, color: "rgba(255,255,255,0.9)", marginTop: 3 }}>
                    {am.map((m,i) => <span key={i}>{i>0?"、":""}<span style={{ width:8, height:8, borderRadius:"50%", background:"rgba(255,255,255,0.7)", display:"inline-block", marginRight:3, verticalAlign:"middle" }} />{m.name}</span>)}
                  </div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── WEEK VIEW ── */}
      {viewMode === "week" && (
        <div style={{ flex: 1, overflowY: "auto", background: "#f2f2f2", position: "relative", touchAction: dragging ? "none" : "auto" }}
          ref={gridRef}
          onPointerMove={dragging ? onPointerMove : undefined}
          onPointerUp={dragging ? onPointerUp : undefined}
          onPointerCancel={dragging ? onPointerCancel : undefined}>
          <div style={{ display: "grid", gridTemplateColumns: "36px repeat(7, 1fr)", position: "relative" }}>
            <div>
              {hours.map(h => (
                <div key={h} style={{ height: dynCellH, display: "flex", alignItems: "flex-start", justifyContent: "flex-end", paddingRight: 6, paddingTop: 4 }}>
