const sb = {
  from: (table) => ({
    _table: table,
    select: function(cols = "*") { this._cols = cols; this._filters = []; return this; },
    insert: function(data) { this._method = "POST"; this._data = data; return this; },
    upsert: function(data) { this._method = "POST"; this._data = data; this._upsert = true; return this; },
    update: function(data) { this._method = "PATCH"; this._data = data; this._filters = []; return this; },
    delete: function() { this._method = "DELETE"; this._filters = []; return this; },
    eq: function(col, val) { this._filters = [...(this._filters||[]), `${col}=eq.${val}`]; return this; },
    order: function(col, opts={}) { this._order = `${col}.${opts.ascending===false?"desc":"asc"}`; return this; },
    then: async function(resolve, reject) {
      try {
        const base = `${SUPABASE_URL}/rest/v1/${this._table}`;
        const headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": this._upsert ? "resolution=merge-duplicates,return=representation" : "return=representation",
        };
        let url = base;
        const params = [];
        if (this._cols && !this._method) params.push(`select=${this._cols}`);
        if (this._filters) this._filters.forEach(f => params.push(f));
        if (this._order) params.push(`order=${this._order}`);
        if (params.length) url += "?" + params.join("&");

        const method = this._method || "GET";
        const res = await fetch(url, {
          method,
          headers,
          body: this._data ? JSON.stringify(this._data) : undefined,
        });
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }
        const data = method === "DELETE" || method === "PATCH" ? [] : await res.json();
        resolve({ data, error: null });
      } catch(e) {
        resolve({ data: null, error: e });
      }
    }
  })
};

      if (existing && existing.length > 0) {
        // 既存 → PATCH（update）
        await fetch(`${SUPABASE_URL}/rest/v1/settings?key=eq.${encodeURIComponent(key)}`, {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation",
          },
          body: JSON.stringify({ value: json }),
        });
      } else {
        // 新規 → POST（insert）
        await fetch(`${SUPABASE_URL}/rest/v1/settings`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation",
          },
          body: JSON.stringify({ key, value: json }),
        });
      }
    } catch(e) {
      console.error("saveSetting error:", e);
    }
  }, []);

  // ── Load all data from Supabase on mount ──
  useEffect(() => {
    const load = async () => {
      setLoading(true);

      // ① settingsを最初に取得してロゴを即セット（ローディング画面に反映させるため）
      const s = await sb.from("settings").select();
      if (!s.error && s.data && s.data.length > 0) {
        const settingsMap = {};
        s.data.forEach(row => { settingsMap[row.key] = row.value; });
        if (settingsMap.bizHours) setBizHours(JSON.parse(settingsMap.bizHours));
        if (settingsMap.closedDaysOfWeek) setClosedDaysOfWeek(JSON.parse(settingsMap.closedDaysOfWeek));
        if (settingsMap.personalHolidays) setPersonalHolidays(JSON.parse(settingsMap.personalHolidays));
        if (settingsMap.salonLogo) setSalonLogo(JSON.parse(settingsMap.salonLogo));
        else setSalonLogo(null);
        if (settingsMap.shopCategoryList) { try { setShopCategoryList(JSON.parse(settingsMap.shopCategoryList)); } catch(e) {} }
        if (settingsMap.blogPrompt && !settingsMap.blogPrompt.includes("ここに")) { try { localStorage.setItem("blogPrompt", settingsMap.blogPrompt); } catch(e) {} }
        if (settingsMap.stylupPrompt && !settingsMap.stylupPrompt.includes("ここに")) { try { localStorage.setItem("stylupPrompt", settingsMap.stylupPrompt); } catch(e) {} }
      } else {
        // settingsが空の場合もundefinedを解消
        setSalonLogo(null);
      }

      // ② 残りのデータを並列取得
      const [c, m, p, v, a, tc, ti] = await Promise.all([
        sb.from("customers").select().order("name"),
        sb.from("menus").select().order("id"),
        sb.from("products").select().order("id"),
        sb.from("visits").select().order("date", {ascending:false}),
        sb.from("appointments").select().order("date"),
        sb.from("tag_categories").select().order("sort_order"),
        sb.from("tag_items").select().order("sort_order"),
      ]);
      if (!c.error) setCustomers(c.data.map(fromDb.customer));
      if (!m.error) setMenus(m.data.map(fromDb.menu));
      if (!p.error) setProducts(p.data.map(fromDb.product));
      if (!v.error) setVisits(v.data.map(fromDb.visit));
      if (!a.error) setAppointments(a.data.map(fromDb.appointment));
      if (!tc.error && !ti.error) {
        const items = ti.data || [];
        setTagCategories((tc.data || []).map(cat => ({
          id: cat.id, name: cat.name, sortOrder: cat.sort_order,
          items: items.filter(i => i.category_id === cat.id).map(i => ({ id: i.id, name: i.name, sortOrder: i.sort_order }))
        })));
      }

      // Seed initial data if empty
      if (!m.error && m.data.length === 0) {
        const menuInserts = SEED_MENUS.map(m => toDb.menu(m));
        const { data: insertedMenus } = await sb.from("menus").insert(menuInserts);
        if (insertedMenus) setMenus(insertedMenus.map(fromDb.menu));
      }
      if (!p.error && p.data.length === 0) {
        const prodInserts = SEED_PRODUCTS.map(p => toDb.product(p));
        const { data: insertedProds } = await sb.from("products").insert(prodInserts);
        if (insertedProds) setProducts(insertedProds.map(fromDb.product));
      }
      setLoading(false);
    };
    load();
  }, []);

  // ── Wrapped setters that sync to Supabase ──
  const addCustomer = useCallback(async (c) => {
    const { data, error } = await sb.from("customers").insert([toDb.customer(c)]);
    if (error) { notify("保存に失敗しました", "error"); return null; }
    if (data && data[0]) {
      const saved = { ...fromDb.customer(data[0]) };
      setCustomers(p => [...p, saved]);
      return saved;
    }
    // insertは成功したがdataが返らない場合、再取得
    try {
      const refetch = await fetch(`${SUPABASE_URL}/rest/v1/customers?order=id.desc&limit=1`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      const rows = await refetch.json();
      if (rows && rows[0]) {
        const saved = fromDb.customer(rows[0]);
        setCustomers(p => [...p, saved]);
        return saved;
      }
    } catch(e) {}
    return null;
  }, []);

  const updateCustomer = useCallback(async (id, changes) => {
    const cur = customers.find(c => c.id === id);
    if (!cur) return;
    await sb.from("customers").update(toDb.customer({...cur,...changes})).eq("id", id);
    setCustomers(p => p.map(c => c.id === id ? {...c,...changes} : c));
  }, [customers]);

  const addVisit = useCallback(async (v) => {
    const { data, error } = await sb.from("visits").insert([toDb.visit(v)]);
    if (error) return notify("保存に失敗しました", "error");
    const saved = fromDb.visit(data[0]);
    setVisits(p => [saved, ...p]);
    return saved;
  }, []);

  const updateVisit = useCallback(async (id, changes) => {
    const cur = visits.find(v => v.id === id);
    if (!cur) return;
    await sb.from("visits").update(toDb.visit({...cur,...changes})).eq("id", id);
    setVisits(p => p.map(v => v.id === id ? {...v,...changes} : v));
  }, [visits]);

  const deleteVisit = useCallback(async (id) => {
    const target = visits.find(v => v.id === id);
    await sb.from("visits").delete().eq("id", id);
    setVisits(p => p.filter(v => v.id !== id));
    if (target) {
      const matched = appointments.filter(a =>
        a.customerId === target.customerId &&
        a.date === target.date &&
        a.time === target.time
      );
      for (const a of matched) {
        await sb.from("appointments").delete().eq("id", a.id);
      }
      setAppointments(p => p.filter(a => !(
        a.customerId === target.customerId &&
        a.date === target.date &&
        a.time === target.time
      )));
    }
    notify("カルテを削除しました");
  }, [visits, appointments]);

  const addAppointment = useCallback(async (a) => {
    const { data, error } = await sb.from("appointments").insert([toDb.appointment(a)]);
    if (error) return notify("保存に失敗しました", "error");
    const saved = fromDb.appointment(data[0]);
    setAppointments(p => [...p, saved]);
    return saved;
  }, []);

  const updateAppointment = useCallback(async (id, changes) => {
    const cur = appointments.find(a => a.id === id);
    if (!cur) return;
    await sb.from("appointments").update(toDb.appointment({...cur,...changes})).eq("id", id);
    setAppointments(p => p.map(a => a.id === id ? {...a,...changes} : a));
  }, [appointments]);

  const deleteAppointment = useCallback(async (id) => {
    const appt = appointments.find(a => a.id === id);
    await sb.from("appointments").delete().eq("id", id);
    setAppointments(p => p.filter(a => a.id !== id));
    if (appt) {
      setVisits(p => {
        const toDelete = p.filter(v =>
          v.customerId === appt.customerId &&
          v.date === appt.date &&
          v.time === appt.time
        );
        toDelete.forEach(v => sb.from("visits").delete().eq("id", v.id));
        return p.filter(v => !toDelete.find(d => d.id === v.id));
      });
    }
  }, [appointments]);

  const addMenu = useCallback(async (m) => {
    const { data, error } = await sb.from("menus").insert([toDb.menu(m)]);
    if (error) return notify("保存に失敗しました", "error");
    const saved = fromDb.menu(data[0]);
    setMenus(p => [...p, saved]);
    return saved;
  }, []);

  const updateMenu = useCallback(async (id, changes) => {
    const cur = menus.find(m => m.id === id);
    if (!cur) return;
    await sb.from("menus").update(toDb.menu({...cur,...changes})).eq("id", id);
    setMenus(p => p.map(m => m.id === id ? {...m,...changes} : m));
  }, [menus]);

  const deleteMenu = useCallback(async (id) => {
    await sb.from("menus").delete().eq("id", id);
    setMenus(p => p.filter(m => m.id !== id));
  }, []);

  const addProduct = useCallback(async (prod) => {
    const { data, error } = await sb.from("products").insert([toDb.product(prod)]);
    if (error) return notify("保存に失敗しました", "error");
    const saved = fromDb.product(data[0]);
    setProducts(p => [...p, saved]);
    return saved;
  }, []);

  const updateProduct = useCallback(async (id, changes) => {
    const cur = products.find(p => p.id === id);
    if (!cur) return;
    await sb.from("products").update(toDb.product({...cur,...changes})).eq("id", id);
    setProducts(p => p.map(x => x.id === id ? {...x,...changes} : x));
  }, [products]);

  const deleteProduct = useCallback(async (id) => {
    await sb.from("products").delete().eq("id", id);
    setProducts(p => p.filter(x => x.id !== id));
  }, []);

  // Wrap setters for backward compatibility with child components
  const setCustomersW = useCallback((fn) => {
    if (typeof fn === "function") setCustomers(fn);
    else setCustomers(fn);
  }, []);
  const setMenusW = useCallback((fn) => {
    if (typeof fn !== "function") { setMenus(fn); return; }
    setMenus(prev => {
      const next = fn(prev);
      // Sync changes to DB
      const added = next.filter(n => !prev.find(p => p.id === n.id));
      const removed = prev.filter(p => !next.find(n => n.id === p.id));
      const updated = next.filter(n => { const old = prev.find(p => p.id === n.id); return old && JSON.stringify(old) !== JSON.stringify(n); });
      added.forEach(m => sb.from("menus").insert([toDb.menu(m)]));
      removed.forEach(m => sb.from("menus").delete().eq("id", m.id));
      updated.forEach(m => sb.from("menus").update(toDb.menu(m)).eq("id", m.id));
      return next;
    });
  }, []);
  const setProductsW = useCallback((fn) => {
    if (typeof fn !== "function") { setProducts(fn); return; }
    setProducts(prev => {
      const next = fn(prev);
      const added = next.filter(n => !prev.find(p => p.id === n.id));
      const removed = prev.filter(p => !next.find(n => n.id === p.id));
      const updated = next.filter(n => { const old = prev.find(p => p.id === n.id); return old && JSON.stringify(old) !== JSON.stringify(n); });
      added.forEach(p => sb.from("products").insert([toDb.product(p)]));
      removed.forEach(p => sb.from("products").delete().eq("id", p.id));
      updated.forEach(p => sb.from("products").update(toDb.product(p)).eq("id", p.id));
      return next;
    });
  }, []);
  const setVisitsW = useCallback((fn) => {
    if (typeof fn !== "function") { setVisits(fn); return; }
    setVisits(prev => {
      const next = fn(prev);
      const added = next.filter(n => !prev.find(p => p.id === n.id));
      added.forEach(v => sb.from("visits").insert([toDb.visit(v)]));
      return next;
    });
  }, []);
  const setAppointmentsW = useCallback((fn) => {
    if (typeof fn !== "function") { setAppointments(fn); return; }
    setAppointments(prev => {
      const next = fn(prev);
      const added = next.filter(n => !prev.find(p => p.id === n.id));
      const removed = prev.filter(p => !next.find(n => n.id === p.id));
      added.forEach(a => sb.from("appointments").insert([toDb.appointment(a)]));
      removed.forEach(a => sb.from("appointments").delete().eq("id", a.id));
      return next;
    });
  }, []);

  const [karteDetailVisit, setKarteDetailVisit] = React.useState(null);
  const [pendingCustomerId, setPendingCustomerId] = React.useState(null);
  const [karteDetailCustomer, setKarteDetailCustomer] = React.useState(null);
  const [karteDetailBackTab, setKarteDetailBackTab] = React.useState("customers");

  const openKarteDetail = React.useCallback((visit, customer, backTab) => {
    setKarteDetailVisit(visit);
    setKarteDetailCustomer(customer);
    setKarteDetailBackTab(backTab || "customers");
    setTab("karteDetail");
  }, []);

  const NAV_ICONS = {
    customers: (active) => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? C.accent : C.sub} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    ),
    appointments: (active) => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? C.accent : C.sub} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
    ),
    analytics: (active) => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? C.accent : C.sub} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    ),
    more: (active) => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={active ? C.accent : C.sub} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="5" r="1" fill={active ? C.accent : C.sub}/><circle cx="12" cy="12" r="1" fill={active ? C.accent : C.sub}/><circle cx="12" cy="19" r="1" fill={active ? C.accent : C.sub}/>
      </svg>
    ),
  };
  const TABS = [
    { id: "customers", label: "カルテ" },
    { id: "appointments", label: "予約表" },
    { id: "analytics", label: "分析" },
    { id: "more", label: "その他" },
  ];

  if (loading) return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100vh", background:C.bg }}>
      {salonLogo === undefined
        ? null
        : salonLogo
          ? <img src={salonLogo} alt="ロゴ" style={{ width:300, height:300, objectFit:"contain", marginBottom:20, borderRadius:20 }} />
          : <div style={{ fontSize:56, marginBottom:20 }}>💇</div>
      }
      <div style={{ fontSize:16, fontWeight:700, color:C.text, marginBottom:8 }}>読み込み中...</div>
      <div style={{ fontSize:13, color:C.sub }}>データを取得しています</div>
    </div>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", maxWidth: 480, margin: "0 auto", fontFamily: "-apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif", paddingBottom: 80, position: "relative", overflowX: "hidden" }}>
      {/* Content */}
      <div style={{ padding: "0 0 8px" }}>
        {tab === "home" && <HomeTab visits={visits} customers={customers} appointments={appointments} menus={menus} setTab={setTab} />}
        {tab === "customers" && <CustomersTab customers={customers} setCustomers={setCustomers} visits={visits} setVisits={setVisitsW} menus={menus} products={products} notify={notify} addCustomer={addCustomer} openKarteDetail={openKarteDetail} setTab={setTab} setPendingCustomerId={setPendingCustomerId} />}
        {tab === "visit" && <VisitTab customers={customers} menus={menus} products={products} visits={visits} setVisits={setVisitsW} setProducts={setProductsW} notify={notify} setTab={setTab} setCustomers={setCustomers} />}
        {tab === "analytics" && <AnalyticsTab visits={visits} customers={customers} menus={menus} products={products} appointments={appointments} />}
        {tab === "more" && <MoreTab setTab={setTab} />}
        {tab === "blogPrompt" && <BlogPromptTab setTab={setTab} notify={notify} />}
        {tab === "stylupPrompt" && <StylupPromptTab setTab={setTab} notify={notify} />}
        {tab === "logoSettings" && <LogoSettingsTab setTab={setTab} notify={notify} salonLogo={salonLogo} setSalonLogo={setSalonLogo} saveSetting={saveSetting} />}
        {tab === "tagSettings" && <TagSettingsTab setTab={setTab} notify={notify} tagCategories={tagCategories} setTagCategories={setTagCategories} />}
        {tab === "appointments" && <AppointmentsTab appointments={appointments} setAppointments={setAppointmentsW} customers={customers} setCustomers={setCustomers} visits={visits} setVisits={setVisitsW} products={products} menus={menus} notify={notify} setTab={setTab} bizHours={bizHours} closedDaysOfWeek={closedDaysOfWeek} personalHolidays={personalHolidays} openKarteDetail={openKarteDetail} addCustomer={addCustomer} addVisit={addVisit} addAppointment={addAppointment} deleteAppointment={deleteAppointment} pendingCustomerId={pendingCustomerId} setPendingCustomerId={setPendingCustomerId} weekOffset={weekOffset} setWeekOffset={setWeekOffset} viewMode={viewMode} setViewMode={setViewMode} dayOffset={dayOffset} setDayOffset={setDayOffset} monthOffset={monthOffset} setMonthOffset={setMonthOffset} shopCategoryList={shopCategoryList} />}
        {tab === "inventory" && <InventoryTab products={products} setProducts={setProductsW} addProduct={addProduct} updateProduct={updateProduct} deleteProduct={deleteProduct} notify={notify} setTab={setTab} visits={visits} />}
        {tab === "bizHours" && <BizHoursTab setTab={setTab} bizHours={bizHours} setBizHours={setBizHours} closedDaysOfWeek={closedDaysOfWeek} setClosedDaysOfWeek={setClosedDaysOfWeek} personalHolidays={personalHolidays} setPersonalHolidays={setPersonalHolidays} saveSetting={saveSetting} notify={notify} />}
        {tab === "settings" && <SettingsTab menus={menus} setMenus={setMenusW} products={products} setProducts={setProductsW} notify={notify} setTab={setTab} />}

        {tab && tab.startsWith("customerDetail_") && (() => {
          const custId = parseInt(tab.split("_")[1]);
          const cust = customers.find(c => c.id === custId);
          if (!cust) return null;
          return <CustomerDetail
            c={cust}
            visits={visits}
            menus={menus}
            products={products}
            onBack={() => setTab("appointments")}
            notify={notify}
            setCustomers={setCustomers}
            setVisits={setVisitsW}
            openKarteDetail={openKarteDetail}
            setTab={setTab}
            setPendingCustomerId={setPendingCustomerId}
          />;
        })()}
        {tab === "karteDetail" && karteDetailVisit && <KarteDetail visit={karteDetailVisit} customer={karteDetailCustomer} menus={menus} products={products} visits={visits} appointments={appointments} updateVisit={updateVisit} updateAppointment={updateAppointment} setVisits={setVisitsW} setVisitsRaw={setVisits} setAppointments={setAppointmentsW} setAppointmentsRaw={setAppointments} tagCategories={tagCategories} shopCategoryList={shopCategoryList} onBack={(updated) => {
          if (updated) updateVisit(karteDetailVisit.id, updated);
          setTab(karteDetailBackTab);
        }} notify={notify} onDeleteVisit={async (id) => { await deleteVisit(id); setTab(karteDetailBackTab); }} />}
      </div>

      {/* Bottom nav */}
      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: C.card, borderTop: `1px solid ${C.border}`, display: "flex", zIndex: 200 }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => {
    setTab(t.id);
            }} style={{
            flex: 1, padding: "10px 4px 12px", border: "none", background: "transparent",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer",
          }}>
            <span style={{ lineHeight: 1 }}>{NAV_ICONS[t.id](tab === t.id)}</span>
            <span style={{ fontSize: 10, fontWeight: 600, color: tab === t.id ? C.accent : C.sub }}>{t.label}</span>
          </button>
        ))}
      </div>

      {toast && <Toast msg={toast.msg} type={toast.type} />}
    </div>
  );
}

function HomeTab({ visits, customers, appointments, menus, setTab }) {
  const now = new Date();
  const mStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const mv = visits.filter(v => v.date.startsWith(mStr));
  const rev = mv.reduce((s, v) => s + v.total, 0);
  const avg = mv.length ? Math.round(rev / mv.length) : 0;
  const shopRev = mv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.price * p.qty, 0), 0);

  const upcoming = appointments.filter(a => a.date >= todayStr()).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);

  return (
    <div style={{ padding: "12px 16px" }}>
      {/* Month summary */}
      <div style={{ ...css.card, background: "linear-gradient(135deg, #7a9aba 0%, #b8cce0 100%)", color: "#fff" }}>
        <div style={{ fontSize: 13, fontWeight: 600, opacity: 0.85, marginBottom: 6 }}>{now.getMonth() + 1}月の売上</div>
        <div style={{ fontSize: 34, fontWeight: 800, letterSpacing: "-0.02em" }}>{yen(rev)}</div>
        <div style={{ display: "flex", gap: 20, marginTop: 12, fontSize: 13 }}>
          <div><span style={{ opacity: 0.75 }}>来店 </span><b>{mv.length}件</b></div>
          <div><span style={{ opacity: 0.75 }}>客単価 </span><b>{yen(avg)}</b></div>
          <div><span style={{ opacity: 0.75 }}>店販 </span><b>{yen(shopRev)}</b></div>
        </div>
      </div>

      {/* Quick stats */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
        {[
          ["カルテ数", customers.length + "名", C.accent],
          ["今月来店", mv.length + "件", C.green],
          ["店販比率", pct(shopRev, rev) + "%", C.orange],
          ["予約数", appointments.filter(a => a.date >= todayStr()).length + "件", C.purple],
        ].map(([l, v, c]) => (
          <div key={l} style={{ ...css.card, marginBottom: 0, textAlign: "center", padding: "14px 8px" }}>
            <div style={{ fontSize: 24, fontWeight: 800, color: c }}>{v}</div>
            <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>{l}</div>
          </div>
        ))}
      </div>

      {/* Upcoming appointments */}
      <div style={css.section}>今後の予約</div>
      <div style={css.card}>
        {upcoming.length === 0 ? (
          <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: "12px 0" }}>予約なし</div>
        ) : upcoming.map((a, i) => (
          <div key={a.id}>
            {i > 0 && <Divider />}
            <ApptRow a={a} customers={[]} slim />
          </div>
        ))}
        <button onClick={() => setTab("appointments")} style={{ ...css.btn(C.accent, false), width: "100%", marginTop: 10, fontSize: 13 }}>予約表を見る</button>
      </div>
    </div>
  );
}

function ApptRow({ a, customers, slim }) {
  return (
    <div style={{ padding: "8px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <div>
        <div style={{ fontSize: slim ? 13 : 15, fontWeight: 700, color: C.text }}>{a.date} <span style={{ color: C.accent }}>{a.time}</span></div>

// Helper: days since a date string
function daysSince(dateStr) {
  if (!dateStr) return null;
  return Math.floor((new Date() - new Date(dateStr + "T00:00:00")) / 86400000);
}
function timeAgoLabel(dateStr) {
  if (!dateStr) return null;
  const d = daysSince(dateStr);
  if (d === 0) return "今日";
  if (d === 1) return "昨日";
  if (d < 30) return d + "日前";
  const m = Math.floor(d / 30);
  if (m < 12) return m + "ヶ月前";
  return Math.floor(m / 12) + "年前";
}
function isOverdue(dateStr, months = 3) {
  if (!dateStr) return false;
  return daysSince(dateStr) > months * 30;
}

const GOJUON = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","つ","て","と","な","に","の","は","ひ","ふ","ま","み","む","も","や","ゆ","よ","ら","り","る","れ","ろ","わ"];
function kanaGroup(kana) {
  if (!kana) return "他";
  const first = kana.charAt(0);
  const map = {あ:"あ",い:"い",う:"う",え:"え",お:"お",か:"か",が:"か",き:"き",ぎ:"き",く:"く",ぐ:"く",け:"け",げ:"け",こ:"こ",ご:"こ",さ:"さ",ざ:"さ",し:"し",じ:"し",す:"す",ず:"す",せ:"せ",ぜ:"せ",そ:"そ",ぞ:"そ",た:"た",だ:"た",ち:"つ",つ:"つ",づ:"つ",て:"て",で:"て",と:"と",ど:"と",な:"な",に:"に",ぬ:"な",ね:"な",の:"の",は:"は",ば:"は",ぱ:"は",ひ:"ひ",び:"ひ",ぴ:"ひ",ふ:"ふ",ぶ:"ふ",ぷ:"ふ",ま:"ま",み:"み",む:"む",め:"ま",も:"も",や:"や",ゆ:"ゆ",よ:"よ",ら:"ら",り:"り",る:"る",れ:"れ",ろ:"ろ",わ:"わ"};
  return map[first] || "他";
}

            <button onClick={deleteCustomer} style={{ width:"100%", marginTop:12, padding:"13px", borderRadius:12, border:"none", background:"#e0e0e0", color:"#888", fontWeight:700, fontSize:14, cursor:"pointer" }}>顧客を削除する</button>
          </div>
        </div>
      )}
    </div>
  );
}

            else setEditMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]);

                  <div key={cat} onClick={() => setProdPickerCat(cat)} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 0", borderBottom:`1px solid ${C.border}`, cursor:"pointer" }}>

              (allProducts||[]).filter(p2 => !p2.placeholder && p2.category === prodPickerCat).map(p2 => (
                <div key={p2.id} onClick={() => { addProd(p2); setProdPickerCat(null); }} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0", borderBottom:`1px solid ${C.border}`, cursor:"pointer" }}>

                    <div style={{ fontSize:12, color:C.sub }}>在庫 {p2.stock}</div>
                  </div>
                  <span style={{ color:"#7a6848", fontWeight:700 }}>¥ {p2.price.toLocaleString()}</span>
                </div>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function KarteDetail({ visit: v, customer: c, menus: allMenus, products: allProducts, visits: allVisits, onBack, notify, onDeleteVisit, appointments, updateVisit, updateAppointment, setVisits, setVisitsRaw, setAppointments, setAppointmentsRaw, tagCategories, shopCategoryList }) {
  const beforeRef = useRef();
  const afterRef = useRef();
  const otherRef = useRef();
  const [beforeImgs, setBeforeImgs] = useState(v.beforeImgs || []);
  const [afterImgs, setAfterImgs] = useState(v.afterImgs || []);
  const [otherImgs, setOtherImgs] = useState(v.otherImgs || []);

  const [selectedIdx, setSelectedIdx] = useState(0);
  const [memo, setMemo] = useState(v.notes || "");
  const [editMemo, setEditMemo] = useState(false);
  const [showMemoPage, setShowMemoPage] = useState(false);
  const [showPastMemos, setShowPastMemos] = useState(false);
  const [showCheckout, setShowCheckout] = useState(false);
  const [showBlogPage, setShowBlogPage] = useState(false);
  const [blogLoading, setBlogLoading] = useState(false);
  const [blogResult, setBlogResult] = useState(null);
  const [karteMenus, setKarteMenus] = useState(v.menus || []);
  const [karteProds, setKarteProds] = useState(v.products || []);
  const [showMenuPicker, setShowMenuPicker] = useState(false);
  const [showProdPicker2, setShowProdPicker2] = useState(false);
  const [prodPickerCat2, setProdPickerCat2] = useState(null);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [karteTags, setKarteTags] = useState(v.tags || []);
  const [tagsOpen, setTagsOpen] = useState(false);
  const [newTagInput, setNewTagInput] = useState("");
  const [styleName, setStyleName] = useState(v.styleName || "");
  const [styleComment, setStyleComment] = useState(v.styleComment || "");
  const [isPublic, setIsPublic] = useState(v.isPublic || false);
  const PRESET_TAGS = ["カット","カラー","パーマ","ストレート","トリートメント","ヘッドスパ","ブルー系","ピンク系","アッシュ系","ベージュ系","ブラウン系","グレー系","ハイライト","ブリーチあり","ショート","ボブ","ミディアム","ロング","ツヤ感","ふんわり","まとまり","軽め"];

  const pastPurchases = (allVisits || [])
    .filter(x => x.customerId === c.id && x.products && x.products.length > 0 && x.id !== v.id)
    .sort((a, b) => b.date.localeCompare(a.date));

  const tabDefs = [
    { key:"before", label:"ビフォー", imgs:beforeImgs, setImgs:setBeforeImgs, ref:beforeRef, color:"#ff9500" },
    { key:"after",  label:"アフター", imgs:afterImgs,  setImgs:setAfterImgs,  ref:afterRef,  color:"#7a6848" },
    { key:"other",  label:"その他",   imgs:otherImgs,  setImgs:setOtherImgs,  ref:otherRef,  color:"#9a9088" },
  ];
  const curTab = tabDefs.find(function(t){ return t.key === photoTab; });

  const compressImg = function(url, cb) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var MAX = 800;
      var ratio = Math.min(MAX/img.width, MAX/img.height, 1);
      canvas.width = img.width * ratio;
      canvas.height = img.height * ratio;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = url;
  };

  const savePhotos = function(before, after, other) {
    var photoData = JSON.stringify({ before: before, after: after, other: other });
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ photo_data: photoData }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, beforeImgs: before, afterImgs: after, otherImgs: other} : x; }); });
  };

  const saveMemo = function() {
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ notes: memo }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, notes: memo} : x; }); });
    setShowMemoPage(false);
  };

  const saveTags = function(tags) {
    fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + v.id, { method: "PATCH", headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ tags: tags }) });
    var vSetter = setVisitsRaw || setVisits;
    if (vSetter) vSetter(function(p) { return p.map(function(x) { return x.id === v.id ? {...x, tags: tags} : x; }); });

            var na = cat==="after"?next:afterImgs;
            var no = cat==="other"?next:otherImgs;

                      閉じる

      {/* Menu picker sheet */}
      {showMenuPicker && (
        <MenuPickerSheet
          menus={allMenus}
          selectedIds={karteMenus.map(m => m.menuId)}
          onToggle={(m) => {

            if (has) setKarteMenus(p => p.filter(x => x.menuId !== m.id));
            else setKarteMenus(p => [...p, { menuId: m.id, name: m.name, price: m.price }]);

          visits={allVisits || []}

      {/* Product picker sheet */}
      {showProdPicker2 && (

          <div style={{ background:C.card, borderRadius:"20px 20px 0 0", padding:"20px 16px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"70vh", overflowY:"auto" }}>

              <div style={{ display:"flex", alignItems:"center", gap:8 }}>

                  <button onClick={() => setProdPickerCat2(null)} style={{ background:"none", border:"none", fontSize:18, color:C.sub, cursor:"pointer", padding:"0 4px" }}>←</button>

              </div>
              <button onClick={() => { setShowProdPicker2(false); setProdPickerCat2(null); }} style={{ background:"none", border:"none", fontSize:22, color:C.sub, cursor:"pointer" }}>✕</button>
            </div>
            {!prodPickerCat2 ? (
              (shopCategoryList||[]).filter(cat => (allProducts||[]).some(p2 => !p2.placeholder && p2.category === cat)).map(cat => {
                const IconComp = PROD_CATEGORY_ICONS_SVG[cat];
                return (
                  <div key={cat} onClick={() => setProdPickerCat2(cat)} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 0", borderBottom:`1px solid ${C.border}`, cursor:"pointer" }}>
                    <span style={{ width:28, display:"flex", alignItems:"center", justifyContent:"center" }}>{IconComp ? <IconComp /> : <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a6848" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>}</span>

            ) : (
              (allProducts||[]).filter(p2 => !p2.placeholder && p2.category === prodPickerCat2).map(p2 => (
                <div key={p2.id} onClick={() => {
                  setKarteProds(p => [...p, { productId: p2.id, name: p2.name, price: p2.price, qty: 1 }]);

                  <div>
                    <div style={{ fontSize:15 }}>{p2.name}</div>
                    <div style={{ fontSize:12, color:C.sub }}>在庫 {p2.stock}</div>

                  <span style={{ color:"#7a6848", fontWeight:700 }}>¥ {p2.price.toLocaleString()}</span>
                </div>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function MenuPickerSheet({ menus, selectedIds, onToggle, onClose, visits }) {
  const [openCats, setOpenCats] = useState({});

  // "よく使う" = top 5 by frequency in visits
  const menuFreq = {};
  (visits || []).forEach(v => (v.menus || []).forEach(m => {
    menuFreq[m.menuId] = (menuFreq[m.menuId] || 0) + 1;
  }));
  const popular = [...menus]
    .sort((a, b) => (menuFreq[b.id] || 0) - (menuFreq[a.id] || 0))
    .slice(0, 5);

  const cats = {};
  menus.forEach(m => {
    if (!cats[m.category]) cats[m.category] = [];
    cats[m.category].push(m);
  });

  const toggleCat = (cat) => setOpenCats(p => ({ ...p, [cat]: !p[cat] }));

  const MenuRow = ({ m }) => {
    const sel = (selectedIds || []).includes(m.id);
    return (
      <div onClick={() => onToggle(m)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 16px", borderBottom: `1px solid ${C.border}`, cursor: "pointer", background: sel ? "#f0fffe" : "#fff" }}>
        <span style={{ fontSize: 15, color: sel ? "#7a6848" : C.text, fontWeight: sel ? 700 : 400 }}>{m.name}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {m.price > 0 && <span style={{ fontSize: 13, color: C.sub }}>{m.price.toLocaleString()} 円</span>}
          {sel && <span style={{ color: "#7a6848", fontWeight: 800, fontSize: 16 }}>✓</span>}
        </div>
      </div>
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 950, display: "flex", alignItems: "flex-end" }}>
      <div style={{ background: C.bg, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 480, margin: "0 auto", maxHeight: "85vh", display: "flex", flexDirection: "column" }}>
        <div style={{ background: "#fff", overflowY: "auto", flex: 1 }}>
          {/* よく使うメニュー */}
          {popular.length > 0 && (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#f0efee", borderBottom: `1px solid ${C.border}` }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: "#f0efee", border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9088" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span style={{ fontWeight: 700, fontSize: 15 }}>よく使うメニュー</span>
              </div>
              {popular.map(m => <MenuRow key={"pop_" + m.id} m={m} />)}
            </>
          )}

          {/* Category dropdowns */}
          {Object.entries(cats).map(([cat, items]) => {
            const bg = MENU_CATEGORY_COLORS[cat] || "#f0efee";
            const stroke = MENU_CATEGORY_STROKE[cat] || "#9a9088";
            const SvgIcon = MENU_CATEGORY_SVG[cat];
            const isOpen = openCats[cat] !== false;
            return (
              <div key={cat}>
                <div onClick={() => toggleCat(cat)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#fff", borderBottom: `1px solid ${C.border}`, cursor: "pointer" }}>
                  <div style={{ width: 36, height: 36, borderRadius: 10, background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {SvgIcon ? SvgIcon(stroke) : <span style={{ fontSize: 18 }}>📋</span>}
                  </div>
                  <span style={{ fontWeight: 700, fontSize: 15, flex: 1 }}>{cat}</span>
                  <span style={{ color: C.sub, fontSize: 14 }}>{isOpen ? "▲" : "▼"}</span>
                </div>
                {isOpen && items.map(m => <MenuRow key={m.id} m={m} />)}
              </div>
            );
          })}
        </div>

        {/* Complete button */}
        <div style={{ padding: "12px 16px 28px", background: "#fff", borderTop: `1px solid ${C.border}` }}>
          <button onClick={onClose} style={{ width: "100%", padding: "16px", borderRadius: 12, border: "none", background: "#E8DCC3", color: "#2a2218", fontWeight: 800, fontSize: 17, cursor: "pointer" }}>
            メニュー選択を完了する
          </button>
        </div>
      </div>
    </div>
  );
}

function PastVisitsPanel({ visits: pv }) {
  const [open, setOpen] = useState(false);
  const PREVIEW = 3;
  const shown = open ? pv : pv.slice(0, PREVIEW);
  return (
    <div style={{ ...css.card, background: "#f0f7ff", border: `1px solid ${C.accent}33`, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.accent }}>📋 過去の施術履歴（全{pv.length}回）</span>
        {pv.length > PREVIEW && (
          <button onClick={() => setOpen(o => !o)} style={{ background: "none", border: `1px solid ${C.accent}`, borderRadius: 20, padding: "2px 10px", fontSize: 11, color: C.accent, fontWeight: 700, cursor: "pointer" }}>
            {open ? "閉じる ▲" : `全て見る ▼`}
          </button>
        )}
      </div>
      <div style={{ maxHeight: open ? 320 : "none", overflowY: open ? "auto" : "visible" }}>
        {shown.map((v, i) => (
          <div key={v.id} style={{ padding: "7px 0", borderBottom: i < shown.length - 1 ? `1px solid ${C.border}` : "none" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{v.date} {v.time}</div>
                <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>{(v.menus||[]).map(m => m.name).join("・")}</div>
                {v.notes ? <div style={{ fontSize: 11, color: C.sub, marginTop: 1 }}>📝 {v.notes}</div> : null}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.accent, flexShrink: 0, marginLeft: 8 }}>{yen(v.total)}</div>
            </div>
          </div>
        ))}
      </div>
      {!open && pv.length > PREVIEW && (
        <div style={{ fontSize: 11, color: C.sub, textAlign: "center", marginTop: 6 }}>
          他 {pv.length - PREVIEW}件…
        </div>
      )}
    </div>
  );
}


function AnalyticsTab({ visits, customers, menus, products, appointments }) {
  const [period, setPeriod] = useState("month");
  const [subTab, setSubTab] = useState("sales");
  // 日・月モード用オフセット
  const [dayOffset, setDayOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);

  const now = new Date();

  // 表示対象のvisitsを期間でフィルタ
  const fv = useMemo(() => visits.filter(v => {
    // 未会計（total=0かつpaid=false）は除外
    if (!v.paid && (v.total === 0 || v.total === undefined)) return false;
    // 日付比較はすべて文字列（YYYY-MM-DD）で行いUTCズレを防ぐ
    const vDate = v.date; // "2026-06-05"形式
    if (period === "day") {
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      const targetStr = `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,"0")}-${String(target.getDate()).padStart(2,"0")}`;
      return vDate === targetStr;
    }
    if (period === "month") {
      const target = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
      const y = target.getFullYear(), m = target.getMonth();
      const dDate = new Date(vDate + "T00:00:00");
      return dDate.getFullYear() === y && dDate.getMonth() === m;
    }
    if (period === "3m") {
      const cut = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate());
      return new Date(vDate + "T00:00:00") >= cut;
    }
    if (period === "year") return vDate.startsWith(String(now.getFullYear()));
    return true;
  }), [visits, period, dayOffset, monthOffset]);

  // 期間ラベル
  const periodLabel = (() => {
    if (period === "day") {
      const t = new Date(now); t.setDate(t.getDate() + dayOffset);
      return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,"0")}/${String(t.getDate()).padStart(2,"0")}`;
    }
    if (period === "month") {
      const t = new Date(now); t.setMonth(t.getMonth() + monthOffset);
      return `${t.getFullYear()}年${t.getMonth()+1}月`;
    }
    return null;
  })();

  // 売上集計
  const { totalRev, shopRev, drugCostTotal, techRev, avg, techAvg } = useMemo(() => {
    const totalRev = fv.reduce((s, v) => s + v.total, 0);
    const shopRev = fv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.price * p.qty, 0), 0);
    const drugCostTotal = fv.reduce((s, v) => s + (v.drugCost || 0), 0);
    const techRev = totalRev - shopRev - drugCostTotal;
    const avg = fv.length ? Math.round(totalRev / fv.length) : 0;
    const techAvg = fv.length ? Math.round(techRev / fv.length) : 0;
    return { totalRev, shopRev, drugCostTotal, techRev, avg, techAvg };
  }, [fv]);

  // 指名・フリー集計
  const { shimeikaSv, freeSv, shimeikaRev, freeRev, shimeikaAvg, freeAvg } = useMemo(() => {
    const shimeikaSv = fv.filter(v => (v.appointmentId ? (appointments.find(a => a.id === v.appointmentId)?.shimeika || "shimeika") : "shimeika") === "shimeika");
    const freeSv = fv.filter(v => (v.appointmentId ? (appointments.find(a => a.id === v.appointmentId)?.shimeika || "shimeika") : "shimeika") === "free");
    const shimeikaRev = shimeikaSv.reduce((s, v) => s + v.total - (v.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0), 0);
    const freeRev = freeSv.reduce((s, v) => s + v.total - (v.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0), 0);
    const shimeikaAvg = shimeikaSv.length ? Math.round(shimeikaRev / shimeikaSv.length) : 0;
    const freeAvg = freeSv.length ? Math.round(freeRev / freeSv.length) : 0;
    return { shimeikaSv, freeSv, shimeikaRev, freeRev, shimeikaAvg, freeAvg };
  }, [fv, appointments]);

  // 店販・支払方法・メニュー集計
  const { shopCount, shopAvg, payBrk, hpbTotal, menuCnt, totalMenuCnt, prodCnt } = useMemo(() => {
    // 店販
    const shopCount = fv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.qty, 0), 0);
    const shopAvg = fv.filter(v => (v.products||[]).length > 0).length ? Math.round(shopRev / fv.filter(v => (v.products||[]).length > 0).length) : 0;
    // 支払方法
    const payBrk = { cash: 0, card: 0, qr: 0, point: 0 };
    fv.forEach(v => { payBrk[v.paymentMethod] = (payBrk[v.paymentMethod] || 0) + v.total; });
    const hpbTotal = fv.reduce((s, v) => s + (v.hpbPoint || 0), 0);
    // メニュー集計
    const menuCnt = {};
    fv.forEach(v => v.menus.forEach(m => { menuCnt[m.name] = (menuCnt[m.name] || 0) + 1; }));
    const totalMenuCnt = Object.values(menuCnt).reduce((s, n) => s + n, 0);
    const prodCnt = {};
    fv.forEach(v => v.products.forEach(p => { prodCnt[p.name] = (prodCnt[p.name] || 0) + p.qty; }));
    return { shopCount, shopAvg, payBrk, hpbTotal, menuCnt, totalMenuCnt, prodCnt };
  }, [fv, shopRev]);

  // 顧客集計
  const { returnCount, returnRate, newCustomerCount, newVisitors, existingVisitors, totalPeriodAppts, newRate, existingRate, monthlyNewEx, genBrk } = useMemo(() => {
    const visitMap = {};
    visits.forEach(v => { visitMap[v.customerId] = (visitMap[v.customerId] || 0) + 1; });
    const returnCount = Object.values(visitMap).filter(n => n > 1).length;
    const returnRate = customers.length > 0 ? pct(returnCount, customers.length) : 0;
    const newCustomerIds = new Set(visits.filter(v => v.customerType === "new").map(v => v.customerId));
    const newCustomerCount = newCustomerIds.size;

    const periodVisits2 = visits.filter(v => {
      if (!v.paid && (v.total === 0 || v.total === undefined)) return false;
      const vDate = v.date;
      if (period === "month") {
        const target = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
        const dDate = new Date(vDate + "T00:00:00");
        return dDate.getFullYear() === target.getFullYear() && dDate.getMonth() === target.getMonth();
      }
      if (period === "3m") { const cut = new Date(now.getFullYear(), now.getMonth()-3, now.getDate()); return new Date(vDate+"T00:00:00") >= cut; }
      if (period === "year") return vDate.startsWith(String(now.getFullYear()));
      return true;
    });
    const newVisitors = periodVisits2.filter(v => v.customerType === "new").length;
    const existingVisitors = periodVisits2.filter(v => v.customerType === "existing").length;
    const totalPeriodAppts = newVisitors + existingVisitors;
    const newRate = totalPeriodAppts > 0 ? pct(newVisitors, totalPeriodAppts) : 0;
    const existingRate = totalPeriodAppts > 0 ? pct(existingVisitors, totalPeriodAppts) : 0;

    const monthlyNewEx = [];
    for (let i = 5; i >= 0; i--) {
      const d3 = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStr3 = `${d3.getFullYear()}-${String(d3.getMonth()+1).padStart(2,"0")}`;
      const mVisits = visits.filter(v => v.date.startsWith(mStr3));
      monthlyNewEx.push({ label: (d3.getMonth()+1) + "月", newV: mVisits.filter(v => v.customerType === "new").length, existV: mVisits.filter(v => v.customerType === "existing").length });
    }

    const genBrk = { female: 0, male: 0, other: 0 };
    fv.forEach(v => { const c = customers.find(x => x.id === v.customerId); if (c) genBrk[c.gender] = (genBrk[c.gender] || 0) + 1; });
    return { returnCount, returnRate, newCustomerCount, newVisitors, existingVisitors, totalPeriodAppts, newRate, existingRate, monthlyNewEx, genBrk };
  }, [visits, customers, fv, period, monthOffset]);

  // グラフデータ生成
  const chartData = useMemo(() => {
    if (period === "day") {
      // 時間別（0〜23時）
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      const dateStr = `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,"0")}-${String(target.getDate()).padStart(2,"0")}`;
      const dayVisits = visits.filter(v => v.date === dateStr && (v.paid || v.total > 0));
      return Array.from({length: 24}, (_, h) => ({
        label: h % 3 === 0 ? h + "時" : "",
        rev: dayVisits.filter(v => parseInt((v.time||"0:").split(":")[0]) === h).reduce((s,v)=>s+v.total,0),
      }));
    }
    if (period === "month") {
      // 日別（1〜月末）
      const target = new Date(now); target.setMonth(target.getMonth() + monthOffset);
      const y = target.getFullYear(); const m = target.getMonth();
      const days = new Date(y, m+1, 0).getDate();
      return Array.from({length: days}, (_, i) => {
        const d = i + 1;
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        return { label: d % 5 === 1 ? d + "日" : "", rev: visits.filter(v => v.date === dateStr).reduce((s,v)=>s+v.total,0) };
      });
    }
    // 3ヶ月・今年・全期間 → 月別6ヶ月
    const result = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const mv = visits.filter(v => v.date.startsWith(mStr) && (v.paid || v.total > 0));
      result.push({ label: (d.getMonth()+1) + "月", rev: mv.reduce((s,v)=>s+v.total,0) });
    }
    return result;
  }, [visits, period, dayOffset, monthOffset]);

  const maxRev = Math.max(...chartData.map(d => d.rev), 1);

  // 折れ線グラフSVG
  const LineChart = ({ data, color = "#7a6848" }) => {
    const W = 280; const H = 80; const pad = 8;
    const points = data.map((d, i) => {
      const x = pad + (i / Math.max(data.length - 1, 1)) * (W - pad * 2);
      const y = H - pad - (d.rev / maxRev) * (H - pad * 2);
      return [x, y];
    });
    const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
    const areaD = `${pathD} L${points[points.length-1][0]},${H-pad} L${points[0][0]},${H-pad} Z`;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 90 }}>
        <defs>
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.2"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaD} fill="url(#chartGrad)"/>
        <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {points.map((p, i) => data[i].rev > 0 && <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
      </svg>
    );
  };

  const HBar = ({ label, value, max, color, suffix = "" }) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
        <span style={{ color: C.text }}>{label}</span>
        <span style={{ fontWeight: 700, color }}>{value.toLocaleString()}{suffix}</span>
      </div>
      <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
        <div style={{ height: 6, borderRadius: 3, background: color, width: `${Math.min(pct(value, max), 100)}%`, transition: "width 0.5s" }} />
      </div>
    </div>
  );

  // 売上内訳行
  const RevRow = ({ label, value, sub, bold }) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
      <span style={{ color: sub ? C.sub : C.text, fontSize: sub ? 12 : 14, paddingLeft: sub ? 12 : 0 }}>{label}</span>
      <span style={{ fontWeight: bold ? 800 : 600, color: bold ? C.text : C.text }}>{value.toLocaleString()} 円</span>
    </div>
  );
  const RevRowCount = ({ label, value, unit }) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
      <span style={{ color: C.sub, fontSize: 12, paddingLeft: 12 }}>{label}</span>
      <span style={{ fontWeight: 600, color: C.text }}>{value.toLocaleString()} {unit}</span>
    </div>
  );

  const SUBTABS = [["sales", "売上"], ["menu", "メニュー"], ["customer", "顧客"], ["product", "店販"]];

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* ヘッダー */}
      <div style={{ background: "#fff", padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}>
        {/* 期間モード */}
        <div style={{ display: "flex", background: C.border + "88", borderRadius: 10, padding: 3, marginBottom: 10 }}>
          {[["day", "日"], ["month", "月"], ["3m", "3ヶ月"], ["year", "今年"], ["all", "全期間"]].map(([k, l]) => (
            <button key={k} onClick={() => setPeriod(k)} style={{ flex: 1, padding: "7px 2px", borderRadius: 8, border: "none", background: period === k ? C.card : "transparent", color: period === k ? C.accent : C.sub, fontWeight: 700, fontSize: 11, cursor: "pointer", boxShadow: period === k ? "0 1px 3px rgba(0,0,0,0.12)" : "none" }}>{l}</button>
          ))}
        </div>
        {/* 日・月ナビ */}
        {(period === "day" || period === "month") && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
            <button onClick={() => period === "day" ? setDayOffset(o => o-1) : setMonthOffset(o => o-1)}
              style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 13, color: C.text }}>＜</button>
            <button onClick={() => period === "day" ? setDayOffset(0) : setMonthOffset(0)}
              style={{ background: "#E8DCC3", border: "none", borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 12, color: "#2a2218" }}>今日</button>
            <div style={{ fontWeight: 700, fontSize: 14, color: C.text, flex: 1, textAlign: "center" }}>{periodLabel}</div>
            <button onClick={() => period === "day" ? setDayOffset(o => o+1) : setMonthOffset(o => o+1)}
              style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 13, color: C.text }}>＞</button>
          </div>
        )}
      </div>

      <div style={{ padding: "12px 16px" }}>
        {/* KPI strip */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
          {[["総売上", yen(totalRev), C.accent], ["来店件数", fv.length + "件", C.green], ["再来率", returnRate + "%", C.purple], ["HPB利用", yen(hpbTotal), "#ff6b35"]].map(([l, v, c]) => (
            <div key={l} style={{ ...css.card, marginBottom: 0, textAlign: "center", padding: "14px 8px" }}>
              <div style={{ fontSize: 20, fontWeight: 800, color: c }}>{v}</div>
              <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Sub-tab nav */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
          {SUBTABS.map(([k, l]) => (
            <button key={k} onClick={() => setSubTab(k)} style={{ padding: "7px 16px", borderRadius: 20, border: "none", background: subTab === k ? C.accent : C.border + "88", color: subTab === k ? "#fff" : C.sub, fontWeight: 700, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>{l}</button>
          ))}
        </div>

        {/* ── 売上サブタブ ── */}
        {subTab === "sales" && (
          <>
            {/* 折れ線グラフ */}
            <div style={css.card}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>
                  {period === "day" ? "時間別売上" : period === "month" ? "日別売上推移" : "月別売上推移（6ヶ月）"}
                </div>
                <div style={{ fontSize: 12, color: C.accent, fontWeight: 700 }}>{yen(totalRev)}</div>
              </div>
              <LineChart data={chartData} color="#7a6848" />
              {/* x軸ラベル */}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 2 }}>
                {period === "day"
                  ? [0,3,6,9,12,15,18,21].map(h => <div key={h} style={{ fontSize: 9, color: C.sub }}>{h}時</div>)
                  : period === "month"
                    ? (() => { const days = chartData.length; return [1, Math.floor(days/4), Math.floor(days/2), Math.floor(days*3/4), days].map(d => <div key={d} style={{ fontSize: 9, color: C.sub }}>{d}日</div>); })()
                    : chartData.filter(d => d.label).map((d, i) => <div key={i} style={{ fontSize: 9, color: C.sub }}>{d.label}</div>)
                }
              </div>
            </div>

            {/* HPB風 売上詳細 */}
            <div style={css.card}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>売上レポート</div>
              <RevRow label="全体の売上合計（技術＋店販）" value={totalRev} bold />
              <RevRow label="技術売上（指名＋フリー）" value={techRev} />
              <RevRowCount label="平均単価" value={techAvg} unit="円" />
              <RevRowCount label="来店人数" value={fv.length} unit="人" />
              <RevRow label="指名売上" value={shimeikaRev} />
              <RevRowCount label="平均単価" value={shimeikaAvg} unit="円" />
              <RevRowCount label="来店人数" value={shimeikaSv.length} unit="人" />
              <RevRow label="フリー売上" value={freeRev} />
              <RevRowCount label="平均単価" value={freeAvg} unit="円" />
              <RevRowCount label="来店人数" value={freeSv.length} unit="人" />
              <RevRow label="店販売上" value={shopRev} />
              <RevRowCount label="平均単価" value={shopAvg} unit="円" />
              <RevRowCount label="販売個数" value={shopCount} unit="個" />
            </div>

            {/* お支払い方法別 */}
            <div style={css.card}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>お支払い方法別データ</div>
              <div style={{ fontSize: 11, color: C.sub, marginBottom: 10 }}>※表示金額は全て税込みです</div>
              <RevRow label="お支払い合計金額" value={totalRev} bold />
              {[["cash", "現金"], ["card", "カード"], ["qr", "QR払い"]].map(([k, l]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                  <span style={{ color: C.sub }}>{l}</span>
                  <span style={{ fontWeight: 600 }}>{(payBrk[k] || 0).toLocaleString()} 円</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", fontSize: 14 }}>
                <span style={{ color: C.sub }}>HPBポイント割引</span>
                <span style={{ fontWeight: 600, color: "#ff6b35" }}>{hpbTotal.toLocaleString()} 円</span>
              </div>
            </div>
          </>
        )}

        {/* ── メニューサブタブ ── */}
        {subTab === "menu" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>メニュー比率・販売数</div>
              {Object.entries(menuCnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name, cnt]) => (
                <HBar key={name} label={name} value={cnt} max={Math.max(...Object.values(menuCnt))} color={C.accent} suffix="回" />
              ))}
              {Object.keys(menuCnt).length === 0 && <div style={{ color: C.sub, fontSize: 13 }}>データなし</div>}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>カテゴリ別売上</div>
              {(() => {
                const catRev = {};
                fv.forEach(v => v.menus.forEach(vm => {
                  const md = menus.find(m => m.id === vm.menuId);
                  const cat = md?.category || "その他";
                  catRev[cat] = (catRev[cat] || 0) + vm.price;
                }));
                const maxC = Math.max(...Object.values(catRev), 1);
                return Object.entries(catRev).sort((a,b)=>b[1]-a[1]).map(([cat, rev]) => (
                  <HBar key={cat} label={cat} value={rev} max={maxC} color={C.accent} suffix="円" />
                ));
              })()}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 8 }}>セットメニュー件数</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#7a6848" }}>
                {fv.reduce((s,v) => s + (v.menus||[]).filter(vm => { const md = menus.find(m => m.id === vm.menuId); return md?.category === "セット"; }).length, 0)}件
              </div>
            </div>
          </>
        )}

        {/* ── 顧客サブタブ ── */}
        {subTab === "customer" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客分析</div>
              {[
                ["登録顧客数", customers.length + "名"],
                ["リピート顧客", returnCount + "名"],
                ["再来率（全期間）", returnRate + "%"],
                ["新規顧客（全期間）", newCustomerCount + "名"],
              ].map(([l, v]) => (
                <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                  <span style={{ color: C.sub }}>{l}</span><span style={{ fontWeight: 700 }}>{v}</span>
                </div>
              ))}
            </div>
            {/* タグ別 */}
            {(() => {
              const tagCounts = {};
              const totalVisitors = new Set();
              fv.forEach(v => {
                totalVisitors.add(v.customerId);
                v.menus.forEach(vm => {
                  const menuDef = menus.find(m => m.id === vm.menuId);
                  const tags = menuDef?.tags || [];
                  tags.forEach(tag => {
                    if (!tagCounts[tag]) tagCounts[tag] = new Set();
                    tagCounts[tag].add(v.customerId);
                  });
                });
              });
              const totalUniq = totalVisitors.size || 1;
              const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1].size - a[1].size);
              return sortedTags.length > 0 ? (
                <div style={css.card}>
                  <div style={{ fontWeight: 700, marginBottom: 12 }}>タグ別 客数・比率</div>
                  {sortedTags.map(([tag, custSet]) => (
                    <div key={tag} style={{ marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
                        <span style={{ fontWeight: 700 }}>{tag}</span>
                        <span style={{ color: "#7a6848", fontWeight: 700 }}>{custSet.size}人 <span style={{ color: C.sub, fontWeight: 400 }}>({pct(custSet.size, totalUniq)}%)</span></span>
                      </div>
                      <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
                        <div style={{ height: 6, borderRadius: 3, background: "#7a6848", width: `${pct(custSet.size, totalUniq)}%`, transition: "width 0.5s" }} />
                      </div>
                    </div>
                  ))}
                </div>
              ) : null;
            })()}
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>性別比率</div>
              {[["female","女性","#ff6b6b"],["male","男性","#6b9fff"],["other","その他","#9a9088"]].map(([k,l,c]) => (
                <HBar key={k} label={l} value={genBrk[k]} max={fv.length||1} color={c} suffix="人" />
              ))}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 8 }}>新規・再来内訳</div>
              <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                <div style={{ flex: 1, textAlign: "center", background: "#fff3e0", borderRadius: 10, padding: "12px 8px" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.orange }}>{newVisitors}人</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>新規</div>
                </div>
                <div style={{ flex: 1, textAlign: "center", background: "#f5ede0", borderRadius: 10, padding: "12px 8px" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: "#7a6848" }}>{existingVisitors}人</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>再来</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#7a6848" }}>{existingRate}%</div>
                </div>
              </div>
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客別売上 TOP</div>
              {(() => {
                const custRev = {};
                visits.forEach(v => { custRev[v.customerId] = (custRev[v.customerId] || 0) + v.total; });
                return Object.entries(custRev).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id, rev]) => {
                  const c = customers.find(x => x.id === parseInt(id));
                  return c ? (
                    <div key={id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                      <span>{c.name}</span><span style={{ fontWeight: 700, color: C.accent }}>{yen(rev)}</span>
                    </div>
                  ) : null;
                });
              })()}
            </div>
          </>
        )}

        {/* ── 店販サブタブ ── */}
        {subTab === "product" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>店販売上</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: C.green, marginBottom: 8 }}>{yen(shopRev)}</div>
              <div style={{ fontSize: 13, color: C.sub }}>販売個数：{shopCount}個</div>
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>商品別販売数</div>
              {Object.entries(prodCnt).sort((a,b)=>b[1]-a[1]).map(([name, cnt]) => (
                <HBar key={name} label={name} value={cnt} max={Math.max(...Object.values(prodCnt))} color={C.green} suffix="個" />
              ))}
              {Object.keys(prodCnt).length === 0 && <div style={{ color: C.sub, fontSize: 13 }}>データなし</div>}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>店販比率</div>
              <HBar label="技術売上" value={techRev} max={totalRev||1} color={C.accent} suffix="円" />
              <HBar label="店販売上" value={shopRev} max={totalRev||1} color={C.green} suffix="円" />
              <div style={{ padding: "10px 0", fontSize: 14, display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontWeight: 700 }}>店販比率</span>
                <span style={{ fontWeight: 800, fontSize: 18, color: C.green }}>{pct(shopRev, totalRev||1)}%</span>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function LogoSettingsTab({ setTab, notify, salonLogo, setSalonLogo, saveSetting }) {
  const fileRef = useRef();
  const [preview, setPreview] = useState(salonLogo);
  const [saving, setSaving] = useState(false);

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024 * 2) {
      notify("画像は2MB以下にしてください", "error");
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => setPreview(ev.target.result);
    reader.readAsDataURL(file);
  };

  const save = async () => {
    setSaving(true);
    await saveSetting("salonLogo", preview);
    setSalonLogo(preview);
    setSaving(false);
    notify("ロゴを保存しました ✓");
  };

  const remove = async () => {
    setSaving(true);
    await saveSetting("salonLogo", null);
    setSalonLogo(null);
    setPreview(null);
    setSaving(false);
    notify("ロゴを削除しました");
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      {/* ヘッダー */}
      <div style={{ background: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.border}` }}>
        <button onClick={() => setTab("more")} style={{ background: "none", border: "none", color: "#7a6848", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>← メニュー</button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>サロンロゴ設定</div>
        <div style={{ width: 60 }} />
      </div>

      <div style={{ padding: 16 }}>
        {/* 説明 */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 16, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.7 }}>
            アプリ起動時の読み込み画面に表示されるロゴ画像を設定できます。<br/>
            推奨サイズ：正方形（300×300px以上）、2MB以下
          </div>
        </div>

        {/* プレビュー */}
        <div style={{ background: "#fff", borderRadius: 14, padding: 24, marginBottom: 16, border: `1px solid ${C.border}`, display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.sub, letterSpacing: 2, textTransform: "uppercase", alignSelf: "flex-start" }}>プレビュー</div>
          <div style={{ width: 120, height: 120, borderRadius: 16, background: C.bg, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
            {preview
              ? <img src={preview} alt="ロゴ" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
              : <span style={{ fontSize: 48 }}>💇</span>
            }
          </div>
          <div style={{ fontSize: 12, color: C.sub }}>
            {preview ? "設定済み" : "未設定（デフォルト絵文字が表示されます）"}
          </div>
        </div>

        {/* ボタン群 */}
        <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
        <button onClick={() => fileRef.current.click()}
          style={{ width: "100%", padding: "13px", borderRadius: 12, border: `1.5px solid ${C.border}`, background: "#fff", color: C.text, fontWeight: 700, fontSize: 15, cursor: "pointer", marginBottom: 10 }}>
          📁 画像を選択する
        </button>

        {preview && (
          <>
            <button onClick={save} disabled={saving}
              style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: "#E8DCC3", color: "#2a2218", fontWeight: 700, fontSize: 15, cursor: "pointer", marginBottom: 10 }}>
              {saving ? "保存中..." : "✓ このロゴを保存する"}
            </button>
            <button onClick={remove} disabled={saving}
              style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: "none", color: C.red, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
              ロゴを削除する
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function TagSettingsTab({ setTab, notify, tagCategories, setTagCategories }) {
  const [editCatId, setEditCatId] = useState(null);
  const [editCatName, setEditCatName] = useState("");
  const [newCatName, setNewCatName] = useState("");
  const [editItemId, setEditItemId] = useState(null);
  const [editItemName, setEditItemName] = useState("");
  const [newItemName, setNewItemName] = useState("");
  const [openCatId, setOpenCatId] = useState(null);

  const addCategory = async () => {
    const name = newCatName.trim();
    if (!name) return;
    const { data } = await sb.from("tag_categories").insert([{ name, sort_order: tagCategories.length }]).select();
    if (data && data[0]) {
      setTagCategories(p => [...p, { id: data[0].id, name, sortOrder: data[0].sort_order, items: [] }]);
      setNewCatName("");
      notify("カテゴリを追加しました ✓");
    }
  };

  const updateCategory = async (id) => {
    const name = editCatName.trim();
    if (!name) return;
    await sb.from("tag_categories").update({ name }).eq("id", id);
    setTagCategories(p => p.map(c => c.id === id ? { ...c, name } : c));
    setEditCatId(null);
    notify("更新しました ✓");
  };

  const deleteCategory = async (id) => {
    if (!window.confirm("このカテゴリとサブタグを全て削除しますか？")) return;
    await sb.from("tag_categories").delete().eq("id", id);
    setTagCategories(p => p.filter(c => c.id !== id));
    notify("削除しました");
  };

  const addItem = async (catId) => {
    const name = newItemName.trim();
    if (!name) return;
    const cat = tagCategories.find(c => c.id === catId);
    const { data } = await sb.from("tag_items").insert([{ category_id: catId, name, sort_order: (cat?.items||[]).length }]).select();
    if (data && data[0]) {
      setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: [...(c.items||[]), { id: data[0].id, name, sortOrder: data[0].sort_order }] } : c));
      setNewItemName("");
      notify("タグを追加しました ✓");
    }
  };

  const updateItem = async (catId, itemId) => {
    const name = editItemName.trim();
    if (!name) return;
    await sb.from("tag_items").update({ name }).eq("id", itemId);
    setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: c.items.map(i => i.id === itemId ? { ...i, name } : i) } : c));
    setEditItemId(null);
    notify("更新しました ✓");
  };

  const deleteItem = async (catId, itemId) => {
    await sb.from("tag_items").delete().eq("id", itemId);
    setTagCategories(p => p.map(c => c.id === catId ? { ...c, items: c.items.filter(i => i.id !== itemId) } : c));
    notify("削除しました");
  };

  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      <div style={{ background:"#E8DCC3", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <button onClick={() => setTab("more")} style={{ background:"none", border:"none", color:"#fff", fontSize:15, fontWeight:700, cursor:"pointer" }}>← 戻る</button>
        <div style={{ fontWeight:800, fontSize:16, color:"#fff" }}>タグ設定</div>
        <div style={{ width:48 }} />
      </div>
      <div style={{ padding:16 }}>
        {tagCategories.map(cat => (
          <div key={cat.id} style={{ background:"#fff", borderRadius:12, marginBottom:12, boxShadow:"0 1px 4px rgba(0,0,0,0.06)", overflow:"hidden" }}>
            <div style={{ display:"flex", alignItems:"center", padding:"12px 16px", gap:8 }}>
              {editCatId === cat.id ? (
                <>
                  <input value={editCatName} onChange={e => setEditCatName(e.target.value)}
                    style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:14 }} />
                  <button onClick={() => updateCategory(cat.id)} style={{ padding:"6px 12px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:13, cursor:"pointer" }}>保存</button>
                  <button onClick={() => setEditCatId(null)} style={{ padding:"6px 12px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", fontSize:13, cursor:"pointer" }}>✕</button>
                </>
              ) : (
                <>
                  <button onClick={() => setOpenCatId(openCatId === cat.id ? null : cat.id)} style={{ flex:1, background:"none", border:"none", textAlign:"left", fontSize:15, fontWeight:800, color:C.text, cursor:"pointer" }}>
                    {cat.name} {openCatId === cat.id ? "▲" : "▼"}
                  </button>
                  <button onClick={() => { setEditCatId(cat.id); setEditCatName(cat.name); }} style={{ background:"none", border:"none", fontSize:14, cursor:"pointer", color:C.sub }}>編集</button>
                  <button onClick={() => deleteCategory(cat.id)} style={{ background:"none", border:"none", fontSize:14, cursor:"pointer", color:"#ff6b6b" }}>削除</button>
                </>
              )}
            </div>
            {openCatId === cat.id && (
              <div style={{ padding:"0 16px 14px", borderTop:`1px solid ${C.border}` }}>
                {(cat.items||[]).map(item => (
                  <div key={item.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0", borderBottom:`1px solid ${C.border}` }}>
                    {editItemId === item.id ? (
                      <>
                        <input value={editItemName} onChange={e => setEditItemName(e.target.value)}
                          style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 8px", fontSize:13 }} />
                        <button onClick={() => updateItem(cat.id, item.id)} style={{ padding:"5px 10px", borderRadius:8, border:"none", background:"#E8DCC3", color:"#2a2218", fontWeight:700, fontSize:12, cursor:"pointer" }}>保存</button>
                        <button onClick={() => setEditItemId(null)} style={{ padding:"5px 10px", borderRadius:8, border:`1px solid ${C.border}`, background:"#fff", fontSize:12, cursor:"pointer" }}>✕</button>
                      </>
                    ) : (
                      <>
                        <span style={{ flex:1, fontSize:14, color:C.text }}>{item.name}</span>
                        <button onClick={() => { setEditItemId(item.id); setEditItemName(item.name); }} style={{ background:"none", border:"none", fontSize:13, cursor:"pointer", color:C.sub }}>編集</button>
                        <button onClick={() => deleteItem(cat.id, item.id)} style={{ background:"none", border:"none", fontSize:13, cursor:"pointer", color:"#ff6b6b" }}>削除</button>
                      </>
                    )}
                  </div>
                ))}
                <div style={{ display:"flex", gap:8, marginTop:10 }}>

const APPT_COLORS = ["#C8A15A", "#e8829a", "#e8a864", "#7a9aba", "#9a88c8", "#72b08a"];
const DAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
const HOUR_START = 6;
const HOUR_END = 23;
const CELL_H = 60;

// Get business open/close hours for a date
function getBizForDate(date, bizHours, closedDaysOfWeek, personalHolidays) {
  if (!bizHours) return { open: "06:00", close: "23:00", isHoliday: false };
  const d = new Date(date + "T00:00:00");
  const dayIdx = d.getDay(); // 0=Sun
  const dayKeys = ["sun","mon","tue","wed","thu","fri","sat"];
  const dayJp = ["日","月","火","水","木","金","土"];
  const key = dayKeys[dayIdx];
  const jp = dayJp[dayIdx];
  const isPersonalHoliday = (personalHolidays||[]).includes(date);
  const isClosedDay = (closedDaysOfWeek||[]).includes(jp);
  const dayHours = bizHours[key] || { open:"06:00", close:"23:00", closed:false };
  const isHoliday = isPersonalHoliday || isClosedDay || dayHours.closed;
  return { open: dayHours.open, close: dayHours.close, isHoliday };
}

function getDefaultBizOpen(bizHours) {
  if (!bizHours) return "10:00";
  const opens = Object.values(bizHours).filter(h => !h.closed).map(h => h.open);
  return opens.sort()[0] || "10:00";
}

function getWeekStart(offset = 0) {
  const now = new Date();
  // JST基準で今日の曜日を取得（0=日,1=月,...,6=土）
  const jstDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = jstDate.getDay(); // 0=日
  // 月曜始まり：月曜日を週の先頭に
  const diffToMon = day === 0 ? -6 : -(day - 1);
  const mon = new Date(jstDate);
  mon.setDate(jstDate.getDate() + diffToMon + offset * 7);
  return mon;
}
