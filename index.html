function MenuPickerSheet({ menus, selectedIds, onToggle, onClose, visits }) {
  const [openCats, setOpenCats] = useState({});

  // "よく使う" = top 5 by frequency in visits
  const menuFreq = {};
  (visits || []).forEach(v => (v.menus || []).forEach(m => {
    menuFreq[m.menuId] = (menuFreq[m.menuId] || 0) + 1;
  }));
  const popular = [...menus]
    .sort((a, b) => (menuFreq[b.id] || 0) - (menuFreq[a.id] || 0))
    .slice(0, 5);

  const cats = {};
  menus.forEach(m => {
    if (!cats[m.category]) cats[m.category] = [];
    cats[m.category].push(m);
  });

  const toggleCat = (cat) => setOpenCats(p => ({ ...p, [cat]: !p[cat] }));

  const MenuRow = ({ m }) => {
    const sel = (selectedIds || []).includes(m.id);
    return (
      <div onClick={() => onToggle(m)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 16px", borderBottom: `1px solid ${C.border}`, cursor: "pointer", background: sel ? "#f0fffe" : "#fff" }}>
        <span style={{ fontSize: 15, color: sel ? "#7a6848" : C.text, fontWeight: sel ? 700 : 400 }}>{m.name}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {m.price > 0 && <span style={{ fontSize: 13, color: C.sub }}>{m.price.toLocaleString()} 円</span>}
          {sel && <span style={{ color: "#7a6848", fontWeight: 800, fontSize: 16 }}>✓</span>}
        </div>
      </div>
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 950, display: "flex", alignItems: "flex-end" }}>
      <div style={{ background: C.bg, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 480, margin: "0 auto", maxHeight: "85vh", display: "flex", flexDirection: "column" }}>
        <div style={{ background: "#fff", overflowY: "auto", flex: 1 }}>
          {/* よく使うメニュー */}
          {popular.length > 0 && (
            <>
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#f0efee", borderBottom: `1px solid ${C.border}` }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: "#f0efee", border: `1px solid ${C.border}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9088" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span style={{ fontWeight: 700, fontSize: 15 }}>よく使うメニュー</span>
              </div>
              {popular.map(m => <MenuRow key={"pop_" + m.id} m={m} />)}
            </>
          )}

          {/* Category dropdowns */}
          {Object.entries(cats).map(([cat, items]) => {
            const bg = MENU_CATEGORY_COLORS[cat] || "#f0efee";
            const stroke = MENU_CATEGORY_STROKE[cat] || "#9a9088";
            const SvgIcon = MENU_CATEGORY_SVG[cat];
            const isOpen = openCats[cat] !== false;
            return (
              <div key={cat}>
                <div onClick={() => toggleCat(cat)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", background: "#fff", borderBottom: `1px solid ${C.border}`, cursor: "pointer" }}>
                  <div style={{ width: 36, height: 36, borderRadius: 10, background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {SvgIcon ? SvgIcon(stroke) : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={stroke} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>}
                  </div>
                  <span style={{ fontWeight: 700, fontSize: 15, flex: 1 }}>{cat}</span>
                  <span style={{ color: C.sub, fontSize: 14 }}>{isOpen ? "▲" : "▼"}</span>
                </div>
                {isOpen && items.map(m => <MenuRow key={m.id} m={m} />)}
              </div>
            );
          })}
        </div>

        {/* Complete button */}
        <div style={{ padding: "12px 16px 28px", background: "#fff", borderTop: `1px solid ${C.border}` }}>
          <button onClick={onClose} style={{ width: "100%", padding: "16px", borderRadius: 12, border: "none", background: "#E8DCC3", color: "#2a2218", fontWeight: 800, fontSize: 17, cursor: "pointer" }}>
            メニュー選択を完了する
          </button>
        </div>
      </div>
    </div>
  );
}

function PastVisitsPanel({ visits: pv }) {
  const [open, setOpen] = useState(false);
  const PREVIEW = 3;
  const shown = open ? pv : pv.slice(0, PREVIEW);
  return (
    <div style={{ ...css.card, background: "#f0f7ff", border: `1px solid ${C.accent}33`, marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: C.accent, display:"flex", alignItems:"center", gap:4 }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg> 過去の施術履歴（全{pv.length}回）</span>
        {pv.length > PREVIEW && (
          <button onClick={() => setOpen(o => !o)} style={{ background: "none", border: `1px solid ${C.accent}`, borderRadius: 20, padding: "2px 10px", fontSize: 11, color: C.accent, fontWeight: 700, cursor: "pointer" }}>
            {open ? "閉じる ▲" : `全て見る ▼`}
          </button>
        )}
      </div>
      <div style={{ maxHeight: open ? 320 : "none", overflowY: open ? "auto" : "visible" }}>
        {shown.map((v, i) => (
          <div key={v.id} style={{ padding: "7px 0", borderBottom: i < shown.length - 1 ? `1px solid ${C.border}` : "none" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{v.date} {v.time}</div>
                <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>{(v.menus||[]).map(m => m.name).join("・")}</div>
                {v.notes ? <div style={{ fontSize: 11, color: C.sub, marginTop: 1 }}>📝 {v.notes}</div> : null}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.accent, flexShrink: 0, marginLeft: 8 }}>{yen(v.total)}</div>
            </div>
          </div>
        ))}
      </div>
      {!open && pv.length > PREVIEW && (
        <div style={{ fontSize: 11, color: C.sub, textAlign: "center", marginTop: 6 }}>
          他 {pv.length - PREVIEW}件…
        </div>
      )}
    </div>
  );
}


function AnalyticsTab({ visits, customers, menus, products, appointments, purchaseCosts, purchaseCategories }) {
  const [period, setPeriod] = useState("month");
  const [subTab, setSubTab] = useState("sales");
  // 日・月モード用オフセット
  const [dayOffset, setDayOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);
  const [showNewList, setShowNewList] = useState(false);
  const [reportCopied, setReportCopied] = useState(false);

  const now = new Date();

  // 表示対象のvisitsを期間でフィルタ
  const fv = useMemo(() => visits.filter(v => {
    // 未会計（total=0かつpaid=false）は除外
    if (!v.paid && (v.total === 0 || v.total === undefined)) return false;
    // 日付比較はすべて文字列（YYYY-MM-DD）で行いUTCズレを防ぐ
    const vDate = v.date; // "2026-06-05"形式
    if (period === "day") {
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      const targetStr = `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,"0")}-${String(target.getDate()).padStart(2,"0")}`;
      return vDate === targetStr;
    }
    if (period === "month") {
      const target = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
      const y = target.getFullYear(), m = target.getMonth();
      const dDate = new Date(vDate + "T00:00:00");
      return dDate.getFullYear() === y && dDate.getMonth() === m;
    }
    if (period === "3m") {
      const cut = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate());
      return new Date(vDate + "T00:00:00") >= cut;
    }
    if (period === "year") return vDate.startsWith(String(now.getFullYear()));
    return true;
  }), [visits, period, dayOffset, monthOffset]);

  // 期間ラベル
  const periodLabel = (() => {
    if (period === "day") {
      const t = new Date(now); t.setDate(t.getDate() + dayOffset);
      return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,"0")}/${String(t.getDate()).padStart(2,"0")}`;
    }
    if (period === "month") {
      const t = new Date(now); t.setMonth(t.getMonth() + monthOffset);
      return `${t.getFullYear()}年${t.getMonth()+1}月`;
    }
    return null;
  })();

  // 売上集計
  const { totalRev, shopRev, drugCostTotal, techRev, avg, techAvg } = useMemo(() => {
    const totalRev = fv.reduce((s, v) => s + v.total, 0);
    const shopRev = fv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.price * p.qty, 0), 0);
    const drugCostTotal = fv.reduce((s, v) => s + (v.drugCost || 0), 0);
    const techRev = totalRev - shopRev - drugCostTotal;
    const avg = fv.length ? Math.round(totalRev / fv.length) : 0;
    const techAvg = fv.length ? Math.round(techRev / fv.length) : 0;
    return { totalRev, shopRev, drugCostTotal, techRev, avg, techAvg };
  }, [fv]);

  // 指名・フリー集計
  const { shimeikaSv, freeSv, shimeikaRev, freeRev, shimeikaAvg, freeAvg } = useMemo(() => {
    const shimeikaSv = fv.filter(v => (v.appointmentId ? (appointments.find(a => a.id === v.appointmentId)?.shimeika || "shimeika") : "shimeika") === "shimeika");
    const freeSv = fv.filter(v => (v.appointmentId ? (appointments.find(a => a.id === v.appointmentId)?.shimeika || "shimeika") : "shimeika") === "free");
    const shimeikaRev = shimeikaSv.reduce((s, v) => s + v.total - (v.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0), 0);
    const freeRev = freeSv.reduce((s, v) => s + v.total - (v.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0), 0);
    const shimeikaAvg = shimeikaSv.length ? Math.round(shimeikaRev / shimeikaSv.length) : 0;
    const freeAvg = freeSv.length ? Math.round(freeRev / freeSv.length) : 0;
    return { shimeikaSv, freeSv, shimeikaRev, freeRev, shimeikaAvg, freeAvg };
  }, [fv, appointments]);

  // 店販・支払方法・メニュー集計
  const { shopCount, shopAvg, payBrk, hpbTotal, menuCnt, totalMenuCnt, prodCnt } = useMemo(() => {
    // 店販
    const shopCount = fv.reduce((s, v) => s + (v.products||[]).reduce((ss, p) => ss + p.qty, 0), 0);
    const shopAvg = fv.filter(v => (v.products||[]).length > 0).length ? Math.round(shopRev / fv.filter(v => (v.products||[]).length > 0).length) : 0;
    // 支払方法
    const payBrk = { cash: 0, card: 0, qr: 0, point: 0 };
    fv.forEach(v => { payBrk[v.paymentMethod] = (payBrk[v.paymentMethod] || 0) + v.total; });
    const hpbTotal = fv.reduce((s, v) => s + (v.hpbPoint || 0), 0);
    // メニュー集計
    const menuCnt = {};
    fv.forEach(v => v.menus.forEach(m => { menuCnt[m.name] = (menuCnt[m.name] || 0) + 1; }));
    const totalMenuCnt = Object.values(menuCnt).reduce((s, n) => s + n, 0);
    const prodCnt = {};
    fv.forEach(v => v.products.forEach(p => { prodCnt[p.name] = (prodCnt[p.name] || 0) + p.qty; }));
    return { shopCount, shopAvg, payBrk, hpbTotal, menuCnt, totalMenuCnt, prodCnt };
  }, [fv, shopRev]);

  // 顧客集計
  const { returnCount, returnRate, newCustomerCount, newVisitors, newVisitorList, existingVisitors, totalPeriodAppts, newRate, existingRate, monthlyNewEx, genBrk } = useMemo(() => {
    const visitMap = {};
    visits.forEach(v => { visitMap[v.customerId] = (visitMap[v.customerId] || 0) + 1; });
    const returnCount = Object.values(visitMap).filter(n => n > 1).length;
    const returnRate = customers.length > 0 ? pct(returnCount, customers.length) : 0;
    const newCustomerIds = new Set(visits.filter(v => v.customerType === "new").map(v => v.customerId));
    const newCustomerCount = newCustomerIds.size;

    const periodVisits2 = visits.filter(v => {
      if (!v.paid && (v.total === 0 || v.total === undefined)) return false;
      const vDate = v.date;
      if (period === "month") {
        const target = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
        const dDate = new Date(vDate + "T00:00:00");
        return dDate.getFullYear() === target.getFullYear() && dDate.getMonth() === target.getMonth();
      }
      if (period === "3m") { const cut = new Date(now.getFullYear(), now.getMonth()-3, now.getDate()); return new Date(vDate+"T00:00:00") >= cut; }
      if (period === "year") return vDate.startsWith(String(now.getFullYear()));
      return true;
    });
    const newVisitors = periodVisits2.filter(v => v.customerType === "new").length;
    const newVisitorList = periodVisits2.filter(v => v.customerType === "new").map(v => customers.find(c => c.id === v.customerId)).filter(Boolean).filter((c, i, a) => a.findIndex(x => x.id === c.id) === i);
    const existingVisitors = periodVisits2.filter(v => v.customerType === "existing").length;
    const totalPeriodAppts = newVisitors + existingVisitors;
    const newRate = totalPeriodAppts > 0 ? pct(newVisitors, totalPeriodAppts) : 0;
    const existingRate = totalPeriodAppts > 0 ? pct(existingVisitors, totalPeriodAppts) : 0;

    const monthlyNewEx = [];
    for (let i = 5; i >= 0; i--) {
      const d3 = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStr3 = `${d3.getFullYear()}-${String(d3.getMonth()+1).padStart(2,"0")}`;
      const mVisits = visits.filter(v => v.date.startsWith(mStr3));
      monthlyNewEx.push({ label: (d3.getMonth()+1) + "月", newV: mVisits.filter(v => v.customerType === "new").length, existV: mVisits.filter(v => v.customerType === "existing").length });
    }

    const genBrk = { female: 0, male: 0, other: 0 };
    fv.forEach(v => { const c = customers.find(x => x.id === v.customerId); if (c) genBrk[c.gender] = (genBrk[c.gender] || 0) + 1; });
    return { returnCount, returnRate, newCustomerCount, newVisitors, newVisitorList, existingVisitors, totalPeriodAppts, newRate, existingRate, monthlyNewEx, genBrk };
  }, [visits, customers, fv, period, monthOffset]);

  // グラフデータ生成
  const chartData = useMemo(() => {
    if (period === "day") {
      // 時間別（0〜23時）
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      const dateStr = `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,"0")}-${String(target.getDate()).padStart(2,"0")}`;
      const dayVisits = visits.filter(v => v.date === dateStr && (v.paid || v.total > 0));
      return Array.from({length: 24}, (_, h) => ({
        label: h % 3 === 0 ? h + "時" : "",
        rev: dayVisits.filter(v => parseInt((v.time||"0:").split(":")[0]) === h).reduce((s,v)=>s+v.total,0),
      }));
    }
    if (period === "month") {
      // 日別（1〜月末）
      const target = new Date(now); target.setMonth(target.getMonth() + monthOffset);
      const y = target.getFullYear(); const m = target.getMonth();
      const days = new Date(y, m+1, 0).getDate();
      return Array.from({length: days}, (_, i) => {
        const d = i + 1;
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        return { label: d % 5 === 1 ? d + "日" : "", rev: visits.filter(v => v.date === dateStr).reduce((s,v)=>s+v.total,0) };
      });
    }
    // 3ヶ月・今年・全期間 → 月別6ヶ月
    const result = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const mv = visits.filter(v => v.date.startsWith(mStr) && (v.paid || v.total > 0));
      result.push({ label: (d.getMonth()+1) + "月", rev: mv.reduce((s,v)=>s+v.total,0) });
    }
    return result;
  }, [visits, period, dayOffset, monthOffset]);

  const maxRev = Math.max(...chartData.map(d => d.rev), 1);

  // 折れ線グラフSVG
  const LineChart = ({ data, color = "#7a6848" }) => {
    const W = 280; const H = 80; const pad = 8;
    const points = data.map((d, i) => {
      const x = pad + (i / Math.max(data.length - 1, 1)) * (W - pad * 2);
      const y = H - pad - (d.rev / maxRev) * (H - pad * 2);
      return [x, y];
    });
    const pathD = points.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
    const areaD = `${pathD} L${points[points.length-1][0]},${H-pad} L${points[0][0]},${H-pad} Z`;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 90 }}>
        <defs>
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.2"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={areaD} fill="url(#chartGrad)"/>
        <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {points.map((p, i) => data[i].rev > 0 && <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>)}
      </svg>
    );
  };

  const HBar = ({ label, value, max, color, suffix = "" }) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
        <span style={{ color: C.text }}>{label}</span>
        <span style={{ fontWeight: 700, color }}>{value.toLocaleString()}{suffix}</span>
      </div>
      <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
        <div style={{ height: 6, borderRadius: 3, background: color, width: `${Math.min(pct(value, max), 100)}%`, transition: "width 0.5s" }} />
      </div>
    </div>
  );

  // 売上内訳行
  const RevRow = ({ label, value, sub, bold }) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
      <span style={{ color: sub ? C.sub : C.text, fontSize: sub ? 12 : 14, paddingLeft: sub ? 12 : 0 }}>{label}</span>
      <span style={{ fontWeight: bold ? 800 : 600, color: bold ? C.text : C.text }}>{value.toLocaleString()} 円</span>
    </div>
  );
  const RevRowCount = ({ label, value, unit }) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
      <span style={{ color: C.sub, fontSize: 12, paddingLeft: 12 }}>{label}</span>
      <span style={{ fontWeight: 600, color: C.text }}>{value.toLocaleString()} {unit}</span>
    </div>
  );

  const SUBTABS = [["sales", "売上"], ["menu", "メニュー"], ["customer", "顧客"], ["product", "店販"]];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", paddingTop: (period === "day" || period === "month") ? 110 : 62 }}>
      {/* ヘッダー */}
      <div style={{ background: "#fff", padding: "12px 16px", borderBottom: `1px solid ${C.border}`, position: "fixed", top: 0, left: 0, right: 0, maxWidth: 480, margin: "0 auto", zIndex: 100 }}>
        {/* 期間モード */}
        <div style={{ display: "flex", background: C.border + "88", borderRadius: 10, padding: 3, marginBottom: 10 }}>
          {[["day", "日"], ["month", "月"], ["3m", "3ヶ月"], ["year", "今年"], ["all", "全期間"]].map(([k, l]) => (
            <button key={k} onClick={() => setPeriod(k)} style={{ flex: 1, padding: "7px 2px", borderRadius: 8, border: "none", background: period === k ? C.card : "transparent", color: period === k ? C.accent : C.sub, fontWeight: 700, fontSize: 11, cursor: "pointer", boxShadow: period === k ? "0 1px 3px rgba(0,0,0,0.12)" : "none" }}>{l}</button>
          ))}
        </div>
        {/* 日・月ナビ */}
        {(period === "day" || period === "month") && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
            <button onClick={() => period === "day" ? setDayOffset(o => o-1) : setMonthOffset(o => o-1)}
              style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 13, color: C.text }}>＜</button>
            <button onClick={() => period === "day" ? setDayOffset(0) : setMonthOffset(0)}
              style={{ background: "#E8DCC3", border: "none", borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 12, color: "#2a2218" }}>今日</button>
            <div style={{ fontWeight: 700, fontSize: 14, color: C.text, flex: 1, textAlign: "center" }}>{periodLabel}</div>
            <button onClick={() => period === "day" ? setDayOffset(o => o+1) : setMonthOffset(o => o+1)}
              style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 13, color: C.text }}>＞</button>
          </div>
        )}
      </div>

      <div style={{ padding: "12px 16px" }}>
        {/* KPI strip */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
          {[["総売上", yen(totalRev), C.accent], ["来店件数", fv.length + "件", C.green], ["再来率", returnRate + "%", C.purple], ["HPB利用", yen(hpbTotal), "#ff6b35"]].map(([l, v, c]) => (
            <div key={l} style={{ ...css.card, marginBottom: 0, textAlign: "center", padding: "14px 8px" }}>
              <div style={{ fontSize: 20, fontWeight: 800, color: c }}>{v}</div>
              <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>{l}</div>
            </div>
          ))}
        </div>

        {/* Sub-tab nav */}
        <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
          {SUBTABS.map(([k, l]) => (
            <button key={k} onClick={() => setSubTab(k)} style={{ padding: "7px 16px", borderRadius: 20, border: "none", background: subTab === k ? C.accent : C.border + "88", color: subTab === k ? "#fff" : C.sub, fontWeight: 700, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>{l}</button>
          ))}
        </div>

        {/* ── 売上サブタブ ── */}
        {subTab === "sales" && (
          <>
            {/* 折れ線グラフ */}
            <div style={css.card}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>
                  {period === "day" ? "時間別売上" : period === "month" ? "日別売上推移" : "月別売上推移（6ヶ月）"}
                </div>
                <div style={{ fontSize: 12, color: C.accent, fontWeight: 700 }}>{yen(totalRev)}</div>
              </div>
              <LineChart data={chartData} color="#7a6848" />
              {/* x軸ラベル */}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 2 }}>
                {period === "day"
                  ? [0,3,6,9,12,15,18,21].map(h => <div key={h} style={{ fontSize: 9, color: C.sub }}>{h}時</div>)
                  : period === "month"
                    ? (() => { const days = chartData.length; return [1, Math.floor(days/4), Math.floor(days/2), Math.floor(days*3/4), days].map(d => <div key={d} style={{ fontSize: 9, color: C.sub }}>{d}日</div>); })()
                    : chartData.filter(d => d.label).map((d, i) => <div key={i} style={{ fontSize: 9, color: C.sub }}>{d.label}</div>)
                }
              </div>
            </div>

            {/* HPB風 売上詳細 */}
            <div style={css.card}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>売上レポート</div>
              <RevRow label="全体の売上合計（技術＋店販）" value={totalRev} bold />
              <RevRow label="技術売上（指名＋フリー）" value={techRev} />
              <RevRowCount label="平均単価" value={techAvg} unit="円" />
              <RevRowCount label="来店人数" value={fv.length} unit="人" />
              <RevRow label="指名売上" value={shimeikaRev} />
              <RevRowCount label="平均単価" value={shimeikaAvg} unit="円" />
              <RevRowCount label="来店人数" value={shimeikaSv.length} unit="人" />
              <RevRow label="フリー売上" value={freeRev} />
              <RevRowCount label="平均単価" value={freeAvg} unit="円" />
              <RevRowCount label="来店人数" value={freeSv.length} unit="人" />
              <RevRow label="店販売上" value={shopRev} />
              <RevRowCount label="平均単価" value={shopAvg} unit="円" />
              <RevRowCount label="販売個数" value={shopCount} unit="個" />
            </div>

            {/* お支払い方法別 */}
            <div style={css.card}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>お支払い方法別データ</div>
              <div style={{ fontSize: 11, color: C.sub, marginBottom: 10 }}>※表示金額は全て税込みです</div>
              <RevRow label="お支払い合計金額" value={totalRev + hpbTotal} bold />
              {[["cash", "現金"], ["card", "カード"], ["qr", "QR払い"]].map(([k, l]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                  <span style={{ color: C.sub }}>{l}</span>
                  <span style={{ fontWeight: 600 }}>{(payBrk[k] || 0).toLocaleString()} 円</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", fontSize: 14 }}>
                <span style={{ color: C.sub }}>HPBポイント割引</span>
                <span style={{ fontWeight: 600, color: "#ff6b35" }}>{hpbTotal.toLocaleString()} 円</span>
              </div>
            </div>

            {period==="month" && (()=>{
              const target = new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
              const mKey = target.getFullYear()+"-"+String(target.getMonth()+1).padStart(2,"0");
              const raw = (purchaseCosts||{})[mKey]||null;
              const items = Array.isArray(raw)?raw:[];
              const legacy = (!Array.isArray(raw)&&raw)?raw:null;
              const sumCat = k => legacy?(legacy[k]||0):items.filter(i=>i.category===k).reduce((s,i)=>s+(i.amount||0),0);
              const catLabel = k => { const c=(purchaseCategories||[]).find(x=>x.key===k); return c?c.label:k; };
              const material = sumCat("material");
              const retail = sumCat("retail");
              const totalCost = legacy?((legacy.material||0)+(legacy.retail||0)+(legacy.supplies||0)):items.reduce((s,i)=>s+(i.amount||0),0);
              const otherCats = (purchaseCategories||[]).filter(c=>c.key!=="material"&&c.key!=="retail");
              const pctOf = (v,base) => base>0?Math.round(v/base*100):0;
              const OC_COLORS=["#9a88c8","#6aaa7a","#e8924a","#c88a9a","#b8a878"];
              const rows = [
                { k:"material", label:catLabel("material"), sub:"対技術売上", cost:material, p:pctOf(material,techRev), color:"#7a6848" },
                { k:"retail", label:catLabel("retail"), sub:"対店販売上", cost:retail, p:pctOf(retail,shopRev), color:"#7a9aba" },
                ...otherCats.map((c,i)=>({ k:c.key, label:c.label, sub:"対総売上", cost:sumCat(c.key), p:pctOf(sumCat(c.key),totalRev), color:OC_COLORS[i%OC_COLORS.length] })),
                { k:"_total", label:"総経費", sub:"対総売上", cost:totalCost, p:pctOf(totalCost,totalRev), color:"#2a2218" },
              ];
              return (
                <div style={css.card}>
                  <div style={{ fontWeight:800, fontSize:15, marginBottom:12 }}>経費率</div>
                  {totalCost===0
                    ? <div style={{ fontSize:13, color:C.sub, textAlign:"center", padding:"8px 0" }}>在庫タブの「仕入れ」から登録してください</div>
                    : rows.map(r=>(
                        <div key={r.k} style={{ padding:"10px 0", borderBottom:"1px solid "+C.border }}>
                          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                            <span style={{ fontSize:13, color:C.sub }}>{r.label}<span style={{ fontSize:10, marginLeft:4 }}>（{r.sub}）</span></span>
                            <div>
                              <span style={{ fontSize:13, fontWeight:700, color:r.color }}>{r.p}%</span>
                              <span style={{ fontSize:12, color:C.sub, marginLeft:8 }}>{"¥"}{r.cost.toLocaleString()}</span>
                            </div>
                          </div>
                          <div style={{ height:6, background:C.border, borderRadius:4, overflow:"hidden" }}>
                            <div style={{ height:"100%", width:Math.min(r.p,100)+"%", background:r.color, borderRadius:4 }} />
                          </div>
                        </div>
                      ))
                  }
                </div>
              );
            })()}

            {/* レポートコピーボタン */}
            {period==="month" && (()=>{
              const target = new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
              const mKey = target.getFullYear()+"-"+String(target.getMonth()+1).padStart(2,"0");
              const monthLabel = target.getFullYear()+"年"+(target.getMonth()+1)+"月";
              const raw = (purchaseCosts||{})[mKey]||null;
              const rItems = Array.isArray(raw)?raw:[];
              const rLegacy = (!Array.isArray(raw)&&raw)?raw:null;
              const sumCat = k => rLegacy?(rLegacy[k]||0):rItems.filter(i=>i.category===k).reduce((s,i)=>s+(i.amount||0),0);
              const catLabel = k => { const c=(purchaseCategories||[]).find(x=>x.key===k); return c?c.label:k; };
              const material = sumCat("material");
              const retail = sumCat("retail");
              const totalCost = rLegacy?((rLegacy.material||0)+(rLegacy.retail||0)+(rLegacy.supplies||0)):rItems.reduce((s,i)=>s+(i.amount||0),0);
              const otherCats = (purchaseCategories||[]).filter(c=>c.key!=="material"&&c.key!=="retail");
              const pctOf = (v,base) => base>0?Math.round(v/base*100):0;

              // 前月データ
              const prevTarget = new Date(now.getFullYear(), now.getMonth()+monthOffset-1, 1);
              const prevKey = prevTarget.getFullYear()+"-"+String(prevTarget.getMonth()+1).padStart(2,"0");
              const prevFv = visits.filter(v2=>v2.date.startsWith(prevKey)&&(v2.paid||v2.total>0));
              const prevRev = prevFv.reduce((s,v2)=>s+v2.total,0);
              const prevCount = prevFv.length;
              const prevShopRev = prevFv.reduce((s,v2)=>s+(v2.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0),0);
              const prevDrugCost = prevFv.reduce((s,v2)=>s+(v2.drugCost||0),0);
              const prevAvg = prevCount?Math.round((prevRev-prevShopRev-prevDrugCost)/prevCount):0;

              // メニュー別TOP5
              const menuMap = {};
              fv.forEach(v2=>(v2.menus||[]).forEach(m=>{ menuMap[m.name]=(menuMap[m.name]||0)+m.price; }));
              const topMenus = Object.entries(menuMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

              // 年代別
              const ageBrk = {"10代":0,"20代":0,"30代":0,"40代":0,"50代":0,"60代以上":0,"不明":0};
              customers.forEach(c=>{
                if(!c.birthday){ageBrk["不明"]++;return;}
                const age=Math.floor((new Date()-new Date(c.birthday))/31557600000);
                if(isNaN(age)||age<0)ageBrk["不明"]++;
                else if(age<20)ageBrk["10代"]++;
                else if(age<30)ageBrk["20代"]++;
                else if(age<40)ageBrk["30代"]++;
                else if(age<50)ageBrk["40代"]++;
                else if(age<60)ageBrk["50代"]++;
                else ageBrk["60代以上"]++;
              });

              // 新規・再来（既存の分析と同じcustomerType判定）
              const newCount = fv.filter(v2=>v2.customerType==="new").length;
              const repeatCount = fv.filter(v2=>v2.customerType!=="new").length;
              const repeatRate = fv.length?Math.round(repeatCount/fv.length*100):0;

              const shopRevMonth = fv.reduce((s,v2)=>s+(v2.products||[]).reduce((ss,p)=>ss+p.price*p.qty,0),0);

              const buildText = () => {
                const lines = [
                  "===== "+monthLabel+" サロンレポート =====",
                  "",
                  "【売上サマリー】",
                  "総売上："+totalRev.toLocaleString()+"円（前月："+prevRev.toLocaleString()+"円）",
                  "来店件数："+fv.length+"件（前月："+prevCount+"件）",
                  "客単価："+techAvg.toLocaleString()+"円（前月："+prevAvg.toLocaleString()+"円）",
                  "店販売上："+shopRevMonth.toLocaleString()+"円",
                  "",
                  "【顧客内訳】",
                  "新規："+newCount+"人",
                  "再来："+repeatCount+"人",
                  "再来率："+repeatRate+"%",
                  "",
                  "【メニュー別売上 TOP5】",
                  ...topMenus.map((m,i)=>(i+1)+". "+m[0]+"："+m[1].toLocaleString()+"円"),
                  "",
                  "【年代別（登録顧客）】",
                  ...Object.entries(ageBrk).filter(([,v2])=>v2>0).map(([k,v2])=>k+"："+v2+"人"),
                  "",
                  "【経費】",
                  catLabel("material")+"："+material.toLocaleString()+"円（技術売上比"+pctOf(material,techRev)+"%）",
                  catLabel("retail")+"："+retail.toLocaleString()+"円（店販売上比"+pctOf(retail,shopRevMonth)+"%）",
                  ...otherCats.map(c=>c.label+"："+sumCat(c.key).toLocaleString()+"円（総売上比"+pctOf(sumCat(c.key),totalRev)+"%）"),
                  "総経費："+totalCost.toLocaleString()+"円（総売上比"+pctOf(totalCost,totalRev)+"%）",
                  "",
                  "===========================",
                  "このデータを分析して、今月の総評・良かった点・課題・来月へのアドバイスを教えてください。",
                ];
                return lines.join("\n");
              };

              const copied = reportCopied, setCopied = setReportCopied;

              return (
                <div style={css.card}>
                  <div style={{ fontWeight:800, fontSize:15, marginBottom:6 }}>AIレポート用データ</div>
                  <div style={{ fontSize:12, color:C.sub, marginBottom:12 }}>
                    コピーしてChatGPTやClaudeに貼り付けてください
                  </div>
                  <button onClick={() => {
                    navigator.clipboard.writeText(buildText()).then(()=>{
                      setCopied(true);
                      setTimeout(()=>setCopied(false), 2000);
                    });
                  }} style={{ width:"100%", padding:"13px", borderRadius:12, border:"none", background: copied?"#4caf50":"#2a2218", color:"#E8DCC3", fontWeight:800, fontSize:14, cursor:"pointer", transition:"background 0.3s" }}>
                    {copied ? "✓ コピーしました！" : "レポートデータをコピーする"}
                  </button>
                </div>
              );
            })()}

            {/* ── CSVエクスポート（会計ソフト取り込み用） ── */}
            <div style={css.card}>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 6 }}>売上データをCSVで書き出す</div>
              <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>
                現在の期間（{periodLabel || (period === "3m" ? "直近3ヶ月" : period === "year" ? `${now.getFullYear()}年` : "全期間")}）の来店・会計記録を1件1行で書き出します。会計ソフトへの取り込みにご利用ください。
              </div>
              <button onClick={() => {
                  if (fv.length === 0) return notify("この期間に書き出せるデータがありません", "error");
                  const rows = [["日付","時刻","顧客名","新規/既存","メニュー","店販","施術売上","店販売上","合計金額","支払方法","備考"]];
                  [...fv].sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||"")).forEach(v => {
                    const cust = customers.find(c => c.id === v.customerId);
                    const menuNames = (v.menus||[]).map(m => m.name).filter(Boolean).join("、");
                    const prodNames = (v.products||[]).map(p => p.name).filter(Boolean).join("、");
                    const menuSum = (v.menus||[]).reduce((s,m) => s + (m.price||0), 0);
                    const prodSum = (v.products||[]).reduce((s,p) => s + (p.price||0), 0);
                    rows.push([
                      v.date||"", v.time||"", cust ? cust.name : "不明",
                      v.customerType === "new" ? "新規" : "既存",
                      menuNames, prodNames, menuSum, prodSum, v.total||0,
                      v.paymentMethod||"", v.notes||"",
                    ]);
                  });
                  const label = periodLabel ? periodLabel.replace(/[\/年月]/g,"") : (period==="3m"?"直近3ヶ月":period==="year"?String(now.getFullYear())+"年":"全期間");
                  downloadCSV(`売上_${label}.csv`, rows);
                  notify("CSVを書き出しました ✓");
                }}
                style={{ width: "100%", padding: "13px", borderRadius: 12, border: `1px solid ${C.accent}`, background: "#fff", color: C.accent, fontWeight: 800, fontSize: 14, cursor: "pointer" }}>
                この期間のデータをCSVで書き出す（{fv.length}件）
              </button>
            </div>
          </>
        )}

        {/* ── メニューサブタブ ── */}
        {subTab === "menu" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>メニュー比率・販売数</div>
              {Object.entries(menuCnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name, cnt]) => (
                <HBar key={name} label={name} value={cnt} max={Math.max(...Object.values(menuCnt))} color={C.accent} suffix="回" />
              ))}
              {Object.keys(menuCnt).length === 0 && <div style={{ color: C.sub, fontSize: 13 }}>データなし</div>}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>カテゴリ別売上</div>
              {(() => {
                const catRev = {};
                fv.forEach(v => v.menus.forEach(vm => {
                  const md = menus.find(m => m.id === vm.menuId);
                  const cat = md?.category || "その他";
                  catRev[cat] = (catRev[cat] || 0) + vm.price;
                }));
                const maxC = Math.max(...Object.values(catRev), 1);
                return Object.entries(catRev).sort((a,b)=>b[1]-a[1]).map(([cat, rev]) => (
                  <HBar key={cat} label={cat} value={rev} max={maxC} color={C.accent} suffix="円" />
                ));
              })()}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 8 }}>セットメニュー件数</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#7a6848" }}>
                {fv.reduce((s,v) => s + (v.menus||[]).filter(vm => { const md = menus.find(m => m.id === vm.menuId); return md?.category === "セット"; }).length, 0)}件
              </div>
            </div>
          </>
        )}

        {/* ── 顧客サブタブ ── */}
        {subTab === "customer" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客分析</div>
              {[
                ["登録顧客数", customers.length + "名"],
                ["リピート顧客", returnCount + "名"],
                ["再来率（全期間）", returnRate + "%"],
                ["新規顧客（全期間）", newCustomerCount + "名"],
              ].map(([l, v]) => (
                <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                  <span style={{ color: C.sub }}>{l}</span><span style={{ fontWeight: 700 }}>{v}</span>
                </div>
              ))}
            </div>
            {/* タグ別 */}
            {(() => {
              const tagCounts = {};
              const totalVisitors = new Set();
              fv.forEach(v => {
                totalVisitors.add(v.customerId);
                v.menus.forEach(vm => {
                  const menuDef = menus.find(m => m.id === vm.menuId);
                  const tags = menuDef?.tags || [];
                  tags.forEach(tag => {
                    if (!tagCounts[tag]) tagCounts[tag] = new Set();
                    tagCounts[tag].add(v.customerId);
                  });
                });
              });
              const totalUniq = totalVisitors.size || 1;
              const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1].size - a[1].size);
              return sortedTags.length > 0 ? (
                <div style={css.card}>
                  <div style={{ fontWeight: 700, marginBottom: 12 }}>タグ別 客数・比率</div>
                  {sortedTags.map(([tag, custSet]) => (
                    <div key={tag} style={{ marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3, fontSize: 13 }}>
                        <span style={{ fontWeight: 700 }}>{tag}</span>
                        <span style={{ color: "#7a6848", fontWeight: 700 }}>{custSet.size}人 <span style={{ color: C.sub, fontWeight: 400 }}>({pct(custSet.size, totalUniq)}%)</span></span>
                      </div>
                      <div style={{ height: 6, background: C.border, borderRadius: 3 }}>
                        <div style={{ height: 6, borderRadius: 3, background: "#7a6848", width: `${pct(custSet.size, totalUniq)}%`, transition: "width 0.5s" }} />
                      </div>
                    </div>
                  ))}
                </div>
              ) : null;
            })()}
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>性別比率</div>
              {[["female","女性","#ff6b6b"],["male","男性","#6b9fff"],["other","その他","#9a9088"]].map(([k,l,c]) => (
                <HBar key={k} label={l} value={genBrk[k]} max={fv.length||1} color={c} suffix="人" />
              ))}
            </div>
            {(() => {
              const ageBrk = { "10代": 0, "20代": 0, "30代": 0, "40代": 0, "50代": 0, "60代以上": 0, "不明": 0 };
              customers.forEach(c => {
                if (!c.birthday) { ageBrk["不明"]++; return; }
                const age = Math.floor((new Date() - new Date(c.birthday)) / 31557600000);
                if (isNaN(age) || age < 0) { ageBrk["不明"]++; }
                else if (age < 20) ageBrk["10代"]++;
                else if (age < 30) ageBrk["20代"]++;
                else if (age < 40) ageBrk["30代"]++;
                else if (age < 50) ageBrk["40代"]++;
                else if (age < 60) ageBrk["50代"]++;
                else ageBrk["60代以上"]++;
              });
              const ageMax = Math.max(1, ...Object.values(ageBrk));
              return (
                <div style={css.card}>
                  <div style={{ fontWeight: 700, marginBottom: 12 }}>年代別（登録顧客）</div>
                  {Object.entries(ageBrk).map(([label, val]) => (
                    <HBar key={label} label={label} value={val} max={ageMax} color="#7a6848" suffix="人" />
                  ))}
                </div>
              );
            })()}
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 8 }}>新規・再来内訳</div>
              <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                <div onClick={() => setShowNewList(true)} style={{ flex: 1, textAlign: "center", background: "#fff3e0", borderRadius: 10, padding: "12px 8px", cursor: "pointer" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.orange }}>{newVisitors}人</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>新規</div>
                  <div style={{ fontSize: 10, color: C.sub, marginTop: 2 }}>▶ 一覧を見る</div>
                </div>
                <div style={{ flex: 1, textAlign: "center", background: "#f5ede0", borderRadius: 10, padding: "12px 8px" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: "#7a6848" }}>{existingVisitors}人</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>再来</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#7a6848" }}>{existingRate}%</div>
                </div>
              </div>
            </div>
            {/* 新規顧客一覧モーダル */}
            {showNewList && (
              <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
                <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 40px", width: "100%", maxWidth: 480, maxHeight: "70vh", overflowY: "auto" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                    <div style={{ fontWeight: 800, fontSize: 16 }}>新規顧客一覧（{newVisitorList.length}人）</div>
                    <button onClick={() => setShowNewList(false)} style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: C.sub }}>✕</button>
                  </div>
                  {newVisitorList.length === 0
                    ? <div style={{ color: C.sub, textAlign: "center", padding: 24 }}>この期間の新規顧客はいません</div>
                    : newVisitorList.map(c => (
                      <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 15 }}>{c.name}</div>
                          {c.kana && <div style={{ fontSize: 12, color: C.sub }}>{c.kana}</div>}
                        </div>
                        <div style={{ fontSize: 12, color: C.sub }}>{c.joinDate || ""}</div>
                      </div>
                    ))
                  }
                </div>
              </div>
            )}
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>顧客別売上 TOP</div>
              {(() => {
                const custRev = {};
                visits.forEach(v => { custRev[v.customerId] = (custRev[v.customerId] || 0) + v.total; });
                return Object.entries(custRev).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id, rev]) => {
                  const c = customers.find(x => x.id === parseInt(id));
                  return c ? (
                    <div key={id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.border}`, fontSize: 14 }}>
                      <span>{c.name}</span><span style={{ fontWeight: 700, color: C.accent }}>{yen(rev)}</span>
                    </div>
                  ) : null;
                });
              })()}
            </div>
          </>
        )}

        {/* ── 店販サブタブ ── */}
        {subTab === "product" && (
          <>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>店販売上</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: C.green, marginBottom: 8 }}>{yen(shopRev)}</div>
              <div style={{ fontSize: 13, color: C.sub }}>販売個数：{shopCount}個</div>
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>商品別販売数</div>
              {Object.entries(prodCnt).sort((a,b)=>b[1]-a[1]).map(([name, cnt]) => (
                <HBar key={name} label={name} value={cnt} max={Math.max(...Object.values(prodCnt))} color={C.green} suffix="個" />
              ))}
              {Object.keys(prodCnt).length === 0 && <div style={{ color: C.sub, fontSize: 13 }}>データなし</div>}
            </div>
            <div style={css.card}>
              <div style={{ fontWeight: 700, marginBottom: 12 }}>店販比率</div>
              <HBar label="技術売上" value={techRev} max={totalRev||1} color={C.accent} suffix="円" />
              <HBar label="店販売上" value={shopRev} max={totalRev||1} color={C.green} suffix="円" />
              <div style={{ padding: "10px 0", fontSize: 14, display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontWeight: 700 }}>店販比率</span>
                <span style={{ fontWeight: 800, fontSize: 18, color: C.green }}>{pct(shopRev, totalRev||1)}%</span>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const items = [
    {
      tab: "appointments", label: "予約表", sub: "スタッフ・週間カレンダー",
      iconBg: "#eef2f8", iconColor: "#6a90b8",

    },

      svg: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a9a80" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    },
    {

function GoalSettingsTab({ setTab, notify, monthlyGoals, setMonthlyGoals, saveSetting }) {
  const [form, setForm] = useState({ techRev: monthlyGoals.techRev || "", visitCount: monthlyGoals.visitCount || "", avgPrice: monthlyGoals.avgPrice || "", shopRev: monthlyGoals.shopRev || "" });
  const [saving, setSaving] = useState(false);
  const save = async () => {
    const next = { techRev: form.techRev, visitCount: form.visitCount, avgPrice: form.avgPrice, shopRev: form.shopRev };
    setSaving(true);
    await saveSetting("monthlyGoals", next);
    setMonthlyGoals(next);
    setSaving(false);
    notify("目標を保存しました ✓");

  const rows = [
    { key:"techRev", label:"技術売上", unit:"円", ph:"例：600000" },

    <div style={{ background: C.bg, minHeight: "100vh" }}>

        <button onClick={() => setTab("more")} style={{ background: "none", border: "none", color: "#7a6848", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>← メニュー</button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>今月の目標設定</div>
        <div style={{ width: 60 }} />
      </div>
      <div style={{ padding: 16 }}>
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 16, border: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.7 }}>
            設定した目標に対する達成率がホーム画面に表示されます。<br/>
            空欄（または0）の項目はホームに表示されません。
          </div>
        </div>
        <div style={{ background: "#fff", borderRadius: 14, padding: 16, border: `1px solid ${C.border}` }}>
          {rows.map(r => (
            <div key={r.key} style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 12, color: C.sub, fontWeight: 700, marginBottom: 8 }}>{r.label}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="number" inputMode="numeric" value={form[r.key]}
                  onChange={e => setForm(p => ({ ...p, [r.key]: e.target.value }))}
                  placeholder={r.ph}
                  style={{ flex: 1, boxSizing: "border-box", border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 14px", fontSize: 16, textAlign: "right", background: "#fff", outline: "none" }} />
                <span style={{ fontSize: 14, color: C.sub }}>{r.unit}</span>
              </div>
            </div>
          ))}
          <button onClick={save} disabled={saving}
            style={{ width: "100%", marginTop: 4, padding: 14, borderRadius: 12, border: "none", background: saving ? C.sub : "#7a6848", color: "#fff", fontWeight: 800, fontSize: 15, cursor: "pointer" }}>
            {saving ? "保存中..." : "保存する"}
          </button>
        </div>
      </div>
    </div>
  );
}

function MergeCustomersTab({ setTab, notify, customers, setCustomers, setVisits, setAppointments }) {
  const [step, setStep] = useState("pick");        // pick | preview
  const [keepId, setKeepId] = useState(null);      // 残すカルテ
  const [dupId, setDupId] = useState(null);        // 統合される(消える)カルテ
  const [qKeep, setQKeep] = useState("");
  const [qDup, setQDup] = useState("");
  const [detail, setDetail] = useState(null);      // プレビュー用にDBから取り直した2人分の最新データ+件数
  const [loadingPrev, setLoadingPrev] = useState(false);
  const [merging, setMerging] = useState(false);

  const findList = (q, excludeId) => {
    const s = (q || "").trim().toLowerCase();
    if (!s) return [];
    return customers
      .filter(c => c.id !== excludeId && ((c.name||"").toLowerCase().includes(s) || (c.kana||"").toLowerCase().includes(s)))
      .slice(0, 20);
  };
  const keepC = customers.find(c => c.id === keepId) || null;
  const dupC = customers.find(c => c.id === dupId) || null;

  // プレビュー: 2人分の最新データ(LINE連携含む)と来店・予約件数をDBから取り直す
  const openPreview = async () => {
    setLoadingPrev(true);
    const get1 = async (id) => {
      const c = await sbRetry(() => sb.from("customers").select("id,name,kana,phone,birthday,notes,line_user_id").eq("id", id));
      const v = await sbRetry(() => sb.from("visits").select("id").eq("customer_id", id));
      const a = await sbRetry(() => sb.from("appointments").select("id").eq("customer_id", id));
      if (c.error || !c.data || !c.data[0] || v.error || a.error) return null;
      return { ...c.data[0], visitCount: v.data.length, apptCount: a.data.length };
    };
    const [k, d] = await Promise.all([get1(keepId), get1(dupId)]);
    setLoadingPrev(false);
    if (!k || !d) { notify("データの取得に失敗しました。通信環境を確認してください", "error"); return; }
    setDetail({ keep: k, dup: d });
    setStep("preview");
  };

  // 統合実行: visits移動 → appointments移動 → 残す側の空欄を補完 → 重複カルテを削除(最後)
  const doMerge = async () => {
    if (merging || !detail) return;
    const { keep, dup } = detail;
    if (!window.confirm(`「${keep.name}」様に「${dup.name}」様の来店記録${dup.visitCount}件・予約${dup.apptCount}件を移動し、「${dup.name}」様のカルテを削除します。\n\nこの操作は取り消せません。実行しますか？`)) return;
    setMerging(true);
    // ①来店記録の移動
    const r1 = await sb.from("visits").update({ customer_id: keep.id }).eq("customer_id", dup.id);
    if (r1.error) { setMerging(false); return notify("統合に失敗しました(来店記録の移動)。カルテは削除されていません", "error"); }
    // ②予約の移動
    const r2 = await sb.from("appointments").update({ customer_id: keep.id }).eq("customer_id", dup.id);
    if (r2.error) { setMerging(false); return notify("統合が途中で失敗しました(予約の移動)。もう一度実行すると続きから統合されます", "error"); }
    // ③残す側の空欄を統合される側の情報で補完(既にある情報は上書きしない)
    const patch = {};
    if (!keep.kana && dup.kana) patch.kana = dup.kana;
    if (!keep.phone && dup.phone) patch.phone = dup.phone;
    if (!keep.birthday && dup.birthday) patch.birthday = dup.birthday;
    if (!keep.line_user_id && dup.line_user_id) patch.line_user_id = dup.line_user_id;
    if (dup.notes) patch.notes = [keep.notes, dup.notes].filter(Boolean).join("\n---（統合されたカルテのメモ）---\n");
    if (Object.keys(patch).length > 0) {
      const r3 = await sb.from("customers").update(patch).eq("id", keep.id);
      if (r3.error) { setMerging(false); return notify("統合が途中で失敗しました(情報の補完)。もう一度実行してください", "error"); }
    }
    // ④重複カルテの削除(①〜③が全て成功した場合のみ)
    const r4 = await sb.from("customers").delete().eq("id", dup.id);
    if (r4.error) { setMerging(false); return notify("記録の移動は完了しましたが、古いカルテの削除に失敗しました。もう一度実行してください", "error"); }

    // 画面側の状態も反映
    setVisits(p => p.map(v => v.customerId === dup.id ? { ...v, customerId: keep.id } : v));
    setAppointments(p => p.map(a => a.customerId === dup.id ? { ...a, customerId: keep.id } : a));
    setCustomers(p => p.filter(c => c.id !== dup.id).map(c => c.id === keep.id ? {
      ...c,
      kana: patch.kana !== undefined ? patch.kana : c.kana,
      phone: patch.phone !== undefined ? patch.phone : c.phone,
      birthday: patch.birthday !== undefined ? patch.birthday : c.birthday,
      notes: patch.notes !== undefined ? patch.notes : c.notes,
    } : c));
    setMerging(false);
    notify(`「${keep.name}」様にカルテを統合しました ✓`);
    setStep("pick"); setKeepId(null); setDupId(null); setQKeep(""); setQDup(""); setDetail(null);
    setTab("more");
  };

  const Picker = ({ label, color, q, setQ, selId, setSelId, excludeId }) => {
    const voiceSearch = useVoiceInput(setQ);
    return (
    <div style={{ background:"#fff", borderRadius:14, padding:16, marginBottom:14, border:`2px solid ${color}` }}>
      <div style={{ fontSize:13, fontWeight:800, color, marginBottom:8 }}>{label}</div>
      {selId ? (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontWeight:800, fontSize:16 }}>{(customers.find(c=>c.id===selId)||{}).name}</div>
            <div style={{ fontSize:12, color:C.sub }}>{(customers.find(c=>c.id===selId)||{}).kana}</div>
          </div>
          <button onClick={() => { setSelId(null); setQ(""); }} style={{ fontSize:12, color:C.sub, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 12px", background:"#fff", cursor:"pointer" }}>選び直す</button>
        </div>
      ) : (
        <div>
          <div style={{ position:"relative" }}>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="お名前・カナで検索"
              style={{ width:"100%", boxSizing:"border-box", border:`1px solid ${C.border}`, borderRadius:10, padding:"11px 34px 11px 14px", fontSize:15, outline:"none" }} />
            <VoiceMicButton voiceSearch={voiceSearch} />
          </div>
          {findList(q, excludeId).map(c => (
            <button key={c.id} onClick={() => setSelId(c.id)}
              style={{ display:"block", width:"100%", textAlign:"left", padding:"10px 12px", marginTop:6, border:`1px solid ${C.border}`, borderRadius:10, background:"#fff", cursor:"pointer" }}>
              <span style={{ fontWeight:700, fontSize:14 }}>{c.name}</span>
              <span style={{ fontSize:12, color:C.sub, marginLeft:8 }}>{c.kana}</span>
            </button>
          ))}
        </div>
      )}
    </div>
    );
  };

  const Row = ({ label, k, d, result }) => (
    <div style={{ display:"flex", borderTop:`1px solid ${C.border}`, fontSize:12 }}>
      <div style={{ width:74, flexShrink:0, padding:"10px 8px", background:"#faf7f2", color:C.sub, fontWeight:700 }}>{label}</div>
      <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}` }}>{k || "-"}</div>
      <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}`, color:C.sub }}>{d || "-"}</div>
      <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}`, fontWeight:700 }}>{result || "-"}</div>
    </div>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      <div style={{ background: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.border}` }}>
        <button onClick={() => step === "preview" ? setStep("pick") : setTab("more")} style={{ background: "none", border: "none", color: "#7a6848", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>← {step === "preview" ? "選び直す" : "メニュー"}</button>
        <div style={{ fontWeight: 800, fontSize: 16 }}>カルテ統合</div>
        <div style={{ width: 60 }} />
      </div>
      <div style={{ padding: 16 }}>
        {step === "pick" && (
          <div>
            <div style={{ background:"#fff", borderRadius:14, padding:14, marginBottom:14, border:`1px solid ${C.border}`, fontSize:12, color:C.sub, lineHeight:1.7 }}>
              同じお客様のカルテが2つできてしまった場合に1つへまとめます。<br/>
              来店記録・予約・写真はすべて「残すカルテ」へ移動し、もう一方のカルテは削除されます。
            </div>
            <Picker label="残すカルテ（メインのカルテ）" color="#06955f" q={qKeep} setQ={setQKeep} selId={keepId} setSelId={setKeepId} excludeId={dupId} />
            <Picker label="統合されるカルテ（削除される側）" color="#c0392b" q={qDup} setQ={setQDup} selId={dupId} setSelId={setDupId} excludeId={keepId} />
            <button onClick={openPreview} disabled={!keepId || !dupId || loadingPrev}
              style={{ width:"100%", padding:14, borderRadius:12, border:"none", background:(!keepId||!dupId)?C.sub:"#4a6b8a", color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer", opacity: loadingPrev?0.6:1 }}>
              {loadingPrev ? "確認中..." : "統合内容を確認する"}
            </button>
          </div>
        )}
        {step === "preview" && detail && (
          <div>
            <div style={{ background:"#fff", borderRadius:14, border:`1px solid ${C.border}`, overflow:"hidden", marginBottom:14 }}>
              <div style={{ display:"flex", fontSize:11, fontWeight:800 }}>
                <div style={{ width:74, flexShrink:0, padding:"10px 8px", background:"#faf7f2" }}></div>
                <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}`, color:"#06955f" }}>残す</div>
                <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}`, color:"#c0392b" }}>統合される</div>
                <div style={{ flex:1, padding:"10px 8px", borderLeft:`1px solid ${C.border}` }}>統合後</div>
              </div>
              <Row label="氏名" k={detail.keep.name} d={detail.dup.name} result={detail.keep.name} />
              <Row label="カナ" k={detail.keep.kana} d={detail.dup.kana} result={detail.keep.kana || detail.dup.kana} />
              <Row label="電話番号" k={detail.keep.phone} d={detail.dup.phone} result={detail.keep.phone || detail.dup.phone} />
              <Row label="誕生日" k={detail.keep.birthday} d={detail.dup.birthday} result={detail.keep.birthday || detail.dup.birthday} />
              <Row label="LINE連携" k={detail.keep.line_user_id ? "あり" : ""} d={detail.dup.line_user_id ? "あり" : ""} result={(detail.keep.line_user_id || detail.dup.line_user_id) ? "あり" : ""} />
              <Row label="来店記録" k={`${detail.keep.visitCount}件`} d={`${detail.dup.visitCount}件`} result={`${detail.keep.visitCount + detail.dup.visitCount}件`} />
              <Row label="予約" k={`${detail.keep.apptCount}件`} d={`${detail.dup.apptCount}件`} result={`${detail.keep.apptCount + detail.dup.apptCount}件`} />
              <Row label="メモ" k={detail.keep.notes ? "あり" : ""} d={detail.dup.notes ? "あり" : ""} result={(detail.keep.notes || detail.dup.notes) ? "両方を保持" : ""} />
            </div>
            <div style={{ background:"#fdf0ee", border:"1px solid #c0392b", borderRadius:12, padding:"10px 14px", fontSize:12, color:"#c0392b", fontWeight:700, marginBottom:14 }}>
              「{detail.dup.name}」様のカルテは削除されます。この操作は取り消せません。
            </div>
            <button onClick={doMerge} disabled={merging}
              style={{ width:"100%", padding:14, borderRadius:12, border:"none", background: merging ? C.sub : "#c0392b", color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer" }}>
              {merging ? "統合中..." : "統合を実行する"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

  ladies: ["ベリーショート","ショート","ミディアム","セミロング","ロング","その他"],
  mens: ["ボウズ","ベリーショート","ショート","ミディアム","ロング","その他"],
};
const STYLE_MENU_FLAGS = [

  { key: "extension", label: "エクステ" },
  { key: "bleach", label: "ブリーチ" },
];
const STYLE_MODEL_OPTIONS = {
  volume: ["設定しない","少ない","普通","多い"],
  texture: ["設定しない","柔らかい","普通","硬い"],
  thickness: ["設定しない","細い","普通","太い"],
  curl: ["設定しない","なし","少し","強い"],
  face: ["設定しない","逆三角","丸型","ベース","卵型","面長","四角"],
  age: ["設定しない","キッズ","10代","20代","30代","40代","50代","60代以上"],
};

// SalonBoardのスタイル登録画面へ自動入力するコードを生成する。
// 顔型/年代/髪量/髪質/太さ/クセの区分コードはSalonBoard側のフォーム構造(事実情報)に基づく対応表。
const SB_FACE_CODE = {"丸型":"1","卵型":"2","四角":"3","逆三角":"4","ベース":"5","面長":"6"};
const SB_AGE_CODE = {"キッズ":"0","10代":"1","20代":"2","30代":"3","40代":"4","50代":"5","60代以上":"6"};
const SB_VOL_CODE = {"少ない":"1","普通":"2","多い":"3"};
const SB_TEX_CODE = {"柔らかい":"1","普通":"2","硬い":"3"};
const SB_THICK_CODE = {"細い":"1","普通":"2","太い":"3"};
const SB_CURL_CODE = {"なし":"1","少し":"2","強い":"3"};

function buildStyleSalonBoardScript(s) {
  // スタイル写真は最大3枚(前/横/後ろの想定順)保存されているので、それぞれbase64データと形式を取り出す
  const imgs = (s.images || []).slice(0, 3).map(img => {
    const mm = (img || "").match(/^data:([^;]+);base64,(.+)$/);
    return mm ? { b64: mm[2], mime: mm[1] } : null;
  });

  const D = {
    styleName: s.styleName || "",
    comment: s.stylistComment || "",
    menu: s.menuText || "",
    tags: (s.hashtags || []).slice(0, 20),
    catCode: s.category === "mens" ? "SG02" : "SG01",
    length: s.length || "",
    faceCode: SB_FACE_CODE[s.modelFace] || "",
    ageCode: SB_AGE_CODE[s.modelAge] || "",
    volCode: SB_VOL_CODE[s.modelVolume] || "",
    texCode: SB_TEX_CODE[s.modelTexture] || "",
    thickCode: SB_THICK_CODE[s.modelThickness] || "",
    curlCode: SB_CURL_CODE[s.modelCurl] || "",
    imgs,
  };

  // テンプレート文字列のプレースホルダをJSONで安全に埋め込む(バッククォート等の混入を避けるため)
  // 顔型/年代/髪量/髪質/太さ/クセの6項目は、ページ読み込み直後にはまだDOMに現れず少し遅れて描画されるため、
  // 要素が出現するまで待ってから設定するsetRadioWaitを使う(value自体の対応表は元から正しかったことを実機診断で確認済み)。
  // 各項目の成功/失敗は簡易チェックリストとして毎回alertで表示する(今後SalonBoard側の仕様変更があった際の早期発見用)。
  // done()はShortcuts「Webページ上でJavaScriptを実行」から呼ばれた場合のみcompletion()を呼ぶ安全なラッパー。
  // 通常のブックマークレットとして実行した場合はcompletionが存在しないため何もしない(同じコードが両方で動く)。
  // Shortcutsの「Webページ上でJavaScriptを実行」はcompletion()呼び出しまでの時間制限が厳しく(数秒程度)、
  // 写真3枚化等で処理時間が伸びた結果タイムアウトすることが実機で判明。そのため合図は早い段階(ホスト確認直後)で
  // 一度だけ送り、実際の入力・写真アップロード処理はそのままページ上で継続させる(completedフラグで二重送信を防止)。
  return [
    '(async function(){',
    '"use strict";',
    'var D=' + JSON.stringify(D) + ';',
    'var R={};',
    'var completed=false;',
    'function done(v){if(completed)return;completed=true;if(typeof completion==="function")completion(v);}',
    'function q(s){return document.querySelector(s);}',
    'function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}',
    'async function waitFor(sel,to){to=to||8000;var end=Date.now()+to;while(Date.now()<end){var el=q(sel);if(el)return el;await sleep(150);}return null;}',
    'function setValue(sel,v){var el=q(sel);if(!el)return false;el.value=v||"";el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}));return true;}',
    'function setSelectByLabel(sel,label){var el=q(sel);if(!el||!label)return false;for(var i=0;i<el.options.length;i++){var o=el.options[i];if(o.textContent.trim()===label||o.textContent.includes(label)){el.value=o.value;el.dispatchEvent(new Event("change",{bubbles:true}));return true;}}return false;}',
    'function selectFirstNonBlank(sel){var el=q(sel);if(!el)return false;for(var i=0;i<el.options.length;i++){if(el.options[i].value){el.value=el.options[i].value;el.dispatchEvent(new Event("change",{bubbles:true}));return true;}}return false;}',
    'async function waitSetSelectByLabel(sel,label,to){if(!label)return false;var el=await waitFor(sel,to||4000);if(!el)return false;for(var i=0;i<el.options.length;i++){var o=el.options[i];if(o.textContent.trim()===label||o.textContent.includes(label)){el.value=o.value;el.dispatchEvent(new Event("change",{bubbles:true}));return true;}}return false;}',
    'function setRadio(name,val){if(!val)return false;var r=document.querySelector(\'input[name="\'+name+\'"][value="\'+val+\'"]\');if(r){r.checked=true;r.dispatchEvent(new Event("change",{bubbles:true}));return true;}return false;}',
    'async function setRadioWait(name,val,to){if(!val)return false;var r=await waitFor(\'input[name="\'+name+\'"][value="\'+val+\'"]\',to||5000);if(!r)return false;r.checked=true;r.dispatchEvent(new Event("change",{bubbles:true}));return true;}',
    'function b64toFile(b64,name,mime){var bin=atob(b64);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new File([arr],name||"photo.jpg",{type:mime||"image/jpeg"});}',
    'async function injectFile(inputSel,file){var input=await waitFor(inputSel);if(!input)return false;var dt=new DataTransfer();dt.items.add(file);input.files=dt.files;input.dispatchEvent(new Event("change",{bubbles:true}));return true;}',
    'try{',
    '  if(!location.hostname.includes("salonboard.com")){alert("SALON BOARDのスタイル登録画面で実行してください");done(false);return;}',
    '  done(true);',
    '  R["スタイル名"]=setValue("input#styleNameTxt",D.styleName);',
    '  R["コメント"]=setValue("textarea#stylistCommentTxt",D.comment);',
    '  R["スタイリスト"]=selectFirstNonBlank("select#stylistCheckCd");',
    '  R["メニュー"]=setValue("textarea#menuDetailTxt",D.menu);',
    '  R["カテゴリ"]=setRadio("frmStyleEditStyleDto.styleCategoryCd",D.catCode);',
    '  if(D.length){R["レングス"]=setSelectByLabel(D.catCode==="SG01"?"select#ladiesHairLengthCd":"select#mensHairLengthCd",D.length);}',
    '  R["顔型"]=await setRadioWait("frmStyleEditStyleModelDto.modelFaceTypeKbn",D.faceCode);',
    '  R["年代"]=await setRadioWait("frmStyleEditStyleModelDto.modelAgeKbn",D.ageCode);',
    '  R["髪量"]=await setRadioWait("frmStyleEditStyleModelDto.modelHairVolumeKbn",D.volCode);',
    '  R["髪質"]=await setRadioWait("frmStyleEditStyleModelDto.modelHairTypeKbn",D.texCode);',
    '  R["太さ"]=await setRadioWait("frmStyleEditStyleModelDto.modelHairThicknessKbn",D.thickCode);',
    '  R["クセ"]=await setRadioWait("frmStyleEditStyleModelDto.modelHairCurlyKbn",D.curlCode);',
    '  var tagInput=q("input#hashTagTxt");',
    '  var tagAddBtn=q("button.jsc_style_edit-editCommon__tag--addBtn");',
    '  R["ハッシュタグ欄"]=!!(tagInput&&tagAddBtn);',
    '  if(tagInput&&tagAddBtn&&D.tags.length){',
    '    for(var i=0;i<D.tags.length;i++){',
    '      tagInput.focus();tagInput.value=D.tags[i];',
    '      tagInput.dispatchEvent(new Event("input",{bubbles:true}));',
    '      tagInput.dispatchEvent(new Event("change",{bubbles:true}));',
    '      await sleep(200);',
    '      if(tagAddBtn.disabled)tagAddBtn.disabled=false;',
    '      tagAddBtn.click();',
    '      await sleep(300);',
    '    }',
    '    tagInput.value="";tagInput.dispatchEvent(new Event("input",{bubbles:true}));',
    '  }',
    // 写真枠3つ(前/横/後ろ)を順番に処理。前(FRONT)のトリガーセレクタは実機で動作確認済み、
    // 横(SIDE)・後ろ(BACK)は隠しinputのname(SIDE_IMG_ID/BACK_IMG_ID、実機診断で確認済み)から
    // 同じ命名規則と推測して組み立てている。各枠には別途FRONT/SIDE/BACK等を選ぶ種別ドロップダウン
    // (styleClassCd01〜03、実機スクリーンショットで確認済み)があるため、写真確定後にそれも設定する。
    '  var slots=[["FRONT_IMG_ID","写真1(前)","styleClassCd01","FRONT"],["SIDE_IMG_ID","写真2(横)","styleClassCd02","SIDE"],["BACK_IMG_ID","写真3(後ろ)","styleClassCd03","BACK"]];',
    '  for(var pi=0;pi<slots.length;pi++){',
    '    var slotName=slots[pi][0],label=slots[pi][1],classSel=slots[pi][2],typeLabel=slots[pi][3],picD=D.imgs[pi];',
    '    if(!picD)continue;',
    '    var trg=q("#"+slotName+"_PC_NEW_NO_PHOTO, img#"+slotName+"_IMG");',
    '    R[label+"枠"]=!!trg;',
    '    if(trg)trg.click();',
    '    await sleep(600);',
    '    R[label+"挿入"]=await injectFile(\'input#formFile, input[name="formFile"], input.jscImageUploaderModalInput\',b64toFile(picD.b64,"photo"+(pi+1)+".jpg",picD.mime));',
    '    await sleep(1200);',
    '    var sub=q(".jscImageUploaderModalSubmitButton, .imageUploaderModalSubmitButton");',
    '    R[label+"確定"]=!!sub;',
    '    if(sub)sub.click();',
    '    await sleep(1200);',
    '    R[label+"種別"]=await waitSetSelectByLabel("select#"+classSel,typeLabel);',
    '    await sleep(800);',
    '  }',
    '  var lines=Object.keys(R).map(function(k){return k+": "+(R[k]?"○":"×");});',
    '  alert("入力結果\\n"+lines.join("\\n")+"\\n\\n内容を確認して「登録」ボタンを押してください。");',
    '  done(true);',
    '}catch(err){alert("エラー: "+err.message);done(false);}',
    '})();',
  ].join("\n");
}
